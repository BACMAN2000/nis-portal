<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada — Portal NIS</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<!-- Todo va en absoluto y sin dependencias: nginx sirve esta página para
     cualquier ruta que no exista, incluida /carpeta/que/no/hay/, y desde ahí
     un enlace relativo apuntaría a la nada. Por lo mismo, los estilos van
     dentro: si el CSS no cargara, el aviso seguiría leyéndose. -->
<style>
@font-face{font-family:'Gotham';src:url('/fonts/GothamBook.woff2') format('woff2'),url('/fonts/GothamBook.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'Gotham';src:url('/fonts/GothamBold.woff2') format('woff2'),url('/fonts/GothamBold.ttf') format('truetype');font-weight:700;font-display:swap}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
  background:#f4f6fb;color:#1e2433;
  font-family:'Gotham','Segoe UI',system-ui,Arial,sans-serif;line-height:1.55}
.caja{background:#fff;border:1px solid #e3e5f3;border-radius:16px;max-width:520px;width:100%;
  padding:38px 34px;box-shadow:0 10px 30px rgba(36,76,119,.10);text-align:center}
img.logo{height:38px;width:auto;margin:0 auto 22px;display:block}
.cod{font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:#67718a;margin:0 0 10px}
h1{font-size:1.5rem;font-weight:700;margin:0 0 12px;line-height:1.25}
p{color:#67718a;margin:0 0 8px;font-size:.98rem}
p.ultimo{margin-bottom:26px}
a.btn{display:inline-block;background:#2f5f93;color:#fff;text-decoration:none;
  padding:12px 24px;border-radius:10px;font-weight:500}
a.btn:hover{background:#244c77}
a.btn:focus-visible{outline:3px solid #1e2433;outline-offset:3px}
</style>
</head>
<body>
  <main class="caja">
    <img class="logo" src="/assets/logo-h.svg" alt="Nordic International School">
    <p class="cod">Error 404</p>
    <h1>Esta página no existe</h1>
    <p>La dirección está mal escrita, o el material que buscas cambió de sitio.</p>
    <p class="ultimo">Desde el portal llegas a todo lo que tengas asignado.</p>
    <a class="btn" href="/">Ir al portal</a>
  </main>
</body>
</html>
