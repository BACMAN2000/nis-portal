   Dos puertas: ?t=TOKEN (enlace de familia, sin cuenta, vía rpc yle_boletin)
   y ?student=UUID&level=starters (profesor/admin/alumno con sesión, vía
   rpc yle_boletin_student). El profesor descarga el PDF desde aquí mismo y lo
   manda por Toddle, que es el canal del colegio. Los escudos son estimación del colegio.

:root{--navy:#0d1d33;--blue:#1e3a8a;--sky:#eef3fb;--border:#d9deea;--ok:#2f8f5b;--bad:#b53a3a;--st:#e08a2a;--mv:#238f85;--fl:#6a54c9;--gold:#d29a1f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Gotham','Segoe UI',system-ui,sans-serif;line-height:1.5}
header.top{background:var(--navy);color:var(--card);padding:10px 18px 10px 118px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header.top img{height:36px}
header.top h1{margin:0;font-size:1.15rem}
header.top .sub{font-size:.8rem;opacity:.8}
header.top .right{margin-left:auto;display:flex;gap:10px;align-items:center}
.btn{border:0;background:var(--blue);color:var(--card);border-radius:10px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
.btn.sec{background:var(--card);color:var(--blue);border:1.5px solid var(--blue)}
.page{max-width:860px;margin:22px auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 22px;margin-bottom:16px}
h2{font-size:1.2rem;margin:0 0 10px}
h3{font-size:1rem;margin:12px 0 6px}
.head{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.head .who{font-size:1.5rem;font-weight:800}
.lvl{border-radius:999px;padding:5px 14px;color:var(--card);font-weight:700}
.starters{background:var(--st)}.movers{background:var(--mv)}.flyers{background:var(--fl)}
.papers{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:10px 0}
.paper{background:var(--sky);border-radius:12px;padding:12px 14px}
.paper b{display:block;font-size:1rem}
.paper .n{font-size:.85rem;color:var(--muted)}
.shields{display:inline-flex;gap:3px;vertical-align:middle;margin:6px 0}
.shields i{width:22px;height:26px;display:inline-grid;place-items:center;font-style:normal;font-size:.72rem;font-weight:800;color:var(--muted);background:var(--line);clip-path:polygon(50% 0,100% 12%,100% 60%,50% 100%,0 60%,0 12%)}
.shields i.on{background:var(--gold);color:var(--ink)}
.total{font-size:1.1rem;margin-top:6px}
.warn{background:#fff3d6;border-radius:12px;padding:10px 14px;margin:10px 0;font-size:.92rem}
.note{background:var(--sky);border-radius:12px;padding:10px 14px;margin:10px 0}
.err{background:#f8e1e1;border-radius:12px;padding:12px 14px}
ul.cando{margin:6px 0;padding-left:20px}
ul.cando li{margin:3px 0}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.tip{border-left:4px solid var(--gold);padding:6px 12px;margin:8px 0;background:var(--card);border-radius:0 10px 10px 0}
.tip b{display:block}
.muted{color:var(--muted)}.small{font-size:.85rem}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{border-bottom:1px solid var(--border);padding:7px 6px;text-align:left;vertical-align:top}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.teacher{border:2px dashed var(--blue);background:var(--bg)}
.teacher input{font:inherit;width:100%;border:1.5px solid var(--border);border-radius:9px;padding:8px 10px}
.stars{font-size:1.2rem;letter-spacing:1px}
@media print{header.top,.noprint{display:none!important}body{background:var(--card)}.card{border:0;padding:0 0 14px;break-inside:avoid}.page{margin:0;max-width:none}}
</style>

                        p3: {en: 'Matching with pictures A–H: pay attention to the detail that tells two options apart.', es: 'Unir con dibujos A–H: atender al detalle que diferencia dos opciones.'},
                        p4: {en: 'Choosing between three pictures: listen to the whole conversation.', es: 'Elegir entre tres dibujos: escuchar la conversación entera.'},
                        p5: {en: 'Colouring and writing: colours, positions and one word on the picture.', es: 'Colorear y escribir: colores, posiciones y una palabra en la lámina.'}},
           rw: {p1: {en: 'Definitions and words: the vocabulary trainer, “Learn” mode.', es: 'Definiciones y palabras: el entrenador de vocabulario, modo «Learn».'},
                p2: {en: 'Choosing the reply in a dialogue: practise everyday conversations.', es: 'Elegir la réplica en un diálogo: practicar conversaciones cotidianas.'},
                p3: {en: 'Text with gaps and a title: read short stories and summarise them.', es: 'Texto con huecos y título: leer cuentos cortos y resumirlos.'},
                p4: {en: 'Factual text with three options: read short texts about science, animals, places.', es: 'Texto informativo con tres opciones: leer textos cortos sobre ciencia, animales, lugares.'},
                p5: {en: 'Completing sentences about a story: retell the story in their own words.', es: 'Completar frases sobre una historia: contar la historia con sus palabras.'},
                p6: {en: 'Gaps with no options (a diary entry or an email): write short messages in English.', es: 'Huecos sin opciones (un diario o un correo): escribir pequeños mensajes en inglés.'},
                p7: {en: 'Writing a 20-word story from three pictures: make up stories together.', es: 'Escribir una historia de 20 palabras a partir de tres dibujos: inventar historias juntos.'}},
           speaking: {p1: {en: 'Finding differences: describe two similar pictures.', es: 'Encontrar diferencias: describir dos dibujos parecidos.'},
                      p2: {en: 'Asking and answering with information cards: ask questions with What, Where, When, How many.', es: 'Preguntar y responder con tarjetas de información: hacer preguntas con What, Where, When, How many.'},
                      p3: {en: 'Telling a story from pictures: use the past tense (went, saw, was).', es: 'Contar una historia en dibujos: usar el pasado (went, saw, was).'},
                      p4: {en: 'Personal questions: talk about what they did at the weekend or during the holidays.', es: 'Preguntas personales: hablar de lo que hizo el fin de semana o en vacaciones.'}}}
};
function shields(n){ var h = '<span class="shields">'; for(var i = 1; i <= 5; i++) h += '<i class="' + (i <= (n || 0) ? 'on' : '') + '">' + i + '</i>'; return h + '</span>'; }
function fecha(s){ if(!s) return ''; var d = new Date(s); return d.toLocaleDateString(LANG === 'en' ? 'en-GB' : 'es-PE', {day: 'numeric', month: 'long', year: 'numeric'}); }
function json(u){ return fetch(u, {cache: 'no-cache'}).then(function(r){ return r.json(); }); }
function speakingShields(p){
  // media de las tres escalas 0–5 del profesor si las hay; si no, la estimación del intento
  var c = p && p.criteria; if(c && c.teacher_total != null && c.teacher_max){ return Math.max(1, Math.min(5, Math.round(5 * c.teacher_total / c.teacher_max))); }
  return p && (p.best_shields || p.last_shields) || null;
}

var VIEW_STATE = 'loading', ERR_CODE = null, ERR_MSG = null;
function showLoading(){ $('#page').innerHTML = '<div class="card">' + tt(UI.loading) + '</div>'; }
function showOldLink(){ $('#page').innerHTML = '<div class="card err">' + tt(UI.oldLink) + '</div>'; }
function renderError(){
  var text;
  if(ERR_MSG != null){ text = tt(UI.errLoadFailedPrefix) + esc(ERR_MSG) + ').'; }
  else if(ERR_CODE === 'expired'){ text = tt(UI.errExpired); }
  else if(ERR_CODE === 'not_found'){ text = tt(UI.errNotFound); }
  else if(ERR_CODE === 'signin'){ text = tt(UI.errSignin); }
  else if(ERR_CODE === 'forbidden'){ text = tt(UI.errForbidden); }
  else { text = tt(UI.errGeneric); }
  $('#page').innerHTML = '<div class="card err">' + text + '</div>';
}

function load(){
  /* Coordinacion decidio que el boletin solo se entrega en PDF por Toddle: ya no
     hay enlaces sin cuenta. Si alguien llega con uno viejo, se le dice, en vez
     de dejarle un error de permisos. */
  if(qs.get('t')){
    VIEW_STATE = 'oldlink';
    showOldLink();
    return Promise.resolve();
  }
  var p = sb.auth.getSession().then(function(u){
    if(!(u && u.data && u.data.session && u.data.session.user)) return {data: {error: 'signin'}};
    return sb.rpc('yle_boletin_student', {p_student: STUDENT, p_level: qs.get('level') || 'starters'});
  });
  return Promise.all([json('yle/specs.json').catch(function(){ return null; }), p]).then(function(r){
    SPECS = r[0]; var res = r[1]; D = res.data;
    if(res.error) throw new Error(res.error.message);
    if(!D || D.error){
      ERR_CODE = D && D.error; ERR_MSG = null; VIEW_STATE = 'error'; renderError(); return;
    }
    LEVEL = D.level; TEACHER = !!(D.guardian || D.full_name);
    VIEW_STATE = 'rendered';
    render();
  }).catch(function(e){ ERR_CODE = null; ERR_MSG = e.message; VIEW_STATE = 'error'; renderError(); });
}

function render(){
  var s = D.student || {}, P = D.papers || {}, spec = SPECS && SPECS.levels && SPECS.levels[LEVEL];
  var L = P.listening, R = P.rw, S = P.speaking;
  var shL = L && (L.best_shields || L.last_shields), shR = R && (R.best_shields || R.last_shields), shS = speakingShields(S);
  var total = (shL || 0) + (shR || 0) + (shS || 0), tests = D.tests_done || 0;
  var lastAt = [L, R, S].filter(Boolean).map(function(x){ return x.last_at; }).sort().pop();
  var st = D.settings || {}, examDate = st['exam_date_' + LEVEL] || st.exam_date, examNote = st['exam_note_' + LEVEL] || st.exam_note;
  $('#hSub').textContent = 'Nordic International School · ' + NAMES[LEVEL] + ' · ' + fecha(D.generated_at);
  var paperBox = function(key, p, sh){
    return '<div class="paper"><b>' + PAPER[key] + '</b><span class="n">' + tt(PAPER_LABEL[key]) + '</span>' + shields(sh) +
      '<div class="small">' + (p ? (key === 'speaking' ? (S && S.criteria && S.criteria.teacher_max ? tt(UI.paperEvaluated) : (S && S.attempts ? S.attempts + tt(UI.paperAttemptsSuffix) : tt(UI.paperNoPracticeYet))) : p.tests + tt(UI.paperTestsMid) + (p.best_pct != null ? p.best_pct + ' %' : '—') + (p.exam_mode ? tt(UI.paperExamMode) : '')) : tt(UI.paperNoPracticeYet)) + '</div></div>';
  };
  var cando = CANDO[LEVEL] || {ls: {en: [], es: []}, rw: {en: [], es: []}};
  // partes más flojas: agregado de todos los intentos
  var partes = (D.parts || []).map(function(x){ return {paper: x.paper, part: x.part, pct: x.total ? Math.round(100 * x.score / x.total) : null}; }).filter(function(x){ return x.pct != null; }).sort(function(a, b){ return a.pct - b.pct; });
  var flojas = partes.filter(function(x){ return x.pct < 75; }).slice(0, 3);
  var tips = flojas.map(function(x){ var tip = TIPS[LEVEL] && TIPS[LEVEL][x.paper] && TIPS[LEVEL][x.paper][x.part]; return tip ? '<div class="tip"><b>' + PAPER[x.paper] + ' · ' + tt(UI.tipPartWord) + ' ' + x.part.replace('p', '') + ' (' + x.pct + tt(UI.tipPctSuffix) + ')</b>' + esc(tt(tip)) + '</div>' : ''; }).join('');
  var vocab = D.vocab || {mastered: 0, seen: 0};
  var fb = S && S.feedback ? '<div class="note">' + tt(UI.feedbackLabel) + esc(S.feedback) + '</div>' : '';
  var fmt = spec ? '<table><thead><tr><th>' + tt(UI.specThPart) + '</th><th>' + tt(UI.specThDuration) + '</th><th>' + tt(UI.specThQuestions) + '</th></tr></thead><tbody>' +
      '<tr><td>Listening</td><td>≈ ' + spec.listening.minutes + ' min</td><td>' + spec.listening.items + tt(UI.itemsInParts) + spec.listening.parts.length + tt(UI.partsWord) + '</td></tr>' +
      '<tr><td>Reading &amp; Writing</td><td>' + spec.rw.minutes + ' min</td><td>' + spec.rw.items + tt(UI.itemsInParts) + spec.rw.parts.length + tt(UI.partsWord) + '</td></tr>' +
      '<tr><td>Speaking</td><td>' + (spec.speaking && spec.speaking.minutes ? [].concat(spec.speaking.minutes).join('–') + ' min' : tt(UI.speakMinutesFallback)) + '</td><td>' + tt(UI.speakConvPrefix) + (spec.speaking && spec.speaking.parts ? spec.speaking.parts.length : 4) + tt(UI.partsWord) + '</td></tr></tbody></table>' : '';
  var teacherBox = TEACHER ? teacherPanel() : '';
  $('#page').innerHTML = teacherBox +
    '<div class="card"><div class="head"><div class="who">' + esc(TEACHER && D.full_name ? D.full_name : s.first_name || tt(UI.studentFallback)) + '</div><span class="lvl ' + LEVEL + '">' + NAMES[LEVEL] + '</span><span class="muted">' + esc(s.grade || '') + '</span></div>' +
      '<p>' + tt(UI.introA) + esc(s.first_name || tt(UI.introFallbackChild)) + tt(UI.introB) + NAMES[LEVEL] + tt(UI.introC) + (lastAt ? tt(UI.introLast) + fecha(lastAt) + ')' : '') + '.</p></div>' +
    '<div class="card"><h2>' + tt(UI.h2Shields) + '</h2>' +
      '<div class="papers">' + paperBox('listening', L, shL) + paperBox('rw', R, shR) + paperBox('speaking', S, shS) + '</div>' +
      '<div class="total"><b>' + total + tt(UI.totalOf15) + '</b> <span class="muted small">' + (LANG === 'en'
        ? '· Nordic’s estimate based on ' + tests + ' practice test' + (tests === 1 ? '' : 's') + ' · ' + fecha(D.generated_at)
        : '· estimación de Nordic a partir de ' + tests + ' test' + (tests === 1 ? '' : 's') + ' de práctica · ' + fecha(D.generated_at)) + '</span></div>' +
      '<div class="warn">' + tt(UI.warnShields) + '</div>' + fb + '</div>' +
    '<div class="card"><h2>' + tt(UI.canDoTitle) + NAMES[LEVEL] + '</h2><p class="small muted">' + tt(UI.canDoHint) + '</p>' +
      '<div class="two"><div><h3>' + tt(UI.listenSpeakHeader) + '</h3><ul class="cando">' + tt(cando.ls).map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>' +
      '<div><h3>' + tt(UI.readWriteHeader) + '</h3><ul class="cando">' + tt(cando.rw).map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div></div></div>' +
    '<div class="card"><h2>' + tt(UI.practiceHomeTitle) + '</h2>' +
      (tips || (partes.length ? '<p>' + tt(UI.practiceGoodMsg) + '</p>' : '<p>' + tt(UI.practiceNoneMsg) + '</p>')) +
      '<div class="tip"><b>' + tt(UI.vocabTipTitle) + '</b>' + tt(UI.vocabMasteredPrefix) + '<b>' + (vocab.mastered || 0) + '</b>' + (vocab.seen ? tt(UI.vocabSeenPrefix) + vocab.seen + ')' : '') + tt(UI.vocabClosingSentence) + '</div>' +
      '<p class="small muted">' + tt(UI.guideLinkText) + '</p></div>' +
    '<div class="card"><h2>' + tt(UI.examTitle) + '</h2>' +
      '<p>' + tt(UI.examDateLabel) + (examDate ? esc(fecha(examDate + 'T12:00:00') || examDate) : tt(UI.examDateTBD)) + (examNote ? ' · ' + esc(examNote) : '') + '</p>' + fmt +
      '<p class="small muted" style="margin-top:8px">' + tt(UI.examFooterNote) + '</p></div>' +
    '<p class="small muted">' + tt(UI.footerBoletin) + fecha(D.generated_at) + '.</p>';
}

/* ---------- caja del profesor: solo el PDF, que se manda por Toddle ---------- */
function teacherPanel(){
  var g = D.guardian || {};
  return '<div class="card teacher noprint"><h2>' + tt(UI.teacherPanelTitle) + '</h2>' +
    '<p class="small">' + tt(UI.teacherPanelBody1) + '</p>' +
    '<p class="small">' + tt(UI.teacherPanelGuardianLabel) + '<b>' + esc(g.name || '—') + '</b>.</p>' +
    '<p><button class="btn" onclick="window.print()">' + tt(UI.teacherPanelBtn) + '</button></p></div>';
}

function refreshLang(){
  document.documentElement.lang = LANG;
  var pt = document.querySelector('title'); if(pt) pt.textContent = tt(UI.pageTitle);
  var hT = $('#hTitle'); if(hT) hT.textContent = tt(UI.hTitle);
  var bP = $('#btnPrint'); if(bP) bP.textContent = tt(UI.btnPrint);
  var bG = $('#btnGuide'); if(bG) bG.textContent = tt(UI.btnGuide);
  var langBtn = $('#lang'); if(langBtn) langBtn.textContent = (LANG === 'en') ? '🌐 Español' : '🌐 English';
  if(VIEW_STATE === 'rendered'){ render(); }
  else {
    var hS = $('#hSub'); if(hS) hS.textContent = tt(UI.hSubDefault);
    if(VIEW_STATE === 'oldlink') showOldLink();
    else if(VIEW_STATE === 'error') renderError();
    else showLoading();
  }
}
function toggleLang(){
  LANG = (LANG === 'en') ? 'es' : 'en';
  try{ localStorage.setItem('nis.yle.lang', LANG); }catch(e){}
  refreshLang();
}
var langBtn0 = $('#lang');
if(langBtn0) langBtn0.addEventListener('click', toggleLang);
refreshLang();
load();
})();
</script>
