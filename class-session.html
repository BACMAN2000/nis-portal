<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class · Nordic International School</title>
<link rel="icon" href="assets/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#4987c6; --blue-d:#2f5f93; --blue-dd:#244c77;
  --bg:#f2f3ff; --grey:#636465; --line:#e3e5f3; --lila:#d1d2ea; --celeste:#76cbe5; --ink:#2b2c33;
  --amber:#9a5c15; --amber-bg:#fdf6ec; --amber-line:#e6c894;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Montserrat',system-ui,Segoe UI,sans-serif;color:var(--ink);background:var(--bg);line-height:1.55}
h1,h2,h3{line-height:1.2;margin:0 0 .4em;font-weight:700}
header{display:flex;align-items:center;gap:14px;background:var(--blue);padding:12px 22px;color:#fff}
header img{height:32px}
header .spacer{flex:1}
header a,header button{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.3);
  padding:8px 14px;border-radius:10px;font:600 .88rem/1 inherit;font-family:inherit;text-decoration:none;cursor:pointer}
header a:hover,header button:hover{background:rgba(255,255,255,.3)}
.wrap{max-width:840px;margin:0 auto;padding:20px 18px 60px}
.hoja{background:#fff;border:1px solid var(--line);border-radius:12px;padding:32px 36px;margin-bottom:20px;
  box-shadow:0 8px 24px rgba(36,76,119,.08)}
.cinta{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--blue-d);font-weight:800}
.hoja h2{font-size:1.3rem;color:var(--blue-dd);margin:6px 0 2px}
.foco{color:var(--grey);font-size:.9rem;margin:0 0 18px}
.bloque{margin:20px 0}
.bloque h3{font-size:.74rem;text-transform:uppercase;letter-spacing:.09em;color:var(--grey);margin:0 0 8px}
.portada{background:linear-gradient(135deg,var(--blue-dd),var(--blue));color:#fff}
.portada h1{color:#fff;font-size:1.55rem;margin:8px 0 0}
.portada .bigq{margin:14px 0 0;padding:13px 16px;background:rgba(255,255,255,.13);border-left:4px solid var(--celeste);
  border-radius:0 10px 10px 0;font-size:.98rem;font-weight:600}
.portada .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.portada .meta span{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);border-radius:999px;
  padding:5px 13px;font-size:.8rem;font-weight:600}
ol.pasos{margin:0;padding-left:0;list-style:none;counter-reset:p}
ol.pasos li{counter-increment:p;position:relative;padding:14px 0 14px 48px;border-bottom:1px solid var(--line)}
ol.pasos li:last-child{border-bottom:none}
ol.pasos li::before{content:counter(p);position:absolute;left:0;top:12px;width:30px;height:30px;border-radius:50%;
  background:var(--blue);color:#fff;font-weight:800;font-size:.85rem;display:flex;align-items:center;justify-content:center}
.consigna{background:#eef4fb;border-left:4px solid var(--blue);border-radius:0 10px 10px 0;padding:15px 17px;
  font-size:1rem;font-weight:600;color:var(--blue-dd)}
.ayuda{background:var(--amber-bg);border-left:4px solid var(--amber);border-radius:0 10px 10px 0;padding:13px 16px;font-size:.9rem}
.ayuda b{color:var(--amber)}
.apoyo{display:flex;flex-wrap:wrap;gap:7px}
.apoyo span{background:#f7faff;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.83rem;font-weight:600;color:var(--blue-dd)}
.exito{list-style:none;padding:0;margin:0}
.exito li{padding:8px 0 8px 26px;position:relative;font-size:.89rem;border-bottom:1px dashed var(--line)}
.exito li:last-child{border-bottom:none}
.exito li::before{content:'☐';position:absolute;left:2px;top:7px;color:var(--blue);font-size:1rem}
.renglones{margin-top:10px}
.renglones div{border-bottom:1px solid #d8dded;height:30px}
.otros{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.otros a{background:#fff;border:1px solid var(--lila);border-radius:999px;padding:6px 14px;font-size:.83rem;
  font-weight:700;color:var(--blue-d);text-decoration:none}
.otros a.on{background:var(--blue);color:#fff;border-color:var(--blue)}
@media print{
  header,.noimprimir{display:none !important}
  body{background:#fff}
  .wrap{max-width:none;padding:0}
  .hoja{border:none;border-radius:0;box-shadow:none;margin:0;padding:24mm 18mm;page-break-after:always;break-after:page}
  .hoja:last-child{page-break-after:auto}
  .portada{background:#fff !important;color:var(--ink) !important}
  .portada h1,.portada .cinta{color:var(--blue-dd) !important}
  .portada .bigq{background:#eef4fb !important;color:var(--blue-dd) !important;border-left-color:var(--blue) !important}
  .portada .meta span{background:#eef4fb !important;border-color:var(--lila) !important;color:var(--blue-dd) !important}
  @page{margin:0}
}
</style>
</head>
<body>
<header class="noimprimir">
  <img src="assets/logo-white-h.svg" alt="Nordic International School" onerror="this.onerror=null;this.src='assets/logo-h.svg'">
  <div class="spacer"></div>
  <button onclick="window.print()">🖨️ Print</button>
  <a href="./" id="backBtn">&#8592; Back</a>
</header>

<div class="wrap" id="app"><p>Loading…</p></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="config.js"></script>
<script src="unit-plans.js?v=11"></script>
<script src="nis-nav.js?v=2"></script>
<script>
/* Dos vistas de la misma semana, generadas del planner:
 *
 *   sin ?level  -> VIEW CLASS: el guion de la sesion, para conducir la clase.
 *                  Es material del profesor y va cerrado al alumno.
 *   con ?level  -> la FICHA del alumno en ese nivel, para imprimir o resolver.
 *
 * En secundaria hay hasta cuatro niveles en un aula (A2-C1); en primaria la
 * diferenciacion es suave a proposito y son solo dos (Support y Core). Los
 * niveles no se inventan aqui: salen de `levels` en cada semana del planner.
 */
const Q = new URLSearchParams(location.search);
const GRADE = (Q.get('grade')||'g9').toLowerCase();
const UNIT  = parseInt(Q.get('unit')||'0',10);
const WEEK  = parseInt(Q.get('week')||'1',10);
const LEVEL = Q.get('level')||'';

const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PLAN = (window.UNIT_PLANS||{})[GRADE];
const U = PLAN ? (PLAN.units||[]).filter(u=>u.n===UNIT)[0] : null;
const W = U ? (U.sequence||[]).filter(w=>w.n===WEEK)[0] : null;

const UNIT_PILOT = new Set([
  'g2.u5','g2.u6','g3.u5','g3.u6','g4.u5','g4.u6','g5.u5','g5.u6','g9.u105','g9.u106'
]);

/* ---- quien mira ---- */
let sb=null, me=null, esProfe=false;
async function conecta(){
  try{
    const cfg=window.NIS_CONFIG;
    if(!(cfg && window.supabase && window.supabase.createClient)) return;
    sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_KEY);
    const {data}=await sb.auth.getSession();
    me = data && data.session ? data.session.user : null;
    if(!me) return;
    const t=await sb.from('teacher_access').select('can_results').eq('profile_id',me.id).maybeSingle();
    if(t && t.data && t.data.can_results){ esProfe=true; return; }
    const pr=await sb.from('profiles').select('role').eq('id',me.id).maybeSingle();
    const rol = pr && pr.data ? pr.data.role : null;
    esProfe = (rol==='admin' || rol==='teacher');
  }catch(_){ esProfe=false; }
}
/* La unidad del piloto solo la abre quien tenga permiso; misma regla que
   unit.html. Fail-closed. */
async function puedeVerla(){
  if(esProfe) return true;
  if(!UNIT_PILOT.has(GRADE+'.u'+UNIT)) return true;
  if(!sb || !me) return false;
  try{
    const key='english.classes.'+GRADE+'.units.u'+UNIT;
    const al=await sb.from('student_access').select('unlocked')
      .eq('student_id',me.id).eq('node_key',key).maybeSingle();
    if(al && al.data) return !!al.data.unlocked;
    const pr=await sb.from('profiles').select('grade_id').eq('id',me.id).maybeSingle();
    const gid = pr && pr.data ? pr.data.grade_id : null;
    if(gid==null) return false;
    const gr=await sb.from('node_access').select('unlocked')
      .eq('grade_id',gid).eq('node_key',key).maybeSingle();
    return !!(gr && gr.data && gr.data.unlocked);
  }catch(_){ return false; }
}

function cerrado(t,d){
  document.getElementById('app').innerHTML =
    `<div class="hoja" style="text-align:center;padding:52px 38px">
      <div style="font-size:3.2rem;line-height:1">🔒</div>
      <h2 style="margin:14px 0 6px">${esc(t)}</h2>
      <p class="foco">${esc(d)}</p>
      <a href="./" style="display:inline-block;background:var(--blue);color:#fff;text-decoration:none;
         padding:10px 18px;border-radius:10px;font-weight:600;font-size:.9rem">← Volver al portal</a>
    </div>`;
}

function portada(sub){
  const ses=(W.sessions||[])[0];
  return `<section class="hoja portada">
    <div class="cinta">${esc((PLAN.label||GRADE))} · Unit ${esc(String(U.label||U.n))} · Week ${W.n}</div>
    <h1>${esc(W.title)}</h1>
    <div class="bigq">${esc(U.bigq||'')}</div>
    <div class="meta">
      <span>${esc(sub)}</span>
      ${ses?`<span>S${ses.s} · ${esc(ses.title)}</span>`:''}
      <span>Hand in: ${esc(W.give||'—')}</span>
    </div>
  </section>`;
}

/* ---------------- VIEW CLASS: el guion de la sesion ---------------- */
function vistaClase(){
  const ses = W.sessions||[];
  return portada('Guion de clase') + ses.map(s=>`
    <section class="hoja">
      <div class="cinta">Sesión ${s.s}</div>
      <h2>${esc(s.title)}</h2>
      <p class="foco">${esc(W.desc||'')}</p>
      <div class="bloque"><h3>Cómo va la sesión</h3>
        <ol class="pasos">${(s.view||[]).map(p=>`<li>${esc(p)}</li>`).join('')}</ol></div>
      <div class="bloque"><h3>Al terminar, el alumno entrega</h3>
        <div class="consigna">${esc(W.give||'')}</div></div>
      ${W.levels?`<div class="bloque"><h3>La ficha, por nivel</h3><div class="otros">
        ${Object.keys(W.levels).map(l=>`<a href="class-session.html?grade=${esc(GRADE)}&unit=${U.n}&week=${W.n}&level=${encodeURIComponent(l)}">${esc(l)}</a>`).join('')}
      </div></div>`:''}
      ${U.words&&U.words.length?`<div class="bloque"><h3>Lengua de la unidad</h3>
        <div class="apoyo">${U.words.slice(0,14).map(w=>`<span>${esc(w)}</span>`).join('')}</div></div>`:''}
    </section>`).join('');
}

/* ---------------- LA FICHA DEL ALUMNO, por nivel ---------------- */
function vistaFicha(){
  const L = (W.levels||{})[LEVEL];
  if(!L) return `<div class="hoja"><h2>Ese nivel no existe en esta semana</h2>
    <p class="foco">Los niveles de esta semana son: ${Object.keys(W.levels||{}).join(', ')||'ninguno'}.</p></div>`;
  const otros = Object.keys(W.levels).map(l=>
    `<a class="${l===LEVEL?'on':''}" href="class-session.html?grade=${esc(GRADE)}&unit=${U.n}&week=${W.n}&level=${encodeURIComponent(l)}">${esc(l)}</a>`).join('');
  const crit = (U.criteria||[]).slice(0, 2).map(c=>{
    const t = c.levels ? (c.levels.A||c.text) : c.text; return `<li>${esc(t)}</li>`;
  }).join('');
  return portada('Worksheet · '+LEVEL) + `
    <section class="hoja">
      <div class="cinta noimprimir">Nivel</div>
      <div class="otros noimprimir" style="margin-bottom:18px">${otros}</div>
      <div class="cinta">Week ${W.n} · ${esc(LEVEL)}</div>
      <h2>${esc(W.title)}</h2>
      <div class="bloque"><h3>Your task</h3><div class="consigna">${esc(L.task)}</div></div>
      ${L.help?`<div class="bloque"><h3>Help you can use</h3>
        <div class="ayuda"><b>Support:</b> ${esc(L.help)}</div></div>`:''}
      <div class="bloque"><h3>You've done it when…</h3><ul class="exito">${crit}</ul></div>
      <div class="bloque"><h3>Write it here — draft first, cross things out</h3>
        ${'<div class="renglones">'+'<div></div>'.repeat(11)+'</div>'}</div>
      <p class="foco" style="margin-top:14px">Hand in: ${esc(W.give||'')}</p>
    </section>`;
}

(async function(){
  await conecta();
  if(!U || !W){ cerrado('Esa semana no está', 'Vuelve al portal y elige otra.'); return; }
  if(!(await puedeVerla())){ cerrado('This unit is not open yet','Your teacher will unlock it when the unit starts.'); return; }
  if(!LEVEL && !esProfe){ cerrado('Solo para profesores','El guion de clase es material del profesor. Pide a tu profesor la ficha de tu nivel.'); return; }
  document.title = (LEVEL? 'Worksheet '+LEVEL : 'Class') + ' · '+PLAN.label+' · Unit '+(U.label||U.n)+' W'+W.n;
  document.getElementById('app').innerHTML = LEVEL ? vistaFicha() : vistaClase();
})();
</script>
</body>
</html>
