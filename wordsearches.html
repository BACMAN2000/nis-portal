<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Word Searches A1–C1 · NIS English</title>
<style>
  :root{--bg:#f4f6fb;--card:#fff;--ink:#1e2433;--muted:#67718a;--accent:#3b5bdb;--accent-soft:#e7ecfd;
    --good:#2f9e44;--good-soft:#d3f4dc;--gold:#f59f00;
    --f1:#ffd8a8;--f2:#b2f2bb;--f3:#a5d8ff;--f4:#fcc2d7;--f5:#d0bfff;--f6:#ffec99;--f7:#c3fae8;--f8:#ffd6a5;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{-webkit-touch-callout:none;font-family:'Segoe UI',system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);padding:14px;user-select:none;-webkit-user-select:none}
  header{max-width:1150px;margin:0 auto 6px;text-align:center}
  header h1{font-size:1.35rem}
  header p{color:var(--muted);font-size:.85rem;margin-top:3px}
  a.back{display:inline-block;margin-top:8px;text-decoration:none;background:#2d5a8d;color:#fff;font-weight:700;font-size:.8rem;padding:7px 13px;border-radius:9px}
  .levels,.puzzles{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px auto;max-width:1150px}
  .lv{border:2px solid transparent;background:var(--card);color:var(--ink);padding:7px 16px;border-radius:22px;font-weight:800;font-size:.9rem;cursor:pointer;box-shadow:0 1px 3px rgba(20,30,60,.12)}
  .lv.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .pz{border:1px solid #d7def0;background:var(--card);color:var(--ink);padding:6px 11px;border-radius:14px;font-weight:700;font-size:.8rem;cursor:pointer}
  .pz small{display:block;font-weight:500;font-size:.66rem;color:var(--muted)}
  .pz.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .pz.on small{color:var(--accent)}
  .wrap{max-width:1150px;margin:0 auto;display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
  .board{max-width:100%;background:var(--card);border-radius:14px;padding:12px;box-shadow:0 2px 10px rgba(20,30,60,.08);overflow:auto}
  .gridbox{display:grid;gap:2px;touch-action:none}
  .cell{width:var(--cs);height:var(--cs);display:flex;align-items:center;justify-content:center;background:var(--accent-soft);border-radius:4px;font-weight:800;font-size:calc(var(--cs)*.5);cursor:pointer}
  .cell.sel{background:#94a8f5;color:#fff}
  .cell.found{color:#1e2433}
  .info{color:var(--muted);font-size:.78rem;margin-top:8px}
  .lifebar{margin-top:8px;font-weight:800;font-size:1rem;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .watch{font-variant-numeric:tabular-nums;color:var(--accent)}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  button.act{border:none;border-radius:9px;padding:9px 15px;font-weight:700;font-size:.85rem;cursor:pointer}
  .b-hint{background:var(--gold);color:#fff}.b-clear{background:#e9ecf3;color:var(--ink)}
  .side{flex:1 1 280px;min-width:250px;max-width:400px}
  .panel{background:var(--card);border-radius:14px;padding:14px 16px;box-shadow:0 2px 10px rgba(20,30,60,.08)}
  .panel h3{font-size:.8rem;text-transform:uppercase;letter-spacing:1px;color:var(--accent);margin-bottom:9px}
  .wlist{display:flex;flex-wrap:wrap;gap:6px;max-height:60vh;overflow:auto}
  .wchip{padding:5px 10px;border-radius:14px;background:var(--accent-soft);font-size:.78rem;font-weight:700;letter-spacing:.4px}
  .wchip.found{background:var(--good-soft);color:var(--good);text-decoration:line-through}
  .score{font-size:.9rem;margin-top:10px;color:var(--muted);font-weight:600}
  .banner{display:none;margin-top:10px;padding:11px;border-radius:10px;background:var(--good-soft);color:var(--good);font-weight:800;text-align:center;font-size:.95rem}
  .banner.show{display:block}
  .staffnote{display:none;margin:8px auto;max-width:1150px;padding:9px 12px;border-radius:9px;background:#fff4e6;color:#b35309;font-weight:700;text-align:center;font-size:.85rem}
  .flash{animation:flash 1s 3}@keyframes flash{50%{background:var(--gold);color:#fff}}
  @media (max-width:480px){body{padding:6px}.board{padding:8px}.gridbox{gap:1px}}
</style>

window.NISACT=(function(){
  let _sb=null,_role=null,_loaded=false,_cbs=[]; const api={_user:null};
  function client(){ if(_sb) return _sb; if(!window.supabase||!window.NIS_CONFIG) return null; _sb=window.supabase.createClient(NIS_CONFIG.SUPABASE_URL,NIS_CONFIG.SUPABASE_KEY); return _sb; }
  async function load(){ const c=client(); if(!c){_loaded=true;fire();return;}
    try{ const u=await c.auth.getUser(); if(u&&u.data&&u.data.user){ const p=await c.from('profiles').select('full_name,first_name,email,role').eq('id',u.data.user.id).maybeSingle();
      if(p&&p.data){_role=p.data.role; api._user={uid:u.data.user.id,email:u.data.user.email||p.data.email,full_name:p.data.full_name,first_name:p.data.first_name,role:p.data.role};} } }catch(e){}
    _loaded=true; fire(); }
  function fire(){ _cbs.forEach(f=>{try{f();}catch(e){}}); _cbs=[]; }
  api.onReady=function(f){ if(_loaded)f(); else _cbs.push(f); };
  api.isStaff=function(){ return _role==='teacher'||_role==='admin'; };
  api.submit=async function(r){ if(!api._user)return{skipped:true};
    try{ await client().from('activity_attempts').insert({student_id:api._user.uid,activity:r.activity,title:r.title,level:r.level,score:r.score,total:r.total,hints_used:r.hints,lives_left:r.lives,duration_sec:r.duration}); }catch(e){}
    try{ const m=Math.floor(r.duration/60),sec=r.duration%60;
      await fetch(NIS_CONFIG.WRITING_WEBHOOK,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify({skill:'Activity',name:api._user.full_name||api._user.first_name||'',email:api._user.email||'',level:r.level,
          examTitle:r.title+' - Time '+m+'m '+String(sec).padStart(2,'0')+'s - Hints '+r.hints+' - Lives left '+r.lives,
          examType:r.activity,score:r.score,total:r.total,duration_min:Math.max(1,Math.round(r.duration/60))})}); }catch(e){}
    return {sent:true}; };
  load(); return api;
})();

let LEVELS=["A1","A2","B1","B2","C1"];
(function(){var q=new URLSearchParams(location.search).get('levels');if(q){var s=q.toUpperCase().split(',').map(function(x){return x.trim();});var f=LEVELS.filter(function(l){return s.indexOf(l)>=0;});if(f.length)LEVELS=f;}})();
const PALETTE=['--f1','--f2','--f3','--f4','--f5','--f6','--f7','--f8'];
let level=LEVELS[0],pidx=0;
let cellEls={},selStart=null,selCells=[],found={},completed=false;
let lives=5,elapsed=0,timerInt=null,hintsUsed=0;
function fmtT(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function staff(){return window.NISACT&&NISACT.isStaff&&NISACT.isStaff();}
function cur(){return DATA[level][pidx];}
function drawStatus(){ const h=document.getElementById('hearts'),w=document.getElementById('watch');
  if(staff()){h.textContent='👩‍🏫';w.textContent='⏱ —';return;}
  h.textContent='❤️'.repeat(lives)+'🤍'.repeat(Math.max(0,5-lives)); w.textContent='⏱ '+fmtT(elapsed); }
function startWatch(){ clearInterval(timerInt); if(staff()||completed){drawStatus();return;} timerInt=setInterval(()=>{elapsed++;drawStatus();},1000); drawStatus(); }
function buildLevels(){ const L=document.getElementById('levels'); L.innerHTML='';
  LEVELS.forEach(lv=>{const b=document.createElement('button');b.className='lv'+(lv===level?' on':'');b.textContent=lv;b.onclick=()=>{progLee();level=lv;pidx=0;load();};L.appendChild(b);}); }
function buildPuzzles(){ const P=document.getElementById('puzzles'); P.innerHTML='';
  DATA[level].forEach((p,i)=>{const b=document.createElement('button');b.className='pz'+(i===pidx?' on':'');b.innerHTML=`${i+1}<small>${p.theme}</small>`;b.onclick=()=>{progLee();pidx=i;load();};P.appendChild(b);}); }
function load(){
  const d=cur(); cellEls={};selStart=null;selCells=[];found={};completed=false;lives=5;elapsed=0;hintsUsed=0;
  document.getElementById('banner').classList.remove('show');
  document.getElementById('staffnote').style.display=staff()?'block':'none';
  document.getElementById('ptitle').innerHTML=`Word Search ${pidx+1} — ${d.theme} <span id="count"></span>`;
  document.getElementById('dirinfo').textContent='Words run horizontally, vertically and diagonally — forwards and backwards.';
  const avail=Math.min(window.innerWidth-44, 640);
  const cs=Math.max(16,Math.min(34,Math.floor(avail/d.size)));
  const g=document.getElementById('grid'); g.style.gridTemplateColumns=`repeat(${d.size}, ${cs}px)`; g.innerHTML='';
  for(let r=0;r<d.size;r++)for(let c=0;c<d.size;c++){
    const el=document.createElement('div'); el.className='cell'; el.textContent=d.grid[r][c];
    el.style.setProperty('--cs',cs+'px'); el.dataset.r=r; el.dataset.c=c;
    el.addEventListener('pointerdown',e=>{e.preventDefault();try{el.releasePointerCapture(e.pointerId);}catch(_){}selStart=[r,c];updateSel(r,c);});
    el.addEventListener('pointerenter',()=>{if(selStart)updateSel(r,c);});
    cellEls[r+'_'+c]=el; g.appendChild(el);
  }
  document.addEventListener('pointerup',endSel); document.addEventListener('pointercancel',endSel);
  g.addEventListener('pointermove',e=>{ if(!selStart)return; const t=document.elementFromPoint(e.clientX,e.clientY);
    if(t&&t.classList&&t.classList.contains('cell')&&t.dataset.r!=null) updateSel(+t.dataset.r,+t.dataset.c); });
  const wl=document.getElementById('wlist'); wl.innerHTML='';
  for(const w of d.words.slice().sort((a,b)=>a.word.localeCompare(b.word))){ const chip=document.createElement('div'); chip.className='wchip'; chip.id='chip_'+w.word; chip.textContent=w.word; wl.appendChild(chip); }
  buildLevels(); buildPuzzles(); updateScore(); startWatch();
  progPinta();
  if(staff()) revealAll();
}
function lineCells(a,b){ const dr=Math.sign(b[0]-a[0]),dc=Math.sign(b[1]-a[1]);
  const len=Math.max(Math.abs(b[0]-a[0]),Math.abs(b[1]-a[1]))+1;
  if(dr!==0&&dc!==0&&Math.abs(b[0]-a[0])!==Math.abs(b[1]-a[1]))return null;
  return Array.from({length:len},(_,i)=>[a[0]+dr*i,a[1]+dc*i]); }
function updateSel(r,c){ const cellsL=lineCells(selStart,[r,c]); document.querySelectorAll('.cell.sel').forEach(e=>e.classList.remove('sel'));
  selCells=cellsL||[selStart]; for(const [rr,cc] of selCells) cellEls[rr+'_'+cc].classList.add('sel'); }
function endSel(){ if(!selStart)return; const d=cur(); const s=selCells.map(([r,c])=>d.grid[r][c]).join('');
  for(const w of d.words){ if(!found[w.word]&&(s===w.word||s===[...w.word].reverse().join(''))){ found[w.word]=true; paint(w,d.words.indexOf(w)); const chip=document.getElementById('chip_'+w.word); if(chip)chip.classList.add('found'); break; } }
  document.querySelectorAll('.cell.sel').forEach(e=>e.classList.remove('sel')); selStart=null; selCells=[]; updateScore();
  if(window.NIS_WORK) NIS_WORK.touch();
  if(d.words.every(w=>found[w.word])&&!completed) onComplete(); }
function paint(w,i){ const col=`var(${PALETTE[i%PALETTE.length]})`; for(const [r,c] of w.cells){ const el=cellEls[r+'_'+c]; el.classList.add('found'); el.style.background=col; } }
function updateScore(){ const d=cur(); const n=d.words.filter(w=>found[w.word]).length;
  const cEl=document.getElementById('count'); if(cEl)cEl.textContent=`(${n}/${d.words.length})`;
  document.getElementById('score').textContent=`Found: ${n} / ${d.words.length}`+(hintsUsed?` · Hints: ${hintsUsed}`:''); }
function onComplete(){ completed=true; clearInterval(timerInt); const b=document.getElementById('banner');
  if(staff()){ b.textContent='✅ Solved view (teacher/admin).'; b.classList.add('show'); return; }
  b.textContent=`🎉 All words found in ${fmtT(elapsed)}! Saved to My Results and emailed to you.`; b.classList.add('show');
  if(window.NISACT) NISACT.submit({activity:'wordsearch',title:`Word Search ${pidx+1} — ${cur().theme}`,level:level,score:cur().words.length,total:cur().words.length,hints:hintsUsed,lives:lives,duration:elapsed}); }
function hint(){ if(completed||staff())return; const d=cur(); const left=d.words.filter(w=>!found[w.word]); if(!left.length)return;
  const w=left[Math.floor(Math.random()*left.length)]; const [r,c]=w.cells[0];
  cellEls[r+'_'+c].classList.remove('flash'); void cellEls[r+'_'+c].offsetWidth; cellEls[r+'_'+c].classList.add('flash');
  hintsUsed++; lives--; drawStatus();
  if(lives<=0){ setTimeout(()=>{ alert('💔 No lives left! This word search restarts.'); resetLevel(); },900); return; } updateScore(); }
function resetLevel(){ load(); }
function revealAll(){ const d=cur(); d.words.forEach((w,i)=>{ found[w.word]=true; paint(w,i); const chip=document.getElementById('chip_'+w.word); if(chip)chip.classList.add('found'); });
  clearInterval(timerInt); updateScore(); const b=document.getElementById('banner'); b.textContent='✅ Solved view (teacher/admin).'; b.classList.add('show'); drawStatus(); }

/* ---- Guardado y entrega (barra Save / Submit) --------------------------
   Practica libre por nivel: se guarda por nivel Y por sopa (A2#3), porque
   aqui hay diez de cada nivel. load() vacia `found` y no repinta, asi que la
   restauracion tiene que volver a colorear la rejilla y las fichas. */
const PROG = {};
function progClave(){ return level + '#' + pidx; }
function progLee(){
  PROG[progClave()] = { found:Object.keys(found), lives:lives, elapsed:elapsed,
                        hints:hintsUsed, done:!!completed, total:cur().words.length };
  return PROG;
}
function progPinta(){
  const p = PROG[progClave()];
  if(!p) return;
  const d = cur();
  found = {};
  (p.found || []).forEach(function(w){ found[w] = true; });
  d.words.forEach(function(w,i){
    if(!found[w.word]) return;
    paint(w, i);
    const chip = document.getElementById('chip_' + w.word);
    if(chip) chip.classList.add('found');
  });
  if(typeof p.lives === 'number') lives = p.lives;
  if(typeof p.elapsed === 'number') elapsed = p.elapsed;
  if(typeof p.hints === 'number') hintsUsed = p.hints;
  /* completed ANTES de nada: reabrir una sopa acabada no puede volver a
     mandarla por correo. */
  if(p.done) completed = true;
  drawStatus();
  updateScore();
}
if(window.NIS_WORK) NIS_WORK.attach(Object.assign(NIS_WORK.ficha(), {
  title: document.title,
  read:  function(){ return { store: progLee(), level: level, pidx: pidx }; },
  write: function(d){
    const p = (d && d.store) || {};
    Object.keys(p).forEach(function(k){ PROG[k] = p[k]; });
    if(d && d.level && DATA[d.level]) level = d.level;
    if(d && typeof d.pidx === 'number' && DATA[level] && DATA[level][d.pidx]) pidx = d.pidx;
  },
  after: function(){ load(); },
  count: function(d){
    const p = (d && d.store) || {};
    return Object.keys(p).reduce(function(n,k){ return n + ((p[k] || {}).found || []).length; }, 0);
  },
  answers: function(d){
    const p = (d && d.store) || {}, out = {};
    Object.keys(p).forEach(function(k){
      const x = p[k] || {}, par = k.split('#'), t = DATA[par[0]] && DATA[par[0]][+par[1]];
      out[par[0] + ' / ' + (t ? t.theme : ('#' + (+par[1] + 1)))] =
        (x.found || []).length + '/' + (x.total || 0) + ' words / ' + fmtT(x.elapsed || 0) +
        ' / hints ' + (x.hints || 0) + ' / lives ' + (x.lives || 0) + (x.done ? ' / finished' : '');
    });
    return out;
  }
}));

window.NISACT.onReady(()=>{ document.getElementById('staffnote').style.display=staff()?'block':'none'; load(); });
setTimeout(()=>{ if(!document.getElementById('grid').children.length) load(); },1500);
