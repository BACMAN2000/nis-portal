<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit · Nordic International School</title>
<link rel="icon" href="assets/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#4987c6; --blue-d:#2f5f93; --blue-dd:#244c77;
  --bg:#f2f3ff; --white:#fff; --grey:#636465; --line:#e3e5f3;
  --lila:#d1d2ea; --celeste:#76cbe5;
  --good:#16a34a; --warn:#f59e0b; --bad:#dc2626;
  --ink:#2b2c33; --r:16px; --r-sm:10px;
  --shadow:0 10px 30px rgba(36,76,119,.10);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Montserrat',system-ui,Segoe UI,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5}
h1,h2,h3{line-height:1.2;margin:0 0 .4em;font-weight:700}
a{color:var(--blue-d)}
header{display:flex;align-items:center;gap:14px;background:var(--blue);padding:12px 22px;color:#fff;box-shadow:var(--shadow)}
header img{height:34px;width:auto;display:block}
header .spacer{flex:1}
header a.back{background:rgba(255,255,255,.16);color:#fff;border:none;padding:8px 14px;border-radius:var(--r-sm);font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:7px;text-decoration:none}
header a.back:hover{background:rgba(255,255,255,.28)}
.wrap{max-width:1020px;margin:0 auto;padding:22px 18px 70px}
.hero{background:linear-gradient(135deg,var(--blue-dd),var(--blue));color:#fff;border-radius:var(--r);padding:24px 26px;margin-bottom:20px;box-shadow:var(--shadow)}
.hero{position:relative;overflow:hidden}
.hero .motivo{position:absolute;right:-10px;bottom:-34px;font-size:9rem;line-height:1;opacity:.18;
  filter:saturate(.4) brightness(1.6);pointer-events:none;user-select:none}
.hero.foto{background-size:cover;background-position:center}
.hero.foto::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(20,35,60,.82),rgba(20,35,60,.5))}
.hero.foto>*{position:relative;z-index:1}
.hero .eyebrow{font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;color:#a9cdf0;font-weight:700;margin:0 0 8px}
.hero h1{color:#fff;font-size:1.6rem;font-weight:800;margin:0}
.hero .bigq{margin:14px 0 0;padding:12px 15px;background:rgba(255,255,255,.12);border-left:4px solid var(--celeste);border-radius:0 var(--r-sm) var(--r-sm) 0;font-size:1rem;font-weight:600}
.hero .meta{margin:12px 0 0;color:#dbe8f6;font-size:.84rem}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow)}
.sec-title{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px;flex-wrap:wrap}
.sec-title h2{font-size:1.15rem;color:var(--blue-dd);margin:0}
.sec-title .hint{font-size:.82rem;color:var(--grey)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.prod{background:var(--white);border:2px solid var(--blue);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow)}
.prod .ico{font-size:2.1rem;line-height:1}
.prod h3{margin:8px 0 4px;color:var(--blue-dd);font-size:1.02rem}
.prod p{margin:0;font-size:.88rem;color:var(--grey)}
.prod .spec{margin-top:10px;font-size:.78rem;font-weight:700;color:var(--blue-d);background:#eef4fb;display:inline-block;padding:4px 10px;border-radius:999px}
.aud{font-size:.86rem;color:var(--grey)}
table.rub{width:100%;border-collapse:collapse;font-size:.82rem}
table.rub th,table.rub td{border:1px solid var(--line);padding:9px 10px;vertical-align:top;text-align:left}
table.rub th{background:#eef4fb;color:var(--blue-dd);font-weight:700;font-size:.76rem;text-transform:uppercase;letter-spacing:.04em}
/* las cabeceras van centradas sobre su columna: pegadas a la izquierda se
   leian como el principio del descriptor y no como el titulo de la columna.
   El texto de cada criterio si se queda a la izquierda — son varias lineas
   de texto corrido y centradas se leen peor. */
table.rub th{text-align:center}
table.rub th:not(:first-child){font-size:.92rem;letter-spacing:.02em}
table.rub td.crit{background:#fafbff;font-weight:600;color:var(--ink)}
table.rub td.lvl{cursor:pointer;transition:.12s;text-align:center}
table.rub td.lvl:hover{background:#f4f8fd}
table.rub td.lvl.on{background:#dff0e0;box-shadow:inset 0 0 0 2px var(--good)}
table.rub.desc td.crit{width:22%}
table.rub.plain td.lvl{width:9%;font-weight:700;color:var(--blue-d)}
.rub-wrap{overflow-x:auto}
.legend{font-size:.78rem;color:var(--grey);margin-top:10px}
/* que significa cada letra, en el mismo orden que las columnas */
.escala{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
.escala li{display:flex;align-items:center;gap:9px;font-size:.82rem;color:var(--ink)}
.escala .lv{flex:none;min-width:2.2rem;text-align:center;border-radius:6px;padding:2px 7px;
  font-weight:800;font-size:.76rem;color:#1f2937}
.escala .lv.ad{background:#dcfce7}
.escala .lv.a{background:#e0f2fe}
.escala .lv.b{background:#fef9c3}
.escala .lv.c{background:#fee2e2}
.week{display:flex;gap:14px;padding:14px 0;border-bottom:1px dashed var(--line)}
.week:last-child{border-bottom:none}
.week .n{flex:0 0 46px;height:46px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.95rem}
.week h3{margin:2px 0 3px;font-size:.98rem;color:var(--blue-dd)}
.week p{margin:0;font-size:.86rem;color:var(--grey)}
.week .give{margin-top:7px;font-size:.78rem;font-weight:700;color:var(--blue-d)}
.words{display:flex;flex-wrap:wrap;gap:8px}
.words span{background:#eef4fb;color:var(--blue-dd);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:.83rem;font-weight:600}
.ses{margin-top:12px;border-left:3px solid var(--lila);padding-left:12px}
.ses h4{margin:0 0 8px;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--grey);font-weight:700}
.ses-row{display:flex;flex-wrap:wrap;align-items:center;gap:7px;padding:6px 0;border-bottom:1px dotted var(--line)}
.ses-row:last-child{border-bottom:none}
.ses-row b{font-size:.83rem;color:var(--blue-dd);flex:1 1 210px;font-weight:600}
.lvl-chip{display:inline-block;border:1px solid var(--blue);color:var(--blue-d);background:#fff;border-radius:6px;padding:3px 9px;font-size:.75rem;font-weight:700;text-decoration:none;transition:.12s}
.lvl-chip:hover{background:var(--blue);color:#fff}
.deck-chip{display:inline-block;border:1px solid var(--celeste);color:#12657f;background:#eefaff;border-radius:6px;padding:3px 9px;font-size:.75rem;font-weight:700;text-decoration:none}
.deck-chip:hover{background:var(--celeste);color:#fff}
#visor{position:fixed;inset:0;background:rgba(15,25,40,.94);z-index:9999;display:none;flex-direction:column;align-items:center;justify-content:center}
#visor.on{display:flex}
#visor img{max-width:94vw;max-height:80vh;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.5);background:#fff;-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
#visor .barra{display:flex;align-items:center;gap:16px;margin-top:16px;color:#fff;font-size:.9rem;font-weight:600}
#visor button{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:8px 16px;font:600 .9rem/1 inherit;cursor:pointer;font-family:inherit}
#visor button:hover{background:rgba(255,255,255,.3)}
#visor button[disabled]{opacity:.35;cursor:default}
#visor .titulo{position:absolute;top:16px;left:20px;right:70px;color:#fff;font-size:.9rem;font-weight:700;opacity:.9}
#visor .cerrar{position:absolute;top:12px;right:16px;font-size:1.1rem;padding:6px 14px}
#visor .aviso{color:#a9cdf0;font-size:.75rem;margin-top:10px}
#visor:fullscreen{background:#0b1220}
#visor:fullscreen img{max-width:100vw;max-height:88vh;border-radius:0;box-shadow:none}
#visor:fullscreen .barra{margin-top:10px}
#visor:fullscreen .aviso{opacity:.55}
.hand-chip{display:inline-block;border:1px solid var(--blue-d);color:#fff;background:var(--blue-d);border-radius:6px;padding:3px 10px;font-size:.75rem;font-weight:700;text-decoration:none}
.hand-chip:hover{background:var(--blue-dd)}
.hand-chip.done{background:#eefaf0;color:#166534;border-color:#86c79b}
.entrega{display:none;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 0 12px 4px;border-bottom:1px dotted var(--line)}
.entrega.on{display:flex}
.entrega input[type=url]{flex:1 1 240px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-family:inherit;font-size:.83rem}
.fbtn{display:inline-block;border:1px solid var(--blue);color:var(--blue-d);background:#fff;border-radius:8px;padding:7px 14px;font-size:.82rem;font-weight:600;cursor:pointer}
.fbtn:hover{background:var(--blue);color:#fff}
.entrega .o{font-size:.75rem;color:var(--grey);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.entrega .btn.small{padding:7px 14px;font-size:.8rem}
.on-chip{display:inline-block;border:1px solid var(--blue);color:#fff;background:var(--blue);border-radius:6px;padding:3px 10px;font-size:.75rem;font-weight:700;text-decoration:none;transition:.12s}
.on-chip:hover{background:var(--blue-dd);border-color:var(--blue-dd)}
.ses-row .grupo{display:inline-flex;align-items:center;gap:5px}
.ses-row .grupo i{font-style:normal;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--grey);font-weight:700}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.act{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:.78rem;font-weight:600;color:var(--blue-d);text-decoration:none;transition:.12s}
.act:hover{background:var(--blue);color:#fff;border-color:var(--blue)}
.tool{display:flex;align-items:center;gap:12px;background:var(--white);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;text-decoration:none;color:inherit;transition:.15s}
.tool:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.tool .ico{font-size:1.6rem}
.tool b{display:block;color:var(--blue-dd);font-size:.92rem}
.tool small{color:var(--grey);font-size:.79rem}
textarea{width:100%;min-height:200px;border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;font-family:inherit;font-size:.92rem;line-height:1.6;resize:vertical;color:var(--ink)}
textarea:focus{outline:none;border-color:var(--blue)}
.counter{font-size:.82rem;font-weight:700;margin-top:8px}
.counter.ok{color:var(--good)} .counter.near{color:var(--warn)} .counter.off{color:var(--grey)}
.btn{background:var(--blue);color:#fff;border:none;border-radius:var(--r-sm);padding:10px 18px;font:600 .9rem/1 inherit;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--blue-d)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
.state{font-size:.83rem;color:var(--grey)}
.state.ok{color:var(--good);font-weight:700}
.state.err{color:var(--bad);font-weight:700}
.note{background:#fff8e6;border:1px solid #f5dea0;border-radius:var(--r-sm);padding:12px 14px;font-size:.85rem;color:#7a5b12}
.fb{background:#eef7ee;border:1px solid #cbe6cd;border-radius:var(--r-sm);padding:14px 16px;margin-top:14px}
.fb h4{margin:0 0 6px;color:#1c6b23;font-size:.92rem}
.fb p{margin:0;font-size:.88rem;color:#2f4f31}
.drop{display:block;border:2px dashed var(--lila);border-radius:var(--r-sm);padding:20px;text-align:center;color:var(--grey);font-size:.87rem;cursor:pointer}
.drop input{display:none}
.checklist{list-style:none;padding:0;margin:14px 0 0}
.checklist li{padding:7px 0 7px 28px;position:relative;font-size:.87rem;border-bottom:1px dashed var(--line)}
.checklist li:last-child{border-bottom:none}
.checklist li::before{content:'\2610';position:absolute;left:4px;top:6px;font-size:1rem;color:var(--blue)}
.checklist li.done::before{content:'\2611';color:var(--good)}
.unit-screen{display:none;min-height:calc(100vh - 178px);align-content:start;animation:screenIn .24s ease}
.unit-screen.on{display:block}
.unit-screen .screen-kicker{text-align:center;color:var(--blue-d);font-size:.76rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin:0 0 12px}
.unit-screen .week{border-bottom:none;padding:4px 0}
.unit-screen .week .n{flex:0 0 54px;height:54px;font-size:1.05rem}
.unit-screen .week h3{font-size:1.12rem}
.week-menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.week-jump{display:flex;align-items:center;gap:13px;width:100%;padding:15px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r-sm);color:var(--ink);font:inherit;cursor:pointer}
.week-jump:hover,.week-jump:focus-visible{border-color:var(--blue);background:#f4f8fd;outline:none}
.week-jump .num{display:grid;place-items:center;flex:0 0 42px;height:42px;border-radius:50%;background:var(--blue);color:#fff;font-weight:800}
.week-jump b{display:block;color:var(--blue-dd);font-size:.9rem}.week-jump small{display:block;color:var(--grey);margin-top:2px}
.unit-nav{position:sticky;bottom:12px;z-index:40;display:grid;grid-template-columns:52px minmax(0,1fr) 52px;align-items:center;gap:12px;max-width:520px;margin:22px auto 0;padding:9px 12px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:999px;box-shadow:0 12px 34px rgba(36,76,119,.22);backdrop-filter:blur(12px)}
.unit-nav button{width:44px;height:44px;border:0;border-radius:50%;background:var(--blue);color:#fff;font:800 1.35rem/1 inherit;cursor:pointer;display:flex;align-items:center;justify-content:center}
.unit-nav button:hover{background:var(--blue-d);transform:scale(1.04)}
.unit-nav button:disabled{opacity:.28;cursor:default;transform:none}
.unit-nav .where{text-align:center;min-width:0}
.unit-nav .where b{display:block;color:var(--blue-dd);font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unit-nav .where span{display:block;color:var(--grey);font-size:.7rem;font-weight:600;margin-top:1px}
@keyframes screenIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
@media(max-width:560px){.hero h1{font-size:1.3rem}.wrap{padding:16px 13px 90px}.card{padding:16px 15px}.unit-screen{min-height:calc(100vh - 160px)}.unit-nav{bottom:8px;grid-template-columns:46px minmax(0,1fr) 46px;padding:7px 9px}.unit-nav button{width:40px;height:40px}.unit-screen .week{display:block}.unit-screen .week .n{margin-bottom:12px}.week-menu{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.unit-screen{animation:none}.unit-nav button{transition:none}}
</style>
</head>
<body>
<header>
  <img src="assets/logo-white-h.svg" alt="Nordic International School" onerror="this.onerror=null;this.src='assets/logo-h.svg'">
  <div class="spacer"></div>
  <a class="back" href="./" id="backBtn"><span>&#8592;</span> Portal</a>
</header>

<div class="wrap" id="app"></div>

<!-- Visor de clase: el alumno ve las diapositivas como imagenes; el .pptx
     no sale del bucket y solo lo abre el profesor. -->
<div id="visor" oncontextmenu="return false">
  <div class="titulo" id="visorTitulo"></div>
  <button class="cerrar" onclick="cierraClase()">&#10005; Close</button>
  <img id="visorImg" alt="" draggable="false">
  <div class="barra">
    <button id="visorPrev" onclick="pasaClase(-1)">&#8592; Prev</button>
    <span id="visorPos"></span>
    <button id="visorNext" onclick="pasaClase(1)">Next &#8594;</button>
    <button id="visorFull" onclick="pantallaClase()">&#9974; Full screen</button>
  </div>
  <div class="aviso">Arrow keys to move · F for full screen · Esc to close</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="config.js"></script>
<script src="activities-data.js?v=12"></script>
<script src="class-files.js?v=2"></script>
<script src="unit-plans.js?v=14"></script>
<script src="nis-nav.js?v=2"></script>
<script>
/* Motor del hub de unidad. Los datos vienen de unit-plans.js, que es una copia
   del planner de Toddle; esta pagina solo los ejecuta con el alumno:
   producto final arriba, rubrica visible desde el dia uno, las semanas del
   planner y la entrega. Las entregas van a unit_submissions y al bucket
   unit-products, igual que Fun for Nordic. */

const Q = new URLSearchParams(location.search);
const GRADE = (Q.get('grade')||'g9').toLowerCase();
const UNIT  = parseInt(Q.get('unit')||'0',10);
const MILESTONE = 'final';
/* De mayor a menor: lo primero que se lee es adonde se quiere llegar, no el
   nivel mas bajo. El orden manda en las columnas de la rubrica y en la escala
   que se explica debajo. */
const NIVELES = ['AD','A','B','C'];

const $  = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const palabras = t => (t.trim().match(/\S+/g)||[]).length;

const PLAN = (window.UNIT_PLANS||{})[GRADE];
const U = PLAN ? (PLAN.units||[]).filter(u=>u.n===UNIT)[0] : null;

if(!U){
  $('#app').innerHTML = `<div class="card"><h2>That unit is not here yet</h2>
    <p class="muted">The unit hubs are being added grade by grade, straight from the
    school's planner. <a href="./">Go back to the portal</a>.</p></div>`;
} else {
  document.title = 'Unit '+(U.label||U.n)+' · '+U.title+' — Nordic International School';
  // pinta() se llama al final del script: usa `sb`/`me`, que se declaran abajo.
}

function pinta(){
  /* No todos los planners de Toddle estan completos: hay unidades sin rubrica
     o sin secuencia. Se ensena lo que hay y no se inventa lo que falta. */
  const hayCrit = (U.criteria||[]).length > 0;
  const haySeq  = (U.sequence||[]).length > 0;
  const conNiveles = (U.criteria||[]).some(c=>c.levels);
  const rubrica = conNiveles
    ? `<table class="rub desc"><thead><tr><th>Criterion</th>${NIVELES.map(l=>`<th>${l}</th>`).join('')}</tr></thead>
       <tbody>${U.criteria.map(c=>`<tr><td class="crit">${c.n}. ${esc(c.text)}</td>
         ${NIVELES.map(l=>`<td class="lvl" data-c="${c.n}" data-l="${l}">${esc(c.levels[l])}</td>`).join('')}</tr>`).join('')}</tbody></table>`
    : `<table class="rub plain"><thead><tr><th>What your teacher will look for</th>${NIVELES.map(l=>`<th>${l}</th>`).join('')}</tr></thead>
       <tbody>${U.criteria.map(c=>`<tr><td class="crit">${c.n}. ${esc(c.text)}</td>
         ${NIVELES.map(l=>`<td class="lvl" data-c="${c.n}" data-l="${l}">${l}</td>`).join('')}</tr>`).join('')}</tbody></table>`;

  const BLOQUE_RUBRICA = `
  <div class="sec-title"><h2>&#128207; How you will be assessed</h2><span class="hint">You can see this from day one. Click the level you think you are at.</span></div>
  <div class="card">
    <div class="rub-wrap" id="rub">${rubrica}</div>
    <ul class="escala">
      <li><span class="lv ad">AD</span><b>Outstanding</b> — you go further than the unit asked.</li>
      <li><span class="lv a">A</span><b>Expected</b> — you are where this unit wants you to be.</li>
      <li><span class="lv b">B</span><b>In progress</b> — nearly there, still with some help.</li>
      <li><span class="lv c">C</span><b>Starting out</b> — you are at the beginning of this criterion.</li>
    </ul>
    <p class="legend">Your self-assessment is saved and your teacher sees it next to your
      work — it is not your grade.</p>
    <div class="row"><span class="state" id="selfState"></span></div>
  </div>`;

  const weekWord=U.stepWord||'Week';
  const looseGames=juegosSueltos();
  const weekScreens=haySeq ? U.sequence.map((w,i)=>({
    label:`${weekWord} ${w.n} · ${w.title}`,
    kind:'week',week:w.n,
    html:`<p class="screen-kicker">Your ${U.sequence.length} ${U.stepWord?(U.stepWord+'s'):'weeks'} · ${weekWord} ${w.n} of ${U.sequence.length}</p>
      <div class="card"><div class="week">
        <div class="n">${(U.stepWord?U.stepWord[0]:'W')}${w.n}</div>
        <div style="flex:1">
          <h3>${esc(w.title)}</h3><p>${esc(w.desc)}</p>
          ${w.give?`<div class="give">You hand in: ${esc(w.give)}</div>`:''}
          ${sesionesSemana(w.n)}
          ${juegosSemana(w.n)}
        </div>
      </div>${i===U.sequence.length-1?looseGames:''}</div>`
  })) : [];

  const weeksMenu={label:`${weekWord}s · Choose a week`,kind:'weeks',html:`
    <div class="sec-title"><h2>&#128197; Choose a ${weekWord.toLowerCase()}</h2><span class="hint">Jump directly to any week.</span></div>
    <div class="card"><div class="week-menu">${(U.sequence||[]).map(w=>`

let unitScreenIndex=0;
function initUnitScreens(){
  const screens=[...document.querySelectorAll('.unit-screen')];
  const prev=$('#unitPrev'), next=$('#unitNext');
  if(!screens.length || !prev || !next) return;
  const show=(n,focusNav)=>{
    unitScreenIndex=Math.max(0,Math.min(screens.length-1,n));
    screens.forEach((screen,i)=>{
      const active=i===unitScreenIndex;
      screen.classList.toggle('on',active);
      screen.setAttribute('aria-hidden',active?'false':'true');
    });
    prev.disabled=unitScreenIndex===0;
    next.disabled=unitScreenIndex===screens.length-1;
    $('#unitWhere').textContent=screens[unitScreenIndex].dataset.label||'Unit';
    $('#unitPos').textContent=(unitScreenIndex+1)+' of '+screens.length;
    const back=$('#backBtn');
    if(back) back.innerHTML=screens[unitScreenIndex].dataset.kind==='week'?'<span>&#8592;</span> Weeks':'<span>&#8592;</span> Portal';
    window.scrollTo({top:0,behavior:focusNav?'smooth':'auto'});
  };
  window.moveUnitScreen=dir=>show(unitScreenIndex+dir,true);
  const weeksIndex=screens.findIndex(s=>s.dataset.kind==='weeks');
  window.showWeeksMenu=()=>show(weeksIndex>=0?weeksIndex:0,true);
  prev.onclick=()=>window.moveUnitScreen(-1);
  next.onclick=()=>window.moveUnitScreen(1);
  $('#backBtn').onclick=e=>{
    if(screens[unitScreenIndex].dataset.kind!=='week') return;
    e.preventDefault(); window.showWeeksMenu();
  };
  document.querySelectorAll('[data-week-jump]').forEach(b=>b.onclick=()=>{
    const at=screens.findIndex(s=>s.dataset.week===b.dataset.weekJump);
    if(at>=0) show(at,true);
  });
  let touchX=null;
  $('#unitScreens').addEventListener('touchstart',e=>{ touchX=e.touches[0].clientX; },{passive:true});
  $('#unitScreens').addEventListener('touchend',e=>{
    if(touchX==null) return;
    const dx=e.changedTouches[0].clientX-touchX;
    touchX=null;
    if(Math.abs(dx)>70) window.moveUnitScreen(dx<0?1:-1);
  },{passive:true});
  show(Q.get('section')==='weeks' && weeksIndex>=0 ? weeksIndex : 0,false);
}

document.addEventListener('keydown',e=>{
  if(!window.moveUnitScreen || $('#visor').classList.contains('on')) return;
  const tag=(e.target&&e.target.tagName||'').toLowerCase();
  if(['input','textarea','select','button'].includes(tag) || e.target.isContentEditable) return;
  if(e.key==='ArrowLeft'){ e.preventDefault(); window.moveUnitScreen(-1); }
  if(e.key==='ArrowRight'){ e.preventDefault(); window.moveUnitScreen(1); }
});

/* Las actividades del portal ya están etiquetadas por unidad y semana en
   activities-data.js, y sus semanas coinciden con las del planner. En vez de
   dejarlas en un cajón aparte, cada una cuelga del hito que le toca: la
   práctica llega cuando hace falta para el producto, no antes ni suelta. */
function unidadActividades(){
  const D = window.ACTIVITIES_DATA;
  if(!D || !D.forGrade) return null;
  return D.forGrade(GRADE,'english').filter(u=>u.id==='u'+UNIT)[0] || null;
}
function semanaActividades(n){
  const u = unidadActividades();
  if(!u || !u.weeks) return null;
  const w = u.weeks.filter(x=>x.id==='w'+n)[0];
  return (w && !w.locked && w.games && w.games.length) ? w : null;
}
function chips(games){
  return `<div class="acts">${games.map(g=>
    `<a class="act" href="${esc(g.href)}" title="${esc(g.desc||'')}">${g.icon||'&#127918;'} ${esc(g.title.replace(/\s+—\s+(Week \d+|Unit \d+)$/,''))}</a>`
  ).join('')}</div>`;
}
function juegosSemana(n){
  const w = semanaActividades(n);
  return w ? chips(w.games) : '';
}
/* La semana w0 existe para lo que cubre la unidad entera (el Word Wheel, la
   lectura y el listening de la U4): no cuelga de ningún hito, así que va al
   final del camino en vez de perderse. */
function juegosSueltos(){
  const u = unidadActividades();
  if(!u || !u.weeks) return '';
  const w0 = u.weeks.filter(x=>!x.title && x.games && x.games.length)[0];
  if(!w0) return '';
  return `<div class="week"><div class="n">&#8734;</div>
    <div style="flex:1"><h3>For the whole unit</h3>
      <p>Practice that is not tied to one week — use it whenever you need it.</p>
      ${chips(w0.games)}</div></div>`;
}

/* Las clases de 9.o tienen materiales por sesion: la ficha del alumno en
   cuatro niveles (A2-C1) y las diapositivas del profesor. Van dentro de la
   SEMANA que les toca, no en un cajon aparte. Las diapositivas solo se
   ensenan a quien es profesor. */
let esProfe = false, _portada = null;
/* Los materiales viven en el bucket privado class-files: el enlace se firma
   en el momento y caduca. El alumno solo puede abrir las fichas; las
   diapositivas las bloquea la propia politica del bucket. */
/* Entrega por ficha. El producto final de la unidad va con milestone
   'final'; cada ficha va con el suyo, 'w1s1'. Se admite archivo (el .docx
   que han rellenado, una foto o un PDF) o un enlace de Google Docs, porque
   muchos alumnos trabajan ahi y no pueden editar un PDF. */
let _entregas = {};

window.abreEntrega = function(hito){
  const b = $('#box-'+hito);
  if(b) b.classList.toggle('on');
  return false;
};

function pintaEntregas(){
  Object.keys(_entregas).forEach(h=>{
    const chip = $('#hand-'+h), r = _entregas[h];
    if(!chip) return;
    chip.classList.add('done');
    const nota = (r.score!=null) ? (' · ' + r.score + '/10') : '';
    chip.innerHTML = '✓ Handed in' + nota;
    if(r.feedback) chip.title = r.feedback;
    const u = $('#u-'+h);
    if(u && r.payload && r.payload.link) u.value = r.payload.link;
  });
}

window.mandaEntrega = async function(hito){
  const est = $('#e-'+hito), f = $('#f-'+hito), url = ($('#u-'+hito).value||'').trim();
  const archivo = f && f.files && f.files[0];
  if(!archivo && !url){ est.textContent='Choose a file or paste a link first.'; est.className='state err'; return; }
  if(url && !/^https?:\/\//i.test(url)){ est.textContent='That link does not look right.'; est.className='state err'; return; }
  est.textContent='Sending…'; est.className='state';
  let ruta = null;
  if(archivo){
    if(archivo.size > 52428800){ est.textContent='That file is over 50 MB.'; est.className='state err'; return; }
    const ext = (archivo.name.split('.').pop()||'bin').toLowerCase();
    ruta = me.id + '/' + GRADE + '-u' + UNIT + '-' + hito + '.' + ext;
    const up = await sb.storage.from('unit-products')
      .upload(ruta, archivo, {upsert:true, contentType: archivo.type || 'application/octet-stream'});
    if(up.error){ est.textContent='Upload failed: '+up.error.message; est.className='state err'; return; }
  }
  const fila = {student_id:me.id, grade:GRADE, unit:UNIT, milestone:hito, kind:'worksheet',
                payload:{link:url||null, name:archivo?archivo.name:null, handed_at:new Date().toISOString()},
                updated_at:new Date().toISOString()};
  if(ruta) fila.file_path = ruta;
  const {error} = await sb.from('unit_submissions')
    .upsert(fila,{onConflict:'student_id,grade,unit,milestone,kind'});
  if(error){ est.textContent='Could not save: '+error.message; est.className='state err'; return; }
  est.textContent='Handed in ✓'; est.className='state ok';
  _entregas[hito] = fila;
  pintaEntregas();
};

/* Visor de clase. Las diapositivas se sirven como imagenes firmadas: se ven
   pero el fichero de PowerPoint no se entrega. Ojo: en la web no se puede
   impedir del todo que alguien guarde una imagen; lo que se evita es que se
   lleven el .pptx editable. */
let _clase = { urls: [], i: 0, titulo: '' };

window.verClase = async function(base, paginas, titulo){
  if(!sb || !me) return false;
  const rutas = [];
  for(let i=1; i<=paginas; i++) rutas.push(base + String(i).padStart(2,'0') + '.png');
  $('#visorTitulo').textContent = titulo + ' — loading…';
  $('#visor').classList.add('on');
  const { data, error } = await sb.storage.from('class-files').createSignedUrls(rutas, 7200);
  if(error || !data){ $('#visorTitulo').textContent = 'This class could not be opened.'; return false; }
  _clase = { urls: data.map(d=>d.signedUrl), i: 0, titulo: titulo };
  $('#visorTitulo').textContent = titulo;
  muestraClase();
  return false;
};

function muestraClase(){
  const n = _clase.urls.length;
  if(!n) return;
  $('#visorImg').src = _clase.urls[_clase.i];
  $('#visorPos').textContent = (_clase.i+1) + ' / ' + n;
  $('#visorPrev').disabled = _clase.i === 0;
  $('#visorNext').disabled = _clase.i === n-1;
  if(_clase.i+1 < n){ const p = new Image(); p.src = _clase.urls[_clase.i+1]; }
}
window.pasaClase = function(d){
  const n = _clase.urls.length;
  _clase.i = Math.max(0, Math.min(n-1, _clase.i + d));
  muestraClase();
};
window.cierraClase = function(){
  if(document.fullscreenElement){ document.exitFullscreen().catch(()=>{}); }
  $('#visor').classList.remove('on'); $('#visorImg').src='';
};
/* Pantalla completa para proyectar: el visor entero pasa a ocupar el monitor,
   y el mismo boton devuelve a la ventana. */
window.pantallaClase = function(){
  const v = $('#visor');
  if(document.fullscreenElement){ document.exitFullscreen().catch(()=>{}); }
  else { (v.requestFullscreen ? v.requestFullscreen() : Promise.reject()).catch(()=>{}); }
};
document.addEventListener('fullscreenchange', ()=>{
  const b = $('#visorFull');
  if(b) b.innerHTML = document.fullscreenElement ? '⤵ Exit full screen' : '⛶ Full screen';
});
document.addEventListener('keydown', e=>{
  if(!$('#visor').classList.contains('on')) return;
  if(e.key==='Escape'){ cierraClase(); }
  else if(e.key==='ArrowRight'||e.key===' '){ e.preventDefault(); pasaClase(1); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); pasaClase(-1); }
  else if(e.key==='f'||e.key==='F'){ e.preventDefault(); pantallaClase(); }
});
$('#visor').addEventListener('click', e=>{ if(e.target.id==='visor') cierraClase(); });
/* Un solo oyente para todos los "View class": las semanas se repintan y los
   chips van y vienen, asi que se escucha en el documento. */
document.addEventListener('click', e=>{
  const a = e.target.closest && e.target.closest('.deck-chip[data-deck]');
  if(a){
    e.preventDefault();
    verClase(a.dataset.deck, parseInt(a.dataset.pages,10)||0, a.dataset.titulo||'');
    return;
  }
});

window.abreArchivo = async function(ruta, el){
  if(!sb || !me) return false;
  const antes = el.textContent; el.textContent = '…';
  const { data, error } = await sb.storage.from('class-files').createSignedUrl(ruta, 3600);
  el.textContent = antes;
  if(error || !data){ el.textContent = '×'; el.title = (error && error.message) || 'No disponible'; return false; }
  window.open(data.signedUrl, '_blank', 'noopener');
  return false;
};
/* Los materiales se DESCUBREN listando el bucket, no leyendo una lista
   escrita a mano: en cuanto un profesor sube una ficha, aparece sola. El
   indice class-files.js se usa solo para los titulos de sesion y para las
   diapositivas ya convertidas a imagen. */
let _mat = null;
const RE_WS = /^u(\d+)w(\d+)s(\d+)-worksheet-([a-z0-9]+)\.(pdf|docx)$/i;

let _digitales = new Set();

async function cargaMateriales(){
  _mat = {};
  if(!sb || !me) return;
  /* Fichas que ya se pueden resolver dentro del portal. */
  try{
    const { data } = await sb.from('worksheets').select('week,session,level')
      .eq('grade',GRADE).eq('unit',UNIT);
    (data||[]).forEach(w => _digitales.add(w.week+'s'+w.session+'-'+w.level));
  }catch(_){}
  const base = GRADE + '/u' + UNIT + '/';
  const idx  = ((window.CLASS_FILES||{})[GRADE]||{})['u'+UNIT] || {weeks:{}};
  const semanas = (U.sequence||[]).map(w=>w.n);
  const listas = await Promise.all(semanas.map(n =>
    sb.storage.from('class-files').list(base+'w'+n, {limit:400}).catch(()=>({data:null}))));
  semanas.forEach((n,k)=>{
    const arch = (listas[k] && listas[k].data) || [];
    const ses = {};
    arch.forEach(f=>{
      const m = RE_WS.exec(f.name||'');
      if(!m) return;
      const sn = parseInt(m[3],10), lvl = m[4].toUpperCase(), ext = m[5].toLowerCase();
      const d = ses[sn] || (ses[sn] = {s:sn, ws:{}});
      (d.ws[lvl] || (d.ws[lvl] = {}))[ext] = 'w'+n+'/'+f.name;
    });
    /* titulo y diapositivas: del indice, que es donde viven */
    ((idx.weeks||{})[n]||[]).forEach(x=>{
      const d = ses[x.s] || (ses[x.s] = {s:x.s, ws:{}});
      d.title = x.title; d.deck = x.deck; d.pages = x.pages;
    });
    const filas = Object.keys(ses).map(k2=>ses[k2]).sort((a,b)=>a.s-b.s);
    if(filas.length) _mat[n] = filas;
  });
}

/* Las unidades del piloto no tienen materiales subidos al bucket: sus
   sesiones y sus fichas por nivel salen del planner y se generan al vuelo en
   class-session.html. El guion de clase es del profesor; la ficha, del
   alumno, y en el nivel que le toque. */
function sesionesDelPlanner(n){
  const w = (U.sequence||[]).filter(x=>x.n===n)[0];
  if(!w || !(w.sessions||[]).length) return '';
  const url = (extra) => `class-session.html?grade=${GRADE}&unit=${UNIT}&week=${n}${extra||''}`;
  const filas = (w.sessions||[]).map(x=>{
    const lv = x.levels || w.levels;
    const niveles = lv ? Object.keys(lv).map(l=>
      `<a class="on-chip" href="${url('&session='+x.s+'&level='+encodeURIComponent(l))}">${esc(l)}</a>`).join('') : '';
    const ver = esProfe ? `<a class="deck-chip" href="${url('&session='+x.s)}">&#9654; View class</a>` : '';
    const hito = 'w' + n + 's' + x.s;
    return `<div class="ses-row">
        <b>S${x.s} · ${esc(x.title||('Session '+x.s))}</b>${ver}
        ${niveles?`<span class="grupo"><i>Worksheet</i>${niveles}</span>`:''}
        <a class="hand-chip" id="hand-${hito}" href="#" onclick="return abreEntrega('${hito}')">&#8593; Hand in</a>
      </div>
      <div class="entrega" id="box-${hito}">
        <label class="fbtn" for="f-${hito}">&#128206; Choose a file from your computer</label>
        <input type="file" id="f-${hito}" style="display:none"
          accept=".pdf,.docx,.doc,.odt,image/png,image/jpeg,audio/*,video/*">
        <span class="o">or</span>
        <input type="url" id="u-${hito}" placeholder="paste a link from Drive or Google Docs">
        <button class="btn small" onclick="mandaEntrega('${hito}')">Send</button>
        <span class="state" id="e-${hito}"></span>
      </div>`;
  }).join('');
  return `<div class="ses"><h4>Class materials — choose your level</h4>${filas}</div>`;
}

function sesionesSemana(n){
  const u = ((window.CLASS_FILES||{})[GRADE]||{})['u'+UNIT];
  const base = GRADE + '/u' + UNIT + '/';
  const ss = _mat && _mat[n];
  /* Sin materiales en el bucket, se ofrece lo que el planner ya declara. */
  if((!ss || !ss.length) && me) return sesionesDelPlanner(n);
  if(!ss || !ss.length || !me) return '';
  const filas = ss.map(x=>{
    /* El PDF se queda solo para el profesor: sirve para imprimir a quien no
       tenga dispositivo. El alumno resuelve la ficha en el portal. */
    const niveles = !esProfe ? '' : ['A2','B1','B2','C1'].filter(l=>x.ws[l] && x.ws[l].pdf)
      .map(l=>`<a class="lvl-chip" href="#" onclick="return abreArchivo('${base}${esc(x.ws[l].pdf)}',this)">${l}</a>`).join('');
    const online = ['A2','B1','B2','C1'].filter(l=>_digitales.has(n+'s'+x.s+'-'+l))
      .map(l=>`<a class="on-chip" href="worksheet.html?grade=${GRADE}&unit=${UNIT}&week=${n}&session=${x.s}&level=${l}">${l}</a>`).join('');
    /* Los datos van en atributos, no dentro de un onclick. Con el titulo
       metido en el onclick, una sesion como "The Sleep Doctor's Top 5 Tips"
       cerraba el texto en el apostrofe y el clic no hacia nada: el .replace
       que pretendia escaparlo era `"\'"`, que en JavaScript es solo `'`. */
    const ver = (x.deck && x.pages)
      ? `<a class="deck-chip" href="#" data-deck="${esc(base + x.deck)}" data-pages="${x.pages}"
           data-titulo="S${x.s} · ${esc(x.title||('Session '+x.s))}">&#9654; View class</a>` : '';
    if(!niveles && !ver && !online) return '';
    const hito = 'w' + n + 's' + x.s;
    return `<div class="ses-row">
        <b>S${x.s} · ${esc(x.title||('Session '+x.s))}</b>${ver}
        ${online?`<span class="grupo"><i>Solve online</i>${online}</span>`:''}
        ${niveles?`<span class="grupo"><i>PDF to print</i>${niveles}</span>`:''}
        <a class="hand-chip" id="hand-${hito}" href="#" onclick="return abreEntrega('${hito}')">&#8593; Hand in</a>
      </div>
      <div class="entrega" id="box-${hito}">
        <label class="fbtn" for="f-${hito}">&#128206; Choose a file from your computer</label>
        <input type="file" id="f-${hito}" style="display:none"
          accept=".pdf,.docx,.doc,.odt,image/png,image/jpeg,audio/*,video/*">
        <span class="o">or</span>
        <input type="url" id="u-${hito}" placeholder="paste a link from Drive or Google Docs">
        <button class="btn small" onclick="mandaEntrega('${hito}')">Send</button>
        <span class="state" id="e-${hito}"></span>
      </div>`;
  }).join('');
  if(!filas) return '';
  return `<div class="ses"><h4>Class materials — choose your level</h4>${filas}</div>`;
}

/* ---------------- sesion y guardado ---------------- */
let sb=null, me=null, self_={}, viewerProfile=null;

/* Primero se conecta (para saber quien mira y si ve las diapositivas),
   luego se pinta, y solo despues se traen las entregas. */
async function conectar(){
  try{
    const cfg=window.NIS_CONFIG;
    if(cfg && window.supabase && window.supabase.createClient){
      sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_KEY);
      const {data}=await sb.auth.getSession();
      me=data&&data.session?data.session.user:null;
    }
  }catch(_){ me=null; }
  if(!me) return;
  /* Docente = can_results O perfil admin/teacher. Los admin no tienen fila
     en teacher_access, asi que con la primera condicion sola no veian sus
     propias diapositivas. */
  try{
    const t = await sb.from('teacher_access').select('can_results').eq('profile_id',me.id).maybeSingle();
    const pr = await sb.from('profiles').select('role,grade_id').eq('id',me.id).maybeSingle();
    viewerProfile=pr&&pr.data;
    esProfe = !!(t && t.data && t.data.can_results);
    if(!esProfe){
      const rol = viewerProfile && viewerProfile.role;
      esProfe = (rol === 'admin' || rol === 'teacher');
    }
  }catch(_){ esProfe=false; }
  /* Nada a medias en vivo: la lista sale del bucket, asi que si un material
     no esta subido sencillamente no se ofrece. */
  await cargaMateriales();
  /* Una foto propia de la unidad, si la han subido, gana al motivo dibujado:
     una imagen del viaje o de la clase dice mas que cualquier icono. */
  try{
    const lista = await sb.storage.from('class-files').list(GRADE+'/u'+UNIT, {limit:20});
    const tapa = (lista.data||[]).filter(f=>/^cover\.(jpg|jpeg|png)$/i.test(f.name))[0];
    if(tapa){
      const r = await sb.storage.from('class-files')
        .createSignedUrl(GRADE+'/u'+UNIT+'/'+tapa.name, 7200);
      if(r.data) _portada = r.data.signedUrl;
    }
  }catch(_){}
}

async function puedeAbrirUnidad(){
  if(esProfe) return true;                       // profesor y admin: siempre
  /* Las unidades del PILOTO 2027 no se abren sin sesion: a esta pagina se
     llega escribiendo la URL, y un filtro en el listado no es un permiso.
     Las demas se comportan como siempre (el aviso de "no has iniciado
     sesion" ya avisa de que nada se guarda). */
  if(!me) return !esUnidadPiloto();
  const key='english.classes.'+GRADE+'.units.u'+UNIT;
  try{
    /* La excepcion por alumno manda sobre la habilitacion del grado. */
    const al=await sb.from('student_access').select('unlocked')
      .eq('student_id',me.id).eq('node_key',key).maybeSingle();
    if(al && al.data) return !!al.data.unlocked;
    if(!viewerProfile || viewerProfile.grade_id==null) return false;
    const {data,error}=await sb.from('node_access').select('unlocked')
      .eq('grade_id',viewerProfile.grade_id).eq('node_key',key).maybeSingle();
    if(error) return false;
    if(data) return !!data.unlocked;
  }catch(_){ return false; }
  return !esUnidadPiloto();                      // sin fila: el piloto nace cerrado
}

function pintaUnidadBloqueada(){
  $('#app').innerHTML=`<div class="card center" style="max-width:620px;margin:50px auto">
    <div style="font-size:3rem">🔒</div><h2>This unit is not open yet</h2>
    <p class="muted">Your teacher will activate Unit ${UNIT} when your class is ready.</p>
    <a class="btn" href="./#classes_${GRADE}_units" style="display:inline-block;text-decoration:none;margin-top:10px">← Back to units</a>
  </div>`;
}

async function arrancaSesion(){
  if(!me){ $('#gate').style.display='block'; U.deliverables.forEach(d=>{ if(d.type==='text') cuenta(d); }); return; }
  $('#handin').style.display='block';
  const {data}=await sb.from('unit_submissions')
    .select('kind,milestone,payload,file_path,score,criteria,feedback')
    .eq('student_id',me.id).eq('grade',GRADE).eq('unit',UNIT);
  /* Las entregas de ficha llevan milestone 'w1s1'; las del producto, 'final'. */
  (data||[]).filter(r=>r.milestone!==MILESTONE).forEach(r=>{ _entregas[r.milestone]=r; });
  pintaEntregas();
  (data||[]).filter(r=>r.milestone===MILESTONE).forEach(r=>{
    if(r.kind==='selfassess'){ self_=(r.payload&&r.payload.levels)||{}; pintaSelf(); return; }
    const st=$('#st-'+r.kind);
    const ta=$('#t-'+r.kind);
    if(ta){ ta.value=(r.payload&&r.payload.text)||''; if(st && r.payload && r.payload.draft===false){ st.textContent='Handed in'; st.className='state ok'; } }
    else if(st && r.file_path){ st.textContent='Uploaded — you can replace it.'; st.className='state ok'; }
    if(r.feedback){
      const fb=$('#fb-'+r.kind); if(fb){ fb.style.display='block';
        $('#fbt-'+r.kind).textContent=(r.score!=null?('Mark: '+r.score+'/10 — '):'')+r.feedback; }
    }
  });
  U.deliverables.forEach(d=>{ if(d.type==='text') cuenta(d); });
}

async function guarda(kind,payload,extra){
  if(!sb||!me) return {ok:false,motivo:'no session'};
  const fila=Object.assign({student_id:me.id,grade:GRADE,unit:UNIT,milestone:MILESTONE,kind:kind,
    payload:payload||{},updated_at:new Date().toISOString()},extra||{});
  const {error}=await sb.from('unit_submissions').upsert(fila,{onConflict:'student_id,grade,unit,milestone,kind'});
  return error?{ok:false,motivo:error.message}:{ok:true};
}

/* ---------------- rubrica ---------------- */
function pintaSelf(){
  $$('#rub td.lvl').forEach(td=>td.classList.toggle('on', self_[td.dataset.c]===td.dataset.l));
}
async function clicRubrica(e){
  const td=e.target.closest('td.lvl'); if(!td||!me) return;
  if(self_[td.dataset.c]===td.dataset.l) delete self_[td.dataset.c];
  else self_[td.dataset.c]=td.dataset.l;
  pintaSelf();
  const r=await guarda('selfassess',{levels:self_});
  $('#selfState').textContent=r.ok?'Saved':'Could not save: '+r.motivo;
  $('#selfState').className=r.ok?'state ok':'state err';
}

/* ---------------- entregas de texto ---------------- */
function cuenta(d){
  const ta=$('#t-'+d.kind); if(!ta) return;
  const n=palabras(ta.value), el=$('#wc-'+d.kind);
  const min=d.range?d.range[0]:0, max=d.range?d.range[1]:0;
  el.textContent = n+' word'+(n===1?'':'s')+(d.range?(' · target '+min+'–'+max):'');
  el.className = 'counter '+(!d.range?'off':(n>=min&&n<=max?'ok':(n>=min*0.8&&n<=max*1.2?'near':'off')));
  if(d.checklist){
    const t=ta.value.toLowerCase();
    d.checklist.forEach(c=>{
      const li=document.querySelector('#chk-'+d.kind+' li[data-k="'+c.k+'"]');
      if(li) li.classList.toggle('done', new RegExp(c.re,'i').test(t));
    });
  }
}

function cablea(d){
  if(d.type!=='text'){ cableaArchivo(d.kind); return; }
  const ta=$('#t-'+d.kind), st=$('#st-'+d.kind);
  let t=null;
  ta.addEventListener('input',()=>{
    cuenta(d);
    if(!me) return;
    clearTimeout(t); st.textContent='Saving…'; st.className='state';
    t=setTimeout(async()=>{
      const r=await guarda(d.kind,{text:ta.value,words:palabras(ta.value),draft:true});
      st.textContent=r.ok?'Draft saved':'Not saved: '+r.motivo;
      st.className=r.ok?'state ok':'state err';
    },1200);
  });
  $('#send-'+d.kind).addEventListener('click',async()=>{
    const n=palabras(ta.value);
    if(n<30){ st.textContent='This is still too short to hand in.'; st.className='state err'; return; }
    $('#send-'+d.kind).disabled=true;
    const r=await guarda(d.kind,{text:ta.value,words:n,draft:false,handed_at:new Date().toISOString()});
    $('#send-'+d.kind).disabled=false;
    st.textContent=r.ok?'Handed in — you can still edit it and hand it in again.':'Could not hand in: '+r.motivo;
    st.className=r.ok?'state ok':'state err';
  });
}

/* ---------------- entregas de archivo ---------------- */
const EXT={'audio/webm':'webm','audio/ogg':'ogg','audio/mpeg':'mp3','audio/mp4':'m4a','audio/wav':'wav',
  'video/webm':'webm','video/mp4':'mp4','application/pdf':'pdf','image/png':'png','image/jpeg':'jpg',
  'application/vnd.openxmlformats-officedocument.wordprocessingml.document':'docx'};

async function sube(blob,ext,estado,kind){
  if(!sb||!me){ estado.textContent='Sign in from the portal to upload.'; estado.className='state err'; return; }
  estado.textContent='Uploading…'; estado.className='state';
  const ruta=me.id+'/'+GRADE+'-u'+UNIT+'-'+kind+'.'+ext;
  const up=await sb.storage.from('unit-products').upload(ruta,blob,{upsert:true,contentType:blob.type||'application/octet-stream'});
  if(up.error){ estado.textContent='Upload failed: '+up.error.message; estado.className='state err'; return; }
  const r=await guarda(kind,{mime:blob.type,size:blob.size},{file_path:ruta});
  estado.textContent=r.ok?'Uploaded — your teacher can see it now.':'Uploaded, but not registered: '+r.motivo;
  estado.className=r.ok?'state ok':'state err';
}

function cableaArchivo(kind){
  const st=$('#st-'+kind), lbl=$('#lbl-'+kind), inp=$('#f-'+kind);
  if(!inp) return;
  const desde=async f=>{
    if(!f) return;
    if(f.size>52428800){ st.textContent='That file is over 50 MB.'; st.className='state err'; return; }
    await sube(f, EXT[f.type]||(f.name.split('.').pop()||'bin').toLowerCase(), st, kind);
  };
  inp.addEventListener('change',e=>desde(e.target.files&&e.target.files[0]));
  ['dragover','dragenter'].forEach(ev=>lbl.addEventListener(ev,e=>{e.preventDefault();lbl.style.borderColor='var(--blue)';}));
  ['dragleave','drop'].forEach(ev=>lbl.addEventListener(ev,e=>{e.preventDefault();lbl.style.borderColor='var(--lila)';}));
  lbl.addEventListener('drop',e=>desde(e.dataTransfer.files&&e.dataTransfer.files[0]));

  const btn=$('#rec-'+kind);
  if(!btn) return;
  let rec=null, trozos=[], grabando=false;
  btn.addEventListener('click',async()=>{
    if(grabando){ rec.stop(); return; }
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      trozos=[]; rec=new MediaRecorder(stream);
      rec.ondataavailable=e=>{ if(e.data.size) trozos.push(e.data); };
      rec.onstop=async()=>{
        stream.getTracks().forEach(t=>t.stop());
        grabando=false; btn.innerHTML='&#9679; Record';
        const blob=new Blob(trozos,{type:rec.mimeType||'audio/webm'});
        const pv=$('#pv-'+kind); pv.src=URL.createObjectURL(blob); pv.style.display='block';
        await sube(blob,(blob.type||'').indexOf('ogg')>=0?'ogg':'webm',st,kind);
      };
      rec.start(); grabando=true; btn.innerHTML='&#9632; Stop';
      st.textContent='Recording…'; st.className='state';
    }catch(_){
      st.textContent='I could not use the microphone. Upload a file instead.';
      st.className='state err';
    }
  });
}

/* ---------------- candado de la unidad ----------------
   El listado del portal ya filtra las unidades cerradas, pero a esta pagina
   se llega tambien escribiendo la URL. Aqui se vuelve a comprobar: un filtro
   en el listado no es un permiso.

   Fail-closed: sin sesion, sin grado conocido o si la consulta falla, la
   unidad del piloto NO se pinta. Profesores y admin pasan siempre (esProfe
   ya distingue por teacher_access o por profiles.role). */
const UNIT_PILOT = new Set([
  'g2.u5','g2.u6','g3.u5','g3.u6','g4.u5','g4.u6','g5.u5','g5.u6','g9.u105','g9.u106'
]);
function esUnidadPiloto(){ return UNIT_PILOT.has(GRADE+'.u'+UNIT); }

/* Todo declarado: ahora si se puede pintar. */
if(U) (async function(){ await conectar(); if(!(await puedeAbrirUnidad())){pintaUnidadBloqueada();return;} pinta(); await arrancaSesion(); })();
</script>
