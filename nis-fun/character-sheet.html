<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Fun for Nordic — Character sheet</title>
<link rel="preload" href="../fonts/GothamBook.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../nis-fonts.css?v=fd196882">
<script>try{var t=localStorage.getItem("nis-tema");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="stylesheet" href="../nis-tokens.css?v=fd0ffbab">
<style>
 body{font-family:'Gotham',system-ui;background:var(--bg);color:var(--ink);margin:2rem}
 h2{margin:2rem 0 .5rem} .row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
 figure{margin:0;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px}
 img{width:96px;display:block} figcaption{font-size:.65rem;color:var(--muted)}
</style><script src="../config.js?v=68725f64"></script>
</head><body>
<h1>Character sheet — verificación</h1>
<div id="out"></div>
<script>
const KIDS={starters:['freya','nico','astrid','tomas'],movers:['erik','valentina','sofia','mateo'],flyers:['ingrid','diego','maya','oliver']};
const MASCOTS={starters:'pip',movers:'luna',flyers:'kili'};
const POSES=['waving','pointing','talking','thinking','surprised','sitting','running','holding','back','celebrating'];
const MPOSES=['waving','pointing','talking','thinking','surprised','sleeping'];
let h='';
for(const [lvl,names] of Object.entries(KIDS)){
  for(const n of names){
    h+=`<h2>${lvl} · ${n}</h2><div class="row">`;
    POSES.forEach((p,i)=>{h+=`<figure><img src="assets/characters/${lvl}/${n}/pose-${String(i+1).padStart(2,'0')}.svg"><figcaption>${String(i+1).padStart(2,'0')} ${p}</figcaption></figure>`});
    h+='</div>';
  }
  const m=MASCOTS[lvl];
  h+=`<h2>${lvl} · ${m} (mascota)</h2><div class="row">`;
  MPOSES.forEach((p,i)=>{h+=`<figure><img src="assets/characters/${lvl}/${m}/pose-${String(i+1).padStart(2,'0')}.svg"><figcaption>${String(i+1).padStart(2,'0')} ${p}</figcaption></figure>`});
  h+='</div>';
}
document.getElementById('out').innerHTML=h;
</script><script src="../nis-tema.js?v=a9738cd9" defer></script>
</body></html>
