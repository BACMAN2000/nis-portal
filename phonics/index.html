/* ============================================================

const SS = {

/* ============================================================
   2) THE 40 ENGLISH PHONEMES — Pronunciation Coach 3D inventory.
   ============================================================ */
const PHONEMES = [
  {arp:"ae",ipa:"/æ/",grp:"Short vowel",voiced:true,word:"cat",say:"a",graphemes:["a"],place:"vowel-low",lip:"spread",manner:"Open front vowel",tip:"Mouth wide open, tongue low and forward — the 'angry cat' sound."},
  {arp:"eh",ipa:"/ɛ/",grp:"Short vowel",voiced:true,word:"bed",say:"e",graphemes:["e","ea"],place:"vowel-mid",lip:"spread",manner:"Mid front vowel",tip:"Tongue mid-front, mouth half open, lips relaxed and slightly spread."},
  {arp:"ih",ipa:"/ɪ/",grp:"Short vowel",voiced:true,word:"sit",say:"i",graphemes:["i","y"],place:"vowel-high",lip:"spread",manner:"Near-high front vowel",tip:"Short, quick sound. Tongue high-front, jaw barely open."},
  {arp:"ah",ipa:"/ʌ/",grp:"Short vowel",voiced:true,word:"cup",say:"u",graphemes:["u","o"],place:"vowel-mid",lip:"neutral",manner:"Mid-central vowel",tip:"Relaxed, central 'uh'. Tongue and lips neutral, mouth half open."},
  {arp:"uh",ipa:"/ʊ/",grp:"Short vowel",voiced:true,word:"book",say:"oo",graphemes:["oo","u"],place:"vowel-high",lip:"rounded",manner:"Near-high back vowel",tip:"Short rounded 'oo'. Lips slightly rounded, tongue high-back."},
  {arp:"aa",ipa:"/ɑː/",grp:"Short vowel",voiced:true,word:"father",say:"ah",graphemes:["o","a"],place:"vowel-low",lip:"neutral",manner:"Open back vowel",tip:"Big open 'ah'. Drop the jaw, tongue low and back — doctor's sound."},
  {arp:"ax",ipa:"/ə/",grp:"Short vowel",voiced:true,word:"about",say:"uh",graphemes:["a","er"],place:"vowel-mid",lip:"neutral",manner:"Schwa (unstressed)",tip:"The lazy 'uh' in unstressed syllables. The most common sound in English."},
  {arp:"iy",ipa:"/iː/",grp:"Long vowel",voiced:true,word:"see",say:"ee",graphemes:["ee","ea","e_e","y"],place:"vowel-high",lip:"spread",manner:"High front long vowel",tip:"Big smile! Lips spread wide, tongue high and forward — 'ee'."},
  {arp:"ey",ipa:"/eɪ/",grp:"Long vowel",voiced:true,word:"cake",say:"ay",graphemes:["a_e","ai","ay","ei"],place:"vowel-mid",lip:"spread",manner:"Diphthong e→i",tip:"Glide from 'e' up to 'i'. The vowel 'says its name': A."},
  {arp:"ay",ipa:"/aɪ/",grp:"Long vowel",voiced:true,word:"bike",say:"eye",graphemes:["i_e","igh","y","ie"],place:"vowel-low",lip:"neutral",manner:"Diphthong a→i",tip:"Glide from open 'ah' up to 'ee'. The letter I 'says its name'."},
  {arp:"ow",ipa:"/oʊ/",grp:"Long vowel",voiced:true,word:"boat",say:"oh",graphemes:["o_e","oa","ow"],place:"vowel-mid",lip:"rounded",manner:"Diphthong o→u",tip:"Lips round and push forward, gliding to 'oo'. O 'says its name'."},
  {arp:"uw",ipa:"/uː/",grp:"Long vowel",voiced:true,word:"moon",say:"oo",graphemes:["oo","ue","u_e","ew"],place:"vowel-high",lip:"rounded",manner:"High back long vowel",tip:"Tight rounded lips, like blowing a kiss. Tongue high and back — 'oo'."},
  {arp:"ao",ipa:"/ɔː/",grp:"Long vowel",voiced:true,word:"saw",say:"aw",graphemes:["aw","au","or"],place:"vowel-low",lip:"rounded",manner:"Open-mid back rounded",tip:"Rounded 'aw'. Lips lightly rounded, tongue low and back."},
  {arp:"aw",ipa:"/aʊ/",grp:"Long vowel",voiced:true,word:"cow",say:"ow",graphemes:["ow","ou"],place:"vowel-low",lip:"rounded",manner:"Diphthong a→u",tip:"Start open 'ah', glide to rounded 'oo' — the 'ouch!' sound."},
  {arp:"oy",ipa:"/ɔɪ/",grp:"Long vowel",voiced:true,word:"boy",say:"oy",graphemes:["oy","oi"],place:"vowel-mid",lip:"rounded",manner:"Diphthong o→i",tip:"Glide from rounded 'aw' to smiling 'ee'."},
  {arp:"er",ipa:"/ɜːr/",grp:"Long vowel",voiced:true,word:"bird",say:"er",graphemes:["er","ir","ur"],place:"vowel-mid",lip:"neutral",manner:"R-controlled vowel",tip:"The 'bossy R' vowel. Tongue bunches in the middle, tip curls slightly."},

  {arp:"b",ipa:"/b/",grp:"Stop",voiced:true,word:"bat",say:"b",graphemes:["b"],place:"lips",lip:"closed",manner:"Voiced bilabial stop",tip:"Same as /p/ but turn the voice ON — feel the throat buzz."},

  {arp:"g",ipa:"/g/",grp:"Stop",voiced:true,word:"goat",say:"g",graphemes:["g"],place:"velum",lip:"neutral",manner:"Voiced velar stop",tip:"Same back-of-tongue lift as /k/ but with voice on."},
  {arp:"f",ipa:"/f/",grp:"Fricative",voiced:false,word:"fan",say:"f",graphemes:["f","ph"],place:"teeth",lip:"neutral",manner:"Voiceless labiodental fricative",tip:"Top teeth touch the bottom lip; push air through. Like an angry cat: ffff."},

  {arp:"h",ipa:"/h/",grp:"Fricative",voiced:false,word:"hat",say:"h",graphemes:["h"],place:"glottis",lip:"neutral",manner:"Voiceless glottal fricative",tip:"Just a puff of air from the throat — fog up a mirror: haa."},

  {arp:"m",ipa:"/m/",grp:"Nasal",voiced:true,word:"man",say:"m",graphemes:["m","mm"],place:"lips",lip:"closed",manner:"Bilabial nasal",tip:"Lips closed, sound hums out the nose — 'yummy!' mmmm."},
  {arp:"n",ipa:"/n/",grp:"Nasal",voiced:true,word:"net",say:"n",graphemes:["n","nn","kn"],place:"ridge",lip:"neutral",manner:"Alveolar nasal",tip:"Tongue tip on the ridge, sound hums out the nose — nnnn."},
  {arp:"ng",ipa:"/ŋ/",grp:"Nasal",voiced:true,word:"sing",say:"ng",graphemes:["ng","n"],place:"velum",lip:"neutral",manner:"Velar nasal",tip:"Back of tongue up (like /g/), hum through the nose — 'ring' ending."},

  {rime:"-ump",words:["bump","jump","lump","dump","pump","hump","plump","stump","grump","slump"]},
  {rime:"-ing",words:["king","ring","sing","wing","bring","sting","thing","swing","spring","string","sling"]},
  {rime:"-ake",words:["cake","lake","make","take","bake","rake","wake","shake","snake","brake","flake","stake"]},
  {rime:"-ight",words:["night","light","right","sight","fight","might","bright","fright","flight","tight","slight"]}

/* ============================================================
   AUDIO ENGINE
   Plays a pre-generated ElevenLabs clip if one exists
   (audio/<accent>-<gender>/<word>.mp3), otherwise falls back to the
   browser's speech engine. Accent (US/UK) and voice (female/male) are
   user-selectable and remembered. Slow, clear pace for PK–K–G1.
   ============================================================ */
const AUDIO_BASE = 'audio';
const BASE_RATE = 0.85;            // baseline; the speed toggle scales this
let voicePrefs = (()=>{ try{ return JSON.parse(localStorage.getItem('phonicsVoice'))||{}; }catch(e){ return {}; } })();
if(!voicePrefs.accent) voicePrefs.accent='us';     // 'us' | 'uk'
if(!voicePrefs.gender) voicePrefs.gender='female'; // 'female' | 'male'
if(!voicePrefs.speed)  voicePrefs.speed='slow';    // 'normal' | 'slow'
function saveVoicePrefs(){ try{ localStorage.setItem('phonicsVoice',JSON.stringify(voicePrefs)); }catch(e){} }
function speedMul(){ return voicePrefs.speed==='slow' ? 0.8 : 1; }   // scales TTS rate + mp3 playbackRate
function voiceVariant(){ return voicePrefs.accent+'-'+voicePrefs.gender; }
function audioKey(text){ return String(text).toLowerCase().replace(/[^a-z]/g,''); }

function pickVoice(){
  const vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  if(!vs.length) return null;
  const wantUK = voicePrefs.accent==='uk';
  const langRe = wantUK ? /en[-_]GB/i : /en[-_]US/i;
  let pool = vs.filter(v=>langRe.test(v.lang));
  if(!pool.length) pool = vs.filter(v=>/^en/i.test(v.lang));
  if(!pool.length) pool = vs;
  const female=/(female|zira|hazel|susan|sonia|libby|maisie|aria|jenny|eva|catherine|hayley|clara)/i;
  const male=/(male|david|mark|guy|ryan|george|daniel|thomas|james|william|brandon)/i;
  const want = voicePrefs.gender==='female'?female:male;
  return pool.find(v=>want.test(v.name)) || pool[0];
}
function webSpeak(text,rate,onDone){
  if(!window.speechSynthesis){ if(onDone) onDone(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice(); if(v) u.voice=v;
  u.lang = voicePrefs.accent==='uk'?'en-GB':'en-US';
  u.rate = rate; u.pitch = 1;
  if(onDone){ let fired=false; const fire=()=>{ if(fired) return; fired=true; onDone(); }; u.onend=fire; u.onerror=fire; }
  speechSynthesis.speak(u);
}
/* Play one clip (ElevenLabs mp3 if present, else browser TTS). Calls onDone
   when the clip finishes — so callers can chain reliably without timing races. */
function playClip(text,rate,onDone,ttsText){
  const cb = onDone || function(){};
  const key = audioKey(text);
  const say = (ttsText!=null ? ttsText : text);   // phonetic text for the TTS fallback
  if(!key){ return webSpeak(say,rate,cb); }
  let settled=false;
  const fallback=()=>{ if(settled) return; settled=true; webSpeak(say,rate,cb); };
  try{
    const a = new Audio(`${AUDIO_BASE}/${voiceVariant()}/${key}.mp3`);
    try{ a.preservesPitch=true; a.mozPreservesPitch=true; a.webkitPreservesPitch=true; }catch(e){}
    a.playbackRate = speedMul();        // slow the pre-recorded clip too, keeping pitch
    a.onerror = fallback;
    a.onplaying = ()=>{ settled=true; };
    a.onended = ()=>{ if(settled) cb(); };   // fires only when the mp3 actually played
    const p = a.play();
    if(p && p.catch) p.catch(fallback);
  }catch(e){ fallback(); }
}
function speak(text,{rate=BASE_RATE}={}){
  playClip(text, Math.max(0.4, Math.min(1, rate*speedMul())), null);
}
/* Speak a list of clips one after another — next starts only when the previous
   ends (plus a short gap). Fixes the "middle sound (vowel) gets cut" problem. */
function speakSequence(parts,{rate=0.5, gap=200, onStep, onDone, sounds=false}={}){
  const eff = Math.max(0.35, Math.min(1, rate*speedMul()));
  let i=0;
  const step=()=>{
    if(i>=parts.length){ if(onDone) onDone(); return; }
    const idx=i; const t=parts[i++];
    if(onStep) onStep(idx);                // karaoke: tell the caller which clip is sounding
    let advanced=false;
    const go=()=>{ if(advanced) return; advanced=true; setTimeout(step, gap); };
    const watchdog=setTimeout(go, 2800);   // never stall if onend doesn't fire
    playClip(t, eff, ()=>{ clearTimeout(watchdog); go(); }, sounds?soundOf(t):undefined);
  };
  step();
}

/* grapheme splitter for sound breakdowns */
const DIGRAPHS=["sh","ch","th","ck","ai","ay","ea","ee","oa","ow","oo","igh","ng","wh","ph","qu","oi","oy","ou","ar","or","er","ir","ur","tch","dge"];
function splitSounds(w){
  let i=0,out=[];
  const magicE = /^[a-z]+e$/.test(w) && w.length>=4 && !"aeiou".includes(w[w.length-2]);
  while(i<w.length){
    if(magicE && i===w.length-1){ out[out.length-1]=out[out.length-1]+"_e"; i++; continue; }
    const tri=w.slice(i,i+3), two=w.slice(i,i+2);
    if(DIGRAPHS.includes(tri)){ out.push(tri); i+=3; }
    else if(DIGRAPHS.includes(two)){ out.push(two); i+=2; }
    else { out.push(w[i]); i++; }
  }
  return out;
}
/* Each grapheme → the SOUND it makes (phonetic spelling the voice can say), so
   "ar" sounds /ar/ and "sh" sounds /sh/ instead of being spelled out letter by
   letter. Used by the sound-by-sound + activities. mp3 clips are keyed by the
   grapheme itself; this text is what the browser voice says as a fallback. */
const GRAPHEME_SOUNDS = {
  b:'buh',c:'kuh',d:'duh',f:'fff',g:'guh',h:'huh',j:'juh',k:'kuh',l:'lll',m:'mmm',n:'nnn',
  p:'puh',q:'kwuh',r:'rrr',s:'sss',t:'tuh',v:'vvv',w:'wuh',x:'ks',y:'yuh',z:'zzz',
  a:'aah',e:'ehh',i:'ih',o:'ah',u:'uh',
  sh:'shh',ch:'chuh',th:'th',wh:'wuh',ck:'kuh',ng:'ng',ph:'fff',qu:'kwuh',tch:'chuh',dge:'juh',
  ai:'ay',ay:'ay',ea:'eee',ee:'eee',oa:'ohh',oo:'oo',igh:'eye',ow:'ow',ou:'ow',oi:'oy',oy:'oy',
  ar:'are',or:'or',er:'er',ir:'er',ur:'er'
};
function soundOf(g){ g=String(g).replace('_e',''); return GRAPHEME_SOUNDS[g] || g; }
/* Speak ONE grapheme as its sound (mp3 keyed by grapheme, else phonetic TTS). */
function speakGrapheme(g,{rate=0.5}={}){
  const eff = Math.max(0.35, Math.min(1, rate*speedMul()));
  playClip(g.replace('_e',''), eff, null, soundOf(g));
}
const VOWELS="aeiou";
/* Colour each letter: consonants blue, vowels coral, silent-e muted. */
function ColorWord({w,big,highlight,hi}){
  const magicE = /^[a-z]+e$/.test(w) && w.length>=4 && !"aeiou".includes(w[w.length-2]);
  return (
    <span className={"font-extrabold inline-flex items-end "+(big?"text-3xl gap-3 ":"text-xl tracking-tight ")}>
      {w.split("").map((ch,i)=>{
        const silentE = magicE && i===w.length-1;
        const isV = VOWELS.includes(ch);
        const col = silentE ? "#9AA8B8" : isV ? "#D2607A" : "#2E5B9E";
        const hl = highlight && w.endsWith(highlight.replace("-","")) && i>=w.length-highlight.replace("-","").length;
        const lit = hi && i>=hi[0] && i<hi[1];   // karaoke: this letter is sounding now
        return <span key={i} style={{color:col}}
          className={"inline-block transition-all duration-150 origin-bottom "
            +(hl?"underline decoration-2 underline-offset-4 ":"")
            +(lit?"scale-[1.6] -translate-y-1 drop-shadow ":"")}>{ch}</span>;
      })}
    </span>
  );
}

function WordModal({w,onClose}){
  const [active,setActive]=useState(-1);   // karaoke: index of the sounding box
  useEffect(()=>{ setActive(-1); },[w]);
  if(!w) return null;
  const parts=splitSounds(w);
  // map each sound → its letter span [start,end) in the word, so the spoken
  // letter(s) can grow inside the big word too.
  const letterRanges=(()=>{ let off=0; return parts.map(p=>{ const base=p.replace('_e',''); const len = p.includes('_e')? base.length+1 : base.length; const r=[off,off+len]; off+=len; return r; }); })();
  const hiRange = active>=0 ? letterRanges[active] : null;
  const playOne=(i)=>{ setActive(i); speakGrapheme(parts[i],{rate:0.5}); setTimeout(()=>setActive(a=>a===i?-1:a),800); };
  const playAll=()=>{
    setActive(-1);
    speakSequence(parts.map(s=>s.replace('_e','')),{rate:0.5, gap:240, sounds:true, onStep:setActive, onDone:()=>setActive(-1)});
  };
  const playWhole=()=>{ setActive(-2); speak(w,{rate:0.8}); setTimeout(()=>setActive(-1),900); };
  return (
    <div className="fixed inset-0 z-50 bg-nordic-900/50 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in" onClick={onClose}>
      <div className="bg-white rounded-3xl max-w-md w-full p-6 card-shadow animate-slide-up text-center" onClick={e=>e.stopPropagation()}>

        <div className="mt-1 mb-1 min-h-[2.5rem] flex items-end justify-center"><ColorWord w={w} big hi={hiRange}/></div>
        <div className="flex items-center justify-center gap-2 my-5">
          {parts.map((s,i)=>(
            <div key={i} onClick={()=>playOne(i)}
              className={"cursor-pointer w-14 h-14 rounded-xl flex items-center justify-center text-xl font-bold transition-all duration-150 "+
                (active===i
                  ? "bg-nordic-600 text-white scale-125 shadow-lg ring-4 ring-nordic-200"
                  : "bg-nordic-100 text-nordic-700 hover:bg-nordic-200")}>
              {s.replace("_e","_e")}
            </div>
          ))}
        </div>
        <p className="text-sm text-nordic-500 mb-3"><b className="text-nordic-700">{parts.length}</b> sounds · <b className="text-nordic-700">{w.length}</b> letters</p>
        <div className="flex gap-2"><button onClick={playAll} className="flex-1 bg-nordic-100 hover:bg-nordic-200 text-nordic-700 font-bold rounded-xl py-2.5 text-sm">🎤 Sound by sound</button><button onClick={playWhole} className="flex-1 bg-nordic-600 hover:bg-nordic-700 text-white font-bold rounded-xl py-2.5 text-sm">🔊 Blend → read</button></div>
        <p className="text-[11px] text-nordic-400 mt-3"><span style={{color:'#2E5B9E'}}>■</span> consonant &nbsp; <span style={{color:'#D2607A'}}>■</span> vowel &nbsp; <span style={{color:'#9AA8B8'}}>■</span> silent e</p>
      </div>
    </div>
  );
}

const WORD_BANK={
  "CVC (short a)":["cat","map","bag","fan","ham","jam","tap","van","sad","rat"],
  "CVC (short i/o/u)":["pig","sit","fox","dog","mud","sun","bus","hop","lip","cup"],

  "Long vowel teams":["rain","boat","seed","leaf","team","goat","play","road","tree","beach"]
};
function BlendingMachine(){
  const banks=Object.keys(WORD_BANK);
  const [bank,setBank]=useState(banks[0]);
  const [word,setWord]=useState(WORD_BANK[banks[0]][0]);
  const [revealed,setRevealed]=useState(0);
  const parts=useMemo(()=>splitSounds(word),[word]);
  useEffect(()=>{setRevealed(0)},[word]);
  const reveal=()=>{ if(revealed<parts.length){ speakGrapheme(parts[revealed],{rate:0.5}); setRevealed(r=>r+1);} };
  const blend=()=>{ setRevealed(parts.length); speak(word,{rate:0.7}); };
  return (
    <div className="bg-white rounded-2xl p-5 card-shadow border border-nordic-100">
      <div className="flex items-center justify-between flex-wrap gap-2"><h4 className="font-bold text-nordic-800 text-lg">🧩 Blending Machine</h4><select value={bank} onChange={e=>{setBank(e.target.value);setWord(WORD_BANK[e.target.value][0]);}} className="text-sm border border-nordic-200 rounded-lg px-2 py-1 text-nordic-700">{banks.map(b=><option key={b}>{b}</option>)}</select></div>
      <p className="text-sm text-nordic-500 mt-1">Tap each box to say the sound, then “Blend” to read the whole word.</p>
      <div className="flex flex-wrap gap-2 mt-3">{WORD_BANK[bank].map(w=><button key={w} onClick={()=>setWord(w)} className={"px-3 py-1 rounded-lg text-sm font-semibold "+(w===word?"bg-nordic-600 text-white":"bg-nordic-50 text-nordic-600 hover:bg-nordic-100")}>{w}</button>)}</div>
      <div className="flex items-center justify-center gap-2 my-7 min-h-[90px]">{parts.map((s,i)=>(<div key={i} onClick={()=>{if(i<=revealed){speakGrapheme(s,{rate:0.5});setRevealed(Math.max(revealed,i+1));}}} className={"cursor-pointer select-none w-16 h-16 sm:w-20 sm:h-20 rounded-2xl flex items-center justify-center text-3xl font-bold transition-all "+(i<revealed?"bg-nordic-600 text-white animate-pop":"bg-nordic-100 text-nordic-300")}>{i<revealed?s.replace("_e","_e"):"?"}</div>))}</div>
      <div className="flex gap-2"><button onClick={reveal} className="flex-1 bg-nordic-100 hover:bg-nordic-200 text-nordic-700 font-bold rounded-xl py-2.5">Reveal next sound</button><button onClick={blend} className="flex-1 bg-nordic-600 hover:bg-nordic-700 text-white font-bold rounded-xl py-2.5">🔊 Blend → read</button></div>
    </div>
  );
}
function SoundBoxes(){
  const words=["dog","fish","ship","cake","train","duck","map","sun","chin","boat"];
  const [word,setWord]=useState("dog");
  const parts=useMemo(()=>splitSounds(word),[word]);
  const [filled,setFilled]=useState([]);
  useEffect(()=>setFilled([]),[word]);
  return (
    <div className="bg-white rounded-2xl p-5 card-shadow border border-nordic-100">
      <h4 className="font-bold text-nordic-800 text-lg">🔢 Sound Boxes (Elkonin)</h4>
      <p className="text-sm text-nordic-500 mt-1">Listen, then push a counter into a box for each sound you hear. Builds segmenting — the bridge to spelling.</p>
      <div className="flex flex-wrap gap-2 mt-3">{words.map(w=><button key={w} onClick={()=>setWord(w)} className={"px-3 py-1 rounded-lg text-sm font-semibold "+(w===word?"bg-nordic-600 text-white":"bg-nordic-50 text-nordic-600 hover:bg-nordic-100")}>{w}</button>)}<button onClick={()=>speak(word,{rate:0.6})} className="px-3 py-1 rounded-lg text-sm font-semibold bg-emerald-500 text-white">🔊 Say it</button></div>
      <div className="flex items-center justify-center gap-2 my-7">{parts.map((s,i)=>(<div key={i} onClick={()=>{const f=[...filled];f[i]=!f[i];setFilled(f);speakGrapheme(s,{rate:0.5});}} className="w-16 h-16 sm:w-20 sm:h-20 rounded-xl border-2 border-dashed border-nordic-300 flex items-center justify-center cursor-pointer relative">{filled[i] && <div className="w-9 h-9 rounded-full bg-nordic-500 animate-pop flex items-center justify-center text-white font-bold text-sm">{s.replace("_e","")}</div>}</div>))}</div>
      <div className="flex gap-2"><button onClick={()=>setFilled(parts.map(()=>true))} className="flex-1 bg-nordic-100 hover:bg-nordic-200 text-nordic-700 font-bold rounded-xl py-2.5">Show all sounds</button><button onClick={()=>setFilled([])} className="flex-1 bg-white border border-nordic-200 text-nordic-600 font-bold rounded-xl py-2.5">Clear counters</button></div>
      <p className="text-center text-nordic-400 text-sm mt-3">“{word}” has <b className="text-nordic-700">{parts.length}</b> sounds and <b className="text-nordic-700">{word.length}</b> letters.</p>
    </div>
  );
}

function Guide(){

      <div className="space-y-3">{[
        ["What is phonics?","Teaching the relationship between the sounds of spoken English (phonemes) and the letters that spell them (graphemes). The goal is automatic decoding so attention is freed for meaning."],
        ["Phonemic awareness ≠ phonics","Phonemic awareness is ears-only (no print): hearing, blending and segmenting sounds. It is the foundation; phonics attaches those sounds to print. Do a little every day."],
        ["Blending","Pushing sounds together to read: /sh/ /i/ /p/ → ship."],
        ["Segmenting","Pulling a word apart into sounds to spell: ship → /sh/ /i/ /p/."],
        ["Grapheme vs phoneme","A phoneme is a sound (44 in English). A grapheme is its spelling — 1+ letters: 'sh', 'igh', 'a_e' are single graphemes."],
        ["Onset & rime","The onset is the first sound(s); the rime is the vowel + what follows. In 'flat', fl = onset, -at = rime. Word families share a rime."],
        ["Digraph / trigraph","Two (sh, ch, th, ck) or three (igh, tch, dge) letters making ONE sound."],
        ["Blend (cluster)","Two consonants TOGETHER but each keeping its sound: st, bl, cr, -nd, -mp. Different from a digraph."],
        ["CVC / CVCe","Consonant-Vowel-Consonant (cat = short vowel). Add silent 'magic e' and the vowel says its name: cap → cape (CVCe)."],
        ["Decodable text","A book using only sound-spellings already taught, so children apply phonics rather than guess from pictures."]
      ].map(([h,d])=>(<div key={h} className="bg-white rounded-2xl p-4 card-shadow border border-nordic-100"><h4 className="font-bold text-nordic-800">{h}</h4><p className="text-sm text-nordic-600 mt-1 leading-snug">{d}</p></div>))}</div>

      )}
      {EMBED && (
        <div className="sticky top-0 z-40 bg-white/90 backdrop-blur border-b border-nordic-100 no-print">
          <div className="max-w-6xl mx-auto px-4 py-2 flex flex-wrap items-center gap-1">{tabs.map(([id,label])=>(<button key={id} onClick={()=>setTab(id)} className={"px-3 py-1.5 rounded-lg text-sm font-semibold transition "+(tab===id?"tab-active":"text-nordic-600 hover:bg-nordic-50")}>{label}</button>))}<span className="mx-1 w-px h-6 bg-nordic-100"></span><VoiceControls/></div>
        </div>
      )}
      <main className="max-w-6xl mx-auto px-4 py-6 pb-16">
        {tab==="home" && <Overview go={setTab}/>}
        {tab==="patterns" && <WordPatterns/>}
        {tab==="scope" && <Scope/>}
        {tab==="wall" && <SoundWall/>}
        {tab==="routine" && <Routine/>}
        {tab==="activities" && <Activities/>}
        {tab==="guide" && <Guide/>}
      </main>
      {!EMBED && <footer className="max-w-6xl mx-auto px-4 py-6 text-center text-xs text-nordic-400 no-print">NIS English — Phonics Studio · Sound inventory based on Pronunciation Coach 3D · Audio: ElevenLabs clips when available, with browser speech fallback · Accent &amp; voice selectable above.</footer>}
    </div>
  );
}
if(EMBED) document.body.classList.add('embed');
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
