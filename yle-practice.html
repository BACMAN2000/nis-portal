<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YLE Practice Tests · Nordic International School</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="brand.css?v=21">
<style>
/* =========================================================================
   Motor de los practice tests YLE (Starters · Movers · Flyers).
   Un test = yle/<level>/test-NN.json con el formato oficial (yle/specs.json).
   Cada parte es una pantalla; hay modo práctica (corrige al momento) y modo
   examen (tiempo oficial, corrige al final). Lo objetivo lo corrige el motor;
   colorear y Speaking los revisa el profesor.
   ========================================================================= */
:root{--navy:#0d1d33;--blue:#1e3a8a;--sky:#eef3fb;--ink:#1e293b;--muted:#64748b;--border:#d9deea;--ok:#2f8f5b;--bad:#b53a3a;--st:#e08a2a;--mv:#238f85;--fl:#6a54c9}
*{box-sizing:border-box}
body{margin:0;background:#f7f8fb;color:var(--ink);font-family:'Gotham','Segoe UI',system-ui,sans-serif}
header.top{background:var(--navy);color:#fff;padding:10px 18px 10px 118px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}  /* el hueco de la izquierda es para el botón Back de nis-nav */
header.top img{height:34px}
header.top h1{font-size:1.1rem;margin:0;font-weight:700}
header.top .sub{font-size:.8rem;opacity:.8}
header.top .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lv{display:inline-block;padding:.1rem .6rem;border-radius:999px;font-weight:700;font-size:.8rem;color:#fff;background:var(--st)}
.lv.movers{background:var(--mv)} .lv.flyers{background:var(--fl)}
.wrap{display:grid;grid-template-columns:230px 1fr;gap:16px;padding:16px;max-width:1240px;margin:0 auto}
aside{background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px;align-self:start;position:sticky;top:12px}
aside h2{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:4px 8px 8px}
.tbtn{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--border);border-radius:10px;padding:9px 10px;margin:6px 0;cursor:pointer;font:inherit}
.tbtn.on{background:var(--sky);border-color:var(--blue);box-shadow:0 0 0 2px #c7d2fe}
.tbtn b{display:block;font-size:.95rem} .tbtn small{color:var(--muted)}
main{min-width:0}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--border);margin-bottom:12px;flex-wrap:wrap}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer}
.tab.on{color:var(--blue);border-bottom-color:var(--blue)}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.card h3{margin:0 0 4px;font-size:1.05rem;color:var(--blue)}
.instr{color:var(--muted);font-size:.92rem;margin:0 0 10px}
.pic{width:100%;max-width:820px;border:1px solid var(--border);border-radius:14px;display:block;margin:10px 0}
audio{width:100%;max-width:820px;margin:6px 0 10px}
.item{display:flex;align-items:center;gap:10px;margin:8px 0;flex-wrap:wrap}
.item label{min-width:180px;font-weight:600}
.item input[type=text]{border:1.5px solid var(--border);border-radius:9px;padding:8px 10px;font:inherit;min-width:160px}
.item select{border:1.5px solid var(--border);border-radius:9px;padding:8px 10px;font:inherit}
.ex{background:var(--sky);border-radius:9px;padding:6px 10px}
.ex .tagex{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.ok{border-color:var(--ok)!important;background:#e3f3ea} .bad{border-color:var(--bad)!important;background:#f8e1e1}
.corr{color:var(--ok);font-weight:700;margin-left:6px}
.abc{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
.abc label{display:flex;align-items:center;gap:6px;border:1.5px solid var(--border);border-radius:10px;padding:8px 12px;cursor:pointer}
.abc label.ok{background:#e3f3ea} .abc label.bad{background:#f8e1e1}
.letter{font-weight:800;color:var(--blue)}
.tc{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.tc .box{border:1.5px solid var(--border);border-radius:12px;padding:10px;text-align:center}
.tc .box p{margin:6px 0;font-weight:600}
.tc .box button{border:1.5px solid var(--border);background:#fff;border-radius:9px;font-size:1.3rem;padding:4px 14px;margin:0 4px;cursor:pointer}
.tc .box button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.tiles{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.tile{width:40px;height:44px;border:2px solid var(--blue);border-radius:9px;background:#fff;font:inherit;font-size:1.2rem;font-weight:800;color:var(--blue);cursor:pointer}
.tile:disabled{opacity:.35}
.ans{display:flex;align-items:center;gap:8px;margin:4px 0 10px}
.ans input{letter-spacing:.2em;font-size:1.2rem;font-weight:700;border:1.5px solid var(--border);border-radius:9px;padding:6px 10px;width:220px;font-family:inherit}
.small{font-size:.85rem;color:var(--muted)}
.bank{display:flex;gap:10px;flex-wrap:wrap;background:var(--sky);border-radius:12px;padding:10px;margin:8px 0}
.bank span{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.85rem;font-weight:600}
.cloze{line-height:2.1;font-size:1.05rem}
.cloze select{margin:0 4px}
.story{display:grid;grid-template-columns:1fr;gap:12px}
.story .part{border:1px solid var(--border);border-radius:12px;padding:10px}
.story .part img{max-width:320px;width:100%;border-radius:10px;display:block;margin-bottom:6px}
.scene{position:relative;display:inline-block;max-width:820px;width:100%}
.scene img{width:100%;display:block;border-radius:14px;border:1px solid var(--border)}
.scene .zone{position:absolute;border:2px dashed transparent;border-radius:8px}
.scene.debug .zone{border-color:#f06}
.scene .drop{position:absolute;width:64px;height:64px;transform:translate(-50%,-50%);cursor:grab;touch-action:none}
.cards{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.cardx{width:78px;height:86px;border:2px solid var(--border);border-radius:12px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.75rem;font-weight:600;cursor:grab;user-select:none;touch-action:none}
.cardx.used{opacity:.35;cursor:default}
.cardx.on{border-color:var(--blue);box-shadow:0 0 0 2px #c7d2fe}
.pin{position:absolute;width:26px;height:26px;border-radius:50%;background:#e53935;border:3px solid #fff;transform:translate(-50%,-50%);box-shadow:0 2px 6px rgba(0,0,0,.3);pointer-events:none}
.spk{border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin:8px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spk .q{flex:1;min-width:200px;font-weight:600}
.btn{border:0;background:var(--blue);color:#fff;border-radius:999px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer}
.btn.sec{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.btn.red{background:#e53935}
.btn:disabled{opacity:.5;cursor:default}
.model{font-size:.85rem;color:var(--muted)}
.model b{color:var(--ok)}
details.key{margin-top:10px} details.key summary{cursor:pointer;font-weight:700;color:var(--blue)}
.navbar{position:sticky;bottom:10px;background:#fff;border:1px solid var(--border);border-radius:999px;padding:8px 10px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(13,29,51,.15);margin-top:10px}
.navbar .mid{flex:1;text-align:center;font-weight:700;font-size:.92rem}
.dots{display:flex;gap:4px;justify-content:center;margin-top:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--border)} .dots i.on{background:var(--blue)}
.score{background:var(--sky);border-radius:12px;padding:12px 14px;margin:10px 0;font-weight:600}
.shields{display:flex;gap:6px;align-items:center;margin-top:6px}
.shield{width:34px;height:40px;clip-path:polygon(50% 0,100% 12%,100% 60%,50% 100%,0 60%,0 12%);background:#d29a1f;display:grid;place-items:center;color:#3b2a05;font-weight:900;font-size:.9rem}
.shield.off{background:#e2e6ef;color:#9aa3b5}
.timer{font-variant-numeric:tabular-nums;font-weight:800;background:#fff;color:var(--navy);border-radius:999px;padding:4px 12px}
.timer.low{background:#ffd5d5;color:#8a1c1c}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:8px 0 12px}
.board .bx{border:1.5px solid var(--border);border-radius:12px;padding:8px 6px;text-align:center;font-size:.85rem;font-weight:600;background:#fff}
.board .bx .letter{display:block;font-size:1.05rem;margin-bottom:2px}
.oddset{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0 12px}
.oddt{width:92px;height:100px;border:2px solid var(--border);border-radius:12px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:inherit;font-size:.75rem;font-weight:600;cursor:pointer}
.oddt.on{border-color:var(--blue);box-shadow:0 0 0 2px #c7d2fe}
.oddt.ok{background:#e3f3ea;border-color:var(--ok)} .oddt.bad{background:#f8e1e1;border-color:var(--bad)}
.dlg{border:1px solid var(--border);border-radius:12px;padding:8px 12px;margin:8px 0}
.dlg .a{font-weight:600;margin:4px 0}
.sent{line-height:2.2;font-size:1.02rem}
.sent input[type=text]{border:1.5px solid var(--border);border-radius:9px;padding:6px 10px;font:inherit;min-width:150px;margin:0 4px}
textarea.free{width:100%;max-width:820px;min-height:64px;border:1.5px solid var(--border);border-radius:10px;padding:8px 10px;font:inherit;display:block;margin:4px 0 10px}
.hidden{display:none!important}
.path .shrow{display:flex;gap:18px;flex-wrap:wrap;margin:8px 0;font-weight:600;align-items:center}
.path .next{background:#fffbf0;border-left:4px solid #d29a1f;padding:8px 12px;border-radius:0 10px 10px 0;margin:10px 0}
.ptable{border-collapse:collapse;width:100%;margin:10px 0}
.ptable th,.ptable td{border-bottom:1px solid var(--border);padding:7px 6px;text-align:left;vertical-align:middle}
.ptable th{font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.ptable td.ok{color:var(--ok);font-weight:700}.ptable td.todo{color:#b9c0cf;font-size:1.2rem}
.btn.sm{padding:5px 10px;font-size:.85rem}
.print-only{display:none}
@media print{header.top,aside,.tabs,.noprint{display:none!important}.wrap{display:block}.print-only{display:block}body{background:#fff}}
.welcome .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:12px 0}
.welcome .tilew{background:var(--sky);border-radius:12px;padding:12px}
.welcome .tilew b{display:block;font-size:1.3rem}
@media (max-width:820px){.wrap{grid-template-columns:1fr}aside{position:static}}
</style>
</head>
<body>
<header class="top">
  <img src="assets/logo-white-h.svg" alt="" onerror="this.remove()">
  <div><h1 id="hTitle">YLE Practice Tests</h1><div class="sub" id="hSub">Cambridge Young Learners · Pre A1 Starters</div></div>
  <div class="right"><span class="lv" id="hLv">Starters</span><span class="timer hidden" id="timer">20:00</span><a href="index.html" class="btn sec" style="text-decoration:none">◀ Portal</a></div>
</header>
<div class="wrap">
  <aside>
    <h2>Practice tests</h2>
    <div id="picker"></div>
    <h2 style="margin-top:14px">My path</h2>
    <button class="tbtn" id="btnPath"><b>⭐ My path</b><small>stars, shields and your next step</small></button>
    <a class="tbtn" id="lnkVocab" href="yle-vocab.html" style="text-decoration:none;color:inherit"><b>📚 Word trainer</b><small>the 2025 word list</small></a>
    <h2 style="margin-top:14px">Level</h2>
    <div id="levels"></div>
  </aside>
  <main>
    <div class="tabs" id="tabs"></div>
    <div id="content"></div>
  </main>
</div>

<!-- NIS-ONLY -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="config.js"></script>
<script src="nis-nav.js?v=2"></script>
<script src="activity-save.js?v=4"></script>
<!-- /NIS-ONLY -->
<script src="yle/fluent3d.js?v=2"></script>
<script src="paint-layer.js?v=2"></script>
<script>
(function(){
'use strict';
var $ = function(s, r){ return (r || document).querySelector(s); };
var $$ = function(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
var esc = function(s){ return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); };
var norm = function(s){ return String(s == null ? '' : s).trim().toLowerCase().replace(/^(a|an|the)\s+/, '').replace(/[.,;:!?'"’]/g, '').replace(/\s+/g, ' '); };
var ART = window.YLE_ART || {};
var pic = function(word, size){ var e = ART.wordEmoji ? ART.wordEmoji(word) : null; return e ? ART.pic3d(e, size || 64) : '<span class="emoji" style="font-size:' + Math.round((size || 64) * .8) + 'px">🖼️</span>'; };

var qs = new URLSearchParams(location.search);
var LEVEL = ['starters', 'movers', 'flyers'].indexOf(qs.get('level')) >= 0 ? qs.get('level') : 'starters';
var NAMES = {starters: 'Pre A1 Starters', movers: 'A1 Movers', flyers: 'A2 Flyers'};
var IMG = 'yle-img/' + LEVEL + '/', AUD = 'yle-audio/' + LEVEL + '/';
var SPECS = null, INDEX = [], T = null, cur = -1, tab = 'overview', screen = 0;
var mode = 'practice';               // practice | exam
var timerInt = null, timerLeft = 0, t0 = Date.now();
var STORE = {};                      // respuestas por test#paper#campo
var PAINT = {};                      // trazos por test#lamina
var REC = {};                        // grabaciones por test#parte (blob)
var PLACED = {};                     // tarjetas colocadas por test
var POINTED = {};                    // clics de "señala" por test
var SESSION = null;                  // simulacro de aula abierto por el profesor (NIS)
var LOCKED = {};                     // tests con candado por yle_access (NIS)

/* ---------- carga ---------- */
function json(u){ return fetch(u, {cache: 'no-cache'}).then(function(r){ if(!r.ok) throw new Error(u); return r.json(); }); }
function key(){ return (cur + 1) + '#' + tab + '#'; }
function nn(){ return String(T.number).padStart(2, '0'); }
function img(id, cls){ return '<img class="' + (cls || 'pic') + '" src="' + IMG + 'test_' + nn() + '_' + id + '.jpg" alt="" loading="lazy" onerror="this.style.display=\'none\'">'; }
function audio(p){ if(SESSION) return '<p class="small">🏫 Class mock: your teacher plays the recording for Part ' + p + ' once, like in the real exam.</p>'; return '<audio controls preload="none" src="' + AUD + 'test_' + nn() + '_part' + p + '.mp3" onerror="this.insertAdjacentHTML(\'afterend\',\'<p class=small>🎧 The recording for this part is not published yet: do it while your teacher reads the script.</p>\');this.remove()"></audio>'; }

function init(){
  $('#hSub').textContent = 'Cambridge Young Learners · ' + NAMES[LEVEL];
  $('#hLv').textContent = LEVEL.charAt(0).toUpperCase() + LEVEL.slice(1); $('#hLv').className = 'lv ' + LEVEL;
  $('#levels').innerHTML = ['starters', 'movers', 'flyers'].map(function(l){ return '<a class="tbtn' + (l === LEVEL ? ' on' : '') + '" href="?level=' + l + '" style="text-decoration:none;color:inherit"><b>' + NAMES[l] + '</b></a>'; }).join('');
  Promise.all([json('yle/specs.json'), json('yle/' + LEVEL + '/index.json').catch(function(){ return []; })]).then(function(r){
    SPECS = r[0]; INDEX = r[1];
    return nisGate().then(function(){
      $('#picker').innerHTML = INDEX.length ? INDEX.map(function(t, i){ var lk = LOCKED[t.number]; return '<button class="tbtn" data-i="' + i + '"' + (lk ? ' disabled style="opacity:.5"' : '') + '><b>' + (lk ? '🔒 ' : '') + 'Test ' + t.number + '</b><small>' + esc(t.theme) + '</small></button>'; }).join('') : '<p class="small">No tests published for this level yet.</p>';
      $$('#picker .tbtn').forEach(function(b){ b.onclick = function(){ openTest(+b.dataset.i); }; });
      $('#btnPath').onclick = showPath; $('#lnkVocab').href = 'yle-vocab.html?level=' + LEVEL;
      if(qs.get('path') === '1') showPath();
      if(SESSION){ mode = 'exam'; var si = INDEX.findIndex(function(t){ return t.number === SESSION.test; }); if(si >= 0){ json('yle/' + LEVEL + '/test-' + String(SESSION.test).padStart(2, '0') + '.json').then(function(t){ T = t; cur = si; tab = SESSION.paper; screen = 0; $$('#picker .tbtn').forEach(function(b, k){ b.classList.toggle('on', k === si); }); render(); startTimer(); }); return; } }
      render();
      var want = +(qs.get('test') || 0); if(want && INDEX.some(function(t){ return t.number === want && !LOCKED[t.number]; })) openTest(INDEX.findIndex(function(t){ return t.number === want; }));
    });
  }).catch(function(e){ $('#content').innerHTML = '<div class="card">Could not load the tests (' + esc(e.message) + ').</div>'; });
}
/* NIS: candado por grado (yle_access) y simulacro de aula (yle_sessions). Sin sesión, no hace nada. */
function nisGate(){
  var c = client(); if(!c) return Promise.resolve();
  return c.auth.getUser().then(function(u){ var user = u && u.data && u.data.user; if(!user) return;
    return c.from('profiles').select('grade_id, role').eq('id', user.id).maybeSingle().then(function(r){ var p = r && r.data; if(!p || p.role !== 'student' || !p.grade_id) return;
      return Promise.all([
        c.from('yle_access').select('unlocked, max_test').eq('grade_id', p.grade_id).eq('level', LEVEL).maybeSingle(),
        c.from('yle_sessions').select('id, test, paper').eq('grade_id', p.grade_id).eq('level', LEVEL).eq('status', 'open').order('started_at', {ascending: false}).limit(1)
      ]).then(function(rr){
        var acc = rr[0] && rr[0].data; if(acc){ if(!acc.unlocked){ INDEX = []; $('#content').innerHTML = '<div class="card">Your teacher has not opened ' + NAMES[LEVEL] + ' for your class yet.</div>'; } else INDEX.forEach(function(t){ if(t.number > acc.max_test) LOCKED[t.number] = true; }); }
        var ses = rr[1] && rr[1].data && rr[1].data[0]; if(ses && INDEX.some(function(t){ return t.number === ses.test; })){ SESSION = ses; LOCKED = {}; }
      });
    });
  }).catch(function(){});
}
function openTest(i){
  json('yle/' + LEVEL + '/test-' + String(INDEX[i].number).padStart(2, '0') + '.json').then(function(t){
    T = t; cur = i; tab = 'overview'; screen = 0;
    $$('#picker .tbtn').forEach(function(b, k){ b.classList.toggle('on', k === i); }); var bp = $('#btnPath'); if(bp) bp.classList.remove('on');
    render();
  });
}


/* ---------- My path: estrellas por paper, escudos estimados, siguiente paso y vocabulario ---------- */
function showPath(){
  T = null; cur = -1; tab = 'overview';
  $$('#picker .tbtn').forEach(function(b){ b.classList.remove('on'); }); $('#btnPath').classList.add('on');
  $('#tabs').innerHTML = ''; $('#content').innerHTML = '<div class="card">Loading your path…</div>';
  pathData().then(renderPath).catch(function(e){ $('#content').innerHTML = '<div class="card">Could not load your path (' + esc(e.message) + ').</div>'; });
}
function pathData(){
  var out = {attempts: [], vocab: {done: 0, total: 0}, account: false};
  var vt = json('yle/vocab/' + LEVEL + '.json').then(function(d){ out.vocab.total = (d.words || []).length; }).catch(function(){});
  var c = client();
  var acc = c ? c.auth.getUser().then(function(u){ var user = u && u.data && u.data.user; if(!user) return;
      return Promise.all([
        c.from('yle_attempts').select('test, paper, mode, score, total, parts, shields_est, criteria, feedback, reviewed_at, audio_path, created_at').eq('student_id', user.id).eq('level', LEVEL).order('created_at', {ascending: false}),
        c.from('yle_vocab_progress').select('word, ok').eq('student_id', user.id).eq('level', LEVEL)
      ]).then(function(r){ out.account = true; out.attempts = (r[0] && r[0].data) || []; out.vocab.done = ((r[1] && r[1].data) || []).filter(function(x){ return x.ok >= 3; }).length; });
    }).catch(function(){}) : Promise.resolve();
  return Promise.all([vt, acc]).then(function(){
    if(!out.account){
      Object.keys(STORE).forEach(function(k){ var m = /^(\d+)#(listening|rw)#result$/.exec(k); if(!m) return; var r = STORE[k], t = INDEX[+m[1] - 1]; if(!r || !t) return;
        out.attempts.push({test: t.number, paper: m[2], mode: r.mode || 'practice', score: r.score, total: r.total, parts: r.parts || {}, shields_est: r.shields, created_at: r.at}); });
      try { var v = JSON.parse(localStorage.getItem('yle_vocab_' + LEVEL) || '{}') || {}; out.vocab.done = Object.keys(v).filter(function(w){ return v[w] && v[w].ok >= 3; }).length; } catch(e){}
    }
    return out;
  });
}
function shieldsMini(n){ var h = '<span class="shields">'; for(var i = 1; i <= 5; i++) h += '<span class="shield' + (i <= (n || 0) ? '' : ' off') + '">' + i + '</span>'; return h + '</span>'; }
function renderPath(d){
  var A = d.attempts, byTest = {}, best = {listening: null, rw: null, speaking: null}, parts = {}, fb = [];
  var PN = {listening: 'Listening', rw: 'Reading & Writing', speaking: 'Speaking'};
  A.forEach(function(a){
    var t = byTest[a.test] = byTest[a.test] || {listening: null, rw: null, speaking: 0, spRev: null};
    if(a.feedback) fb.push(a);
    if(a.paper === 'speaking'){ t.speaking++; if(a.reviewed_at && a.criteria && a.criteria.teacher_max){ var sh = Math.max(1, Math.min(5, Math.round(5 * (a.criteria.teacher_total || 0) / a.criteria.teacher_max))); t.spRev = t.spRev || sh; if(!best.speaking || sh > best.speaking) best.speaking = sh; } return; }

  });

  var maxStars = INDEX.length * 3, total = (best.listening || 0) + (best.rw || 0) + (best.speaking || 0);
  var weak = null; Object.keys(parts).forEach(function(kk){ var p = Math.round(100 * parts[kk][0] / parts[kk][1]); if(weak == null || p < weak.p) weak = {k: kk, p: p}; });
  var next;

  else if(weak && weak.p < 75){ var pp = weak.k.split('/'), sp = SPECS.levels[LEVEL][pp[0]] && SPECS.levels[LEVEL][pp[0]].parts[+pp[1].slice(1) - 1];

    (fb.length ? '<h3>From your teacher</h3>' + fb.slice(0, 3).map(function(a){ return '<div class="score">Test ' + a.test + ' · ' + PN[a.paper] + ': ' + esc(a.feedback) + '</div>'; }).join('') : '') +

/* ---------- corrección ---------- */
function keyOf(paper, pk, i){
  var P = T[paper][pk];
  if(P.type === 'draw_lines') return P.items[i].person;
  if(P.type === 'note_taking' || P.type === 'note_taking_names_numbers') return P.items[i].a;
  if(P.type === 'mc_pictures') return P.items[i].key;
  if(P.type === 'tick_cross') return P.items[i].key ? 'yes' : 'no';
  if(P.type === 'yes_no') return P.items[i].key;
  if(P.type === 'unscramble') return P.items[i].word;
  if(P.type === 'mc_cloze_copy') return P.key[i];
  if(P.type === 'story_one_word'){ var all = []; P.parts.forEach(function(x){ x.items.forEach(function(it){ all.push(it.a); }); }); return all[i]; }
  if(P.type === 'match_letters') return P.items[i].letter;
  if(P.type === 'definitions_copy') return P.items[i].word;
  if(P.type === 'dialogue_mc3') return P.items[i].key;
  if(P.type === 'gapped_text_title') return i < P.key.length ? P.key[i] : P.title_key;
  if(P.type === 'mc_cloze') return P.items[i].options['ABC'.indexOf(P.items[i].key)];
  if(P.type === 'story_completion'){ var allS = []; P.parts.forEach(function(x){ x.items.forEach(function(it){ allS.push(it.a); }); }); return allS[i]; }
  if(P.type === 'productive_writing') return P.complete[i].a;
  return null;
}
var NUM = {one: '1', two: '2', three: '3', four: '4', five: '5', six: '6', seven: '7', eight: '8', nine: '9', ten: '10', eleven: '11', twelve: '12', thirteen: '13', fourteen: '14', fifteen: '15', sixteen: '16', seventeen: '17', eighteen: '18', nineteen: '19', twenty: '20'};
function same(a, b){ if(Array.isArray(b)) return b.some(function(x){ return same(a, x); }); a = norm(a); b = norm(b); if(NUM[a]) a = NUM[a]; if(NUM[b]) b = NUM[b]; return a === b; }
function countItems(paper, pk){ var P = T[paper][pk]; if(P.type === 'story_one_word' || P.type === 'story_completion') return P.parts.reduce(function(n, x){ return n + x.items.length; }, 0); if(P.type === 'mc_cloze_copy') return P.key.length; if(P.type === 'gapped_text_title') return P.key.length + 1; if(P.type === 'productive_writing') return P.complete.length; return (P.items || []).length; }
function teacherItems(P){ if(P.type === 'colour' || P.type === 'colour_write') return P.items.length; if(P.type === 'productive_writing') return (P.answer || []).length + ((P.write || {}).n || 2); return 0; }
function checkPart(pk, silent){
  readDOM(); var paper = tab === 'rw' ? 'rw' : 'listening'; var P = T[paper][pk];
  if(P.type === 'colour' || P.type === 'colour_write'){ var det = $('[data-part="' + pk + '"] details'); if(det) det.open = true; return {score: 0, total: 0, teacher: P.items.length}; }
  var score = 0, total = countItems(paper, pk);
  for(var i = 0; i < total; i++){
    var k = keyOf(paper, pk, i), v = STORE[key() + pk + '_' + i]; var ok = v != null && v !== '' && same(v, k);
    if(ok) score++;
    if(!silent){
      var el = $('#content [data-name="' + pk + '_' + i + '"]') || $('#content input[name="' + pk + '_' + i + '"][value="' + v + '"]');
      if(el && el.type !== 'hidden'){ el.classList.remove('ok', 'bad'); el.classList.add(ok ? 'ok' : 'bad'); if(el.type === 'radio') el.parentNode.classList.add(ok ? 'ok' : 'bad'); if(!ok && el.parentNode && !$('.corr', el.parentNode)){ var s = document.createElement('span'); s.className = 'corr'; s.textContent = '→ ' + (Array.isArray(k) ? k[0] : k); el.parentNode.appendChild(s); } }
      else if(el && el.type === 'hidden'){ el.parentNode.classList.add(ok ? 'ok' : 'bad'); if(!ok && !$('.corr', el.parentNode)){ var s2 = document.createElement('span'); s2.className = 'corr'; s2.textContent = '→ ' + (k === 'yes' ? '✓' : '✗'); el.parentNode.appendChild(s2); } }
    }
  }
  var tch = teacherItems(P);
  if(!silent){ var c = $('[data-part="' + pk + '"]'); var box = $('.score', c) || document.createElement('div'); box.className = 'score'; box.textContent = 'Part ' + pk.slice(1) + ': ' + score + ' / ' + total + (tch ? ' auto-marked · ' + tch + ' for your teacher' : ''); c.appendChild(box); var det = $('[data-part="' + pk + '"] details'); if(det && tch) det.open = true; }
  return {score: score, total: total, teacher: tch};
}
function band(pct){ var b = (SPECS.shields && SPECS.shields.nis_estimate_bands) || [[90, 5], [75, 4], [60, 3], [40, 2], [0, 1]]; for(var i = 0; i < b.length; i++) if(pct >= b[i][0]) return b[i][1]; return 1; }

  var msg = document.createElement('div'); msg.className = 'card';
  msg.innerHTML = '<h3>' + (paper === 'rw' ? 'Reading & Writing' : 'Listening') + ' — result</h3><div class="score">' + score + ' / ' + total + ' auto-marked (' + pct + ' %)' + (teacher ? ' · ' + teacher + ' items for your teacher to check' : '') + shields(sh) + '</div><p class="small">Estimated shields are your school\'s estimate from this practice test, not a Cambridge result.</p><p id="saveMsg" class="small">Saving…</p>';
  $('#content').insertBefore(msg, $('#content').firstChild); window.scrollTo({top: 0, behavior: 'smooth'});
  var bar = $('.navbar'); if(bar) bar.remove();
  saveAttempt(paper, res).then(function(t){ $('#saveMsg').textContent = t; });
}
function answersOf(paper){ var out = {}; var k = key(); Object.keys(STORE).forEach(function(x){ if(x.indexOf(k) === 0 && x !== k + 'result') out[x.slice(k.length)] = STORE[x]; }); return out; }
function drawingsOf(){ var out = {}; var k = (cur + 1) + '#'; Object.keys(PAINT).forEach(function(x){ if(x.indexOf(k) === 0) out[x.slice(k.length)] = PAINT[x]; }); return out; }
var sb = null;
function client(){ if(sb) return sb; if(!window.supabase || !window.NIS_CONFIG) return null; sb = supabase.createClient(NIS_CONFIG.SUPABASE_URL, NIS_CONFIG.SUPABASE_KEY); return sb; }
function saveAttempt(paper, res, extra){
  var c = client(); if(!c) return Promise.resolve('Saved on this device (open the test from the portal to save it to your account).');
  return c.auth.getUser().then(function(u){ var user = u && u.data && u.data.user; if(!user) return 'Saved on this device. Sign in through the portal to keep it in your account.';
    var row = Object.assign({student_id: user.id, level: LEVEL, test: T.number, paper: paper, mode: mode, session_id: (SESSION && SESSION.paper === paper) ? SESSION.id : null, score: res.score, total: res.total, parts: res.parts || {}, answers: answersOf(paper), drawings: drawingsOf(), duration_sec: Math.min(32000, Math.round((Date.now() - t0) / 1000)), shields_est: res.shields || null}, extra || {});
    return c.from('yle_attempts').insert(row).then(function(r){ return r.error ? 'Could not save to your account: ' + r.error.message : 'Saved to your account ✓ Your teacher can see it.'; });
  }).catch(function(e){ return 'Could not save: ' + e.message; });
}

/* ---------- temporizador (modo examen) ---------- */
function startTimer(){ stopTimer(); var s = SPECS.levels[LEVEL][tab === 'rw' ? 'rw' : 'listening']; timerLeft = (s.minutes || 20) * 60; t0 = Date.now(); var el = $('#timer'); el.classList.remove('hidden', 'low'); tick(); timerInt = setInterval(tick, 1000); }
function tick(){ var el = $('#timer'); var m = Math.floor(timerLeft / 60), s = timerLeft % 60; el.textContent = m + ':' + (s < 10 ? '0' : '') + s; if(timerLeft <= 120) el.classList.add('low'); if(timerLeft <= 0){ stopTimer(); if(tab !== 'speaking' && tab !== 'overview') finishPaper(); return; } timerLeft--; }
function stopTimer(){ if(timerInt) clearInterval(timerInt); timerInt = null; $('#timer').classList.add('hidden'); }

/* ---------- pintura sobre láminas ---------- */
window.attachPaintYle = function(){
  if(!window.PaintLayer) return;
  $$('#content img[data-paint]').forEach(function(im){
    if(im.__pl) return; var id = im.dataset.paint, k = (cur + 1) + '#' + id;
    PaintLayer.attach(im, {tools: im.dataset.tools ? im.dataset.tools.split(',').concat(['text']) : undefined, initial: PAINT[k], onChange: function(d){ PAINT[k] = d; save(); }});
  });
};

/* ---------- examinador virtual ---------- */
function say(txt){
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(txt); u.lang = 'en-GB'; u.rate = LEVEL === 'starters' ? .82 : .9;
  var v = speechSynthesis.getVoices().filter(function(x){ return /en-GB/i.test(x.lang); }); if(v.length) u.voice = v.find(function(x){ return /female|Libby|Sonia|Hazel/i.test(x.name); }) || v[0];
  speechSynthesis.speak(u);
}
/* señalar en la escena / colocar tarjetas */
var armedPoint = null, armedPlace = null;
function armPoint(i){ armedPoint = i; armedPlace = null; $$('#cards .cardx').forEach(function(c){ c.classList.remove('on'); }); }
function armPlace(i){ armedPlace = i; armedPoint = null; var P1 = T.speaking.p1; var c = $('#cards .cardx[data-card="' + P1.place[i].card + '"]'); if(c) c.classList.add('on'); }
function inZone(x, y, z){ return z && x >= z.x && x <= z.x + z.w && y >= z.y && y <= z.y + z.h; }
function setupScene(){
  var sc = $('#scene'), P1 = T.speaking.p1, k = (cur + 1) + '#';
  POINTED[k] = POINTED[k] || {}; PLACED[k] = PLACED[k] || {};
  var pct = function(e){ var r = sc.getBoundingClientRect(); return {x: 100 * (e.clientX - r.left) / r.width, y: 100 * (e.clientY - r.top) / r.height}; };
  sc.addEventListener('click', function(e){
    if(e.target.closest('.drop')) return;
    var p = pct(e);
    if(armedPoint != null){ POINTED[k][armedPoint] = p; drawPins(); }
    else if(armedPlace != null){ PLACED[k][armedPlace] = p; drawDrops(); armedPlace = null; $$('#cards .cardx').forEach(function(c){ c.classList.remove('on'); }); save(); }
  });
  // arrastrar tarjetas
  $$('#cards .cardx').forEach(function(c){
    c.addEventListener('pointerdown', function(e){ e.preventDefault(); var name = c.dataset.card; var idx = P1.place.findIndex(function(x){ return x.card === name; }); if(idx < 0) return; armedPlace = idx; c.classList.add('on');
      var ghost = c.cloneNode(true); ghost.style.position = 'fixed'; ghost.style.pointerEvents = 'none'; ghost.style.opacity = '.85'; ghost.style.zIndex = 99; document.body.appendChild(ghost);
      var move = function(ev){ ghost.style.left = (ev.clientX - 39) + 'px'; ghost.style.top = (ev.clientY - 43) + 'px'; }; move(e);
      var up = function(ev){ document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up); ghost.remove(); var r = sc.getBoundingClientRect(); if(ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom){ PLACED[k][idx] = pct(ev); drawDrops(); save(); } armedPlace = null; c.classList.remove('on'); };
      document.addEventListener('pointermove', move); document.addEventListener('pointerup', up);
    });
  });
  function drawPins(){ $$('.pin', sc).forEach(function(p){ p.remove(); }); Object.keys(POINTED[k]).forEach(function(i){ var p = POINTED[k][i]; var d = document.createElement('div'); d.className = 'pin'; d.style.left = p.x + '%'; d.style.top = p.y + '%'; d.title = P1.point[i].say; sc.appendChild(d); }); }
  function drawDrops(){ $$('.drop', sc).forEach(function(p){ p.remove(); }); Object.keys(PLACED[k]).forEach(function(i){ var p = PLACED[k][i]; var d = document.createElement('div'); d.className = 'drop'; d.style.left = p.x + '%'; d.style.top = p.y + '%'; d.innerHTML = pic(P1.place[i].card, 60); sc.appendChild(d); }); $$('#cards .cardx').forEach(function(c){ c.classList.toggle('used', P1.place.some(function(x, i){ return x.card === c.dataset.card && PLACED[k][i]; })); }); }
  drawPins(); drawDrops();
}
function checkOdd(){
  readDOM(); var pk = Object.keys(T.speaking).find(function(x){ return T.speaking[x].type === 'odd_one_out'; }); var P = T.speaking[pk]; var ok = 0, tot = P.sets.length - 1;
  P.sets.slice(1).forEach(function(st, i){ var v = STORE[key() + pk + '_' + i]; var good = v !== '' && v != null && +v === st.odd; if(good) ok++; var box = $('[data-odd="' + i + '"]').parentNode; $$('.oddt', box).forEach(function(x){ x.classList.remove('ok', 'bad'); if(+x.dataset.j === st.odd) x.classList.add('ok'); else if(x.dataset.j === v) x.classList.add('bad'); }); var el = $('[data-odd-res="' + i + '"]'); if(el) el.textContent = v === '' || v == null ? '— tap one' : (good ? '✓ ' + st.reason : '✗ ' + st.reason); });
  var c = $('[data-checkodd]').closest('.card'); var box = $('.score', c) || document.createElement('div'); box.className = 'score'; box.textContent = 'Odd one out: ' + ok + ' / ' + tot; c.appendChild(box); var det = $('details', c); if(det) det.open = true;
  saveAttempt('speaking', {score: ok, total: tot, parts: {}, shields: null}).then(function(){});
}
function checkSpeaking(){
  var P1 = T.speaking.p1, k = (cur + 1) + '#', okP = 0, okC = 0;
  P1.point.forEach(function(x, i){ var p = POINTED[k][i]; var ok = p && inZone(p.x, p.y, P1.zones[x.target]); if(ok) okP++; var el = $('[data-point-res="' + i + '"]'); if(el) el.textContent = p ? (ok ? '✓' : '✗ (not there)') : '— tap the picture after listening'; });
  P1.place.forEach(function(x, i){ var p = PLACED[k][i]; var c = p && {x: p.x, y: p.y}; var ok = c && inZone(c.x, c.y, x.zone); if(ok) okC++; var el = $('[data-place-res="' + i + '"]'); if(el) el.textContent = p ? (ok ? '✓' : '✗ (wrong place)') : '— drag the card'; });
  var c = $('#scene').closest('.card'); var box = $('.score', c) || document.createElement('div'); box.className = 'score'; box.textContent = 'Part 1: pointed ' + okP + ' / ' + P1.point.length + ' · cards ' + okC + ' / ' + P1.place.length; c.appendChild(box);
  saveAttempt('speaking', {score: okP + okC, total: P1.point.length + P1.place.length, parts: {p1: {score: okP + okC, total: P1.point.length + P1.place.length}}, shields: null});
}
/* grabadora */
var recs = {};
function toggleRec(id){
  var st = recs[id]; var btn = $('[data-recbtn="' + id + '"]'), time = $('[data-rectime="' + id + '"]'), au = $('[data-recaudio="' + id + '"]'), msg = $('[data-recstate="' + id + '"]');
  if(st && st.mr && st.mr.state === 'recording'){ st.mr.stop(); return; }
  if(!navigator.mediaDevices){ msg.textContent = 'This browser cannot record.'; return; }
  navigator.mediaDevices.getUserMedia({audio: true}).then(function(stream){
    var mr = new MediaRecorder(stream), chunks = [], start = Date.now(); recs[id] = {mr: mr};
    var tk = setInterval(function(){ var s = Math.floor((Date.now() - start) / 1000); time.textContent = Math.floor(s / 60) + ':' + (s % 60 < 10 ? '0' : '') + (s % 60); if(s >= 120) mr.stop(); }, 250);
    mr.ondataavailable = function(e){ chunks.push(e.data); };
    mr.onstop = function(){ clearInterval(tk); stream.getTracks().forEach(function(t){ t.stop(); }); var blob = new Blob(chunks, {type: mr.mimeType || 'audio/webm'}); REC[(cur + 1) + '#' + id] = blob; au.src = URL.createObjectURL(blob); au.classList.remove('hidden'); btn.textContent = '● Record again'; btn.classList.remove('sec'); msg.textContent = 'Saved on this device. Uploading…'; upload(id, blob).then(function(t){ msg.textContent = t; }); };
    mr.start(); btn.textContent = '■ Stop'; msg.textContent = 'Recording…';
  }).catch(function(){ msg.textContent = 'Microphone not allowed.'; });
}
function upload(id, blob){
  var c = client(); if(!c) return Promise.resolve('Saved on this device.');
  return c.auth.getUser().then(function(u){ var user = u && u.data && u.data.user; if(!user) return 'Saved on this device (sign in through the portal to send it to your teacher).';
    var ext = /ogg/.test(blob.type) ? 'ogg' : 'webm', ruta = user.id + '/yle-' + LEVEL + '-t' + nn() + '-' + id + '.' + ext;
    return c.storage.from('fun-speaking').upload(ruta, blob, {upsert: true, contentType: blob.type || 'audio/webm'}).then(function(r){ if(r.error) return 'Saved on this device (' + r.error.message + ').';
      return saveAttempt('speaking', {score: null, total: null, parts: {}, shields: null}, {audio_path: ruta, answers: {part: id}}).then(function(){ return 'Sent to your teacher ✓'; }); });
  });
}

/* ---------- guardado en la cuenta (NIS_WORK) ---------- */
if(window.NIS_WORK){
  NIS_WORK.attach(Object.assign(NIS_WORK.ficha(), {
    slug: 'yle-' + LEVEL, title: NAMES[LEVEL] + ' — Practice Tests',
    read: function(){ readDOM(); return {store: STORE, paint: PAINT, placed: PLACED}; },
    write: function(d){ if(d && d.store) Object.keys(d.store).forEach(function(k){ STORE[k] = d.store[k]; }); if(d && d.paint) Object.keys(d.paint).forEach(function(k){ PAINT[k] = d.paint[k]; }); if(d && d.placed) Object.keys(d.placed).forEach(function(k){ PLACED[k] = d.placed[k]; }); },
    after: function(){ restore(); },
    count: function(d){ return Object.keys(((d || {}).store) || {}).length; },
    answers: function(d){ var p = (d && d.store) || {}, out = {}; Object.keys(p).forEach(function(k){ if(/#result$/.test(k)) out['Test ' + k.replace(/#/g, ' / ')] = p[k].score + ' / ' + p[k].total + ' (' + p[k].pct + ' %)'; else if(p[k] !== '') out['Test ' + k.replace(/#/g, ' / ')] = String(p[k]); }); return out; }
  }));
}
if(window.speechSynthesis) speechSynthesis.onvoiceschanged = function(){};
init();
})();
