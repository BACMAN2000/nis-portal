<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan de las once semanas · NIS</title>
<link rel="icon" href="assets/favicon.svg">
<link href="vendor/fonts/montserrat-68a53b.css" rel="stylesheet">
<!--
  La hoja que se lleva a la mesa.

  project.html es para el alumno y para navegar. Esto es para la reunión: el
  plan del trimestre entero en papel, con las once semanas y lo que hace cada
  curso en cada una. Dos vistas:

    · MATRIZ  — semana × curso, en horizontal. Es la vista de coordinación:
                de un vistazo se ve si un curso se queda fuera tres semanas
                seguidas, que es justo lo que hay que discutir.
    · POR CURSO — una hoja por profesor, con sus once semanas y nada más.
                Es lo que cada uno se lleva.

  Sirve para los arcos de primaria (?arc=g1.t3) y para los de once semanas de
  secundaria (?arco11=g9.t2). El contenido no se duplica: se lee de los
  mismos archivos que usa el portal.
-->
<style>
:root{ --tinta:#1f2937; --gris:#6b7280; --linea:#d7dce5; --azul:#244c77;
  --prop:#FFFBEB; --propB:#FDE68A; --propT:#92400E; }
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Montserrat',system-ui,Segoe UI,sans-serif;color:var(--tinta);background:#eef1f6;line-height:1.4;font-size:13px}
header{background:var(--azul);color:#fff;padding:11px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header img{height:28px}
header .sp{flex:1}
header a,header button{background:rgba(255,255,255,.18);color:#fff;border:none;padding:7px 13px;border-radius:9px;
  font:inherit;font-size:.85rem;font-weight:600;text-decoration:none;cursor:pointer}
header a:hover,header button:hover{background:rgba(255,255,255,.3)}
header button.on{background:#fff;color:var(--azul)}
select{font:inherit;padding:6px 10px;border-radius:8px;border:1px solid var(--linea);max-width:260px}
.wrap{max-width:1500px;margin:0 auto;padding:16px 14px 60px}
.cab{background:#fff;border:1px solid var(--linea);border-radius:10px;padding:18px 22px;margin-bottom:16px}
.cab h1{margin:0 0 4px;font-size:1.4rem;color:var(--azul)}
.cab .meta{font-size:.85rem;color:var(--gris);margin:0 0 8px}
.cab .q{font-style:italic;color:var(--azul);margin:0 0 10px;font-size:1rem}
.cab p{margin:0 0 8px;font-size:.9rem}
.aviso{background:var(--prop);border:1px solid var(--propB);border-radius:8px;padding:10px 13px;font-size:.85rem;color:var(--propT)}
table{width:100%;border-collapse:collapse;font-size:.76rem;background:#fff}
th,td{border:1px solid var(--linea);padding:6px 7px;vertical-align:top;text-align:left}
th{background:#eef4fb;color:var(--azul);font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0}
td.sem{background:#fafbfd;font-weight:700;color:var(--azul);width:104px}
td.sem small{display:block;font-weight:400;color:var(--gris);font-size:.92em;text-transform:none;letter-spacing:0}
td.hito{background:#F8FAFC;font-size:.72rem;color:var(--gris);width:120px}
.matriz{overflow-x:auto;border-radius:10px;border:1px solid var(--linea)}
.curso-hoja{background:#fff;border:1px solid var(--linea);border-radius:10px;padding:18px 22px;margin-bottom:16px}
.curso-hoja h2{margin:0 0 2px;font-size:1.15rem;color:var(--azul)}
.curso-hoja .sub{font-size:.82rem;color:var(--gris);margin:0 0 12px}
.curso-hoja table{font-size:.82rem}
.prod{background:#fff;border:1px solid var(--linea);border-radius:10px;padding:18px 22px;margin-bottom:16px}
.prod h2{margin:0 0 8px;font-size:1.05rem;color:var(--azul)}
.prod .integra{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:9px;margin-top:10px}
.prod .integra div{border:1px solid var(--propB);background:var(--prop);border-radius:8px;padding:8px 11px;font-size:.8rem}
.prod .integra b{display:block;color:var(--propT);margin-bottom:2px}
.dp{color:#15803D;font-size:.9em}
td.nota{background:#FFFBEB;border-left:3px solid #F59E0B;color:#92400E;font-size:.7rem;font-style:italic}
.leyenda{font-size:.78rem;color:var(--gris);margin:0 0 10px}
.oculto{display:none}
@media print{
  @page{size:A4 landscape;margin:9mm}
  body{background:#fff;font-size:8.5px}
  header,.noprint{display:none!important}
  .wrap{max-width:none;padding:0}
  .cab,.prod,.curso-hoja{border:none;border-radius:0;padding:0 0 8px;margin:0 0 10px}
  .matriz{border:none;overflow:visible}
  table{font-size:7.4px}
  th,td{padding:3px 4px}
  th{position:static}
  .curso-hoja{page-break-inside:avoid}
  .modo-curso .curso-hoja{page-break-after:always}
  .modo-curso .curso-hoja:last-child{page-break-after:auto}
}
</style>
</head>
<body>
<header>
  <img src="assets/logo-white-h.svg" alt="Nordic International School" onerror="this.style.display='none'">
  <select id="sel" aria-label="Proyecto"></select>
  <button type="button" id="bMatriz" class="on">Matriz</button>
  <button type="button" id="bCurso">Por curso</button>
  <div class="sp"></div>
  <button type="button" id="print">&#128424; Imprimir</button>
  <a id="back" href="project.html">&#8592; Volver</a>
</header>

<div class="wrap" id="app"><p>Cargando…</p></div>

<script src="project-arcs.js?v=11"></script>
<script src="project-cursos.js?v=3"></script>
<script src="project-arcs-sec11.js?v=2"></script>
<script>
const $ = q => document.querySelector(q);
const P = new URLSearchParams(location.search);

const AREA_NOMBRE = {
  science:'Science', social:'Social Studies', math:'Math', english:'English',
  comunicacion:'Comunicación', tutoria:'Tutoría', pe:'PE', art:'Art', music:'Music',
  drama:'Drama', spiritual:'Spiritual History', ccss:'Ciencias Sociales', com:'Comunicación',
  mat:'Matemática', cyt:'Ciencia y Tecnología', arte:'Arte y Cultura', ict:'ICT', ing:'Inglés',
  sh:'Spiritual History', fr:'Français', fil:'Philosophy', ent:'Enterprise'
};
const AREA_ICONO = {
  science:'🔬', social:'🌎', math:'🔢', english:'🗣️', comunicacion:'📖', tutoria:'🤝',
  pe:'⚽', art:'🎨', music:'🎵', drama:'🎭', spiritual:'🕊️',
  ccss:'🌎', com:'📖', mat:'🔢', cyt:'🔬', arte:'🎨', ict:'💻', ing:'🗣️',
  sh:'🕊️', fr:'🇫🇷', fil:'💭', ent:'📈'
};
/* Orden de lectura: primero las que casi siempre están, después el resto. */
const ORDEN = ['comunicacion','com','math','mat','science','cyt','social','ccss','english','ing',
  'art','arte','music','ict','ent','pe','tutoria','spiritual','sh','fil','fr','drama'];

function esc(s){ return String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
/* Este documento es de trabajo y va en castellano, que es la lengua de la reunión. */
const es = v => (v == null) ? '' : (typeof v === 'string' ? v : (v.es || v.en || ''));

/* Los dos tipos de arco se leen distinto pero se pintan igual: esto los
   normaliza a una sola forma {titulo, semanas:[{n,etiqueta,hito,cursos}]}. */
function normaliza(){
  const out = [];
  const A = window.PROJECT_ARCS || {}, C = window.PROJECT_ARCS_CURSOS || {};
  Object.keys(A).forEach(k => {
    const a = A[k];
    const semanas = a.fases.map(f => ({
      n: f.n,
      etiqueta: 'P' + f.periodo + ' W' + f.semana,
      foco: es(f.foco),
      hito: es(f.evidencia),
      cursos: f.cursos || (C[k] || {})[f.n] || null
    }));
    out.push({clave:'arc=' + k, tipo:'primaria', grado:a.label, orden:[0, Number(String(a.grade).replace('g','')), a.trimestre],
      titulo: es(a.titulo), sub: es(a.subtitulo), pregunta: es(a.preguntaEsencial),
      situacion: es(a.situacion), fechas: (a.inicio || '') + ' → ' + (a.fin || ''),
      periodos: 'P' + (a.periodos || []).join(' + P'), propuesta: !!a.propuesta,
      producto: {titulo: es(a.producto.titulo), desc: es(a.producto.descripcion),
                 incluye: (a.producto.incluye || []).map(es), integra: null},
      evaluacion: (a.evaluacion || []).map(c => ({dim: es(c.criterio), areas: '', desc: es(c.descriptor)})),
      revisar: (a.revisar || []).map(es), semanas: semanas});
  });
  const S = window.PROJECT_SEC11 || {};
  Object.keys(S).forEach(k => {
    const p = S[k];
    out.push({clave:'arco11=' + k, tipo:'secundaria', grado:(p.grado + '.º'), orden:[1, p.grado, p.trimestre],
      titulo: es(p.titulo), sub:'', pregunta: es(p.preguntaEsencial), situacion: p.situacion,
      fechas: p.meses, periodos: 'U' + (p.unidades || []).join(' + U'), propuesta: true,
      producto: {titulo: es(p.producto.titulo), desc: es(p.producto.descripcion),
                 incluye: (p.producto.incluye || []).map(es), integra: p.producto.integra || []},
      evaluacion: (p.evaluacion || []).map(e => ({dim: e.dimension, areas: e.areas, desc: e.descriptor})),
      revisar: p.revisar || [],
      semanas: p.semanas.map(w => ({n: w.n, etiqueta: 'U' + w.unidad,
        foco: es(w.foco), hito: es(w.hito), cursos: w.cursos || null, nota: w.nota || ''}))});
  });
  out.sort((a, b) => a.orden[0] - b.orden[0] || a.orden[1] - b.orden[1] || a.orden[2] - b.orden[2]);
  return out;
}

const TODOS = normaliza();
let modo = 'matriz';

function cursosDe(a){
  const set = {};
  a.semanas.forEach(s => Object.keys(s.cursos || {}).forEach(c => { set[c] = 1; }));
  const ks = Object.keys(set);
  return ORDEN.filter(x => ks.indexOf(x) >= 0).concat(ks.filter(x => ORDEN.indexOf(x) < 0));
}

function cabecera(a){
  return `<div class="cab">
    <h1>${esc(a.titulo)}</h1>
    <p class="meta">${esc(a.grado)} &middot; ${esc(a.periodos)} &middot; ${a.semanas.length} semanas
      &middot; ${esc(a.fechas)}</p>
    <p class="q">${esc(a.pregunta)}</p>
    <p>${esc(a.situacion)}</p>
    ${a.propuesta ? `<div class="aviso"><b>Propuesta del portal.</b> El contenido de cada curso sale
      del plan del colegio; el reparto por semana y la redacción son propuesta, para acordar con cada
      profesor y con coordinación.</div>` : ''}
  </div>`;
}

function producto(a){
  return `<div class="prod">
    <h2>Producto final &middot; ${esc(a.producto.titulo)}</h2>
    <p style="margin:0 0 6px;font-size:.88rem">${esc(a.producto.desc)}</p>
    <ul style="margin:.2em 0;padding-left:1.15em;font-size:.85rem">
      ${a.producto.incluye.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
    ${(a.producto.integra || []).length ? `<h2 style="margin-top:14px">Qué aporta cada curso
      <span style="font-weight:400;font-size:.8rem;color:var(--gris)">— quita uno y el producto queda incompleto</span></h2>
      <div class="integra">${a.producto.integra.map(x =>
        `<div><b>${AREA_ICONO[x[0]] || ''} ${esc(AREA_NOMBRE[x[0]] || x[0])}</b>${esc(x[1])}</div>`).join('')}</div>` : ''}
  </div>`;
}

/* Una linea que empieza por "Del plan:" (Annual Plan o documento de
   conexiones) o por "Del Scope:" (Scope & Sequence de ingles) es contenido
   del colegio; el resto es propuesta. En papel se distingue con un punto
   verde delante, que es lo minimo que se ve en blanco y negro sin dejar de
   verse. */
const RE_FUENTE = /^Del (plan|Scope|documento)([ ]*\([^)]*\))?:[ ]*/;
function celda(txt){
  const t = String(txt || '');
  const m = t.match(RE_FUENTE);
  if(!m) return esc(t);
  const cuerpo = (m[2] ? m[2].trim() + ' ' : '') + t.slice(m[0].length);
  return '<span class="dp" title="contenido del colegio">&#9679;</span> ' + esc(cuerpo);
}

/* La nota de procedencia solo se imprime cuando cambia: si no, la misma
   advertencia sale cinco veces seguidas y deja de leerse. */
function filaNota(s, prev, cols){
  if(!s.nota || s.nota === prev) return '';
  return `<tr><td class="nota" colspan="${cols}">${esc(s.nota)}</td></tr>`;
}

function matriz(a){
  const cs = cursosDe(a);
  if(!cs.length) return `<div class="prod"><p>Este proyecto todavía no tiene el detalle por curso.</p></div>`;
  let h = `<div class="matriz"><table><tr><th>Semana</th><th>Hito</th>
    ${cs.map(c => `<th>${AREA_ICONO[c] || ''} ${esc(AREA_NOMBRE[c] || c)}</th>`).join('')}</tr>`;
  let prev = '';
  a.semanas.forEach(s => {
    h += filaNota(s, prev, cs.length + 2);
    prev = s.nota || prev;
    h += `<tr><td class="sem">W${s.n}<small>${esc(s.etiqueta)}</small><small>${esc(s.foco)}</small></td>
      <td class="hito">${esc(s.hito)}</td>
      ${cs.map(c => `<td>${celda((s.cursos || {})[c])}</td>`).join('')}</tr>`;
  });
  return h + `</table></div>`;
}

function porCurso(a){
  const cs = cursosDe(a);
  if(!cs.length) return `<div class="prod"><p>Este proyecto todavía no tiene el detalle por curso.</p></div>`;
  return cs.map(c => {
    let prev = '';
    const filas = a.semanas.filter(s => (s.cursos || {})[c]).map(s => {
      const nota = filaNota(s, prev, 3);
      prev = s.nota || prev;
      return nota + `<tr><td class="sem">W${s.n}<small>${esc(s.etiqueta)}</small></td>
        <td class="hito">${esc(s.hito)}</td><td>${celda(s.cursos[c])}</td></tr>`;
    }).join('');
    const n = a.semanas.filter(s => (s.cursos || {})[c]).length;
    return `<div class="curso-hoja">
      <h2>${AREA_ICONO[c] || ''} ${esc(AREA_NOMBRE[c] || c)}</h2>
      <p class="sub">${esc(a.titulo)} &middot; ${esc(a.grado)} &middot; ${n} de ${a.semanas.length} semanas</p>
      <table><tr><th style="width:104px">Semana</th><th style="width:130px">Hito de la semana</th>
        <th>Lo que hace este curso</th></tr>${filas}</table></div>`;
  }).join('');
}

function evaluacion(a){
  if(!a.evaluacion.length) return '';
  return `<div class="prod"><h2>Evaluación</h2>
    <table><tr><th style="width:26%">Criterio</th>${a.evaluacion[0].areas ? '<th style="width:12%">Áreas</th>' : ''}
      <th>Qué se mira</th></tr>
    ${a.evaluacion.map(e => `<tr><td class="sem" style="width:auto">${esc(e.dim)}</td>
      ${e.areas ? `<td class="hito" style="width:auto">${esc(e.areas)}</td>` : ''}
      <td>${esc(e.desc)}</td></tr>`).join('')}</table>
    ${a.revisar.length ? `<h2 style="margin-top:14px">Para decidir en la reunión</h2>
      <ul style="margin:.2em 0;padding-left:1.15em;font-size:.85rem">
      ${a.revisar.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}</div>`;
}

function pinta(){
  const clave = P.get('arc') ? 'arc=' + P.get('arc')
              : P.get('arco11') ? 'arco11=' + P.get('arco11') : (TODOS[0] || {}).clave;
  const a = TODOS.find(x => x.clave === clave) || TODOS[0];
  if(!a){ $('#app').innerHTML = '<p>No hay proyectos cargados.</p>'; return; }

  $('#sel').innerHTML = TODOS.map(x =>
    `<option value="${x.clave}"${x.clave === a.clave ? ' selected' : ''}>${esc(x.grado)} — ${esc(x.titulo)}</option>`).join('');
  $('#back').href = 'project.html?' + a.clave;
  document.body.className = modo === 'curso' ? 'modo-curso' : 'modo-matriz';
  $('#bMatriz').className = modo === 'matriz' ? 'on' : '';
  $('#bCurso').className = modo === 'curso' ? 'on' : '';

  const leyenda = `<p class="leyenda"><span class="dp">&#9679;</span> lo que el plan anual del
    colegio da esa semana &nbsp;·&nbsp; sin punto: propuesta del portal, para acordar con el profesor</p>`;
  $('#app').innerHTML = cabecera(a) + producto(a) + leyenda +
    (modo === 'matriz' ? matriz(a) + evaluacion(a) : porCurso(a));
  document.title = a.titulo + ' · plan de ' + a.semanas.length + ' semanas · NIS';
}

$('#sel').addEventListener('change', function(){ location.search = '?' + this.value; });
$('#bMatriz').addEventListener('click', () => { modo = 'matriz'; pinta(); });
$('#bCurso').addEventListener('click', () => { modo = 'curso'; pinta(); });
$('#print').addEventListener('click', () => window.print());
pinta();
</script>
</body>
</html>
