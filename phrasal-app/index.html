<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phrasal Verbs · Nordic International School</title>
<link rel="icon" href="../favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../lexapp.css?v=bf8f5e87">
<script>try{var t=localStorage.getItem("nis-tema");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="stylesheet" href="../nis-tokens.css?v=36174a4f">
<style>
.embed header{display:none}
/* Embebida, el iframe se ajusta al contenido: los 70px de respiro del final
   se convertirían en franja vacía dentro del portal. */
.embed .wrap{padding-top:16px;padding-bottom:18px}
</style>
</head>
<body>
<script>if(new URLSearchParams(location.search).get("embed")==="1")document.documentElement.classList.add("embed");</script>
<header>
  <div class="wrap">
    <div class="crumb"><a href="../index.html">Portal</a> › Phrasal verbs</div>
    <h1>Phrasal Verbs</h1>
    <div class="sub">Los verbos compuestos que de verdad aparecen en nuestros cursos, nivel por nivel.</div>
  </div>
</header>

<div class="wrap">
  <div class="levels" id="levels"></div>
  <div class="tabs" role="tablist">
    <button class="tab" id="tab-learn" role="tab" aria-selected="true" onclick="setTab('learn')">Aprender</button>
    <button class="tab" id="tab-practice" role="tab" aria-selected="false" onclick="setTab('practice')">Practicar</button>
    <button class="tab" id="tab-games" role="tab" aria-selected="false" onclick="setTab('games')">Juegos</button>
    <button class="tab" id="tab-progress" role="tab" aria-selected="false" onclick="setTab('progress')">Mi progreso</button>
  </div>
  <div id="view"><div class="empty">Cargando…</div></div>
</div>

<script>
/* Lo único propio de esta app: qué claves trae su data.json y cómo se nombra lo
   que enseña. El motor está en ../js/lexapp.js, compartido con las otras dos. */
var APP = {
  store:'coh_phrasal', list:'verbs', id:'pv', audio:'phrasal', datav:1,
  uno:'phrasal verb', varios:'phrasal verbs',
  elMejor:'el mejor', deLos:'de los',
  extra:', forma de pasado y separable o no',
  badges: function(d){
    return '<span class="badge ' + (d.sep === 'separable' ? 'sep">separable' : 'insep">inseparable') + '</span>' +
      (d.freq ? '<span class="badge">' + d.freq + ' veces en el curso</span>' : '');
  }
};
</script>
<script src="../lexapp.js?v=7c37370b"></script>
<script src="../nis-tema.js?v=a9738cd9" defer></script>
</body>
</html>
