<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta name="google" content="notranslate">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YLE Word Trainer · Nordic International School</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preload" href="fonts/GothamBook.woff2" as="font" type="font/woff2" crossorigin>
<script>try{var t=localStorage.getItem("nis-tema");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="stylesheet" href="brand.css?v=6345244b">
<link rel="stylesheet" href="nis-tokens.css?v=b3bffd5c">
<style>
/* =========================================================================
   Entrenador de vocabulario YLE (Ruta YLE 2026, Fase 3).
   Las palabras de la lista oficial 2025 que no salen en Fun for Nordic, con
   dibujo, audio y frase de ejemplo: yle/vocab/<level>.json. Cuatro modos:
   Learn (tarjetas), Pick the picture, Spell it y Listen & type. El progreso
   por palabra va a la cuenta (yle_vocab_progress) en NIS y al navegador en
   Cohasset; una palabra está «dominada» con tres aciertos.
   ========================================================================= */
:root{--navy:#0d1d33;--blue:#1e3a8a;--sky:#eef3fb;--border:#d9deea;--ok:#2f8f5b;--bad:#b53a3a;--st:#e08a2a;--mv:#238f85;--fl:#6a54c9;--gold:#d29a1f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Gotham','Segoe UI',system-ui,sans-serif}
header.top{background:var(--navy);color:var(--card);padding:10px 18px 10px 118px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header.top img{height:36px}
header.top h1{margin:0;font-size:1.15rem}
header.top .sub{font-size:.8rem;opacity:.8}
header.top .right{margin-left:auto;display:flex;gap:10px;align-items:center}
.lv{border-radius:999px;padding:4px 12px;font-weight:700;font-size:.85rem;background:var(--card);color:var(--navy)}
.lv.starters{background:var(--st);color:var(--card)}.lv.movers{background:var(--mv);color:var(--card)}.lv.flyers{background:var(--fl);color:var(--card)}
.wrap{display:grid;grid-template-columns:250px 1fr;gap:18px;max-width:1180px;margin:18px auto;padding:0 16px}
aside{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;align-self:start;position:sticky;top:12px}
aside h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px}
/* Cuanto de la lista oficial se entrena aqui y cuanto lo da ya el curso. Es la
   pregunta que hace el profesor y antes la pagina no la contestaba. */
.cover{margin:14px 0 0;padding-top:10px;border-top:1px solid var(--border);font-size:.74rem;line-height:1.5;color:var(--muted)}
.cover b{color:var(--ink)}
.tbtn{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;border:1.5px solid var(--border);background:var(--card);border-radius:10px;padding:8px 10px;margin:0 0 6px;font:inherit;font-size:.9rem;cursor:pointer}
.tbtn.on{border-color:var(--blue);background:var(--sky)}
.tbtn small{color:var(--muted);font-size:.75rem;white-space:nowrap}
.tbtn .done{color:var(--ok);font-weight:700}
main{min-width:0}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.card h3{margin:0 0 8px;font-size:1.05rem}
.btn{border:0;background:var(--blue);color:var(--card);border-radius:10px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer}
.btn.sec{background:var(--card);color:var(--blue);border:1.5px solid var(--blue)}
.btn.ok{background:var(--ok)} .btn:disabled{opacity:.5;cursor:default}
.small{font-size:.82rem;color:var(--muted)}
.modes{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.modes button{border:1.5px solid var(--border);background:var(--card);border-radius:999px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer}
.modes button.on{border-color:var(--blue);background:var(--sky)}
.bar{height:12px;background:var(--line);border-radius:999px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#f3c766);border-radius:999px;transition:width .4s}
.stars{font-size:1.3rem;letter-spacing:2px}
.flash{text-align:center;padding:10px 0}
.flash .pic{height:170px;display:flex;align-items:center;justify-content:center}
.flash .pic img{max-height:160px}
.flash .emoji{font-size:120px;line-height:1}
.flash .ipa .reg{font:600 .62rem system-ui;background:var(--line);color:var(--ink);border-radius:99px;padding:1px 6px;vertical-align:2px;margin-right:4px}
.ipa{font-family:ui-monospace,Consolas,monospace;color:var(--muted);font-size:1.05rem;margin:2px 0 6px}
.word{font-size:2rem;font-weight:800;margin:6px 0 2px}
.flash .ex{font-size:1.1rem;margin:8px auto;max-width:560px}
.flash .ex b{color:var(--blue)}
.flash .es{color:var(--muted);font-style:italic}
.spk{border:1.5px solid var(--border);background:var(--card);border-radius:999px;padding:6px 12px;font:inherit;cursor:pointer;margin:2px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:12px 0}
.opt{border:2px solid var(--border);border-radius:14px;background:var(--card);padding:12px 6px;text-align:center;cursor:pointer;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font:inherit}
.opt img{max-height:96px}.opt .emoji{font-size:72px;line-height:1}
.opt.ok{border-color:var(--ok);background:var(--line)}.opt.bad{border-color:var(--bad);background:#f8e1e1}
.opt:disabled{cursor:default}
.tiles{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.tile{width:44px;height:48px;border:2px solid var(--border);border-radius:10px;background:var(--card);font:inherit;font-size:1.3rem;font-weight:800;cursor:pointer;text-transform:lowercase}
.tile:disabled{opacity:.25;cursor:default}
.answer{min-height:52px;border:2px dashed var(--border);border-radius:12px;display:flex;gap:6px;align-items:center;justify-content:center;padding:6px;font-size:1.5rem;font-weight:800;letter-spacing:2px;margin:8px auto;max-width:560px}
.answer.ok{border-color:var(--ok);background:var(--line)}.answer.bad{border-color:var(--bad);background:#f8e1e1}
.answer .gap{width:14px}
input.typed{font:inherit;font-size:1.4rem;font-weight:700;border:2px solid var(--border);border-radius:12px;padding:10px 14px;width:100%;max-width:420px;text-align:center}
input.typed.ok{border-color:var(--ok);background:var(--line)}input.typed.bad{border-color:var(--bad);background:#f8e1e1}
.round{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--muted)}
.fb{min-height:28px;font-weight:700;margin-top:6px}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.result{text-align:center;padding:16px}
.result .big{font-size:2.4rem;font-weight:800}
.hidden{display:none!important}
.wpic{object-fit:contain}
/* Recordar: tarjeta que se voltea */
.flipcard{width:220px;max-width:100%;height:210px;margin:6px auto;cursor:pointer;perspective:900px}
.fc-in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flipcard.flip .fc-in{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2px solid var(--border);border-radius:16px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px}
.fc-face .pic{height:150px;display:flex;align-items:center;justify-content:center}
.fc-face .pic img{max-height:140px}.fc-face .emoji{font-size:110px;line-height:1}
.fc-back{transform:rotateY(180deg);background:var(--sky)}
/* Memory game */
.memgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px auto;max-width:520px}
.memcard{aspect-ratio:1;border:2px solid var(--border);border-radius:12px;background:var(--card);display:flex;align-items:center;justify-content:center;padding:4px;cursor:pointer;font:inherit}
.memcard .memback{font-size:1.8rem;color:var(--muted);font-weight:800}
.memcard.up{border-color:var(--blue);background:var(--sky)}
.memcard.done{border-color:var(--ok);background:var(--line);opacity:.65}
.memcard img{max-height:84px;max-width:100%;object-fit:contain}.memcard .emoji{font-size:52px;line-height:1}
.memword{font-weight:800;font-size:.95rem;text-align:center;word-break:break-word;padding:0 2px}
@media (max-width:520px){.memgrid{grid-template-columns:repeat(3,1fr)}.memcard .memword{font-size:.8rem}}
@media (max-width:820px){.wrap{grid-template-columns:1fr}aside{position:static}}
</style>
</head>
<body>
<header class="top">
  <img src="assets/logo-white-h.svg" alt="" onerror="this.remove()">
  <div><h1>YLE Word Trainer</h1><div class="sub" id="hSub">Cambridge Young Learners · the 2025 word list</div></div>
  <div class="right"><span class="lv" id="hLv">Starters</span><a id="backTests" href="yle-practice.html" class="btn sec" style="text-decoration:none">◀ Practice tests</a></div>
</header>
<div class="wrap">
  <aside>
    <h2>Words</h2>
    <div id="scope"></div>
    <h2 style="margin-top:14px">Topics</h2>
    <div id="themes"></div>
    <h2 style="margin-top:14px">Level</h2>
    <div id="levels"></div>
    <p class="cover" id="cover"></p>
  </aside>
  <main>
    <div class="card" id="top"></div>
    <div id="content"></div>
  </main>
</div>

<!-- NIS-ONLY -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="config.js?v=720edc7d"></script>
<script src="nis-nav.js?v=c6e39903"></script>
<!-- /NIS-ONLY -->
<script src="yle-media.js?v=8e201b2b"></script>
<script src="yle-words.js?v=a291b740"></script>
<script src="yle/fluent3d.js?v=fa6d9e1d"></script>
<script>
(function(){
'use strict';
var $ = function(s, r){ return (r || document).querySelector(s); };
var $$ = function(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
var esc = function(s){ return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); };
var norm = function(s){ return String(s == null ? '' : s).trim().toLowerCase().replace(/[.,;:!?'"’()]/g, '').replace(/\s+/g, ' '); };
var ART = window.YLE_ART || {};
/* Ilustraciones por palabra (yle-img/words/<slug>.jpg, servidas por el backend
   via YM). La lista de las que existen viene de yle-words.js (estatico de raiz);
   ver [[yle-word-illustrations]]. Si la palabra no tiene dibujo, cae al emoji. */
var WORD_IMG = 'yle-img/words/';
var WORDS_HAVE = window.YLE_WORDS_HAVE || {};
var wslug = function(w){ return String(w == null ? '' : w).toLowerCase().replace(/^(a|an|the)\s+/, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, ''); };
function hasIll(w){ return !!WORDS_HAVE[wslug(w.k)]; }
var qs = new URLSearchParams(location.search);
var LEVEL = ['starters', 'movers', 'flyers'].indexOf(qs.get('level')) >= 0 ? qs.get('level') : 'starters';
var NAMES = {starters: 'Pre A1 Starters', movers: 'A1 Movers', flyers: 'A2 Flyers'};
var AUD = 'yle-audio/vocab/' + LEVEL + '/';
var MODES = [['learn', '📖 Learn'], ['recall', '🃏 Flip & recall'], ['pick', '🖼️ Pick the picture'], ['spell', '🔤 Spell it'], ['listen', '🎧 Listen & type'], ['memory', '🧩 Memory game']];
/* Desde el 8-sep-2026 el entrenador trae la lista oficial entera, tambien lo que
   ya se ve en clase (viene marcado con "c"). Aqui el alumno elige: todo, solo lo
   que no ha dado en Fun for Nordic, o solo el repaso de lo que si. */
var SCOPES = [['all', '⭐ All words'], ['new', '✨ New for you'], ['course', '🏫 Also in class']];
var scope = ['all', 'new', 'course'].indexOf(qs.get('words')) >= 0 ? qs.get('words') : 'all';
function scoped(){ return scope === 'all' ? WORDS : WORDS.filter(function(w){ return scope === 'course' ? !!w.c : !w.c; }); }
var DATA = null, WORDS = [], THEMES = {};
var theme = qs.get('topic') || 'all', mode = ['learn', 'recall', 'pick', 'spell', 'listen', 'memory'].indexOf(qs.get('mode')) >= 0 ? qs.get('mode') : 'learn';
var PROG = {};                         // clave -> {ok, seen}
var MASTER = 3;                        // aciertos para «dominada»
var sb = null, USER = null;
var game = null;                       // estado de la ronda en curso
var t0 = Date.now();

function client(){ if(sb) return sb; if(!window.supabase || !window.NIS_CONFIG) return null; sb = supabase.createClient(NIS_CONFIG.SUPABASE_URL, NIS_CONFIG.SUPABASE_KEY); return sb; }
function json(u){ return fetch(u, {cache: 'no-cache'}).then(function(r){ if(!r.ok) throw new Error(u); return r.json(); }); }
function shuffle(a){ a = a.slice(); for(var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function emojiOf(w){ return w.e || (ART.wordEmoji ? ART.wordEmoji(w.k) : null); }
function emojiPic(w, size){ var e = emojiOf(w); if(!e) return '<span class="emoji" style="font-size:' + Math.round(size * .7) + 'px">🔤</span>'; return ART.pic3d ? ART.pic3d(e, size).replace(' loading="lazy"', '') : '<span class="emoji" style="font-size:' + Math.round(size * .8) + 'px">' + e + '</span>'; }
function picOf(w, size){
  var sl = wslug(w.k);
  if(!WORDS_HAVE[sl]) return emojiPic(w, size);
  var fb = emojiPic(w, size).replace(/"/g, '&quot;');
  return '<img class="wpic" src="' + YM(WORD_IMG + sl + '.jpg') + '" width="' + size + '" height="' + size + '" alt="' + esc(w.w) + '" style="object-fit:contain;max-height:' + size + 'px" data-fb="' + fb + '" onerror="var d=document.createElement(\'span\');d.innerHTML=this.getAttribute(\'data-fb\');this.replaceWith(d.firstChild||d);">';
}
function hasPic(w){ return w.p !== false && (hasIll(w) || !!emojiOf(w)); }
function prog(w){ return PROG[w.k] || {ok: 0, seen: 0}; }
function mastered(w){ return prog(w).ok >= MASTER; }
function pool(){ var ws = scoped(); return theme === 'all' ? ws : ws.filter(function(w){ return w.t === theme; }); }
function boldWord(ex, w){ var base = w.w.split(' (')[0].split(' / ')[0]; var re = new RegExp('(' + base.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/s$/, '') + '\\w*)', 'i'); return esc(ex).replace(re, '<b>$1</b>'); }

/* ---------- audio: mp3 propio, y si no carga, la voz del navegador ---------- */
var cur = null;
function play(w, ex){
  if(cur){ try { cur.pause(); } catch(e){} }
  var a = new Audio(YM(AUD + w.s + (ex ? '_ex' : '') + '.mp3')); cur = a;   /* voz Libby con el ritmo por nivel (5-sep-2026); lo sirve el backend */
  a.onerror = function(){
    /* Si falta el mp3 del entrenador se prueba el del lexico, que cubre 8.647
       palabras; la voz del navegador queda como ultimo recurso. */
    var base = w.w.split(' (')[0].split(' / ')[0].toLowerCase().trim();
    var f = base.replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    if(!ex && f && base === f){
      var b = new Audio('lexicon-audio/uk/' + f + '.mp3'); cur = b;
      b.onerror = function(){ speak(base); };
      b.play().catch(function(){ speak(base); });
      return;
    }
    speak(ex ? w.ex : base);
  };
  a.play().catch(function(){ speak(ex ? w.ex : w.w); });
}
function speak(t){ try { var u = new SpeechSynthesisUtterance(t); u.lang = 'en-GB'; u.rate = .85; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch(e){} }

/* ---------- progreso: navegador siempre; cuenta del alumno en NIS ---------- */
function loadLocal(){ try { PROG = JSON.parse(localStorage.getItem('yle_vocab_' + LEVEL) || '{}') || {}; } catch(e){ PROG = {}; } }
function saveLocal(){ try { localStorage.setItem('yle_vocab_' + LEVEL, JSON.stringify(PROG)); } catch(e){} }
function loadAccount(){
  var c = client(); if(!c) return Promise.resolve();
  return c.auth.getUser().then(function(u){ USER = u && u.data && u.data.user; if(!USER) return;
    return c.from('yle_vocab_progress').select('word, ok, seen').eq('student_id', USER.id).eq('level', LEVEL).then(function(r){
      (r.data || []).forEach(function(row){ var p = PROG[row.word] || {ok: 0, seen: 0}; PROG[row.word] = {ok: Math.max(p.ok, row.ok), seen: Math.max(p.seen, row.seen)}; });
      saveLocal();
    });
  }).catch(function(){});
}
var pendUp = {};
function bump(w, correct){
  var p = PROG[w.k] || {ok: 0, seen: 0}; p.seen++; if(correct) p.ok++; PROG[w.k] = p; saveLocal(); paintThemes(); paintTop();
  if(USER && sb){ pendUp[w.k] = p; clearTimeout(bump._t); bump._t = setTimeout(flush, 800); }
}
function flush(){
  var rows = Object.keys(pendUp).map(function(k){ return {student_id: USER.id, level: LEVEL, word: k, ok: pendUp[k].ok, seen: pendUp[k].seen, updated_at: new Date().toISOString()}; });
  pendUp = {}; if(!rows.length) return;
  sb.from('yle_vocab_progress').upsert(rows, {onConflict: 'student_id,level,word'}).then(function(r){ if(r.error) console.warn(r.error.message); });
}
function saveRound(modeKey, score, total){
  if(!USER || !sb) return;
  var label = MODES.filter(function(m){ return m[0] === modeKey; })[0][1].replace(/^\S+\s/, '');
  sb.from('activity_attempts').insert({student_id: USER.id, activity: 'yle-vocab:' + LEVEL + ':' + modeKey, title: 'YLE Word Trainer · ' + NAMES[LEVEL] + ' · ' + label, level: LEVEL, score: score, total: total, duration_sec: Math.min(32000, Math.round((Date.now() - t0) / 1000)), submitted_at: new Date().toISOString()}).then(function(r){ if(r.error) console.warn(r.error.message); t0 = Date.now(); });
}

/* Lo que cubre el entrenador. Antes la cabecera decia «the 2025 word list» y
   entrenaba una cuarta parte: las palabras que el curso ya ensena no estaban
   aqui, y nada lo explicaba. Desde el 8-sep-2026 estan todas, y lo que se dice
   es la lista entera; el curso queda como el dato de cuantas se repasan. */
function paintCover(){
  var c = DATA.cover; if(!c) return;
  $('#hSub').textContent = 'Cambridge Young Learners · ' + NAMES[LEVEL] + ' · ' + c.official + ' words of the 2025 list';
  $('#cover').innerHTML = 'The whole <b>' + c.official + '</b>-word 2025 list for ' + NAMES[LEVEL] +
    ' \u00b7 <b>' + c.course + '</b> of them you also study in Fun for Nordic.';
}

/* ---------- pantalla ---------- */
function init(){
  $('#hSub').textContent = 'Cambridge Young Learners · ' + NAMES[LEVEL] + ' · the 2025 word list';   /* la cifra exacta la pone paintCover() al cargar los datos */
  $('#hLv').textContent = LEVEL.charAt(0).toUpperCase() + LEVEL.slice(1); $('#hLv').className = 'lv ' + LEVEL;
  $('#backTests').href = 'yle-practice.html?level=' + LEVEL;
  $('#levels').innerHTML = ['starters', 'movers', 'flyers'].map(function(l){ return '<a class="tbtn' + (l === LEVEL ? ' on' : '') + '" href="?level=' + l + '" style="text-decoration:none;color:inherit"><b>' + NAMES[l] + '</b></a>'; }).join('');
  loadLocal();
  json('yle/vocab/' + LEVEL + '.json').then(function(d){
    DATA = d; WORDS = d.words; THEMES = d.themes;
    if(theme !== 'all' && !THEMES[theme]) theme = 'all';
    paintCover();
    paintScope();
    return loadAccount();
  }).then(function(){ paintThemes(); paintTop(); render(); })
  .catch(function(e){ $('#content').innerHTML = '<div class="card">Could not load the words (' + esc(e.message) + ').</div>'; });
}
function paintScope(){
  $('#scope').innerHTML = SCOPES.map(function(s){
    var n = s[0] === 'all' ? WORDS.length : WORDS.filter(function(w){ return s[0] === 'course' ? !!w.c : !w.c; }).length;
    return '<button class="tbtn' + (s[0] === scope ? ' on' : '') + '" data-s="' + s[0] + '"><span>' + s[1] + '</span><small>' + n + '</small></button>';
  }).join('');
  $$('#scope .tbtn').forEach(function(b){ b.onclick = function(){
    scope = b.dataset.s; game = null;
    /* si el tema abierto se queda sin palabras en el grupo nuevo, se vuelve a todos */
    if(theme !== 'all' && !scoped().some(function(w){ return w.t === theme; })) theme = 'all';
    paintScope(); paintThemes(); paintTop(); render();
  }; });
}
function paintThemes(){
  var vis = scoped();
  var keys = Object.keys(THEMES).filter(function(t){ return vis.some(function(w){ return w.t === t; }); });
  var row = function(k, label, ws){ var m = ws.filter(mastered).length; return '<button class="tbtn' + (k === theme ? ' on' : '') + '" data-t="' + k + '"><span>' + label + '</span><small' + (m === ws.length && ws.length ? ' class="done"' : '') + '>' + m + '/' + ws.length + '</small></button>'; };
  $('#themes').innerHTML = row('all', '⭐ All topics', vis) + keys.map(function(k){ return row(k, THEMES[k], vis.filter(function(w){ return w.t === k; })); }).join('');
  $$('#themes .tbtn').forEach(function(b){ b.onclick = function(){ theme = b.dataset.t; game = null; paintThemes(); paintTop(); render(); }; });
}
function paintTop(){
  var ws = pool(), m = ws.filter(mastered).length, pc = ws.length ? Math.round(100 * m / ws.length) : 0;
  var label = theme === 'all' ? 'All words' : THEMES[theme];
  $('#top').innerHTML = '<h3>' + esc(NAMES[LEVEL]) + ' · ' + esc(label) + '</h3>' +
    '<div><b>You know ' + m + ' of ' + ws.length + ' words</b> <span class="small">(a word is yours after ' + MASTER + ' correct answers)</span></div>' +
    '<div class="bar"><i style="width:' + pc + '%"></i></div>' +
    '<div class="modes">' + MODES.map(function(x){ return '<button class="' + (x[0] === mode ? 'on' : '') + '" data-m="' + x[0] + '">' + x[1] + '</button>'; }).join('') + '</div>' +
    (USER ? '' : '<p class="small" style="margin:8px 0 0">Your progress is saved on this device' + (window.NIS_CONFIG ? '; open the trainer from the portal to keep it in your account' : '') + '.</p>');
  $$('#top .modes button').forEach(function(b){ b.onclick = function(){ mode = b.dataset.m; game = null; paintTop(); render(); }; });
}
function render(){
  var ws = pool();
  if(!ws.length){ $('#content').innerHTML = '<div class="card">No words in this topic yet.</div>'; return; }
  if(mode === 'learn') return learn(ws);
  if(mode === 'recall') return recall(ws);
  if(mode === 'pick') return pick(ws);
  if(mode === 'spell') return spell(ws);
  if(mode === 'memory') return memory(ws);
  return listen(ws);
}
/* orden de estudio: primero las que no se saben, mezcladas */
function queue(ws){ var a = shuffle(ws.filter(function(w){ return !mastered(w); })), b = shuffle(ws.filter(mastered)); return a.concat(b); }

/* ---------- Learn: tarjetas ---------- */
function learn(ws){
  if(!game || game.mode !== 'learn'){ game = {mode: 'learn', q: queue(ws), i: 0}; }
  var w = game.q[game.i % game.q.length]; var p = prog(w);
  $('#content').innerHTML = '<div class="card flash">' +
    '<div class="round"><span>Card ' + (game.i % game.q.length + 1) + ' of ' + game.q.length + '</span><span>' + (mastered(w) ? '⭐ You know this one' : '✓ ' + p.ok + ' of ' + MASTER) + '</span></div>' +
    '<div class="pic">' + picOf(w, 150) + '</div>' +
    '<div class="word">' + esc(w.w) + '</div>' +
    (w.ipa ? '<div class="ipa"><span class="reg">' + (w.ipa_reg || 'UK') + '</span> ' + esc(w.ipa) + '</div>' : '') +
    '<div><button class="spk" data-say="w">🔊 Word</button><button class="spk" data-say="ex">🔊 Sentence</button></div>' +
    '<p class="ex">' + boldWord(w.ex, w) + '</p>' +
    '<p class="es hidden" id="es">🇪🇸 ' + esc(w.es) + '</p><p><button class="spk" id="showEs">Show in Spanish</button></p>' +
    '<p style="margin-top:14px"><button class="btn ok" id="know">I know it ✓</button> <button class="btn sec" id="next">Next →</button></p>' +
    '<p class="small">Say the word out loud, then the sentence. Press <b>I know it</b> when you can say it without looking.</p></div>';
  $$('#content .spk[data-say]').forEach(function(b){ b.onclick = function(){ play(w, b.dataset.say === 'ex'); }; });
  $('#showEs').onclick = function(){ $('#es').classList.toggle('hidden'); };
  $('#know').onclick = function(){ bump(w, true); game.i++; learn(ws); };
  $('#next').onclick = function(){ bump(w, false); game.i++; learn(ws); };
  play(w, false);
}

/* ---------- rondas de 10 ---------- */
function newGame(kind, ws, filter){
  var cand = ws.filter(filter); if(cand.length < 4) cand = WORDS.filter(filter);
  var q = queue(cand).slice(0, 10);
  game = {mode: kind, q: q, i: 0, score: 0, cand: cand};
  t0 = Date.now();
  return game;
}
function header(kind){ return '<div class="round"><span>Question ' + (game.i + 1) + ' of ' + game.q.length + '</span><span>Score ' + game.score + '</span></div>'; }
function finish(ws){
  var s = game.score, n = game.q.length, st = s >= 9 ? 3 : s >= 7 ? 2 : s >= 5 ? 1 : 0;
  saveRound(game.mode, s, n);
  $('#content').innerHTML = '<div class="card result"><div class="big">' + s + ' / ' + n + '</div><div class="stars">' + '⭐'.repeat(st) + '☆'.repeat(3 - st) + '</div>' +
    '<p>' + (st === 3 ? 'Brilliant! You know these words.' : st >= 1 ? 'Good work! Play again to get all the stars.' : 'Keep going — try the Learn cards first, then play again.') + '</p>' +
    '<p><button class="btn" id="again">Play again</button> <button class="btn sec" id="toLearn">📖 Learn cards</button></p></div>';
  var m = game.mode; game = null;
  $('#again').onclick = function(){ mode = m; render(); };
  $('#toLearn').onclick = function(){ mode = 'learn'; paintTop(); render(); };
}

/* ---------- Pick the picture ---------- */
function pick(ws){
  if(!game || game.mode !== 'pick') newGame('pick', ws, hasPic);
  if(game.q.length < 4){ $('#content').innerHTML = '<div class="card">This topic has no pictures to choose from. Try <b>Spell it</b> or <b>Listen &amp; type</b>.</div>'; return; }
  if(game.i >= game.q.length) return finish(ws);
  var w = game.q[game.i];
  var others = shuffle(game.cand.filter(function(x){ return x.k !== w.k && emojiOf(x) !== emojiOf(w); })).slice(0, 3);
  var opts = shuffle([w].concat(others));
  $('#content').innerHTML = '<div class="card">' + header() + '<div class="flash"><div class="word">' + esc(w.w) + '</div><button class="spk" id="say">🔊 Listen</button></div>' +
    '<div class="opts">' + opts.map(function(o, i){ return '<button class="opt" data-i="' + i + '">' + picOf(o, 96) + '</button>'; }).join('') + '</div><div class="fb" id="fb"></div></div>';
  $('#say').onclick = function(){ play(w, false); };
  $$('#content .opt').forEach(function(b){ b.onclick = function(){
    var o = opts[+b.dataset.i], ok = o.k === w.k;
    $$('#content .opt').forEach(function(x){ x.disabled = true; if(opts[+x.dataset.i].k === w.k) x.classList.add('ok'); });
    if(!ok) b.classList.add('bad');
    $('#fb').className = 'fb ' + (ok ? 'ok' : 'bad'); $('#fb').textContent = ok ? '✓ Yes! ' + w.w : '✗ That is «' + o.w + '». This is ' + w.w + '.';
    if(ok) game.score++; bump(w, ok); game.i++;
    setTimeout(function(){ if(game && game.mode === 'pick') pick(ws); }, ok ? 900 : 1800);
  }; });
  play(w, false);
}

/* ---------- Spell it: fichas de letras, como Starters R&W Part 3 ---------- */
function spellable(w){ return /^[a-z][a-z ]*$/.test(w.k) && w.k.replace(/ /g, '').length <= 14; }
function spell(ws){
  if(!game || game.mode !== 'spell') newGame('spell', ws, spellable);
  if(game.i >= game.q.length) return finish(ws);
  var w = game.q[game.i], target = w.k, letters = shuffle(target.replace(/ /g, '').split(''));
  game.typed = [];
  $('#content').innerHTML = '<div class="card">' + header() + '<div class="flash"><div class="pic">' + picOf(w, 120) + '</div>' +
    '<button class="spk" id="say">🔊 Listen</button> <span class="small">' + (w.t === 'names' ? 'a name' : esc(THEMES[w.t] || '')) + (target.indexOf(' ') > 0 ? ' · ' + target.split(' ').length + ' words' : '') + '</span></div>' +
    '<div class="answer" id="ans"></div>' +
    '<div class="tiles" id="tiles">' + letters.map(function(l, i){ return '<button class="tile" data-i="' + i + '">' + l + '</button>'; }).join('') + '</div>' +
    '<div style="text-align:center"><button class="spk" id="undo">⌫ Undo</button> <button class="btn" id="check">Check</button></div><div class="fb" id="fb" style="text-align:center"></div></div>';
  var paintAns = function(){ var s = game.typed.map(function(t){ return t.l; }).join(''), out = '', p = 0; for(var i = 0; i < target.length; i++){ if(target[i] === ' '){ out += '<span class="gap"></span>'; continue; } out += p < s.length ? esc(s[p]) : '<span style="opacity:.25">_</span>'; p++; } $('#ans').innerHTML = out; };
  paintAns();
  $('#say').onclick = function(){ play(w, false); };
  $$('#tiles .tile').forEach(function(b){ b.onclick = function(){ if(game.typed.length >= target.replace(/ /g, '').length) return; game.typed.push({l: b.textContent, i: +b.dataset.i}); b.disabled = true; paintAns(); }; });
  $('#undo').onclick = function(){ var t = game.typed.pop(); if(t){ $('#tiles .tile[data-i="' + t.i + '"]').disabled = false; paintAns(); } };
  $('#check').onclick = function(){
    var s = game.typed.map(function(t){ return t.l; }).join(''), ok = s === target.replace(/ /g, '');
    $('#ans').classList.add(ok ? 'ok' : 'bad'); $('#fb').className = 'fb ' + (ok ? 'ok' : 'bad'); $('#fb').textContent = ok ? '✓ ' + w.w : '✗ It is spelt: ' + target;
    $('#check').disabled = true; if(ok) game.score++; bump(w, ok); game.i++;
    setTimeout(function(){ if(game && game.mode === 'spell') spell(ws); }, ok ? 900 : 2200);
  };
  play(w, false);
}

/* ---------- Listen & type ---------- */
function listen(ws){
  if(!game || game.mode !== 'listen') newGame('listen', ws, function(){ return true; });
  if(game.i >= game.q.length) return finish(ws);
  var w = game.q[game.i];
  $('#content').innerHTML = '<div class="card">' + header() + '<div class="flash"><div class="pic">' + (hasPic(w) ? picOf(w, 110) : '<span class="emoji" style="font-size:70px">🎧</span>') + '</div>' +
    '<button class="spk" id="say">🔊 Listen again</button> <button class="spk" id="sayEx">🔊 In a sentence</button>' +
    '<p><input class="typed" id="typed" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type the word"></p>' +
    '<p><button class="btn" id="check">Check</button></p><div class="fb" id="fb"></div></div></div>';
  var inp = $('#typed'); try { inp.focus({preventScroll: true}); } catch(e){ inp.focus(); }
  $('#say').onclick = function(){ play(w, false); }; $('#sayEx').onclick = function(){ play(w, true); };
  var check = function(){
    var ok = norm(inp.value) === norm(w.k) || norm(inp.value) === norm(w.w.split(' (')[0]);
    inp.classList.add(ok ? 'ok' : 'bad'); $('#fb').className = 'fb ' + (ok ? 'ok' : 'bad'); $('#fb').textContent = ok ? '✓ ' + w.w : '✗ The word is: ' + w.w;
    $('#check').disabled = true; inp.disabled = true; if(ok) game.score++; bump(w, ok); game.i++;
    setTimeout(function(){ if(game && game.mode === 'listen') listen(ws); }, ok ? 900 : 2200);
  };
  $('#check').onclick = check; inp.onkeydown = function(e){ if(e.key === 'Enter' && !inp.disabled) check(); };
  play(w, false);
}

/* ---------- Recordar: solo la figura; se toca para ver el nombre ---------- */
function recall(ws){
  var withPic = ws.filter(function(w){ return hasIll(w) || !!emojiOf(w); });
  if(!withPic.length){ $('#content').innerHTML = '<div class="card">This topic has no pictures. Try <b>📖 Learn</b> or <b>🔤 Spell it</b>.</div>'; return; }
  if(!game || game.mode !== 'recall'){ game = {mode: 'recall', q: queue(withPic), i: 0, flip: false}; }
  var w = game.q[game.i % game.q.length];
  $('#content').innerHTML = '<div class="card flash">' +
    '<div class="round"><span>Card ' + (game.i % game.q.length + 1) + ' of ' + game.q.length + '</span><span>' + (mastered(w) ? '⭐ You know this one' : '✓ ' + prog(w).ok + ' of ' + MASTER) + '</span></div>' +
    '<div class="flipcard' + (game.flip ? ' flip' : '') + '" id="flip"><div class="fc-in">' +
      '<div class="fc-face fc-front"><div class="pic">' + picOf(w, 150) + '</div><p class="small">Tap the card to see the word</p></div>' +
      '<div class="fc-face fc-back"><div class="word">' + esc(w.w) + '</div>' + (w.ipa ? '<div class="ipa"><span class="reg">' + (w.ipa_reg || 'UK') + '</span> ' + esc(w.ipa) + '</div>' : '') + '<button class="spk" id="say2">🔊 Say it</button></div>' +
    '</div></div>' +
    '<p style="margin-top:14px"><button class="btn ok" id="know">I knew it ✓</button> <button class="btn sec" id="next">Next →</button></p>' +
    '<p class="small">Look at the picture and say the word out loud. Tap the card to check.</p></div>';
  var doFlip = function(){ game.flip = !game.flip; $('#flip').classList.toggle('flip', game.flip); if(game.flip) play(w, false); };
  $('#flip').onclick = function(e){ if(e.target && e.target.id === 'say2') return; doFlip(); };
  var s2 = $('#say2'); if(s2) s2.onclick = function(e){ e.stopPropagation(); play(w, false); };
  $('#know').onclick = function(){ bump(w, true); game.i++; game.flip = false; recall(ws); };
  $('#next').onclick = function(){ bump(w, false); game.i++; game.flip = false; recall(ws); };
}

/* ---------- Memory game: emparejar figura y nombre ---------- */
function memory(ws){
  var withPic = shuffle(ws.filter(hasIll));
  if(withPic.length < 4) withPic = shuffle(ws.filter(function(w){ return hasIll(w) || !!emojiOf(w); }));
  if(withPic.length < 4){ $('#content').innerHTML = '<div class="card">This topic has too few pictures for the memory game. Pick another topic, or <b>⭐ All topics</b>.</div>'; return; }
  if(!game || game.mode !== 'memory'){
    var chosen = withPic.slice(0, Math.min(6, withPic.length)), cards = [];
    chosen.forEach(function(w, i){ cards.push({id: i, kind: 'pic', w: w}); cards.push({id: i, kind: 'word', w: w}); });
    /* precargar las imagenes: el backend tarda ~1s la 1a vez y en un memory game
       la carta debe revelarse al instante; asi quedan en cache antes de voltear. */
    chosen.forEach(function(w){ if(hasIll(w)){ try { var pi = new Image(); pi.src = YM(WORD_IMG + wslug(w.k) + '.jpg'); } catch(e){} } });
    game = {mode: 'memory', cards: shuffle(cards), open: [], done: {}, moves: 0, pairs: chosen.length, lock: false};
    t0 = Date.now();
  }
  var g = game;
  var draw = function(){
    var found = Object.keys(g.done).length;
    $('#content').innerHTML = '<div class="card"><div class="round"><span>' + found + ' of ' + g.pairs + ' pairs</span><span>Moves ' + g.moves + '</span></div>' +
      '<p class="small" style="text-align:center;margin:2px 0 6px">Turn over two cards to match the picture with its word.</p>' +
      '<div class="memgrid">' + g.cards.map(function(c, i){
        var up = g.done[c.id] || g.open.indexOf(i) >= 0;
        var face = c.kind === 'pic' ? picOf(c.w, 84) : '<span class="memword">' + esc(c.w.w) + '</span>';
        return '<button class="memcard' + (up ? ' up' : '') + (g.done[c.id] ? ' done' : '') + '" data-i="' + i + '"' + (up || g.lock ? ' disabled' : '') + '>' + (up ? face : '<span class="memback">?</span>') + '</button>';
      }).join('') + '</div>' +
      (found === g.pairs ? '<div class="result" style="padding:6px"><div class="stars">' + '⭐⭐⭐' + '</div><p>All matched in ' + g.moves + ' moves!</p><button class="btn" id="again2">Play again</button></div>' : '') + '</div>';
    $$('#content .memcard').forEach(function(b){ b.onclick = function(){ onFlip(+b.dataset.i); }; });
    var ag = $('#again2'); if(ag) ag.onclick = function(){ game = null; memory(ws); };
  };
  var onFlip = function(i){
    if(g.lock || g.open.indexOf(i) >= 0 || g.done[g.cards[i].id]) return;
    var c = g.cards[i]; g.open.push(i);
    if(c.kind === 'pic') play(c.w, false);
    if(g.open.length < 2){ draw(); return; }
    g.moves++; g.lock = true;
    var a = g.cards[g.open[0]], b = g.cards[g.open[1]]; draw();
    if(a.id === b.id && a.kind !== b.kind){
      g.done[a.id] = true; bump(a.w, true);
      setTimeout(function(){ g.open = []; g.lock = false; draw(); if(Object.keys(g.done).length === g.pairs) saveRound('memory', g.pairs, g.pairs); }, 650);
    } else {
      setTimeout(function(){ g.open = []; g.lock = false; draw(); }, 1100);
    }
  };
  draw();
}

init();
})();
</script>
