<!doctype html>
<html lang="en" translate="no">
<head>
<meta name="google" content="notranslate">
<meta charset="utf-8">
<title>The Nordic Times</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,800;1,7..72,400&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* ===== The Nordic Times — periódico del portal NIS por niveles (A2·B1·B2·C1) ===== */
:root { --ink:#1b2b3d; --soft:#56677a; --line:#d9d2c3; --paper:#fbfaf6; --bg:#ece7dc; --navy:#1f3b6e; --red:#c0392b;
  --a2:#2f9268; --b1:#3b6fb5; --b2:#d97d0d; --c1:#7a4bb3; color-scheme: light; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 'Source Sans 3', system-ui, sans-serif; }
h1, h2, h3 { font-family: 'Literata', Georgia, serif; margin: 0; line-height: 1.15; text-wrap: balance; }
button, select, textarea { font: inherit; }
a { color: var(--navy); }
:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }

/* cabecera */
.mast { background: var(--paper); border-bottom: 3px double var(--ink); }
.mast .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 0 0; font-size: 13px; color: var(--soft); }
.mast .top a { text-decoration: none; font-weight: 700; }
.mast h1 { text-align: center; font-weight: 800; font-size: clamp(34px, 7vw, 64px); letter-spacing: -.5px; padding: 6px 0 2px; }
.mast .sub { text-align: center; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--soft);
  border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); padding: 5px 0; margin-bottom: 10px; display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; }
.archive select { padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); }

/* breaking news */
.breaking { background: var(--red); color: #fff; overflow: hidden; }
.breaking .wrap { display: flex; align-items: center; gap: 12px; padding-top: 8px; padding-bottom: 8px; }
.breaking b { flex: none; background: #fff; color: var(--red); font-size: 12px; letter-spacing: .1em; padding: 2px 8px; border-radius: 4px; }
.ticker { overflow: hidden; white-space: nowrap; flex: 1; mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent); }
.ticker span { display: inline-block; padding-left: 100%; animation: tick 45s linear infinite; font-weight: 600; }
.ticker span i { font-style: normal; margin: 0 22px; opacity: .7; }
@keyframes tick { to { transform: translateX(-100%); } }
@media (prefers-reduced-motion: reduce) { .ticker span { animation: none; padding-left: 0; white-space: normal; } .ticker { white-space: normal; } }

/* filtros */
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 18px 0 6px; }
.filters .lab { font-size: 13px; color: var(--soft); font-weight: 700; margin-right: 2px; }
.chip { border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 999px; padding: 5px 13px; cursor: pointer; font-weight: 700; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.chip.lv[aria-pressed="true"] { background: var(--c); border-color: var(--c); }
.sep { width: 1px; height: 22px; background: var(--line); margin: 0 6px; }

/* portada */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; padding: 10px 0 40px; }
.card { background: var(--paper); border-radius: 14px; padding: 18px 20px 16px; box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 8px 22px rgba(60,40,10,.06);
  cursor: pointer; display: flex; flex-direction: column; gap: 8px; border-top: 5px solid var(--c); text-align: left; border-left: 0; border-right: 0; border-bottom: 0; color: inherit; }
.card:hover { transform: translateY(-2px); transition: transform .15s; }
.card h2 { font-size: 22px; }
.card p { margin: 0; color: var(--soft); font-size: 15px; }
.meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12.5px; font-weight: 700; }
.lvl { background: var(--c); color: #fff; padding: 1px 8px; border-radius: 5px; }
.sec { text-transform: uppercase; letter-spacing: .08em; color: var(--soft); }
.exam { margin-top: auto; font-size: 12.5px; color: var(--c); font-weight: 700; }
.lead { grid-column: 1 / -1; display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; }
.lead h2 { font-size: clamp(26px, 4vw, 38px); }
.lead .first { font-family: 'Literata', serif; font-size: 16.5px; color: var(--ink); }
@media (max-width: 720px) { .lead { grid-template-columns: 1fr; } }
.empty { padding: 40px; text-align: center; color: var(--soft); grid-column: 1 / -1; }

/* artículo */
.art { max-width: 760px; margin: 18px auto 50px; background: var(--paper); border-radius: 16px; padding: 26px clamp(18px, 4vw, 44px) 34px; box-shadow: 0 8px 24px rgba(60,40,10,.07); border-top: 6px solid var(--c); }
.back { border: 0; background: none; color: var(--navy); font-weight: 700; cursor: pointer; padding: 0; margin-bottom: 14px; }
.art h2 { font-size: clamp(28px, 4.6vw, 40px); margin: 10px 0 8px; }
.art .stand { font-family: 'Literata', serif; font-style: italic; font-size: 18px; color: var(--soft); margin: 0 0 16px; }
.art .body p { font-family: 'Literata', serif; font-size: 17.5px; line-height: 1.7; margin: 0 0 14px; }
.gl { border-bottom: 2px dotted var(--c); cursor: help; background: none; border-top: 0; border-left: 0; border-right: 0; padding: 0; font: inherit; color: inherit; }
.tip { position: fixed; z-index: 50; max-width: 300px; background: var(--ink); color: #fff; padding: 9px 12px; border-radius: 10px; font: 14px/1.4 'Source Sans 3', sans-serif; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.box { border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-top: 22px; background: #fff; }
.box h3 { font-size: 19px; margin-bottom: 4px; }
.box .tag { font-size: 13px; color: var(--c); font-weight: 700; margin-bottom: 10px; }
.words { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; font-size: 15px; }
.words b { color: var(--c); }
.q { margin: 14px 0; }
.q .stem { font-weight: 600; margin-bottom: 6px; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opt { border: 1px solid var(--line); background: #fbfaf6; border-radius: 9px; padding: 6px 12px; cursor: pointer; text-align: left; color: var(--ink); }
.opt[aria-pressed="true"] { border-color: var(--c); background: var(--c); color: #fff; }
.opt.ok { background: #2f9268 !important; border-color: #2f9268 !important; color: #fff !important; }
.opt.ko { background: #c0392b !important; border-color: #c0392b !important; color: #fff !important; }
.actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
.btn { border: 0; background: var(--c); color: #fff; padding: 9px 18px; border-radius: 10px; font-weight: 700; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--c); border: 1px solid var(--c); }
.score { font-weight: 700; }
textarea { width: 100%; min-height: 160px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; resize: vertical; color: var(--ink); background: #fbfaf6; }
.count { font-size: 13px; color: var(--soft); }
.src { font-size: 13px; color: var(--soft); margin-top: 22px; }
#sync { letter-spacing: .04em; }
#sync.ok { color: #2f9268; } #sync.err { color: var(--red); }
.subm { font-size: 13px; font-weight: 700; color: #2f9268; }
.btn:disabled { opacity: .5; cursor: default; }
.ph { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 10px; background: #e2dccf; display: block; }
.lead .ph { margin-top: 12px; }
.fig { margin: 4px 0 18px; }
.fig img { width: 100%; max-height: 440px; object-fit: cover; border-radius: 12px; display: block; background: #e2dccf; }
.fig figcaption { font-size: 13.5px; color: var(--soft); margin-top: 6px; }
.fig figcaption small { display: block; font-size: 12px; opacity: .85; }
.rev { margin-top: 14px; border-left: 4px solid #2f9268; background: #f1faf5; border-radius: 10px; padding: 12px 14px; }
.rev h4 { margin: 0 0 6px; font: 700 15px 'Source Sans 3', sans-serif; }
.rev .g { display: inline-block; background: #2f9268; color: #fff; border-radius: 6px; padding: 0 8px; margin-left: 6px; }
.rev ul { margin: 6px 0 0; padding-left: 18px; font-size: 14px; }
.topr { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
#progView { padding: 18px 16px 40px; }
.foot { text-align: center; font-size: 13px; color: var(--soft); padding: 0 16px 40px; }
</style>
</head>
<body>
<header class="mast">
  <div class="wrap">
    <div class="top"><a href="../" id="home">← Portal</a><span class="topr"><a href="#progress" id="progLink" hidden>📈 My progress</a><label class="archive">Edition <select id="arch" aria-label="Choose edition"></select></label></span></div>
    <h1 id="mast">The Nordic Times</h1>
    <div class="sub"><span id="dateTxt"></span><span id="issueTxt"></span><span>News for learners · A2 to C1</span><span id="sync" hidden></span></div>
  </div>
</header>
<div class="breaking" id="breaking" hidden><div class="wrap"><b>BREAKING</b><div class="ticker"><span id="ticker"></span></div></div></div>

<main class="wrap" id="front">
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
</main>
<main id="artView" hidden></main>
<main id="progView" class="wrap" hidden></main>
<p class="foot">Original articles written for our students from facts reported by news organisations around the world. Sources are listed under each story.</p>

<script src="../school.js?v=d5a47dc5"></script>
<script src="../config.js?v=720edc7d"></script>
<script src="progress.js?v=50f24818"></script>
<script src="marks.js?v=d782d633"></script>
<script>window.NEWS_BACKEND = 'nis';</script>
<script>
(function(){
'use strict';
var LV = ['A2','B1','B2','C1'];
var LVCOL = {A2:'var(--a2)', B1:'var(--b1)', B2:'var(--b2)', C1:'var(--c1)'};
var issue = null, fLevel = 'All', fSec = 'All';
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function store(k, v){ try { if(v === undefined) return JSON.parse(localStorage.getItem('nisnews:' + k) || 'null'); localStorage.setItem('nisnews:' + k, JSON.stringify(v)); } catch(e){ return null; } }
function fmtDate(d){ var p = d.split('-'); return new Date(+p[0], p[1]-1, +p[2]).toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long', year:'numeric'}); }
function getJSON(u){ return fetch(u, {cache:'no-cache'}).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }); }

/* ---------- guardado en la cuenta del alumno ----------
   NIS y Cohasset Schools: tabla news_responses de Supabase (una fila por alumno
   y artículo). cohasset.pe: backend /news (la copia cambia NEWS_BACKEND).
   Embebido en el portal se usa el cliente de la ventana padre: config.js
   memoriza createClient, así que dos clientes no renuevan el token a la vez. */
var SYNC = (function(){
  var mode = window.NEWS_BACKEND || 'none', ready = null, me = null, client = null;
  function lib(){ try { if(window.parent !== window && window.parent.supabase && window.parent.supabase.createClient) return window.parent.supabase; } catch(e){} return window.supabase; }
  function sdk(){ return new Promise(function(res){
    if(lib() && lib().createClient) return res();
    var s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4';
    s.onload = s.onerror = function(){ res(); }; document.head.appendChild(s);
  }); }
  function base(){ var h = location.hostname; if(h === 'localhost' || h === '127.0.0.1') return 'http://localhost:8000'; try { return (localStorage.getItem('bm_url') || '/api').replace(/\/$/, ''); } catch(e){ return '/api'; } }
  function tok(){ try { return localStorage.getItem('cohasset_token') || localStorage.getItem('bm_token') || ''; } catch(e){ return ''; } }
  function init(){
    if(ready) return ready;
    if(mode === 'nis') ready = sdk().then(function(){
      var L = lib(), cfg = window.NIS_CONFIG; if(!L || !L.createClient || !cfg) return false;
      client = L.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_KEY);
      return client.auth.getSession().then(function(r){ me = r && r.data && r.data.session ? r.data.session.user : null; return !!me; }, function(){ return false; });
    });
    else if(mode === 'cohasset') ready = Promise.resolve(!!tok());
    else ready = Promise.resolve(false);
    return ready;
  }
  function load(date){
    return init().then(function(ok){
      if(!ok) return null;
      if(mode === 'nis') return client.from('news_responses').select('id,article_id,answers,score,total,writing,submitted_at,grade,feedback,criteria,reviewed_at,marks,student_note').eq('issue_date', date).eq('student_id', me.id)
        .then(function(r){ if(r.error) throw r.error; return r.data; });
      return fetch(base() + '/news/mine?issue_date=' + date, {headers:{Authorization:'Bearer ' + tok()}}).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); });
    });
  }
  function save(row){
    return init().then(function(ok){
      if(!ok) return {ok:false, why:'signin'};
      if(mode === 'nis'){
        var now = new Date().toISOString(), p = {student_id:me.id, issue_date:row.issue_date, article_id:row.article_id, level:row.level, headline:row.headline, updated_at:now};
        if(row.answers) p.answers = row.answers;
        if(row.checked){ p.score = row.score; p.total = row.total; p.checked_at = now; }
        if(row.writing != null){ p.writing = row.writing; p.writing_words = (row.writing.trim().match(/\S+/g) || []).length; }
        if(row.submit) p.submitted_at = now;
        return client.from('news_responses').upsert(p, {onConflict:'student_id,article_id'}).select('id,submitted_at').maybeSingle()
          .then(function(r){ return r.error ? {ok:false, why:r.error.message} : {ok:true, data:r.data}; });
      }
      return fetch(base() + '/news/responses', {method:'PUT', headers:{'Content-Type':'application/json', Authorization:'Bearer ' + tok()}, body:JSON.stringify(row)})
        .then(function(r){ return r.json().then(function(d){ return r.ok ? {ok:true, data:d} : {ok:false, why:(d && d.detail) || r.status}; }); });
    }).catch(function(e){ return {ok:false, why:String(e && e.message || e)}; });
  }
  /* Tachaduras y reflexión: van por RPC en NIS (el alumno no escribe esas
     columnas directamente) y por /writing/pieces/n<id> en cohasset.pe. */
  function extra(rowId, kind, value){
    return init().then(function(ok){
      if(!ok) return Promise.reject(new Error('Sign in to save'));
      if(mode === 'nis'){
        var call = kind === 'marks' ? client.rpc('news_marks', {p_id:rowId, p_marks:value}) : client.rpc('news_note', {p_id:rowId, p_note:value});
        return call.then(function(r){ if(r.error) throw r.error; return r.data; });
      }
      return fetch(base() + '/writing/pieces/n' + rowId + '/' + (kind === 'marks' ? 'marks' : 'note'), {method:'PUT', headers:{'Content-Type':'application/json', Authorization:'Bearer ' + tok()},
        body:JSON.stringify(kind === 'marks' ? {marks:value} : {note:value})})
        .then(function(r){ return r.json().then(function(d){ if(!r.ok) throw new Error((d && d.detail) || r.status); return {marks:d.marks, student_note:d.student_note}; }); });
    });
  }
  /* Todo lo del alumno, de todas las ediciones (para «My progress»). */
  function all(){
    return init().then(function(ok){
      if(!ok) return null;
      if(mode === 'nis') return client.from('news_responses').select('issue_date,article_id,level,headline,score,total,checked_at,writing_words,submitted_at,grade,feedback,reviewed_at')
        .eq('student_id', me.id).order('issue_date', {ascending:false}).then(function(r){ if(r.error) throw r.error; return r.data; });
      return fetch(base() + '/news/mine', {headers:{Authorization:'Bearer ' + tok()}}).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); });
    });
  }
  return {mode:mode, init:init, load:load, save:save, extra:extra, all:all};
})();
function setSync(st){
  var el = $('sync'); if(SYNC.mode === 'none') return;
  el.hidden = false;
  el.className = st === 'saved' ? 'ok' : (st === 'error' ? 'err' : '');
  el.textContent = {saving:'Saving…', saved:'✓ Saved to your account', signin:'Sign in to save your work', error:'Not saved — check your connection'}[st] || '';
}
var pend = {}, timers = {};
/* Junta lo pendiente de un artículo y lo sube tras una pausa: marcar diez
   opciones seguidas es una sola petición, y «checked»/«submit» no se pierden. */
function push(a, extra, wait){
  var k = a.id;
  store('dirty:' + k, true); setSync('saving');
  pend[k] = Object.assign(pend[k] || {issue_date:issue.date, article_id:k, level:a.level, headline:a.headline}, extra);
  clearTimeout(timers[k]);
  timers[k] = setTimeout(function(){
    var p = pend[k]; delete pend[k];
    SYNC.save(p).then(function(r){
      if(r.ok){
        if(!pend[k]) store('dirty:' + k, null);
        if(r.data && r.data.submitted_at){ store('sub:' + k, r.data.submitted_at); if(p.submit){ store('wrsub:' + k, p.writing); if(r.data.id) store('rid:' + k, r.data.id); } }
        setSync('saved');
      } else setSync(r.why === 'signin' ? 'signin' : 'error');
      if(window._newsAfterSave) window._newsAfterSave(k);
    });
  }, wait || 0);
}
/* Al abrir: lo de la cuenta rellena este equipo, salvo lo que aquí no se
   llegó a subir, que se sube ahora. Nunca se tira nada. */
function syncIssue(){
  SYNC.load(issue.date).then(function(rows){
    if(rows === null){ setSync('signin'); return; }
    var byId = {}; (rows || []).forEach(function(r){ byId[r.article_id] = r; });
    issue.articles.forEach(function(a){
      var r = byId[a.id];
      if(store('dirty:' + a.id)){
        var x = {answers:store('ans:' + a.id) || {}, writing:store('wr:' + a.id) || ''}, sc = store('score:' + a.id);
        if(sc){ x.score = sc.ok; x.total = sc.n; x.checked = true; }
        push(a, x, 0);
      } else if(r){
        if(r.answers) store('ans:' + a.id, r.answers);
        if(r.score != null) store('score:' + a.id, {ok:r.score, n:r.total});
        if(r.writing != null) store('wr:' + a.id, r.writing);
        store('sub:' + a.id, r.submitted_at || null);
      }
      if(r){ store('rid:' + a.id, r.id); store('wrsub:' + a.id, r.submitted_at ? r.writing : null); store('marks:' + a.id, r.marks || []); store('note:' + a.id, r.student_note || ''); }
      store('rev:' + a.id, r && r.reviewed_at ? {grade:r.grade, feedback:r.feedback, criteria:r.criteria || {}, at:r.reviewed_at} : null);
    });
    setSync('saved'); route();
  }).catch(function(){ setSync('error'); });
}

/* ---------- arranque: archivo de números ---------- */
getJSON('issues/index.json').then(function(ix){
  var list = (ix.issues || []).slice().sort(function(a, b){ return a.date < b.date ? 1 : -1; });
  var want = new URLSearchParams(location.search).get('d');
  var cur = list.find(function(x){ return x.date === want; }) || list[0];
  $('arch').innerHTML = list.map(function(x){ return '<option value="' + x.date + '"' + (x === cur ? ' selected' : '') + '>No. ' + x.issue + ' · ' + x.date + '</option>'; }).join('');
  $('arch').onchange = function(){ var q = new URLSearchParams(location.search); q.set('d', this.value); location.search = q.toString(); };
  if(!cur){ $('grid').innerHTML = '<p class="empty">No editions yet.</p>'; return; }
  return getJSON('issues/' + cur.date + '.json').then(function(d){ issue = d; start(); });
}).catch(function(){ $('grid').innerHTML = '<p class="empty">The newspaper could not be loaded. Please try again later.</p>'; });

/* Nombre del periódico según el colegio (Cohasset Schools): NIS = The Nordic Times. */
function brand(){
  var S = window.NIS_SCHOOL, n = (!S || !S.slug || S.slug === 'nis') ? 'The Nordic Times' : 'The ' + String(S.short || S.name || 'School').replace(/\s+Schools?$/i, '') + ' Times';
  $('mast').textContent = n; document.title = n;
  return S && S.loaded;
}
(function tick(k){ if(!brand() && k < 25) setTimeout(function(){ tick(k + 1); }, 200); })(0);
if(new URLSearchParams(location.search).get('embed') === '1') $('home').hidden = true;

function start(){
  $('dateTxt').textContent = fmtDate(issue.date);
  $('issueTxt').textContent = 'No. ' + issue.issue;
  if(issue.breaking && issue.breaking.length){
    $('breaking').hidden = false;
    $('ticker').innerHTML = issue.breaking.map(esc).join('<i>●</i>');
  }
  $('progLink').hidden = SYNC.mode === 'none';
  drawFilters(); route();
  window.addEventListener('hashchange', route);
  syncIssue();
}

/* ---------- portada ---------- */
function drawFilters(){
  var secs = ['All'].concat(issue.articles.map(function(a){ return a.section; }).filter(function(s, i, arr){ return arr.indexOf(s) === i; }));
  var h = '<span class="lab">Level</span>' + ['All'].concat(LV).map(function(l){
    return '<button class="chip' + (l !== 'All' ? ' lv' : '') + '" style="--c:' + (LVCOL[l] || 'var(--ink)') + '" data-lv="' + l + '" aria-pressed="' + (fLevel === l) + '">' + l + '</button>';
  }).join('') + '<span class="sep"></span><span class="lab">Section</span>' + secs.map(function(s){
    return '<button class="chip" data-sec="' + esc(s) + '" aria-pressed="' + (fSec === s) + '">' + esc(s) + '</button>';
  }).join('');
  $('filters').innerHTML = h;
  $('filters').onclick = function(e){
    var b = e.target.closest('button'); if(!b) return;
    if(b.dataset.lv) fLevel = b.dataset.lv; else fSec = b.dataset.sec;
    drawFilters(); drawGrid();
  };
  drawGrid();
}
function ph(a){ return a.image ? '<img class="ph" src="' + esc(a.image.src) + '" alt="' + esc(a.image.alt) + '" loading="lazy">' : ''; }
function credit(im){ return 'Photo: ' + esc(im.credit) + ' · <a href="' + esc(im.link) + '" target="_blank" rel="noopener">' + esc(im.license) + ', Wikimedia Commons</a>'; }
function done(a){ var s = store('score:' + a.id); return s ? ' · ✓ ' + s.ok + '/' + s.n : ''; }
function drawGrid(){
  var arts = issue.articles.filter(function(a){ return (fLevel === 'All' || a.level === fLevel) && (fSec === 'All' || a.section === fSec); });
  if(!arts.length){ $('grid').innerHTML = '<p class="empty">No stories for this filter today.</p>'; return; }
  $('grid').innerHTML = arts.map(function(a, i){
    var lead = i === 0 && fLevel === 'All' && fSec === 'All';
    var meta = '<div class="meta"><span class="lvl">' + a.level + '</span><span class="sec">' + esc(a.section) + '</span><span>' + a.flag + ' ' + esc(a.country) + '</span><span class="sec">' + esc(done(a)) + '</span></div>';
    if(lead) return '<button class="card lead" style="--c:' + LVCOL[a.level] + '" data-id="' + a.id + '"><div>' + meta + '<h2>' + esc(a.headline) + '</h2>' + ph(a) + '</div><div><p class="first">' + esc(a.standfirst) + '</p><p>' + esc(a.body[0]) + '</p><div class="exam">' + esc(a.topic) + ' · ' + esc(a.exam) + '</div></div></button>';
    return '<button class="card" style="--c:' + LVCOL[a.level] + '" data-id="' + a.id + '">' + ph(a) + meta + '<h2>' + esc(a.headline) + '</h2><p>' + esc(a.standfirst) + '</p><div class="exam">' + esc(a.topic) + ' · ' + esc(a.exam) + '</div></button>';
  }).join('');
  $('grid').onclick = function(e){ var c = e.target.closest('.card'); if(c) location.hash = 'a=' + c.dataset.id; };
}

function route(){
  var prog = location.hash === '#progress';
  var m = !prog && location.hash.match(/a=([\w-]+)/);
  var a = m && issue.articles.find(function(x){ return x.id === m[1]; });
  $('front').hidden = !!a || prog; $('artView').hidden = !a; $('progView').hidden = !prog;
  if(prog){ drawProgress(); window.scrollTo(0, 0); }
  else if(a){ drawArticle(a); window.scrollTo(0, 0); } else drawGrid();
}

/* ---------- «My progress»: todo lo que el alumno ha hecho en el periódico ----------
   Sale de su cuenta (news_responses / backend), no de este navegador. */
function drawProgress(){
  var v = $('progView'), back = {label:'← Back to the newspaper', go:function(){ location.hash = ''; }};
  v.innerHTML = '<p>Loading your progress…</p>';
  SYNC.all().then(function(rows){
    if(rows === null){ v.innerHTML = '<div class="npg"><button class="back" onclick="location.hash=\'\'">← Back to the newspaper</button><h2>My progress</h2><p>Sign in to your portal to see your progress. Your answers and writings are saved in your account.</p></div>'; return; }
    var emb = new URLSearchParams(location.search).get('embed') === '1' ? '&embed=1' : '';
    NewsProgress.render(v, rows || [], {back:back, link:function(r){ return '?d=' + r.issue_date + emb + '#a=' + r.article_id; }});
  }).catch(function(){ v.innerHTML = '<p>Your progress could not be loaded. Check your connection and try again.</p>'; });
}

/* ---------- artículo ---------- */
function glossed(text, gl){
  var out = esc(text);
  gl.forEach(function(g, i){
    var w = g.w.replace(/\s*\(.*\)/, '');
    var re = new RegExp('\\b(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\w*)', 'i');
    out = out.replace(re, '<button class="gl" data-g="' + i + '">$1</button>');
  });
  return out;
}
/* El texto entregado con las tachaduras del profesor (y las del alumno), y su
   reflexión sobre la corrección. Solo cuando hay algo entregado y guardado en
   su cuenta. */
function drawMarks(a, rv){
  var box = $('markBox'), rid = store('rid:' + a.id), txt = store('wrsub:' + a.id), marks = store('marks:' + a.id) || [];
  if(!box) return;
  if(!rid || !txt || !window.NewsMarks || (!rv && !marks.length)){ box.innerHTML = ''; return; }
  box.innerHTML = '<h4 style="margin:16px 0 6px;font:700 15px \'Source Sans 3\',sans-serif">Your submitted text, marked</h4><div id="markTxt"></div>' +
    (rv ? '<label for="noteTx" style="display:block;margin-top:12px;font-weight:700">What will you do differently next time?</label>' +
      '<textarea id="noteTx" maxlength="4000" style="min-height:80px" placeholder="Read the feedback and the marks, then write your reflection."></textarea>' +
      '<div class="actions"><button class="btn ghost" id="noteSave">Save my reflection</button><span class="subm" id="noteMsg"></span></div>' : '');
  NewsMarks.render($('markTxt'), txt, marks, {editable:true, by:'student', onSave:function(m){
    return SYNC.extra(rid, 'marks', m).then(function(d){ store('marks:' + a.id, d.marks || m); });
  }});
  if(rv){
    $('noteTx').value = store('note:' + a.id) || '';
    $('noteSave').onclick = function(){
      $('noteMsg').textContent = 'Saving…';
      SYNC.extra(rid, 'note', $('noteTx').value.trim()).then(function(d){ store('note:' + a.id, d.student_note || ''); $('noteMsg').textContent = '✓ Saved'; },
        function(e){ $('noteMsg').textContent = 'Not saved: ' + (e && e.message || e); });
    };
  }
}
function drawArticle(a){
  var v = $('artView'), saved = store('ans:' + a.id) || {};
  var tf = {T:'True', F:'False', NS:"Doesn't say"};
  var qs = a.questions.map(function(q, i){
    var opts = q.type === 'tf' ? ['T','F','NS'] : q.options;
    return '<div class="q" data-i="' + i + '"><div class="stem">' + (i + 1) + '. ' + esc(q.q) + '</div><div class="opts">' + opts.map(function(o, j){
      var val = q.type === 'tf' ? o : j;
      return '<button class="opt" data-v="' + val + '" aria-pressed="' + (String(saved[q.id]) === String(val)) + '">' + esc(q.type === 'tf' ? tf[o] : (q.type === 'match' ? o : String.fromCharCode(65 + j) + '  ' + o)) + '</button>';
    }).join('') + '</div></div>';
  }).join('');
  v.className = 'art'; v.style.setProperty('--c', LVCOL[a.level]);
  v.innerHTML =
    '<button class="back" id="back">← All stories</button>' +
    '<div class="meta"><span class="lvl">' + a.level + '</span><span class="sec">' + esc(a.section) + '</span><span>' + a.flag + ' ' + esc(a.country) + '</span><span class="sec">· ' + esc(a.topic) + '</span></div>' +
    '<h2>' + esc(a.headline) + '</h2><p class="stand">' + esc(a.standfirst) + '</p>' +
    (a.image ? '<figure class="fig"><img src="' + esc(a.image.src) + '" alt="' + esc(a.image.alt) + '"><figcaption>' + esc(a.image.caption) + '<small>' + credit(a.image) + '</small></figcaption></figure>' : '') +
    '<div class="body">' + a.body.map(function(p){ return '<p>' + glossed(p, a.glossary) + '</p>'; }).join('') + '</div>' +
    '<section class="box"><h3>Key words</h3><ul class="words">' + a.glossary.map(function(g){ return '<li><b>' + esc(g.w) + '</b> — ' + esc(g.d) + '</li>'; }).join('') + '</ul></section>' +
    '<section class="box" id="quiz"><h3>Check your understanding</h3><div class="tag">' + esc(a.exam) + '</div>' + (a.instructions ? '<p>' + esc(a.instructions) + '</p>' : '') + qs +
      '<div class="actions"><button class="btn" id="check">Check answers</button><button class="btn ghost" id="reset">Try again</button><span class="score" id="score" aria-live="polite"></span></div></section>' +
    (a.writing ? '<section class="box"><h3>Writing</h3><div class="tag">' + esc(a.writing.exam) + '</div><p>' + esc(a.writing.task) + '</p><textarea id="wr" aria-label="Your writing"></textarea><div class="actions"><span class="count" id="wc"></span><button class="btn" id="hand">Submit writing</button><span class="subm" id="subm" aria-live="polite"></span></div><div id="revBox"></div><div id="markBox"></div></section>' : '') +
    '<p class="src">Sources: ' + a.sources.map(function(s){ return '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.name) + '</a>'; }).join(' · ') + '</p>';

  $('back').onclick = function(){ location.hash = ''; };
  v.querySelectorAll('.q').forEach(function(qe){
    qe.onclick = function(e){
      var b = e.target.closest('.opt'); if(!b) return;
      qe.querySelectorAll('.opt').forEach(function(o){ o.setAttribute('aria-pressed', o === b); o.classList.remove('ok', 'ko'); });
      var q = a.questions[+qe.dataset.i]; saved[q.id] = b.dataset.v; store('ans:' + a.id, saved);
      push(a, {answers:saved}, 800);
    };
  });
  $('check').onclick = function(){
    var ok = 0;
    v.querySelectorAll('.q').forEach(function(qe){
      var q = a.questions[+qe.dataset.i], right = String(q.answer);
      qe.querySelectorAll('.opt').forEach(function(o){
        o.classList.remove('ok', 'ko');
        if(o.dataset.v === right) o.classList.add('ok');
        else if(o.getAttribute('aria-pressed') === 'true') o.classList.add('ko');
      });
      if(String(saved[q.id]) === right) ok++;
    });
    $('score').textContent = ok + ' / ' + a.questions.length;
    store('score:' + a.id, {ok: ok, n: a.questions.length});
    push(a, {answers:saved, score:ok, total:a.questions.length, checked:true}, 0);
  };
  $('reset').onclick = function(){ saved = {}; store('ans:' + a.id, saved); store('score:' + a.id, null); push(a, {answers:{}}, 0); drawArticle(a); };
  var wr = $('wr');
  if(wr){
    var showSub = function(){ var t = store('sub:' + a.id); $('subm').textContent = t ? '✓ Submitted ' + new Date(t).toLocaleString('en-GB', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'}) : ''; $('hand').textContent = t ? 'Submit again' : 'Submit writing'; };
    var wc = function(){ var n = (wr.value.trim().match(/\S+/g) || []).length; $('wc').textContent = n + ' words'; $('hand').disabled = !n; };
    wr.value = store('wr:' + a.id) || ''; wc(); showSub();
    wr.oninput = function(){ store('wr:' + a.id, wr.value); wc(); push(a, {writing:wr.value}, 1500); };
    $('hand').hidden = SYNC.mode === 'none';
    $('hand').onclick = function(){ $('subm').textContent = 'Sending…'; push(a, {writing:wr.value, submit:true, task:a.writing.exam + ' — ' + a.writing.task}, 0); };
    window._newsAfterSave = function(k){ if(k === a.id && $('subm')) showSub(); };
    var rv = store('rev:' + a.id), CRIT = {content:'Content', communicative:'Communicative achievement', organisation:'Organisation', language:'Language', task:'Task', grammar:'Grammar', vocab:'Vocabulary', clarity:'Clarity'};
    drawMarks(a, rv);
    if(rv) $('revBox').innerHTML = '<div class="rev"><h4>Your teacher\'s feedback' + (rv.grade ? '<span class="g">' + esc(rv.grade) + '</span>' : '') + '</h4>' +
      (rv.feedback ? '<p style="margin:0">' + esc(rv.feedback) + '</p>' : '') +
      '<ul>' + Object.keys(CRIT).filter(function(k){ return rv.criteria[k] != null; }).map(function(k){ return '<li>' + CRIT[k] + ': <b>' + esc(rv.criteria[k]) + (typeof rv.criteria[k] === 'number' ? '/5' : '') + '</b></li>'; }).join('') + '</ul></div>';
  }
  /* definiciones al pulsar la palabra subrayada */
  var tip = null;
  v.querySelector('.body').onclick = function(e){
    var g = e.target.closest('.gl'); if(tip){ tip.remove(); tip = null; } if(!g) return;
    e.stopPropagation();
    var d = a.glossary[+g.dataset.g], r = g.getBoundingClientRect();
    tip = document.createElement('div'); tip.className = 'tip'; tip.setAttribute('role', 'status');
    tip.innerHTML = '<b>' + esc(d.w) + '</b>: ' + esc(d.d); document.body.appendChild(tip);
    tip.style.left = Math.max(8, Math.min(r.left, innerWidth - tip.offsetWidth - 8)) + 'px';
    tip.style.top = (r.bottom + 6) + 'px';
  };
  document.onclick = function(e){ if(tip && !e.target.closest('.gl')){ tip.remove(); tip = null; } };
  window.onscroll = function(){ if(tip){ tip.remove(); tip = null; } };
}
})();
</script>
</body>
</html>
