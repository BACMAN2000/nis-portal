}

/* ---------- REPRODUCTOR del Read along ----------
   Un Audio por párrafo + json de tiempos por palabra (WordBoundary de
   edge-tts). Línea de progreso de TODO el capítulo con punto azul
   arrastrable, ▶ ⏸ ⏹, y karaoke palabra a palabra. */
window.RP={
  auds:[], tims:[], durs:[], cum:[], total:0, cur:0, playing:false, tick:null, ready:false, seeking:false,
  init(c,paras){
    this.destroy();
    this.auds=paras.map((_,i)=>{ const a=new Audio(); a.preload='metadata'; a.src=AUD_BASE+'ch'+c.n+'-p'+(i+1)+'.mp3'; return a; });
    this.tims=paras.map(()=>null); this.durs=paras.map(()=>0); this.cur=0; this.playing=false; this.ready=false;
    const metas=this.auds.map((a,i)=>new Promise(res=>{
      a.addEventListener('loadedmetadata',()=>{ RP.durs[i]=a.duration||0; res(true); },{once:true});
      a.addEventListener('error',()=>res(false),{once:true});
      setTimeout(()=>res(false),8000);
    }));
    paras.forEach((_,i)=>{ fetch(AUD_BASE+'ch'+c.n+'-p'+(i+1)+'.json').then(r=>r.ok?r.json():null)
      .then(j=>{ RP.tims[i]=j; RP.mapWords(i); }).catch(()=>{}); });
    this.auds.forEach((a,i)=>{ a.onended=()=>{ if(i+1<RP.auds.length){ RP.cur=i+1; RP.auds[RP.cur].playbackRate=_rate(); RP.auds[RP.cur].currentTime=0; RP.auds[RP.cur].play(); RP.paint(); } else RP.stop(); }; });
    Promise.all(metas).then(oks=>{
      if(!oks.some(Boolean)){ const h=$('#rpHint'); if(h) h.textContent='⚠️ Audio not available on this device — ask your teacher.'; return; }
      RP.cum=[]; let t=0; RP.durs.forEach(d=>{ RP.cum.push(t); t+=d; }); RP.total=t; RP.ready=true;
      const s=$('#rpSeek'); if(s){ s.max=Math.max(1,Math.round(t*10)/10); s.step=0.1; }
      RP.paint();
    });
  },
  /* asigna a cada <span class=w> su tiempo de inicio (alineación 1:1 con
     los WordBoundary; el TTS omite la puntuación suelta, así que se saltan
     los tokens sin letras) */
  mapWords(p){
    const spans=[...document.querySelectorAll('.reading .w[data-p="'+p+'"]')];
    const tim=this.tims[p]; if(!tim||!spans.length) return;
    let k=0;
    spans.forEach(sp=>{ if(!/[a-zA-Z0-9]/.test(sp.textContent)){ sp.dataset.t=''; return; }
      if(k<tim.length){ sp.dataset.t=tim[k][0]; k++; } });
  },
  gt(){ return (this.cum[this.cur]||0)+(this.auds[this.cur]?this.auds[this.cur].currentTime:0); },
  fmt(s){ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); },
  paint(){
    const t=this.gt();
    if(!this.seeking){ const s=$('#rpSeek'); if(s&&this.ready){ s.value=t; s.style.setProperty('--pct',(t/this.total*100)+'%'); } }
    const tl=$('#rpTime'); if(tl) tl.textContent=this.fmt(t)+' / '+this.fmt(this.total||0);
    document.querySelectorAll('.reading p.rp').forEach((p,i)=>p.classList.toggle('playing',i===this.cur&&(this.playing||t>0)));
    const read=document.querySelector('.reading'); if(read) read.classList.toggle('rp-paused',!this.playing);
    // karaoke: última palabra cuyo inicio <= tiempo local
    const local=this.auds[this.cur]?this.auds[this.cur].currentTime:0;
    let hot=null;
    document.querySelectorAll('.reading .w.hot').forEach(w=>w.classList.remove('hot'));
    if(this.playing){
      const spans=[...document.querySelectorAll('.reading .w[data-p="'+this.cur+'"]')];
      for(const sp of spans){ const st=parseFloat(sp.dataset.t); if(!isNaN(st)&&st<=local) hot=sp; }
      if(hot){ hot.classList.add('hot');
        if(window.BK && BK.on){ BK.reveal(hot); }   // en modo libro la pagina pasa sola
        else { const r=hot.getBoundingClientRect(); if(r.top<120||r.bottom>innerHeight-60) hot.scrollIntoView({behavior:'smooth',block:'center'}); } }
    }
    const pb=$('#rpPlayBtn'); if(pb) pb.innerHTML=this.playing?'⏸':'▶';
  },
  play(){
    if(!this.auds.length) return;
    const a=this.auds[this.cur]; a.playbackRate=_rate();
    a.play().then(()=>{ RP.playing=true;
      if(!RP.tick) RP.tick=setInterval(()=>RP.paint(),200);
      RP.paint();
    }).catch(()=>{ const h=$('#rpHint'); if(h) h.textContent='⚠️ Audio not available — check your connection.'; });
  },
  pause(){ if(this.auds[this.cur]) this.auds[this.cur].pause(); this.playing=false; this.paint(); },
  toggle(){ this.playing?this.pause():this.play(); },
  stop(){
    this.auds.forEach(a=>{ a.pause(); try{ a.currentTime=0; }catch(e){} });
    this.cur=0; this.playing=false;
    if(this.tick){ clearInterval(this.tick); this.tick=null; }
    this.paint();
    const s=$('#rpSeek'); if(s){ s.value=0; s.style.setProperty('--pct','0%'); }
  },
  seekTo(t){
    if(!this.ready) return;
    t=Math.min(Math.max(0,t),Math.max(0,this.total-0.2));
    let k=0; while(k+1<this.cum.length && this.cum[k+1]<=t) k++;
    const was=this.playing;
    this.auds.forEach((a,i)=>{ if(i!==k){ a.pause(); try{ a.currentTime=0; }catch(e){} } });
    this.cur=k;
    const a=this.auds[k], local=t-this.cum[k];
    const apply=()=>{ try{ a.currentTime=local; }catch(e){} };
    apply();
    // si el navegador aún no tiene datos en ese punto, reintentar al estar listo
    if(Math.abs(a.currentTime-local)>0.8){
      const fix=()=>{ if(Math.abs(a.currentTime-local)>0.8) apply(); };
      a.addEventListener('canplay',fix,{once:true});
      a.addEventListener('progress',fix,{once:true});
    }
    if(was) this.play(); else this.paint();
  },
  destroy(){
    if(this.tick){ clearInterval(this.tick); this.tick=null; }
    this.auds.forEach(a=>{ a.onended=null; a.pause(); a.src=''; });
    this.auds=[]; this.playing=false; this.ready=false; this.cur=0;
  }
};
window.rpPara=(i)=>{ if(RP.ready){ RP.seekTo((RP.cum[i]||0)+0.01); if(!RP.playing) RP.play(); } };

/* ---------- diccionario al tocar una palabra (lectura en pausa) ---------- */
function _storySentence(word,p){
  const re=new RegExp('\\b'+word.replace(/[^a-zA-Z]/g,'')+'\\b','i');
  const c=CHAPTERS[view.chap]; const paras=READINGS[c.n]||[];
  const pool=(p!=null&&paras[p])?[paras[p],...paras]:paras;
  for(const para of pool){ const s=para.split(/(?<=[.!?…’”])\s+/).find(s=>re.test(s)); if(s) return s; }
  return null;
}
window.wordDict=(el)=>{
  if(RP.playing) return;               // solo con la lectura detenida
  const raw=el.textContent.replace(/[^a-zA-Z’']/g,'').replace(/’|'/g,'');
  if(!raw) return;
  const word=raw.toLowerCase();
  const p=parseInt(el.dataset.p);
  const c=CHAPTERS[view.chap];
  const local=(c.vocab.find(v=>v[0].toLowerCase()===word)||[])[1];
  const story=_storySentence(word,p);
  const veil=document.createElement('div'); veil.className='dict-veil';
  veil.innerHTML=`<div class="dict-pop" onclick="event.stopPropagation()">
    <div style="display:flex;gap:10px;align-items:center;justify-content:space-between">
      <h3>${raw} <button class="btn ghost sm" style="padding:4px 10px" onclick="sayWord('${word}')">🔊</button></h3>
      <button class="btn ghost sm" onclick="this.closest('.dict-veil').remove()">✕ Close</button>
    </div>
    <div class="phon" id="dictPhon"></div>
    <div id="dictBody"><p class="muted" style="margin-top:10px">Looking it up…</p></div>
    ${local?`<div class="pos">In this chapter’s word list</div><p class="def">${local}</p>`:''}
    ${story?`<div class="story">📖 In the story: “${story}”</div>`:''}
  </div>`;
  veil.onclick=()=>veil.remove();
  document.body.appendChild(veil);
  fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(word))
    .then(r=>r.ok?r.json():Promise.reject())
    .then(j=>{
      const e=j[0]; const body=$('#dictBody'); if(!body) return;
      const phon=e.phonetic||((e.phonetics||[]).find(p=>p.text)||{}).text||'';
      const ph=$('#dictPhon'); if(ph) ph.textContent=phon;
      body.innerHTML=(e.meanings||[]).slice(0,2).map(m=>{
        const d=(m.definitions||[])[0]||{};
        return `<div class="pos">${m.partOfSpeech||''}</div>
          <p class="def">${d.definition||''}</p>
          ${d.example?`<p class="ex">“${d.example}”</p>`:''}`;
      }).join('')||'<p class="muted">No definition found.</p>';
    })
    .catch(()=>{ const body=$('#dictBody'); if(body) body.innerHTML=local?'':'<p class="muted">No dictionary entry found for this word — ask your teacher! 🙋</p>'; });
};

/* ============================================================
   LISTENING — escucha sin leer y completa las palabras que faltan.
   Los huecos se construyen con las palabras del vocabulario del
   capítulo tal como aparecen en el retelling.
   ============================================================ */
function _gapItems(c){
  const text=(READINGS[c.n]||[]).join(' ');
  const sents=text.split(/(?<=[.!?…’”])\s+/);
  const used=new Set(); const items=[];
  const take=(word,hint)=>{
    const re=new RegExp('\\b('+word+'s?)\\b','i');
    const s=sents.find(s=>re.test(s) && s.split(/\s+/).length<=34 && !used.has(s));
    if(!s) return false;
    used.add(s);
    const m=s.match(re);
    items.push({sent:s.replace(re,'____'), answer:m[1], hint});
    return true;
  };
  for(const v of shuffle(c.vocab)){
    if(items.length>=6) break;
    take(v[0].toLowerCase(), v[1]);
  }
  // Si el vocabulario no da para 6 huecos, completar con nombres de personajes.
  const NAMES=['Vera','Lombard','Rogers','Wargrave','Armstrong','Blore','Marston','Macarthur','Brent','Narracott','Owen'];
  for(const n of shuffle(NAMES)){
    if(items.length>=6) break;
    take(n, "a character's name");
  }
  return items;
}
function actListen(c){
  _actT0=Date.now();
  const items=_gapItems(c);
  const paras=READINGS[c.n]||[];
  stage.innerHTML=`<div class="panel">
    <div class="qnum">CHAPTER ${c.n} · LISTENING</div>
    <h2 style="color:var(--blue-d);margin:2px 0 8px">🎧 Listen first, then write</h2>
    <p class="muted" style="margin:0 0 12px">Step 1 — Listen to the chapter <b>without reading the text</b>. You can listen twice.</p>
    <div class="rp-player">
      <div class="rp-ctl">
        <button id="rpPlayBtn" class="cbtn" title="Play / Pause" onclick="rpListenToggle()">▶</button>
        <button class="cbtn ghost" title="Stop" onclick="rpListenStop()">⏹</button>
        <span class="time" id="rpTime">0:00 / 0:00</span>
        <input type="range" class="rp-seek" id="rpSeek" min="0" max="1" step="0.1" value="0">
        <select id="rpRate" title="Speed" onchange="rpListenRate(this.value)"><option value="0.8">🐢 slower</option><option value="1" selected>1× normal</option><option value="1.15">⚡ faster</option></select>
        <a class="rp-dl" href="${AUD_BASE}ch${c.n}.mp3" download="ATTWN-${LVL}-chapter-${c.n}.mp3">⬇ mp3</a>
      </div>
      <div class="rp-hint" id="rpHint">🎧 Listen without reading the text below. Drag the blue dot to go back or forward.</div>
    </div>
    <p class="muted" style="margin:0 0 12px">Step 2 — Complete each sentence with the missing word. The definition helps you.</p>
    <div id="gapList">${items.map((it,i)=>`
      <div class="gap-item" data-i="${i}">${i+1}. ${it.sent.replace('____',`<input type="text" autocomplete="off" autocapitalize="off" data-i="${i}">`)}
        <div class="muted" style="font-size:12px;margin-top:5px">💡 ${it.hint}</div></div>`).join('')}
    <div style="display:flex;gap:10px;align-items:center;margin-top:12px">
      <button class="btn sm" onclick="gapCheck()">Check my answers</button><div id="gapOut"></div></div></div>`;
  let _lisSeeking=false;
  const _lisPaint=()=>{
    const b=$('#rpPlayBtn'), s=$('#rpSeek'), tl=$('#rpTime');
    const playing=_aud && !_aud.paused && !_aud.ended;
    if(b) b.innerHTML=playing?'⏸':'▶';
    const t=_aud?_aud.currentTime:0, dur=(_aud&&isFinite(_aud.duration))?_aud.duration:0;
    if(s && !_lisSeeking && dur){ s.max=Math.max(1,Math.round(dur*10)/10); s.value=t; s.style.setProperty('--pct',(t/dur*100)+'%'); }
    if(tl) tl.textContent=RP.fmt(t)+' / '+RP.fmt(dur);
  };

  }

const EVENTS = ATTWN_DATA.EVENTS;

  function draw(){
    stage.innerHTML=`<div class="panel">
      <div class="qnum">CHAPTER ${c.n} · SUMMARIZE</div>
      <h2 style="color:var(--blue-d);margin:2px 0 8px">📋 Step 1 — Put the events in order</h2>
      <p class="muted" style="margin:0 0 10px">Tap the events in the order they happen in the chapter. Tap again to undo.</p>

  window.ordReset=()=>{ picked=[]; draw(); };
  window.ordCheck=()=>{
    let ok=0;

      <div style="margin-top:10px;display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn sm" onclick="sumModel()">📖 Compare with a model summary</button></div>
      <div id="sumModel"></div>`;
    const area=$('#sumArea');
    area.addEventListener('input',()=>{
      const txt=area.value.toLowerCase();
      $('#sumWc').textContent=(area.value.trim().match(/\S+/g)||[]).length;
      let n=0;
      stage.querySelectorAll('.kw').forEach(k=>{ const hit=txt.includes(k.dataset.k); k.classList.toggle('hit',hit); if(hit)n++; });

    window.scrollTo(0,document.body.scrollHeight);
  };

}

const GRAMMAR_PP=[
  ["Vera was nervous because she ____ her host before.",["had never met","never meets","has never met","never met"],0,
   "Past perfect (had + past participle): the 'not meeting' happened BEFORE she felt nervous."],
  ["Wargrave read the letter that Constance ____ him.",["had sent","sends","has sent","was sending"],0,
   "The sending happened before the reading — past perfect."],
  ["Lombard took the job because he ____ for a long time.",["hadn't worked","doesn't work","hasn't worked","wasn't working"],0,
   "Negative past perfect: hadn't + past participle."],
  ["When the guests arrived, the Owens ____ yet.",["hadn't appeared","don't appear","haven't appeared","didn't appeared"],0,
   "The guests' arrival is past simple; what happened (or not) before it is past perfect."],
  ["Everyone knew about the island because it ____ in all the newspapers.",["had been","has been","is","was being"],0,
   "First the newspapers wrote about it, then everyone knew — past perfect."],
  ["Why ____ Isaac Morris ____ Lombard so little about the job?",["had · told","did · tell","has · told","does · tell"],0,
   "Past perfect question: Why had + subject + past participle?"],
  ["Dr Armstrong felt lucky: after that terrible affair he ____ drinking and worked hard.",["had stopped","stops","has stopped","stopping"],0,
   "Stopping came before feeling lucky — past perfect."],
  ["Blore smiled: the old sailor clearly ____ too much.",["had drunk","drinks","has drunk","drank"],0,
   "The drinking happened before Blore's smile — past perfect."]
];

    if(marked>=4) saveResult('notebook-deaths',ok,marked,"Notebook · death list");
  };
  window.nbAccuse=()=>{
    const who=$('#nbWho').value;
    if(!who){ $('#nbReveal').innerHTML='<div class="nb-reveal lose">Choose a suspect first.</div>'; return; }
    if(!confirm('Have you really finished Chapter 10? The solution will be revealed. Continue?')) return;
    const n=nbLoad(); n.accused=who;
    const win = who==='Judge Lawrence Wargrave';
    if(win){ n.solved=true; $('#nbReveal').innerHTML=_nbWinHTML(); }
    else{ $('#nbReveal').innerHTML=`<div class="nb-reveal lose">❌ You accuse <b>${who}</b>… but the case falls apart:
      the evidence doesn't fit. The killer is still free. Re-read your clues — especially Chapter 8 — and try again.</div>`; }
    nbSave(n);
    saveResult('notebook-accuse',win?1:0,1,'Notebook · final accusation');
  };
}
function _nbWinHTML(){
  return `<div class="nb-reveal win">🏆 <b>Case closed, detective!</b> It was <b>Judge Lawrence Wargrave</b>.
  His 'death' in Chapter 8 was a trick: he persuaded Dr Armstrong to help him pretend — mud and red curtain
  material on his forehead — and then pushed the doctor into the sea. With everyone believing the judge was dead,
  nobody watched him. When Vera was gone, he arranged his own real death so the police would find only a mystery…
  until a fishing boat pulled up his confession in a bottle. Justice — his kind of justice — was done.</div>`;
}

  hangman:actHangman, memory:actMemory, scramble:actScramble
};
/* Historial: la vista vive también en el hash (#c2, #c2-read, #info-notebook…)
   para que el botón "atrás" del navegador retroceda una vista en lugar de
   sacar al alumno del reader (auditoría 2026-08-25). render() y las pantallas
   extra sincronizan el hash; hashchange re-renderiza; _hashMute evita el
   doble render. El chooser y el modo C2 son de una sola pantalla y quedan fuera. */
let _hashMute=false, _lastRoute=null;
function _routeHash(){
  if(view.screen==="acts") return "c"+view.chap;
  if(view.screen==="act")  return "c"+view.chap+"-"+view.act;
  if(view.screen==="info") return "info-"+(view.info||"bio");
  if(view.screen==="teacher") return "teacher";
  return "";
}
function _syncHash(){
  const h=_routeHash(), cur=location.hash.replace(/^#/,"");
  if(h===cur) return;
  _hashMute=true; location.hash=h;
}
function _applyRoute(h){
  let m;
  if((m=/^c(\d+)-(\w+)$/.exec(h)) && CHAPTERS[+m[1]] && ACT_RENDER[m[2]] && !chapterLocked(CHAPTERS[+m[1]].n)){ view={screen:"act",chap:+m[1],act:m[2]}; }
  else if((m=/^c(\d+)$/.exec(h)) && CHAPTERS[+m[1]] && !chapterLocked(CHAPTERS[+m[1]].n)){ view={screen:"acts",chap:+m[1],act:null}; }
  else if((m=/^info-(\w+)$/.exec(h))){
    const fn={before:extraBeforeYouRead,grammar:extraGrammar,charwriting:extraCharWriting,notebook:extraNotebook}[m[1]];
    if(fn) return fn();
    if(m[1]==="bio"||m[1]==="characters") view={screen:"info",info:m[1],chap:null,act:null};
    else view={screen:"chapters",chap:null,act:null,info:null};
  }
  else if(h==="teacher"){ view={screen:"teacher",chap:null,act:null}; }
  else view={screen:"chapters",chap:null,act:null,info:null};
  render();
}
window.addEventListener("hashchange",()=>{
  if(window.ATTWN_CHOOSER || window.ATTWN_C2) return;
  if(_hashMute){ _hashMute=false; return; }
  _applyRoute(location.hash.replace(/^#/,""));
});
if(window.ATTWN_CHOOSER) renderChooser();
else if(window.ATTWN_C2) extraC2();
else _applyRoute(location.hash.replace(/^#/,""));

</script>
