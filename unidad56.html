<!--
  La propuesta que se lleva a coordinación de secundaria.

  No es una página de contenido: es una decisión de calendario con su
  justificación y su prueba. Tres partes:

    1. POR QUÉ  — cuatro razones, y la tercera es la que pesa: el calendario
                  del propio Scope pone el examen oficial de Cambridge el
                  2 de diciembre. Noviembre ya está ocupado.
    2. CÓMO     — las once semanas de cada grado, con todo el contenido de
                  las dos unidades del Scope repartido.
    3. LA PRUEBA — la cobertura se calcula EN VIVO contra scope-2026.json:
                  la página cuenta los bloques que el Scope declara para U5 y
                  U6 y comprueba uno por uno que estén asignados a una semana.
                  Si alguien cambia el Scope y algo deja de encajar, esta
                  página lo dice sola. Lo mismo, en consola:
                  node tools/audita_u56.js
-->

<script src="scope-u56-en.js?v=92ee599b"></script>
<script>
const U = window.SCOPE_U56;
const GRADOS = Object.keys(U.grados).map(Number).sort((a, b) => a - b);
const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
/* Documento de reunión: castellano. Los términos del Scope van en inglés
   porque así se llaman en el documento del colegio. */
const es = v => v == null ? '' : (typeof v === 'string' ? v : (v.es || v.en || ''));

/* ---------------- idioma ----------------
   El castellano vive en scope-u56.js y es el documento que firma
   coordinacion; el ingles, en scope-u56-en.js. Si la traduccion no esta
   cargada, la pagina sigue en castellano sin enterarse. */
const EN = window.SCOPE_U56_EN || null;
let LANG = (function(){
  const q = new URLSearchParams(location.search).get('lang') || window.__LANG || '';
  return (q === 'en' && EN) ? 'en' : 'es';
})();
const enIngles = () => LANG === 'en' && EN;

/* Textos de la propia pagina. Los del ingles viajan en el archivo de
   traduccion, junto al contenido que describen. */
const UI_ES = {
  eyebrow:'propuesta a coordinación', porQue:'Por qué',
  calendarioTit:'El calendario con el que hay que encajar',
  huecosTit:'Qué áreas no llegan a estas once semanas',
  huecosSub:'Contado en vivo sobre el Annual Plan del colegio, periodos 5 y 6. Es el hueco que un '+
    'producto integrador de once semanas puede cubrir.',
  colGrado:'Grado', colCero:'Sin una sola semana en las once', colPoco:'Con 3 semanas o menos',
  colCuando:'Cuándo', colQue:'Qué', colDonde:'Dónde cae en la unidad',
  colSemana:'Semana', colFoco:'Foco', colLengua:'Lengua', colLectura:'Lectura',
  colEscritura:'Escritura', colOral:'Oral', colHito:'Hito',
  gana:'Qué gana este grado',
  disc:'Sin resolver, y hay que resolverlo antes de la matrícula',
  cober:'bloques del Scope de U5 y U6, colocados',
  coberOk:'Nada de las dos unidades se queda fuera. Comprobado contra scope/scope-2026.json al abrir esta página.',
  coberMal:'bloque(s) del Scope sin semana asignada',
  falta:'Falta:', sobra:'Declarado y no está en el Scope:',
  leyenda:'Franja del color de la mitad de origen:',
  leyendaA:'contenido de', leyendaB:'contenido de',
  leyendaFin:'Las dos entregas calificadas van marcadas en verde.',
  fuentePie:'Construido sobre', fuentePie2:'La cobertura del final de cada grado se calcula en vivo contra esos archivos. Reparto:',
  todo:'Todo', grados:'grados', unaUnidad:'una unidad', planLector:'Plan lector:',
  semana:'Semana', delScope:'del Scope', evidencia:'EVIDENCIA CALIFICADA'
};
const w = k => (enIngles() && EN.ui[k]) || UI_ES[k];

/* Un campo de un grado, de una semana, de una etapa o de la discrepancia, en
   el idioma activo. Si falta la traduccion de ese campo concreto, cae al
   castellano en vez de dejar un hueco. */
function gT(g, campo){
  const a = U.grados[g], b = enIngles() ? (EN.grados[g] || {}) : {};
  return b[campo] != null ? b[campo] : a[campo];
}
function sT(g, i, campo){
  const a = U.grados[g].semanas[i];
  const b = enIngles() ? ((EN.grados[g] || {}).semanas || [])[i] : null;
  const v = b && b[campo] != null ? b[campo] : a[campo];
  return typeof v === 'string' ? v : es(v);
}
function eT(et, campo){
  const a = U.etapas[et], b = enIngles() ? (EN.etapas[et] || {}) : {};
  return b[campo] != null ? b[campo] : a[campo];
}
function dT(campo){
  const a = U.discrepancia || {}, b = enIngles() ? (EN.discrepancia || {}) : {};
  return b[campo] != null ? b[campo] : a[campo];
}
const exam = g => (enIngles() && EN.examen && EN.examen[g]) || U.examen[g];
const ordinal = g => enIngles() ? ('Grade ' + g) : (g + 'º');

/* La cobertura no se afirma, se calcula: se leen los bloques que el Scope
   declara para U5 y U6 de cada grado y se comprueba que cada uno tenga
   semana asignada. */
let SCOPE = null, PLAN = null;
/* Lo que el usuario eligió en el selector, si eligió algo. */
let forzado = null;
function cobertura(g){
  if(!SCOPE) return null;
  const gs = SCOPE.grados.find(x => x.grado === 'G' + g);
  if(!gs) return null;
  const esperado = [];
  [5, 6].forEach(n => ((gs.unidades.find(u => u.n === n) || {}).bloques || [])
    .forEach(b => esperado.push('U' + n + ':' + b.bloque)));
  const donde = {};
  U.grados[g].semanas.forEach(s => (s.cubre || []).forEach(x => {
    (donde[x] = donde[x] || []).push(s.n);
  }));
  return {esperado: esperado, donde: donde,
          falta: esperado.filter(x => !donde[x]),
          sobra: Object.keys(donde).filter(x => esperado.indexOf(x) < 0)};
}

/* Las razones y el calendario ya no viven aqui: son distintos en primaria y
   en secundaria, y vienen de los datos. La pagina solo los pinta. */
function argumento(et){
  const e = U.etapas[et];
  const cal = eT(et, 'calendario').map(c =>
    `<tr><td class="sem" style="width:132px">${esc(c.cuando)}</td>
      <td>${esc(c.que)}</td><td class="hito" style="width:250px">${esc(c.donde)}</td></tr>`).join('');
  const g0 = e.grados[0], gN = e.grados[e.grados.length - 1];
  const rango = enIngles() ? ('Grades ' + g0 + ' to ' + gN) : (g0 + 'º a ' + gN + 'º');
  const meses = enIngles() ? 'September – November 2026' : 'setiembre – noviembre 2026';
  const titulo = (enIngles() && EN.etapas[et] && EN.etapas[et].titulo) ? EN.etapas[et].titulo
    : (et === 'primaria' ? 'El periodo 5 y el periodo 6 son una sola unidad de once semanas'
                         : 'Unidad 5 y Unidad 6 son una sola unidad de once semanas');
  return `<div class="hero">
    <p class="eyebrow">${esc(eT(et, 'label'))} &middot; ${rango} &middot; ${meses} &middot; ${w('eyebrow')}</p>
    <h1>${esc(titulo)}</h1>
    <p class="lead">${esc(eT(et, 'lead'))}</p>
    <p class="fuente">${w('fuentePie')} ${esc(enIngles() ? EN.fuente : U.fuente)}.
      ${w('fuentePie2')} ${esc(eT(et, 'reparto'))}.</p>
  </div>

  <div class="card">
    <h2>${w('porQue')}</h2>
    <div class="razones">${eT(et, 'razones').map((r, i) => `<div class="razon">
      <span class="n">${i + 1}</span><h4>${esc(r[0])}</h4><p>${r[1]}</p></div>`).join('')}</div>

    <h3>${w('calendarioTit')}</h3>
    <div class="tabla"><table>
      <tr><th>${w('colCuando')}</th><th>${w('colQue')}</th><th>${w('colDonde')}</th></tr>${cal}</table></div>
    <div class="alerta">${eT(et, 'alerta')}</div>
    ${et === 'secundaria' ? discrepancia() : ''}
    ${et === 'primaria' ? huecosPlan() : ''}

    <div class="pide">${eT(et, 'pide').join(' ')}</div>
  </div>`;
}

/* Un desacuerdo entre dos documentos del colegio no se resuelve desde aqui:
   se pone delante, con las dos fuentes citadas, y lo decide coordinacion. */
/* Un desacuerdo entre dos documentos del colegio no se resuelve desde aqui:
   se pone delante, con las dos fuentes citadas, y lo decide coordinacion. */
function discrepancia(){
  if(!U.discrepancia) return '';
  return `<div class="alerta" style="border-left-color:#F59E0B;background:var(--prop);
      border-color:var(--propB);color:var(--propT)">
    <b style="color:var(--propT)">${w('disc')} &mdash; ${esc(dT('titulo'))}</b>
    <ul style="margin:7px 0 7px;padding-left:1.2em">
      ${dT('fuentes').map(f => `<li><b>${esc(f[0])}:</b> ${esc(f[1])}</li>`).join('')}</ul>
    <p style="margin:0 0 6px">${esc(dT('porque'))}</p>
    <p style="margin:0"><i>${esc(dT('mientras'))}</i></p></div>`;
}

/* Que areas del Annual Plan no aparecen NI UNA semana en las once. Es el dato
   que hace util la reunion de primaria, asi que no se escribe a mano: se
   cuenta del propio plan cada vez que se abre la pagina. */
const AREAS = {comunicacion:'Comunicación', math:'Math', science:'Science', social:'Social Studies',
  english:'English', art:'Art', music:'Music', pe:'PE', tutoria:'Tutoría'};
function cuentaPlan(g){
  if(!PLAN) return null;
  const gr = (PLAN.grados || {})['g' + g];
  if(!gr) return null;
  const n = {};
  [5, 6].forEach(pn => {
    const per = (gr.periodos || []).find(x => x.periodo === pn) || {semanas: []};
    (per.semanas || []).forEach(w => Object.keys(w.areas || {}).forEach(a => {
      if((w.areas[a] || []).length) n[a] = (n[a] || 0) + 1;
    }));
  });
  return n;
}
function huecosPlan(){
  if(!PLAN) return '';
  const filas = U.etapas.primaria.grados.map(g => {
    const n = cuentaPlan(g); if(!n) return '';
    const ks = Object.keys(AREAS);
    const cero = ks.filter(a => !n[a]), poco = ks.filter(a => n[a] && n[a] <= 3);
    return `<tr><td class="sem" style="width:64px">${ordinal(g)}</td>
      <td>${cero.length ? cero.map(a => esc(AREAS[a])).join(', ') : '&mdash;'}</td>
      <td>${poco.length ? poco.map(a => esc(AREAS[a]) + ' (' + n[a] + ')').join(', ') : '&mdash;'}</td></tr>`;
  }).join('');
  return `<h3>${w('huecosTit')}</h3>
    <p style="font-size:.84rem;margin:0 0 7px">${w('huecosSub')}</p>
    <div class="tabla"><table>
      <tr><th style="width:64px">${w('colGrado')}</th><th>${w('colCero')}</th>
        <th style="width:32%">${w('colPoco')}</th></tr>${filas}</table></div>`;
}

const etiqMitad = (et, de) => et === 'primaria'
  ? 'P' + de.slice(1) + ' · U' + de.slice(1) + ' ' + w('delScope')
  : de + ' ' + w('delScope');

function pintaGrado(g){
  const d = U.grados[g], ex = exam(g), conEx = ex.indexOf('—') !== 0;
  const pri = d.etapa === 'primaria';
  const filas = d.semanas.map((s, i) => `<tr>
    <td class="sem ${s.de === 'U5' ? 'u5' : 'u6'}">${w('semana')} ${s.n}<small>${etiqMitad(d.etapa, s.de)}</small></td>
    <td class="hito">${esc(sT(g, i, 'foco'))}</td>
    <td>${esc(sT(g, i, 'lengua'))}</td>
    <td>${esc(sT(g, i, 'lectura'))}</td>
    <td>${marcaEvidencia(sT(g, i, 'escritura'))}</td>
    <td>${esc(sT(g, i, 'oral'))}</td>
    <td class="hito" style="width:130px">${esc(sT(g, i, 'hito'))}</td></tr>`).join('');

  const c = cobertura(g);
  let cob = '';
  if(c){
    const bien = !c.falta.length && !c.sobra.length;
    cob = `<div class="cober${bien ? '' : ' mal'}">
      <b>${bien ? '&#10003; ' + c.esperado.length + (enIngles() ? ' of ' : ' de ') + c.esperado.length
                 + ' ' + w('cober')
                 : '&#9888; ' + c.falta.length + ' ' + w('coberMal')}</b>
      ${bien ? '<p style="margin:5px 0 0;font-size:.79rem">' + w('coberOk') + '</p>' : ''}
      ${c.falta.length ? '<p style="margin:5px 0 0">' + w('falta') + ' ' + esc(c.falta.join(', ')) + '</p>' : ''}
      ${c.sobra.length ? '<p style="margin:5px 0 0">' + w('sobra') + ' ' + esc(c.sobra.join(', ')) + '</p>' : ''}
      <div class="lista">${c.esperado.map(x =>
        `<span>${esc(x)} &rarr; ${w('semana').toLowerCase()} ${(c.donde[x] || []).join(enIngles() ? ' and ' : ' y ')}</span>`).join('')}</div>
    </div>`;
  }

  return `<div class="grado">
    <h2>${ordinal(g)} &middot; ${esc(enIngles() ? gT(g, 'titulo') : es(d.titulo))}</h2>
    <p class="meta">CEFR ${esc(d.cefr)} &middot; 11 ${enIngles() ? 'weeks' : 'semanas'}
      &middot; ${esc(U.trimestre.inicio)} &rarr; ${esc(U.trimestre.fin)}</p>
    <p class="fusion"><b>${pri ? 'P5' : 'U5'} &laquo;${esc(gT(g, 'temaU5'))}&raquo;</b> +
      <b>${pri ? 'P6' : 'U6'} &laquo;${esc(gT(g, 'temaU6'))}&raquo;</b> &rarr; ${w('unaUnidad')}</p>
    <div class="chips">
      <span class="chip${conEx ? ' ex' : ' no'}">${conEx ? (enIngles() ? '2 December: ' : '2 de diciembre: ') : ''}${esc(ex)}</span>
      <span class="chip">${w('planLector')} ${esc(gT(g, 'reader'))}</span>
      ${gT(g, 'escritura').map(e => `<span class="chip">${pri ? 'P' + e.de.slice(1) : e.de}: ${esc(e.que)}</span>`).join('')}
    </div>
    <p class="hilo">${esc(gT(g, 'hilo'))}</p>
    <div class="tabla"><table>
      <tr><th>${w('colSemana')}</th><th>${w('colFoco')}</th><th>${w('colLengua')}</th><th>${w('colLectura')}</th>
        <th>${w('colEscritura')}</th><th>${w('colOral')}</th><th>${w('colHito')}</th></tr>
      ${filas}</table></div>
    <h3 style="margin:0 0 6px;font-size:.95rem;color:var(--azul)">${w('gana')}</h3>
    <div class="gana">${gT(g, 'gana').map(x => '<div>' + esc(x) + '</div>').join('')}</div>
    ${cob}
  </div>`;
}

/* Las dos entregas calificadas son el esqueleto de la propuesta: se ven. */
function marcaEvidencia(txt){
  const t = String(txt || '');
  const i = t.indexOf(w('evidencia'));
  if(i < 0) return esc(t);
  const corte = t.lastIndexOf('.', i) + 1;
  return esc(t.slice(0, corte)) + ' <span class="evid">' + esc(t.slice(corte).trim()) + '</span>';
}

/* La etapa sale del grado pedido; sin grado, de ?etapa; y si no, secundaria,
   que es como nacio esta pagina y como esta enlazada desde fuera. */
function pedido(){
  if(forzado) return forzado;
  if(window.__FIJO) return {grado: window.__FIJO.grado || null, etapa: window.__FIJO.etapa || null};
  const P = new URLSearchParams(location.search);
  return {grado: P.get('grado'), etapa: P.get('etapa')};
}
function etapaActual(){
  const q = pedido();
  if(q.grado && U.grados[q.grado]) return U.grados[q.grado].etapa;
  return U.etapas[q.etapa] ? q.etapa : 'secundaria';
}

function pinta(){
  const g = pedido().grado, et = etapaActual();
  const lista = g && U.grados[g] ? [Number(g)] : U.etapas[et].grados;
  const u5 = et === 'primaria' ? 'P5' : 'U5', u6 = et === 'primaria' ? 'P6' : 'U6';
  document.getElementById('app').innerHTML = argumento(et)
    + `<p class="leyenda">${w('leyenda')}
        <i class="a"></i> ${w('leyendaA')} ${u5} &nbsp; <i class="b"></i> ${w('leyendaB')} ${u6}.
        ${w('leyendaFin')}</p>`
    + lista.map(pintaGrado).join('');
  document.title = eT(et, 'label')
    + (enIngles() ? ': one single eleven-week unit · NIS'
                  : ': una sola unidad de once semanas · NIS');
}

const sel = document.getElementById('sel');
function pintaSelector(){
  sel.innerHTML = Object.keys(U.etapas).map(et => {
    const e = U.etapas[et], lab = eT(et, 'label');
    return `<optgroup label="${esc(lab)}">`
      + `<option value="e:${et}">${w('todo')} ${esc(lab.toLowerCase())} (${e.grados.length} ${w('grados')})</option>`
      + e.grados.map(g => `<option value="${g}">${ordinal(g)} · ${esc(enIngles() ? gT(g, 'titulo') : es(U.grados[g].titulo))}</option>`).join('')
      + '</optgroup>';
  }).join('');
}
pintaSelector();
sel.value = pedido().grado || ('e:' + etapaActual());
/* La copia suelta se abre desde el disco, y ahi replaceState puede fallar.
   La eleccion del selector se guarda en `forzado` para que repinte igual. */
sel.onchange = () => {
  const v = sel.value;
  forzado = v.indexOf('e:') === 0 ? {etapa: v.slice(2), grado: null} : {etapa: null, grado: v};
  try{
    history.replaceState(null, '', v.indexOf('e:') === 0 ? '?etapa=' + v.slice(2) : '?grado=' + v);
  }catch(e){ /* file:// no deja reescribir la URL; da igual, ya está en forzado */ }
  pinta(); window.scrollTo(0, 0);
};
document.getElementById('print').onclick = () => window.print();

/* El boton de idioma solo aparece si la traduccion esta cargada. */
if(EN){
  const bo = document.createElement('button');
  bo.type = 'button';
  const rotula = () => { bo.textContent = enIngles() ? 'ES  Español' : 'EN  English'; };
  rotula();
  bo.onclick = () => {
    LANG = enIngles() ? 'es' : 'en';
    rotula(); pintaSelector();
    sel.value = pedido().grado || ('e:' + etapaActual());
    pinta(); window.scrollTo(0, 0);
  };
  const pr = document.getElementById('print');
  pr.parentNode.insertBefore(bo, pr);
}

pinta();
/* El Scope se lee después de pintar: si no está, la página sirve igual y solo
   falta el recuadro de comprobación. */
/* La copia suelta que se lleva a la reunion trae el Scope incrustado en
   window.__SCOPE y no pide nada a la red (ver tools/gen-u56.js). */
function carga(url, guarda, incrustado){
  if(incrustado){ guarda(incrustado); pinta(); return; }
  fetch(url, {cache: 'no-store'}).then(r => r.ok ? r.json() : null)
    .then(j => { if(j){ guarda(j); pinta(); } }).catch(() => {});
}
carga('scope/scope-2026.json', j => { SCOPE = j; }, window.__SCOPE);
carga('scope/annual-plan-primary-2026.json', j => { PLAN = j; }, window.__PLAN);
</script>
