<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cambridge B2 First — Listening · Nordic International School</title>
<link rel="icon" href="assets/favicon.svg">
<link href="vendor/fonts/montserrat-68a53b.css" rel="stylesheet">
<style>
:root{
  --blue:#4987c6; --blue-d:#2f5f93; --blue-dd:#244c77;
  --bg:#f2f3ff; --white:#fff; --grey:#636465; --line:#e3e5f3;
  --lila:#d1d2ea; --celeste:#76cbe5;
  --good:#16a34a; --warn:#f59e0b; --bad:#dc2626;
  --ink:#2b2c33; --r:16px; --r-sm:10px;
  --shadow:0 10px 30px rgba(36,76,119,.10);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Montserrat',system-ui,Segoe UI,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5}
h1,h2,h3{line-height:1.2;margin:0 0 .4em;font-weight:700}
header{display:flex;align-items:center;gap:14px;background:var(--blue);padding:12px 22px;color:#fff;box-shadow:var(--shadow)}
header img{height:34px;width:auto;display:block}
header .spacer{flex:1}
header a.back{background:rgba(255,255,255,.16);color:#fff;border:none;padding:8px 14px;border-radius:var(--r-sm);font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:7px}
header a.back:hover{background:rgba(255,255,255,.28)}
.wrap{max-width:1000px;margin:0 auto;padding:22px 18px 60px}
.hero{background:linear-gradient(135deg,var(--blue-dd),var(--blue));color:#fff;border-radius:var(--r);padding:22px 24px;margin-bottom:18px;box-shadow:var(--shadow)}
.hero h1{color:#fff;font-size:1.5rem;font-weight:800;margin:0}
.hero p{margin:.4em 0 0;color:#dbe8f6;font-size:.92rem}
.lead{color:var(--grey);font-size:.9rem;margin:0 0 16px}
/* index cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{display:flex;align-items:center;gap:14px;background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s,border-color .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 16px 30px -14px rgba(36,76,119,.35);border-color:var(--blue)}
.card-ico{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--blue-d),var(--celeste));color:#fff;display:grid;place-items:center;font-size:1.1rem;flex:none}
.card-body{flex:1;min-width:0}
.card-ttl{font-weight:700;color:var(--ink);font-size:.96rem;line-height:1.2}
.card-sub{font-size:.8rem;color:var(--grey);margin-top:3px}
.card-arrow{color:var(--grey);flex:none}
.back-link{display:inline-flex;align-items:center;gap:7px;cursor:pointer;color:var(--blue-d);font-weight:700;font-size:.88rem;margin-bottom:8px}
.back-link:hover{text-decoration:underline}
.unit-ttl{font-size:1.25rem;color:var(--ink);margin:2px 0 2px}
/* track */
.track{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.track-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.part{color:#fff;font-size:.68rem;font-weight:800;letter-spacing:.5px;padding:2px 9px;border-radius:8px;text-transform:uppercase;flex:none}
.part.support{background:var(--lila);color:var(--blue-dd)}
.track-ttl{font-size:.94rem;color:var(--ink)}
.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:999px;margin-left:6px;background:#e5e7eb;color:#374151}
.pill.g{background:#dcfce7;color:#166534}.pill.y{background:#fef9c3;color:#854d0e}.pill.r{background:#fee2e2;color:#991b1b}
.instr{font-size:.86rem;color:var(--grey);line-height:1.5;margin:2px 0 10px;background:var(--bg);border-radius:8px;padding:8px 12px}
/* player */
.player{display:flex;align-items:center;gap:12px;background:var(--blue-dd);border-radius:14px;padding:12px 16px;margin:8px 0 14px}
.pbtn{width:40px;height:40px;border-radius:50%;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:.95rem;flex:none;color:#fff}
.pbtn.play{background:var(--blue)}.pbtn.play:hover{background:#3f79b4}
.pbtn.stop{background:rgba(255,255,255,.14)}.pbtn.stop:hover{background:rgba(255,255,255,.26)}
.bar{position:relative;flex:1;height:8px;background:rgba(255,255,255,.25);border-radius:6px;cursor:pointer}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--celeste);border-radius:6px}
.thumb{position:absolute;top:50%;left:0;width:16px;height:16px;background:var(--celeste);border:3px solid #fff;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 1px 4px rgba(0,0,0,.3);pointer-events:none}
.ptime{color:#cfe0f2;font-size:.72rem;font-variant-numeric:tabular-nums;flex:none;min-width:74px;text-align:right}
.pmiss{color:#fca5a5;font-size:.74rem}
/* exercises */
.q{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.q-stem{font-weight:600;font-size:.92rem;margin-bottom:8px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid #cbd5e1;border-radius:10px;padding:8px 11px;margin:5px 0;cursor:pointer;font:inherit;background:#fff;color:inherit}
.opt:hover{border-color:var(--blue)}
.opt.sel{border-color:var(--blue);background:#eef5fc}
.opt.correct{border-color:var(--good);background:#dcfce7}
.opt.wrong{border-color:var(--bad);background:#fee2e2}
.opt .let{width:22px;height:22px;border-radius:6px;background:#eef2ff;color:var(--blue-d);font-weight:700;font-size:.78rem;display:grid;place-items:center;flex:none}
.gapinput{padding:7px 10px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;width:170px}
.acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.btn{border:none;border-radius:9px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.check{background:var(--blue);color:#fff}.btn.check:hover{background:#3f79b4}
.btn.reset{background:#eef2f7;color:var(--grey)}
.fb{margin-top:8px;border-radius:9px;padding:9px 12px;font-size:.88rem}
.fb.ok{background:#dcfce7;color:#166534}.fb.no{background:#fee2e2;color:#991b1b}
.fb b{display:block;margin-bottom:2px}
.footer{color:var(--grey);font-size:.8rem;text-align:center;margin-top:30px}
</style>
</head>

<script>
const XA = {"title":"Audios extra — Ready for B2 First","subtitle":"Listening auténtico del examen: reproduce cada audio y resuelve la tarea (Parts 1–4).","base":"https://lpwaahwxjvogcbkrklzz.supabase.co/storage/v1/object/public/course-audio/b2first-extra/","units":[{"unit":0,"title":"Prueba diagnóstica (Ready for Listening)","tracks":[{"id":"0.1","file":"track-0.1.mp3","part":"Part 1","type":"Multiple choice","title":"Ocho situaciones cortas","instr":"Escucharás a gente en ocho situaciones distintas. Para las preguntas 1–8, elige la mejor respuesta (A, B o C).","questions":[{"type":"mcq","q":"1. You hear a man talking about the use of mobile phones in restaurants. What point does he make?","options":["The appearance of food now matters as much as its taste.","Waiters enjoy taking photos for customers.","People should not use their phones at the table."],"a":0,"explain":"'appearance is just as important as taste'."},{"type":"mcq","q":"2. You hear two friends talking about a concert. What does the woman think could have been better?","options":["their view of the stage","the choice of songs played","the singer's interaction with the audience"],"a":2,"explain":"'he could have spoken more with the crowd... got more of a rapport'."},{"type":"mcq","q":"3. You hear a man talking on the radio about pickleball. Why does it appeal to him?","options":["It is less physically demanding than other racket sports.","It is cheaper to play.","It can be played indoors."],"a":0,"explain":"'you don't need to run around... or hit the ball with such force'."},{"type":"mcq","q":"4. You overhear two students talking about a temporary factory job. What do they agree about the work?","options":["It is well paid.","It is monotonous.","It offers a lot of variety."],"a":1,"explain":"'Very monotonous'; 'Packing boxes really is not my idea of fun'."},{"type":"mcq","q":"5. You hear a woman reviewing a biography on the radio. What does she say about the actor?","options":["His appearance made him easy to cast as villains.","He quickly became a company president.","He turned down all small parts."],"a":0,"explain":"'his twisted features and rough voice made him easy to cast as... villains'."},{"type":"mcq","q":"6. You hear a man talking about his new doctor. What is his opinion of her?","options":["She keeps patients waiting too long.","She is often late for appointments.","She is too rushed to understand problems fully."],"a":2,"explain":"'she'd get a more complete picture if she didn't do everything in such a hurry'."},{"type":"mcq","q":"7. You hear two people talking about their local supermarket. What is the woman's main criticism?","options":["the unfriendly staff","the high prices","the limited choice of products"],"a":2,"explain":"'a fairly limited selection... I like to have a bit of variety'."},{"type":"mcq","q":"8. You hear two people talking about a subtitled film. What problem did the man have?","options":["The subtitles were mistranslated.","The subtitles were too small to read.","The subtitles vanished too quickly."],"a":1,"explain":"'The writing was too small for me and I didn't have my glasses'."}]},{"id":"0.2","file":"track-0.2.mp3","part":"Part 2","type":"Sentence completion","title":"Helen Wells — espectáculo de aves","instr":"Escucharás a Helen Wells hablando de su trabajo. Completa las frases con una palabra o frase corta.","questions":[{"type":"cloze","q":"1","sentence":"The zoo prefers to call the free-flight display a ___ rather than a 'show'.","a":"demonstration","alts":["demonstration"],"explain":"Lo llaman 'demonstration' para destacar lo educativo."},{"type":"cloze","q":"2","sentence":"As well as the birds' skills, the audience learns about the ___ they face, such as trafficking and habitat loss.","a":"dangers","alts":["dangers"],"explain":"'the dangers they face'."},{"type":"cloze","q":"3","sentence":"Helen says that ___ are surprisingly agile despite their huge beak.","a":"toucans","alts":["toucans"],"explain":"'toucans are incredibly agile birds'."},{"type":"cloze","q":"4","sentence":"In this year's show a toucan would catch a ___ that Helen threw into the air.","a":"grape","alts":["grape"],"explain":"'throw a grape into the air'."},{"type":"cloze","q":"5","sentence":"Children are usually happy to have a macaw on their ___ , feeding from their hand.","a":"arm","alts":["arm"],"explain":"En el brazo, no en el hombro."},{"type":"cloze","q":"6","sentence":"To be a trainer you have to be a fairly ___ person.","a":"sociable","alts":["sociable"],"explain":"'a fairly sociable person'."},{"type":"cloze","q":"7","sentence":"Good ___ is essential so trainers are in the right place to receive a bird.","a":"teamwork","alts":["teamwork","team work"],"explain":"'good team work is essential'."},{"type":"cloze","q":"8","sentence":"Last month a ___ flew to the top of a fountain and refused to come down.","a":"cockatoo","alts":["cockatoo"],"explain":"'a cockatoo flew to the top of a fountain'."},{"type":"cloze","q":"9","sentence":"Trainers record each bird's ___ every day; if it is too low the bird may be ill.","a":"weight","alts":["weight"],"explain":"'record their weight every day'."},{"type":"cloze","q":"10","sentence":"Helen was not happy about the amount of ___ they were asked to do.","a":"overtime","alts":["overtime"],"explain":"'all the overtime we were asked to do'."}]},{"id":"0.3","file":"track-0.3.mp3","type":"Apoyo","title":"Audio de apoyo"},{"id":"0.4","file":"track-0.4.mp3","part":"Part 4","type":"Multiple choice","title":"Steve Muir — montañas rusas","instr":"Escucharás una entrevista con Steve Muir. Elige la mejor respuesta (A, B o C).","questions":[{"type":"mcq","q":"1. What first got Steve interested in roller coasters as a boy?","options":["the sounds the rides made","the speed of the cars","the fear on the riders' faces"],"a":0,"explain":"'There was a kind of music to it all' (clicks, screams, whooshing)."},{"type":"mcq","q":"2. What gives Steve his biggest thrill on a ride?","options":["the sudden drops","the sense of danger","the feeling of weightlessness"],"a":2,"explain":"'the feeling of weightlessness... Airtime'."},{"type":"mcq","q":"3. How did Steve get a place on the American tour?","options":["He booked it far in advance.","He replaced someone who had dropped out.","He won it in a competition."],"a":1,"explain":"'someone had dropped out... I jumped at the chance'."},{"type":"mcq","q":"4. What was special about Six Flags Great Adventure?","options":["It opened exclusively for their group.","It had the fastest coaster in the world.","It was the last park on the tour."],"a":0,"explain":"'they opened just for us before the general public'."},{"type":"mcq","q":"5. What made the ride on El Toro so memorable?","options":["its record-breaking height","riding it in near-darkness at the end of the day","its smooth, gentle ride"],"a":1,"explain":"'the ride operators turned off all the lights'."},{"type":"mcq","q":"6. What does Steve say about the steel coaster Maverick?","options":["Its height is what makes it frightening.","It is easy to ride first time.","It takes practice to ride well."],"a":2,"explain":"'It's definitely a coaster you have to learn to ride'."},{"type":"mcq","q":"7. What does Steve say about riding Formula Rossa in Abu Dhabi?","options":["He usually has to queue for a long time.","Most of the park is covered, so he avoids the heat.","He only ever stays for a morning."],"a":1,"explain":"'most of the park's covered, so... I'll be out of the heat'."}]},{"id":"0.5","file":"track-0.5.mp3","type":"Speaking","title":"Speaking Part 1 — modelo (entrevista)"},{"id":"0.6","file":"track-0.6.mp3","type":"Speaking","title":"Speaking Part 2 — modelo (fotos)"},{"id":"0.7","file":"track-0.7.mp3","type":"Speaking","title":"Speaking Part 3 — modelo (tarea colaborativa)"},{"id":"0.8","file":"track-0.8.mp3","type":"Speaking","title":"Speaking Part 4 — modelo (discusión)"}]},{"unit":1,"title":"Unit 1 — Lifestyle","tracks":[{"id":"1.1","file":"track-1.1.mp3","part":"Part 3","type":"Multiple matching","title":"La ropa que usa la gente","instr":"Escucharás a cinco personas hablando de la ropa que usan. Para cada hablante (1–5), elige de la lista (A–H) lo que dice. Usa cada letra una sola vez; sobran tres letras.","questions":[{"type":"mcq","q":"Speaker 1","options":["I tend to wear the same clothes all the time.","I don't really care what clothes I wear.","I refuse to wear designer clothes.","I'm careful to check the origin of the clothes I buy.","I generally wear second-hand clothes.","I only throw clothes away when absolutely necessary.","I buy quality clothes that are guaranteed to last.","I wear clothes that give me self-confidence."],"a":4,"explain":"Compra casi todo en tiendas de segunda mano (charity shops)."},{"type":"mcq","q":"Speaker 2","options":["I tend to wear the same clothes all the time.","I don't really care what clothes I wear.","I refuse to wear designer clothes.","I'm careful to check the origin of the clothes I buy.","I generally wear second-hand clothes.","I only throw clothes away when absolutely necessary.","I buy quality clothes that are guaranteed to last.","I wear clothes that give me self-confidence."],"a":1,"explain":"No dedica tiempo a pensar qué ponerse: le da igual."},{"type":"mcq","q":"Speaker 3","options":["I tend to wear the same clothes all the time.","I don't really care what clothes I wear.","I refuse to wear designer clothes.","I'm careful to check the origin of the clothes I buy.","I generally wear second-hand clothes.","I only throw clothes away when absolutely necessary.","I buy quality clothes that are guaranteed to last.","I wear clothes that give me self-confidence."],"a":3,"explain":"Solo compra ropa ética; comprueba cómo y quién la fabricó."},{"type":"mcq","q":"Speaker 4","options":["I tend to wear the same clothes all the time.","I don't really care what clothes I wear.","I refuse to wear designer clothes.","I'm careful to check the origin of the clothes I buy.","I generally wear second-hand clothes.","I only throw clothes away when absolutely necessary.","I buy quality clothes that are guaranteed to last.","I wear clothes that give me self-confidence."],"a":7,"explain":"La ropa le hace sentirse bien; la inseguridad desaparece al ponérsela."},{"type":"mcq","q":"Speaker 5","options":["I tend to wear the same clothes all the time.","I don't really care what clothes I wear.","I refuse to wear designer clothes.","I'm careful to check the origin of the clothes I buy.","I generally wear second-hand clothes.","I only throw clothes away when absolutely necessary.","I buy quality clothes that are guaranteed to last.","I wear clothes that give me self-confidence."],"a":5,"explain":"Solo se deshace de una prenda cuando ya no puede justificar conservarla."}]},{"id":"1.2","file":"track-1.2.mp3","part":"Part 1","type":"Multiple choice","title":"Ocho situaciones cortas","instr":"Escucharás a gente en ocho situaciones distintas. Para las preguntas 1–8, elige la mejor respuesta (A, B o C).","questions":[{"type":"mcq","q":"1. You hear two people talking about a friend of theirs. What does the woman say about the friend?","options":["He talks a lot about his lifestyle.","He leads a comfortable lifestyle.","He may change his lifestyle."],"a":2,"explain":"Dice que podría deshacerse de todo y quedarse a vivir en España."},{"type":"mcq","q":"2. You overhear a man talking to a friend on his phone. Why is he phoning?","options":["to persuade his friend to do something","to ask for some information","to change an arrangement"],"a":1,"explain":"Pregunta cómo fue la clase de pilates (experiencia de primera mano)."},{"type":"mcq","q":"3. You hear a woman talking about her family's financial situation. What is she going to do?","options":["ask someone to help her","try to sell something","look for a new job"],"a":1,"explain":"Va a poner el coche a la venta."},{"type":"mcq","q":"4. You hear a man talking about his job. Who is the man?","options":["a hotel manager","a hotel receptionist","a hotel doorman"],"a":2,"explain":"Es la primera persona que ven los huéspedes; está fuera, en las escaleras, con abrigo."},{"type":"mcq","q":"5. You hear two people talking about the value of their time spent living abroad. What do they agree about?","options":["It has helped them develop their personality.","It has made them appreciate their own country.","It has given them better job prospects."],"a":0,"explain":"Coinciden en que han crecido como personas (más tolerantes, abiertos)."},{"type":"mcq","q":"6. You hear a man talking on the radio. What is he doing?","options":["reviewing a book","advertising a product","reading a news report"],"a":0,"explain":"Critica el libro de autoayuda 'Back to Basics'."},{"type":"mcq","q":"7. You hear two people talking about the village they both live in. What does the woman think of the village?","options":["People are not always very friendly.","Some of the roads are dangerous.","There are not enough children."],"a":1,"explain":"Le preocupa el tráfico; algunos conductores no reducen la velocidad."},{"type":"mcq","q":"8. You hear a man talking about a country in which he once lived. What surprised him about the people?","options":["the importance they give to clothes","the type of food they eat","their attitude to work"],"a":0,"explain":"No esperaba lo mucho que les importaba la forma de vestir."}]},{"id":"1.3","file":"track-1.3.mp3","type":"Apoyo","title":"Audio de apoyo"},{"id":"1.4","file":"track-1.4.mp3","type":"Pronunciación","title":"Entonación de preguntas"}]},{"unit":2,"title":"Unit 2 — Music & entertainment","tracks":[{"id":"2.1","file":"track-2.1.mp3","part":"Part 2","type":"Sentence completion","title":"Jack Suggs — el mundo de la música","instr":"Escucharás a Jack Suggs en un programa de radio sobre música. Completa las frases con una palabra o frase corta.","questions":[{"type":"cloze","q":"1","sentence":"Young adults aged 18-24 listen to an average of about ___ hours of music a day.","a":" const PART_COLOR = {'Part 1':'#4987c6','Part 2':'#0e9488','Part 3':'#7c3aed','Part 4':'#d97706'};
let curUnit = null;      // null = index
const state = {};        // per-question: {sel, done}
const players = {};       // id -> {audio}
let active = null;        // current playing id

/* ---------- audio player ---------- */
function fmt(s){ s=Math.max(0,s|0); const m=(s/60)|0, r=s%60; return m+':'+(r<10?'0':'')+r; }
function stopAll(){ if(active){ const p=players[active]; if(p&&p.audio){try{p.audio.pause();}catch(e){}} active=null; document.querySelectorAll('.player').forEach(el=>{ el.querySelector('.play').innerHTML='&#9654;'; }); } }
function mkPlayer(id, mp3){
  players[id] = {mp3, audio:null};
  return `<div class="player" data-pid="${id}">
    <button class="pbtn play" title="Play/Pause" onclick="pToggle('${id}')">&#9654;</button>
    <button class="pbtn stop" title="Stop" onclick="pStop('${id}')">&#9632;</button>
    <div class="bar" onclick="pSeek(event,'${id}')"><div class="fill"></div><div class="thumb"></div></div>
    <div class="ptime">0:00</div>
  </div>`;
}
function pEl(id){ return document.querySelector('.player[data-pid="'+CSS.escape(id)+'"]'); }
function pPaint(id,frac,cur,dur){
  const el=pEl(id); if(!el) return;
  frac=Math.max(0,Math.min(1,frac||0));
  el.querySelector('.fill').style.width=(frac*100)+'%';
  el.querySelector('.thumb').style.left=(frac*100)+'%';
  if(dur) el.querySelector('.ptime').textContent=fmt(cur)+' / '+fmt(dur);
}
function pEnsure(id){
  const p=players[id]; if(!p) return null;
  if(!p.audio){
    const a=new Audio(encodeURI(p.mp3));
    a.addEventListener('timeupdate',()=>{ if(a.duration) pPaint(id, a.currentTime/a.duration, a.currentTime, a.duration); });
    a.addEventListener('ended',()=>{ pStop(id); });
    a.addEventListener('error',()=>{ const el=pEl(id); if(el&&!el.querySelector('.pmiss')){ const t=el.querySelector('.ptime'); t.className='pmiss'; t.textContent='audio no disponible aún'; } });
    p.audio=a;
  }
  return p.audio;
}
function pToggle(id){
  const a=pEnsure(id); if(!a) return;
  if(active && active!==id) stopAll();
  const el=pEl(id); const btn=el.querySelector('.play');
  if(a.paused){ a.play().then(()=>{ active=id; btn.innerHTML='&#10073;&#10073;'; }).catch(()=>{}); }
  else { a.pause(); btn.innerHTML='&#9654;'; }
}
function pStop(id){
  const p=players[id]; if(p&&p.audio){ try{p.audio.pause(); p.audio.currentTime=0;}catch(e){} }
  const el=pEl(id); if(el){ el.querySelector('.play').innerHTML='&#9654;'; pPaint(id,0,0,p&&p.audio?p.audio.duration:0); }
  if(active===id) active=null;
}
function pSeek(ev,id){
  const a=pEnsure(id); if(!a||!a.duration) return;
  const bar=ev.currentTarget, r=bar.getBoundingClientRect();
  a.currentTime=Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width))*a.duration;
}

/* ---------- exercises ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function qKey(tid,i){ return tid+'#'+i; }
function renderQ(tid, ex, i){
  const k=qKey(tid,i); const st=state[k]||{};
  let body='';
  if(ex.type==='mcq'){
    body = `<div class="q-stem">${esc(ex.q)}</div>` + ex.options.map((o,j)=>
      `<button class="opt" data-j="${j}" onclick="selOpt('${tid}',${i},${j})"><span class="let">${String.fromCharCode(65+j)}</span><span>${esc(o)}</span></button>`).join('');
  } else { // cloze
    const parts=String(ex.sentence||'').split(/_{2,}|___/);
    const sent = parts.map(esc).join(`<input class="gapinput" data-gap="1" placeholder="?" autocomplete="off">`);
    body = `<div class="q-stem">${ex.q?('<b style="color:var(--blue-d)">'+esc(ex.q)+'.</b> '):''}${sent}</div>`;
  }
  return `<div class="q" data-tid="${tid}" data-i="${i}">
    ${body}
    <div class="acts">
      <button class="btn check" onclick="checkQ('${tid}',${i})">Check</button>
      <button class="btn reset" onclick="resetQ('${tid}',${i})">↺</button>
    </div>
    <div class="fb" style="display:none"></div>
  </div>`;
}
function qNode(tid,i){ return document.querySelector('.q[data-tid="'+CSS.escape(tid)+'"][data-i="'+i+'"]'); }
function selOpt(tid,i,j){
  const n=qNode(tid,i); n.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
  n.querySelector('.opt[data-j="'+j+'"]').classList.add('sel');
  (state[qKey(tid,i)]=state[qKey(tid,i)]||{}).sel=j;
  if(window.NIS_WORK) NIS_WORK.touch();
}
function norm(s){ return String(s||'').trim().toLowerCase().replace(/\s+/g,' ').replace(/[.’']/g,c=>c==='.'?'':"'"); }
function checkQ(tid,i){
  const tr=trackById(tid); const ex=tr.questions[i]; const n=qNode(tid,i); const fb=n.querySelector('.fb');
  let ok=false, msg='';
  if(ex.type==='mcq'){
    const st=state[qKey(tid,i)]||{};
    if(st.sel==null){ fb.style.display='block'; fb.className='fb no'; fb.innerHTML='Selecciona una opción primero.'; return; }
    ok = st.sel===ex.a;
    n.querySelectorAll('.opt').forEach((o,j)=>{ o.classList.remove('sel'); if(j===ex.a)o.classList.add('correct'); else if(j===st.sel)o.classList.add('wrong'); });
    msg = ok ? ('¡Correcto! '+esc(ex.explain||'')) : ('Respuesta correcta: '+String.fromCharCode(65+ex.a)+' — '+esc(ex.options[ex.a])+'. '+esc(ex.explain||''));
  } else {
    const inp=n.querySelector('.gapinput'); const val=inp.value;
    const accept=(ex.alts&&ex.alts.length?ex.alts:[ex.a]).map(norm);
    ok = accept.includes(norm(val));
    inp.style.borderColor = ok?'var(--good)':'var(--bad)';
    msg = ok ? ('¡Correcto! '+esc(ex.explain||'')) : ('Respuesta: '+esc(ex.a)+'. '+esc(ex.explain||''));
  }
  fb.style.display='block'; fb.className='fb '+(ok?'ok':'no');
  fb.innerHTML='<b>'+(ok?'Correct':'Incorrect')+'</b>'+msg;
  (state[qKey(tid,i)]=state[qKey(tid,i)]||{}).done = ok?'ok':'no';
  if(window.NIS_WORK) NIS_WORK.touch();
  updatePill(tid);
}
function resetQ(tid,i){
  const n=qNode(tid,i); n.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel','correct','wrong'));
  const inp=n.querySelector('.gapinput'); if(inp){ inp.value=''; inp.style.borderColor=''; }
  const fb=n.querySelector('.fb'); fb.style.display='none';
  delete state[qKey(tid,i)]; updatePill(tid);
}
function updatePill(tid){
  const tr=trackById(tid); if(!tr.questions) return;
  const pill=document.getElementById('pill-'+tid); if(!pill) return;
  let ok=0; tr.questions.forEach((_,i)=>{ if((state[qKey(tid,i)]||{}).done==='ok') ok++; });
  const total=tr.questions.length;
  pill.textContent=ok+'/'+total;
  pill.className='pill '+(ok>=total*0.8?'g':ok>=total*0.4?'y':'r');
}

/* ---------- data helpers ---------- */
function trackById(id){ for(const u of XA.units) for(const t of u.tracks) if(t.id===id) return t; return null; }
function unitStats(u){ return {audios:u.tracks.length, ex:u.tracks.filter(t=>t.questions&&t.questions.length).length}; }

/* ---------- render ---------- */
function renderTrack(tr){
  const id='xa-'+tr.id;
  const badge = tr.part ? `<span class="part" style="background:${PART_COLOR[tr.part]||'#64748b'}">${tr.part}</span>` : `<span class="part support">${esc(tr.type||'')}</span>`;
  let ex='';
  if(tr.questions&&tr.questions.length){
    ex = (tr.instr?`<div class="instr">${esc(tr.instr)}</div>`:'') + tr.questions.map((q,i)=>renderQ(tr.id,q,i)).join('');
  }
  return `<div class="track">
    <div class="track-head">${badge}
      <div class="track-ttl"><b>${esc(tr.id)}</b> · ${esc(tr.title||'')}${tr.questions?` <span class="pill g" id="pill-${tr.id}">0/${tr.questions.length}</span>`:''}</div>
    </div>
    ${mkPlayer(id, XA.base+tr.file)}
    ${ex}
  </div>`;
}
function render(){
  stopAll();
  const app=document.getElementById('app');
  const hero=`<div class="hero"><h1>🎓 Cambridge B2 First — Listening</h1><p>${esc(XA.subtitle||'')}</p></div>`;
  if(curUnit!=null){
    const u=XA.units.find(x=>x.unit===curUnit);
    app.innerHTML = `<div class="back-link" onclick="goIndex()"><span>&#8592;</span> Todas las secciones</div>
      <h2 class="unit-ttl">${esc(u.title)}</h2>
      <p class="lead">Reproduce cada grabación y responde. Comprueba cada respuesta.</p>
      ${u.tracks.map(renderTrack).join('')}
      <div class="back-link" style="margin-top:8px" onclick="goIndex()"><span>&#8592;</span> Todas las secciones</div>`;
  } else {
    app.innerHTML = hero + `<p class="lead">Elige una sección para empezar.</p><div class="grid">` +
      XA.units.map(u=>{ const s=unitStats(u); return `<div class="card" onclick="openUnit(${u.unit})">
        <div class="card-ico">🎧</div>
        <div class="card-body"><div class="card-ttl">${esc(u.title)}</div>
          <div class="card-sub">${s.audios} audios${s.ex?` · <b>${s.ex} ejercicios</b>`:''}</div></div>
        <div class="card-arrow">&#8250;</div></div>`; }).join('') + `</div>`;
  }
  window.scrollTo(0,0);
}
/* La vista actual vive en el hash (#u0, #u1…): así el botón "atrás" del
   navegador vuelve al índice de secciones en vez de sacar al alumno de la
   página. La navegación interna solo escribe el hash; hashchange renderiza. */
function openUnit(u){ location.hash='u'+u; }
function goIndex(){ location.hash=''; }
function applyRoute(){
  const m=/^#u(\d+)$/.exec(location.hash);
  curUnit = (m && XA.units.some(x=>x.unit===+m[1])) ? +m[1] : null;
  render();
}
/* ---- Guardado y entrega (barra Save / Submit) --------------------------
   Cincuenta y cinco audios con sus tareas, y todo lo respondido se perdia al
   cerrar. `state` ya tenia la respuesta y el acierto de cada pregunta: solo
   habia que llevarlo a la cuenta del alumno. */
if(window.NIS_WORK) NIS_WORK.attach(Object.assign(NIS_WORK.ficha(), {
  title: document.title,
  read:  function(){ return { store: state, unidad: curUnit }; },
  write: function(d){
    const p = (d && d.store) || {};
    Object.keys(p).forEach(function(k){ state[k] = p[k]; });
  },
  after: function(){ render(); },
  count: function(d){
    const p = (d && d.store) || {};
    return Object.keys(p).filter(function(k){ return (p[k] || {}).sel != null; }).length;
  },
  answers: function(d){
    const p = (d && d.store) || {}, out = {};
    /* Por pista, no por pregunta: al profesor le sirve "cuantas bien de
       cuantas", no una lista de cincuenta lineas. */
    Object.keys(p).forEach(function(k){
      const pista = String(k).split('#')[0] || k;
      const a = out[pista] || (out[pista] = { n:0, ok:0 });
      if((p[k] || {}).sel != null) a.n++;
      if((p[k] || {}).done === 'ok') a.ok++;
    });
    const fin = {};
    Object.keys(out).forEach(function(k){ fin[k] = out[k].ok + '/' + out[k].n + ' right'; });
    return fin;
  }
}));

window.addEventListener('hashchange', applyRoute);
applyRoute();
</script>
