<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reported Speech Lab · NIS English</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#fff; --ink:#1e2433; --muted:#67718a;
    --accent:#3b5bdb; --accent-soft:#e7ecfd;
    --good:#2f9e44; --good-soft:#d3f4dc; --bad:#e03131; --bad-soft:#ffe3e3; --gold:#f59f00;
    --c-verb:#9b5de5; --c-pron:#3b5bdb; --c-tense:#e8590c; --c-time:#0c8599; --c-struct:#c2255c;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Segoe UI',system-ui,Arial,sans-serif; background:var(--bg); color:var(--ink); padding:16px; line-height:1.5;}
  .topnav{position:sticky; top:0; z-index:30; background:#fff; display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    padding:10px 18px; box-shadow:0 2px 10px rgba(20,30,60,.08); margin:-16px -16px 16px;}
  .topnav img{height:30px; width:auto; display:block;}
  .topnav .nav-sp{margin-left:auto;}
  .navbtn{text-decoration:none; font-weight:700; font-size:.85rem; padding:8px 14px; border-radius:9px; white-space:nowrap;
    background:var(--accent-soft); color:var(--accent); transition:.15s; border:none; cursor:pointer;}
  .navbtn:hover{filter:brightness(.97);}
  .navbtn.primary{background:var(--accent); color:#fff;}
  header{max-width:920px; margin:0 auto 8px; text-align:center;}
  header h1{font-size:1.5rem;}
  header p{color:var(--muted); font-size:.9rem; margin-top:4px;}
  .tabs{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:14px auto; max-width:920px;}
  .tab{border:2px solid transparent; background:var(--card); color:var(--ink); padding:9px 18px; border-radius:24px;
       font-weight:700; font-size:.92rem; cursor:pointer; box-shadow:0 1px 3px rgba(20,30,60,.12); transition:.15s;}
  .tab small{display:block; font-weight:500; font-size:.66rem; color:var(--muted);}
  .tab.on{background:var(--accent); color:#fff; border-color:var(--accent);}
  .tab.on small{color:#dce4ff;}
  .tab.done{border-color:var(--good);}
  .tab.done::after{content:" ✓"; color:var(--good);}
  .tab.on.done::after{color:#bff2cc;}
  main{max-width:920px; margin:0 auto;}
  .card{background:var(--card); border-radius:16px; padding:20px; box-shadow:0 2px 12px rgba(20,30,60,.08); margin-bottom:14px;}
  /* ---- Learn ---- */
  .bubble{position:relative; background:var(--accent-soft); color:var(--ink); border-radius:16px; padding:16px 20px;
    font-size:1.25rem; font-weight:600; display:inline-block; max-width:100%;}
  .bubble.direct::after{content:""; position:absolute; left:30px; bottom:-12px; border:8px solid transparent;
    border-top-color:var(--accent-soft); border-bottom:0;}
  .who{color:var(--muted); font-size:.85rem; margin:8px 0 2px;}
  .arrow{text-align:center; font-size:1.6rem; color:var(--accent); margin:14px 0 6px;}
  .reported{font-size:1.25rem; font-weight:600; padding:14px 18px; border-radius:14px; background:#f8fafc;
    border:1px dashed #cbd5e1; min-height:54px; transition:.2s;}
  .reported.show{background:var(--good-soft); border-color:var(--good);}
  mark{background:none; font-weight:800; padding:0 1px; border-radius:3px; cursor:help;}
  .c-verb{color:var(--c-verb);} .c-pron{color:var(--c-pron);} .c-tense{color:var(--c-tense);}
  .c-time{color:var(--c-time);} .c-struct{color:var(--c-struct);}
  .legend{display:flex; gap:12px; flex-wrap:wrap; margin-top:14px; font-size:.8rem; font-weight:700;}
  .legend span{display:flex; align-items:center; gap:5px;}
  .dot{width:11px; height:11px; border-radius:50%; display:inline-block;}
  .changes{margin-top:14px; display:none;}
  .changes.show{display:block;}
  .chg{display:flex; gap:10px; align-items:flex-start; padding:7px 0; border-top:1px solid #eef1f7; font-size:.9rem;}
  .chg .pill{font-size:.7rem; font-weight:800; padding:3px 8px; border-radius:10px; white-space:nowrap; color:#fff;}
  .btns{display:flex; gap:8px; flex-wrap:wrap; margin-top:16px;}
  button.act{border:none; border-radius:10px; padding:11px 18px; font-weight:700; font-size:.9rem; cursor:pointer; transition:.15s;}
  .b-go{background:var(--accent); color:#fff;} .b-alt{background:#e9ecf3; color:var(--ink);}
  button.act:hover{filter:brightness(1.06);} button.act:disabled{opacity:.5; cursor:default;}
  .counter{color:var(--muted); font-size:.85rem; text-align:center; margin-top:6px;}
  /* ---- Practice ---- */
  .lvlbar{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:12px;}
  .lvl{border:2px solid #d7def0; background:#fff; padding:7px 16px; border-radius:20px; font-weight:700; font-size:.85rem; cursor:pointer;}
  .lvl.on{background:var(--accent); color:#fff; border-color:var(--accent);}
  .lvl.done{border-color:var(--good);} .lvl.done::after{content:" ✓"; color:var(--good);}
  .status{display:flex; gap:16px; align-items:center; justify-content:center; font-weight:800; margin-bottom:12px; flex-wrap:wrap;}
  .watch{font-variant-numeric:tabular-nums; color:var(--accent);}
  .qbox{font-size:1.05rem;}
  .qdirect{background:var(--accent-soft); border-radius:14px; padding:14px 18px; font-weight:600; font-size:1.15rem; position:relative; margin-bottom:6px;}
  .qspk{color:var(--muted); font-size:.85rem; margin:8px 0 14px;}
  .opts{display:grid; gap:10px;}
  .opt{text-align:left; background:#fff; border:2px solid #d7def0; border-radius:12px; padding:13px 16px; font-size:1rem; cursor:pointer; transition:.12s; font-weight:600;}
  .opt:hover{border-color:var(--accent); background:var(--accent-soft);}
  .opt.correct{border-color:var(--good); background:var(--good-soft); color:var(--good);}
  .opt.wrong{border-color:var(--bad); background:var(--bad-soft); color:var(--bad);}
  .opt:disabled{cursor:default;}
  .explain{margin-top:14px; padding:12px 16px; border-radius:12px; background:#fff8e6; border:1px solid #ffe3a3; font-size:.92rem; display:none;}
  .explain.show{display:block;}
  .explain b{color:var(--c-tense);}
  .banner{display:none; margin-top:14px; padding:14px; border-radius:12px; background:var(--good-soft); color:var(--good); font-weight:800; text-align:center; font-size:1.05rem;}
  .banner.show{display:block; animation:pop .4s;}
  @keyframes pop{0%{transform:scale(.85); opacity:0;} 100%{transform:scale(1); opacity:1;}}
  .progress{height:7px; background:#e9ecf3; border-radius:6px; overflow:hidden; margin:10px 0 16px;}
  .progress>i{display:block; height:100%; background:var(--accent); width:0; transition:.3s;}
  footer{max-width:920px; margin:18px auto 0; text-align:center; color:var(--muted); font-size:.75rem;}
  @media (max-width:480px){ body{padding:10px;} .topnav{margin:-10px -10px 12px;} .bubble,.reported,.qdirect{font-size:1.05rem;} }
</style>
</head>

<header>
  <h1>🗣️ Reported Speech Lab</h1>
  <p>Turn what people <b>say</b> into what we <b>report</b>. Learn the changes, then practise. Grade 8–11 · NIS English</p>
</header>

<div class="tabs" id="tabs">
  <button class="tab on" data-tab="learn" onclick="go('learn')">① Learn<small>watch the changes</small></button>
  <button class="tab" data-tab="practice" onclick="go('practice')">② Practice<small>statements · questions · commands</small></button>
</div>

<main id="main"></main>

<footer>Reported Speech &amp; Backshifting · NIS English · 2026 — <a href="backshifting.html" style="color:var(--accent)">Need the tenses? Try the Backshifting Machine →</a></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="config.js"></script>
<script>
/* Portal NIS bridge: saves the result to activity_attempts + emails it. No portal session => no-op. */
window.NISACT=(function(){
  let _sb=null;
  function client(){ if(_sb) return _sb; if(!window.supabase||!window.NIS_CONFIG) return null;
    _sb=window.supabase.createClient(NIS_CONFIG.SUPABASE_URL,NIS_CONFIG.SUPABASE_KEY); return _sb; }
  async function student(){ const c=client(); if(!c) return null;
    try{ const u=await c.auth.getUser(); if(!u||!u.data||!u.data.user) return null;
      const p=await c.from('profiles').select('full_name,first_name,email').eq('id',u.data.user.id).maybeSingle();
      const d=(p&&p.data)||{}; return {uid:u.data.user.id,email:u.data.user.email||d.email,full_name:d.full_name,first_name:d.first_name};
    }catch(e){ return null; } }
  async function submit(r){
    const s=await student(); if(!s) return {skipped:true};
    try{ await client().from('activity_attempts').insert({student_id:s.uid,activity:r.activity,title:r.title,level:r.level,
      score:r.score,total:r.total,hints_used:0,lives_left:r.lives,duration_sec:r.duration}); }catch(e){}
    try{ const m=Math.floor(r.duration/60), sec=r.duration%60;
      await fetch(NIS_CONFIG.WRITING_WEBHOOK,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify({skill:'Grammar',name:s.full_name||s.first_name||'',email:s.email||'',level:r.level,
          examTitle:r.title+' - Time '+m+'m '+String(sec).padStart(2,'0')+'s - Lives left '+r.lives,
          examType:r.activity,score:r.score,total:r.total,duration_min:Math.max(1,Math.round(r.duration/60))})});
    }catch(e){}
    return {sent:true};
  }
  return {submit};
})();

/* ============== DATA ============== */
const PILL = {verb:'var(--c-verb)',pron:'var(--c-pron)',tense:'var(--c-tense)',time:'var(--c-time)',struct:'var(--c-struct)'};
const PILLNAME = {verb:'Reporting verb',pron:'Pronoun',tense:'Tense back-shift',time:'Time / place',struct:'Structure'};

const LEARN = [
  { who:'Tom said:', direct:'I am tired.',
    reported:'Tom <mark class="c-verb">said</mark> (that) <mark class="c-pron">he</mark> <mark class="c-tense">was</mark> tired.',
    changes:[
      {t:'verb', txt:'We add a reporting verb: <b>said</b>. After <i>say</i> we don\'t need an object.'},
      {t:'pron', txt:'<b>I</b> → <b>he</b> (Tom is the speaker, so the pronoun changes to match).'},
      {t:'tense', txt:'<b>am</b> → <b>was</b>: present simple back-shifts to past simple.'} ] },
  { who:'Sara said to me:', direct:'I will call you tomorrow.',
    reported:'Sara <mark class="c-verb">said</mark> <mark class="c-pron">she</mark> <mark class="c-tense">would</mark> call <mark class="c-pron">me</mark> <mark class="c-time">the next day</mark>.',
    changes:[
      {t:'pron', txt:'<b>I</b> → <b>she</b>, and <b>you</b> → <b>me</b> (you = the listener, which is me).'},
      {t:'tense', txt:'<b>will</b> → <b>would</b>: the modal back-shifts.'},
      {t:'time', txt:'<b>tomorrow</b> → <b>the next day</b> (the moment of speaking has passed).'} ] },
  { who:'He asked me:', direct:'Do you like this song?',
    reported:'He <mark class="c-verb">asked</mark> <mark class="c-struct">if</mark> <mark class="c-pron">I</mark> <mark class="c-tense">liked</mark> <mark class="c-time">that</mark> song.',
    changes:[
      {t:'verb', txt:'For questions we use <b>ask</b>, not <i>say</i>.'},
      {t:'struct', txt:'Yes/No question → add <b>if</b> (or <i>whether</i>) and use <b>statement word order</b> (no <i>do/does/did</i>, no question mark).'},
      {t:'tense', txt:'<b>do you like</b> → <b>liked</b>: present simple back-shifts to past simple.'},
      {t:'time', txt:'<b>this</b> → <b>that</b>.'} ] },
  { who:'She asked me:', direct:'Where are you going?',
    reported:'She <mark class="c-verb">asked</mark> where <mark class="c-pron">I</mark> <mark class="c-tense">was</mark> going.',
    changes:[
      {t:'struct', txt:'Wh- question → keep the question word (<b>where</b>) but use <b>statement order</b> and drop the question mark.'},
      {t:'pron', txt:'<b>you</b> → <b>I</b>.'},
      {t:'tense', txt:'<b>are going</b> → <b>was going</b>: present continuous back-shifts to past continuous.'} ] },
  { who:'The teacher said to us:', direct:'Close the window, please.',
    reported:'The teacher <mark class="c-verb">asked</mark> <mark class="c-pron">us</mark> <mark class="c-struct">to close</mark> the window.',
    changes:[
      {t:'verb', txt:'Polite order/request → <b>ask</b> + object. (A strong order uses <b>tell</b> / <b>order</b>.)'},
      {t:'struct', txt:'Imperative → <b>to + infinitive</b>: <i>close</i> → <b>to close</b>. No tense back-shift here.'},
      {t:'pron', txt:'The object is <b>us</b> (the people spoken to).'} ] },
  { who:'My mum said to me:', direct:"Don't touch that!",
    reported:'My mum <mark class="c-verb">told</mark> <mark class="c-pron">me</mark> <mark class="c-struct">not to touch</mark> that.',
    changes:[
      {t:'verb', txt:'A firm command → <b>tell</b> + object.'},
      {t:'struct', txt:'Negative imperative → <b>not to + infinitive</b>: <i>don\'t touch</i> → <b>not to touch</b>.'} ] },
];

const PRACTICE = {
  statements: { label:'Statements', items:[
    { d:'"I work in a bank."', s:'— Mr Diaz', o:[
        'Mr Diaz said he works in a bank.',
        'Mr Diaz said he worked in a bank.',
        'Mr Diaz said he had worked in a bank.'], a:1,
      e:'Present simple <b>work</b> → past simple <b>worked</b>.' },
    { d:'"I have lost my keys."', s:'— Lucy', o:[
        'Lucy said she lost her keys.',
        'Lucy said she has lost her keys.',
        'Lucy said she had lost her keys.'], a:2,
      e:'Present perfect <b>have lost</b> → past perfect <b>had lost</b>. Note <i>my</i> → <i>her</i>.' },
    { d:'"We are watching a film."', s:'— the kids', o:[
        'They said they were watching a film.',
        'They said they are watching a film.',
        'They said they had watched a film.'], a:0,
      e:'Present continuous <b>are watching</b> → past continuous <b>were watching</b>. <i>We</i> → <i>they</i>.' },
    { d:'"I will help you tomorrow."', s:'— Sam to me', o:[
        'Sam said he will help me tomorrow.',
        'Sam said he would help me the next day.',
        'Sam said he would help you tomorrow.'], a:1,
      e:'<b>will</b> → <b>would</b>; <i>you</i> → <i>me</i>; <i>tomorrow</i> → <b>the next day</b>.' },
    { d:'"I can swim very well."', s:'— Nora', o:[
        'Nora said she can swim very well.',
        'Nora said she could swim very well.',
        'Nora said she could swum very well.'], a:1,
      e:'Modal <b>can</b> → <b>could</b>.' },
    { d:'"The sun rises in the east."', s:'— teacher (a general truth)', o:[
        'The teacher said the sun rose in the east.',
        'The teacher said the sun rises in the east.',
        'Both are acceptable.'], a:2,
      e:'For <b>general truths / facts</b> the back-shift is <i>optional</i> — you may keep the present.' },
  ]},
  questions: { label:'Questions', items:[
    { d:'"Do you speak French?"', s:'— she asked me', o:[
        'She asked do I speak French.',
        'She asked if I spoke French.',
        'She asked if I speak French.'], a:1,
      e:'Yes/No → add <b>if</b>, statement order (no <i>do</i>), back-shift <b>speak</b> → <b>spoke</b>.' },
    { d:'"Where do you live?"', s:'— he asked me', o:[
        'He asked where did I live.',
        'He asked where I lived.',
        'He asked where do I live.'], a:1,
      e:'Wh- → keep <b>where</b>, statement order, no <i>do</i>: <b>lived</b>.' },
    { d:'"Are you coming to the party?"', s:'— Mia asked me', o:[
        'Mia asked if I was coming to the party.',
        'Mia asked was I coming to the party.',
        'Mia asked if I am coming to the party.'], a:0,
      e:'Yes/No → <b>if</b> + statement order; <b>are</b> → <b>was</b>.' },
    { d:'"What time does the train leave?"', s:'— a tourist asked me', o:[
        'He asked what time does the train leave.',
        'He asked what time the train left.',
        'He asked what time did the train leave.'], a:1,
      e:'Wh- + statement order, drop <i>does</i>: <b>left</b>.' },
    { d:'"Have you finished?"', s:'— the coach asked us', o:[
        'The coach asked if we had finished.',
        'The coach asked if we have finished.',
        'The coach asked had we finished.'], a:0,
      e:'Yes/No → <b>if</b>; present perfect <b>have finished</b> → past perfect <b>had finished</b>.' },
  ]},
  commands: { label:'Commands & requests', items:[
    { d:'"Sit down."', s:'— the teacher to the class', o:[
        'The teacher told the class sit down.',
        'The teacher told the class to sit down.',
        'The teacher said the class to sit down.'], a:1,
      e:'Command → <b>tell</b> + object + <b>to</b> + infinitive. (Not <i>say</i>.)' },
    { d:'"Please wait for me."', s:'— Ana to me', o:[
        'Ana asked me to wait for her.',
        'Ana told me wait for her.',
        'Ana asked me waiting for her.'], a:0,
      e:'Polite request → <b>ask</b> + object + <b>to</b>-infinitive; <i>me</i> → <i>her</i>.' },
    { d:'"Don\'t be late."', s:'— Dad to us', o:[
        'Dad told us don\'t be late.',
        'Dad told us not to be late.',
        'Dad told us to not be late.'], a:1,
      e:'Negative command → <b>not to</b> + infinitive.' },
    { d:'"Could you open the door?"', s:'— she to me', o:[
        'She asked me to open the door.',
        'She told me open the door.',
        'She asked me opening the door.'], a:0,
      e:'A request → <b>ask</b> + object + <b>to</b>-infinitive.' },
    { d:'"Turn off your phones."', s:'— the guide to the group', o:[
        'The guide told the group to turn off their phones.',
        'The guide said to turn off your phones.',
        'The guide told the group turn off their phones.'], a:0,
      e:'<b>tell</b> + object + <b>to</b>-infinitive; <i>your</i> → <i>their</i>.' },
  ]},
};

/* ============== STATE ============== */
let tab='learn', learnIdx=0, learnShown=false;
let plevel='statements', pidx=0, lives=5, score=0, elapsed=0, timer=null, answered=false;
const pdone={};

function go(t){ tab=t; document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===t)); render(); }

/* ============== LEARN ============== */
function renderLearn(){
  const ex=LEARN[learnIdx];
  const legend=Object.keys(PILLNAME).map(k=>`<span><i class="dot" style="background:${PILL[k]}"></i>${PILLNAME[k]}</span>`).join('');
  document.getElementById('main').innerHTML=`
    <div class="card">
      <div class="who">${ex.who}</div>
      <div class="bubble direct">“${ex.direct}”</div>
      <div class="arrow">⬇️ report it</div>
      <div class="reported ${learnShown?'show':''}" id="rep">${learnShown?ex.reported:'<span style="color:var(--muted)">Press <b>Report it ▶</b> to reveal the reported sentence…</span>'}</div>
      <div class="legend">${legend}</div>
      <div class="changes ${learnShown?'show':''}" id="changes">
        ${ex.changes.map(c=>`<div class="chg"><span class="pill" style="background:${PILL[c.t]}">${PILLNAME[c.t]}</span><span>${c.txt}</span></div>`).join('')}
      </div>
      <div class="btns">
        <button class="act b-go" id="goBtn" onclick="reveal()" ${learnShown?'disabled':''}>Report it ▶</button>
        <button class="act b-alt" onclick="prevEx()">‹ Previous</button>
        <button class="act b-alt" onclick="nextEx()">Next example ›</button>
      </div>
      <div class="counter">Example ${learnIdx+1} of ${LEARN.length}</div>
    </div>
    <div class="card" style="font-size:.92rem">
      <b style="color:var(--accent)">Remember the 4 moves of reported speech</b>
      <ol style="margin:8px 0 0 18px; line-height:1.7">
        <li><b style="color:var(--c-verb)">Reporting verb</b> — say (no object) · tell (+ object) · ask (questions/requests).</li>
        <li><b style="color:var(--c-pron)">Pronouns</b> change to match the new speaker (I→he/she, you→me, my→his/her…).</li>
        <li><b style="color:var(--c-tense)">Tenses back-shift</b> one step into the past (present→past, will→would…). <a href="backshifting.html" style="color:var(--accent)">See the full table →</a></li>
        <li><b style="color:var(--c-time)">Time &amp; place</b> words shift (now→then, today→that day, here→there, this→that…).</li>
      </ol>
    </div>`;
}
function reveal(){ learnShown=true; renderLearn(); }
function nextEx(){ learnIdx=(learnIdx+1)%LEARN.length; learnShown=false; renderLearn(); }
function prevEx(){ learnIdx=(learnIdx-1+LEARN.length)%LEARN.length; learnShown=false; renderLearn(); }

/* ============== PRACTICE ============== */
function fmt(s){ return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function startTimer(){ clearInterval(timer); timer=setInterval(()=>{ elapsed++; const w=document.getElementById('watch'); if(w) w.textContent='⏱ '+fmt(elapsed); },1000); }

function renderPractice(){
  clearInterval(timer);
  const keys=Object.keys(PRACTICE);
  const bar=keys.map(k=>`<button class="lvl ${k===plevel?'on':''} ${pdone[k]?'done':''}" onclick="setLevel('${k}')">${PRACTICE[k].label}</button>`).join('');
  document.getElementById('main').innerHTML=`
    <div class="card">
      <div class="lvlbar">${bar}</div>
      <div class="status">
        <span id="hearts"></span>
        <span class="watch" id="watch">⏱ 00:00</span>
        <span id="sc" style="color:var(--muted)"></span>
      </div>
      <div class="progress"><i id="bar"></i></div>
      <div id="q"></div>
      <div class="banner" id="banner"></div>
    </div>`;
  drawHearts(); renderQ(); startTimer();
}
function setLevel(k){ plevel=k; pidx=0; lives=5; score=0; elapsed=0; renderPractice(); }
function drawHearts(){ const h=document.getElementById('hearts'); if(h) h.textContent='❤️'.repeat(lives)+'🤍'.repeat(Math.max(0,5-lives)); }

function renderQ(){
  answered=false;
  const set=PRACTICE[plevel].items, q=set[pidx];
  document.getElementById('sc').textContent=`Score ${score}/${set.length}`;
  document.getElementById('bar').style.width=(pidx/set.length*100)+'%';
  document.getElementById('q').innerHTML=`
    <div class="qbox">
      <div class="qdirect">Direct: “${q.d.replace(/^"|"$/g,'')}”</div>
      <div class="qspk">${q.s} — choose the correct <b>reported</b> sentence:</div>
      <div class="opts">${q.o.map((t,i)=>`<button class="opt" data-i="${i}" onclick="answer(${i})">${t}</button>`).join('')}</div>
      <div class="explain" id="ex"><b>Why:</b> ${q.e}</div>
    </div>`;
}
function answer(i){
  if(answered) return; answered=true;
  const set=PRACTICE[plevel].items, q=set[pidx];
  const opts=document.querySelectorAll('.opt'); opts.forEach(o=>o.disabled=true);
  opts[q.a].classList.add('correct');
  if(i===q.a){ score++; }
  else{ opts[i].classList.add('wrong'); lives--; drawHearts(); }
  document.getElementById('sc').textContent=`Score ${score}/${set.length}`;
  document.getElementById('ex').classList.add('show');

  if(lives<=0){
    setTimeout(()=>{ const b=document.getElementById('banner'); b.textContent='💔 Out of lives! Restarting this level.'; b.classList.add('show');
      setTimeout(()=>setLevel(plevel),1400); },700);
    return;
  }
  const last=pidx>=set.length-1;
  setTimeout(()=>{
    if(last){ finishLevel(); }
    else{ pidx++; renderQ(); }
  }, 1200);
}
function finishLevel(){
  clearInterval(timer);
  document.getElementById('bar').style.width='100%';
  pdone[plevel]=true;
  document.querySelectorAll('.lvl').forEach(b=>{ if(b.textContent.trim().startsWith(PRACTICE[plevel].label)) b.classList.add('done'); });
  const set=PRACTICE[plevel].items;
  const b=document.getElementById('banner');
  b.innerHTML=`🎉 ${PRACTICE[plevel].label} complete — ${score}/${set.length} in ${fmt(elapsed)}! `+
    (Object.keys(PRACTICE).every(k=>pdone[k])?'You finished every level! 🏆':'Pick another level above.')+
    `<br><span style="font-weight:600;font-size:.85rem">Saved to My Results (if you\'re signed in to the portal).</span>`;
  b.classList.add('show');
  if(window.NISACT) NISACT.submit({activity:'reported-speech', title:'Reported Speech — '+PRACTICE[plevel].label,
    level:plevel, score:score, total:set.length, lives:lives, duration:elapsed});
}

function render(){ if(tab==='learn'){ clearInterval(timer); renderLearn(); } else renderPractice(); }
render();
</script>
