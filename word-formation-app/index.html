.afijo{font-size:1.18rem;font-weight:700;color:var(--primary-d)}
.sentido{font-weight:600;margin-left:9px;color:var(--ink)}
.badge.n{background:var(--accent-soft);color:#3730A3}
.badge.a{background:var(--amber50);color:var(--sand-txt)}
.badge.v{background:var(--green50);color:var(--green-txt)}
.badge.d{background:var(--line);color:#9D174D}
.nota{margin-top:7px;font-size:.9rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 10px;font-size:.88rem;cursor:pointer;font-family:inherit;color:var(--ink)}
.chip:hover{border-color:var(--primary);background:var(--primary-l)}
.chip.on{border-color:var(--primary);background:var(--primary-l);color:var(--primary-d);font-weight:600}

.fam{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;align-items:center}
.flecha{color:var(--muted)}
.stem{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin:10px 0 14px;font-size:1.02rem}
.stem u{text-decoration:none;border-bottom:2px dashed var(--primary);padding:0 26px}
.given{display:inline-block;margin-top:9px;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--primary-d);background:var(--primary-l);border-radius:6px;padding:3px 9px}
.modos{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 14px}
.modo{border:2px solid var(--line);background:var(--card);border-radius:11px;padding:8px 15px;cursor:pointer;font-weight:600;font-size:.92rem;color:var(--muted);font-family:inherit}
.modo b{color:var(--ink)}
.modo[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-l);color:var(--primary-d)}
.modo[aria-pressed="true"] b{color:var(--primary-d)}

<script>
/* Guardado en la cuenta del alumno (WP-E). El motor (../wordform.js) es
   compartido con nada más — esta es su única página— pero no está en la
   lista de archivos a tocar, así que el enganche va aquí, envolviendo sus
   funciones globales (var/function de nivel superior, sin IIFE) en vez de
   editar el motor. */
(function(){
  'use strict';

  /* NISACT: mismo patrón que las demás actividades sueltas del portal
     (ver activity-save.js — no hay un módulo compartido). */
  if(!window.NISACT) window.NISACT = (function(){
    var CDN = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4';
    var sb = null;
    function cargaSDK(){
      return new Promise(function(res){
        if(window.supabase && window.supabase.createClient) return res();
        var s = document.createElement('script');
        s.src = CDN; s.onload = function(){ res(); }; s.onerror = function(){ res(); };
        document.head.appendChild(s);
      });
    }
    function cliente(){
      if(sb) return sb;
      if(!window.supabase || !window.supabase.createClient || !window.NIS_CONFIG) return null;
      sb = window.supabase.createClient(window.NIS_CONFIG.SUPABASE_URL, window.NIS_CONFIG.SUPABASE_KEY);
      return sb;
    }
    function submit(r){
      return cargaSDK().then(function(){
        var c = cliente();
        if(!c) return {skipped:true};
        return c.auth.getSession().then(function(s){
          var u = s && s.data && s.data.session && s.data.session.user;
          if(!u) return {skipped:true};
          return c.from('activity_attempts').insert({
            student_id:u.id, activity:r.activity, title:r.title, level:r.level || null,
            score:(r.score == null ? null : r.score), total:(r.total == null ? null : r.total),
            duration_sec:(r.duration == null ? null : r.duration)
          }).then(function(q){ return (q && q.error) ? {sent:false, motivo:q.error.message} : {sent:true}; });
        });
      }).catch(function(e){ return {sent:false, motivo:(e && e.message) || 'no connection'}; });
    }
    return {submit:submit};
  })();

  /* Cada marca (acierto o fallo) toca la barra Save/Submit. apunta() es el
     único sitio por el que pasan gap-fill, emparejar, mixto, contrarreloj
     y memoria — envolverlo cubre los cinco sin tocar cada uno. */
  var _apunta = apunta;
  apunta = function(clave, bien){
    _apunta(clave, bien);
    if(window.NIS_WORK) NIS_WORK.touch();
  };

  function reportaBloque(tit, ok, total, t0){
    if(!window.NISACT) return;
    NISACT.submit({
      activity:'wordform', level:LEVEL, score:ok, total:total,
      title:'Word Formation · ' + MODO + ' · ' + LEVEL + ' · Block ' + (IB + 1) + ' · ' + tit,
      duration:Math.round((Date.now() - (t0 || Date.now())) / 1000)
    });
  }

  var _iniciaRelleno = iniciaRelleno;
  iniciaRelleno = function(){ _iniciaRelleno(); if(ST){ ST.t0 = Date.now(); ST.reportado = false; } };
  var _sigRelleno = sigRelleno;
  sigRelleno = function(){
    _sigRelleno();
    if(ST && ST.i >= ST.huecos.length && !ST.reportado){
      ST.reportado = true;
      reportaBloque('Fill in the gaps', ST.ok, ST.huecos.length, ST.t0);
    }
  };

  var _iniciaEmparejar = iniciaEmparejar;
  iniciaEmparejar = function(){ _iniciaEmparejar(); if(ST){ ST.t0 = Date.now(); ST.reportado = false; } };
  var _sigRonda = sigRonda;
  sigRonda = function(){
    var antes = ST;
    if(antes && antes.r + 1 >= antes.rondas.length && !antes.reportado){
      antes.reportado = true;
      reportaBloque('Match', antes.ok, antes.ok + antes.err, antes.t0);
    }
    _sigRonda();
  };

  var _iniciaMixto = iniciaMixto;
  iniciaMixto = function(){ _iniciaMixto(); if(ST){ ST.t0 = Date.now(); ST.reportado = false; } };
  var _sigMixto = sigMixto;
  sigMixto = function(){
    _sigMixto();
    if(ST && ST.i >= ST.q.length && !ST.reportado){
      ST.reportado = true;
      reportaBloque('Mixed review', ST.ok, ST.q.length, ST.t0);
    }
  };

  /* Progreso para "Mi progreso": HECHOS y guardaProgreso() son globales del
     motor (afijo/familia -> {ok,no}), igual de válidos vistos desde aquí. */
  if(window.NIS_WORK) NIS_WORK.attach({
    slug:'wordform', grade:'g9', unit:0, week:null, auto:true,
    title:document.title,
    vacio:'Practise something first — then you can hand it in.',
    read: function(){ return { store:HECHOS }; },
    write: function(d){
      var p = (d && d.store) || {};
      Object.keys(p).forEach(function(k){ HECHOS[k] = p[k]; });
      guardaProgreso();
    },
    after: function(){ if(typeof DATA !== 'undefined' && DATA) render(); },
    count: function(d){ return Object.keys((d && d.store) || {}).length; },
    answers: function(d){
      var p = (d && d.store) || {}, out = {};
      Object.keys(p).forEach(function(k){
        var h = p[k] || {}, tot = (h.ok || 0) + (h.no || 0);
        out[k] = (h.ok || 0) + '/' + tot;
      });
      return out;
    }
  });
})();
</script>
