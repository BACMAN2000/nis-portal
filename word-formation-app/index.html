<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Formation · Nordic International School</title>
<link rel="icon" href="../favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../lexapp.css?v=bf8f5e87">
<script>try{var t=localStorage.getItem("nis-tema");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="stylesheet" href="../nis-tokens.css?v=36174a4f">
<style>
/* Lo propio de esta app: afijos, familias y el hueco al estilo Cambridge.
   Todo lo demás (tarjetas, carrusel, banco, juegos) viene de lexapp.css. */
.afijo{font-size:1.18rem;font-weight:700;color:var(--primary-d)}
.sentido{font-weight:600;margin-left:9px;color:var(--ink)}
.badge.n{background:var(--accent-soft);color:#3730A3}
.badge.a{background:var(--amber50);color:var(--sand-txt)}
.badge.v{background:var(--green50);color:var(--green-txt)}
.badge.d{background:var(--line);color:#9D174D}
.nota{margin-top:7px;font-size:.9rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 10px;font-size:.88rem;cursor:pointer;font-family:inherit;color:var(--ink)}
.chip:hover{border-color:var(--primary);background:var(--primary-l)}
.chip.on{border-color:var(--primary);background:var(--primary-l);color:var(--primary-d);font-weight:600}
.ex b{font-style:normal;color:var(--primary-d)}
.fam{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;align-items:center}
.flecha{color:var(--muted)}
.stem{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin:10px 0 14px;font-size:1.02rem}
.stem u{text-decoration:none;border-bottom:2px dashed var(--primary);padding:0 26px}
.given{display:inline-block;margin-top:9px;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--primary-d);background:var(--primary-l);border-radius:6px;padding:3px 9px}
.modos{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 14px}
.modo{border:2px solid var(--line);background:var(--card);border-radius:11px;padding:8px 15px;cursor:pointer;font-weight:600;font-size:.92rem;color:var(--muted);font-family:inherit}
.modo b{color:var(--ink)}
.modo[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-l);color:var(--primary-d)}
.modo[aria-pressed="true"] b{color:var(--primary-d)}
body.embed header{display:none}
body.embed .wrap{padding-top:14px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="crumb"><a href="../index.html">Portal</a> › Word formation</div>
    <h1>Word Formation</h1>
    <div class="sub">Prefijos, sufijos y familias de palabras, sacados de los textos de nuestros propios cursos.</div>
  </div>
</header>

<div class="wrap">
  <div class="levels" id="levels"></div>
  <div class="tabs" role="tablist">
    <button class="tab" id="tab-learn" role="tab" aria-selected="true" onclick="setTab('learn')">Aprender</button>
    <button class="tab" id="tab-practice" role="tab" aria-selected="false" onclick="setTab('practice')">Practicar</button>
    <button class="tab" id="tab-games" role="tab" aria-selected="false" onclick="setTab('games')">Juegos</button>
    <button class="tab" id="tab-progress" role="tab" aria-selected="false" onclick="setTab('progress')">Mi progreso</button>
  </div>
  <div id="view"><div class="empty">Cargando…</div></div>
</div>

<script>if(location.search.indexOf('embed=1') >= 0) document.body.classList.add('embed');</script>
<script src="../wordform.js?v=abc74dd1"></script>
<script src="../nis-tema.js?v=469a5ee4" defer></script>
</body>
</html>
