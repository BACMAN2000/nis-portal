<head>

<style>
:root{
  --blue:#4987c6;
  --blue-d:#2f5f93;
  --blue-dd:#244c77;
  --white:#fff;
  --grey:#636465;
  --line:#e2e8f0;
  --lila:#d1d2ea;
  --celeste:#76cbe5;
  --warn:#b45309;
  --r:16px;
  --r-sm:10px;
  --shadow:0 10px 30px rgba(36,76,119,.10);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Gotham','Montserrat',system-ui,Segoe UI,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5}
h1,h2,h3,h4{line-height:1.2;margin:0 0 .4em;font-weight:700}
a{color:var(--blue-d)}
header{display:flex;align-items:center;gap:14px;background:var(--blue);padding:12px 22px;color:var(--card);box-shadow:var(--shadow)}
header img{height:34px;width:auto;display:block}
header .spacer{flex:1}
header a.back{background:rgba(255,255,255,.16);color:var(--card);border:none;padding:8px 14px;border-radius:var(--r-sm);font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:7px;text-decoration:none}
header a.back:hover{background:rgba(255,255,255,.28)}
.wrap{max-width:1060px;margin:0 auto;padding:22px 18px 80px}
.hero{position:relative;overflow:hidden;color:var(--card);border-radius:var(--r);padding:26px 28px;margin-bottom:20px;box-shadow:var(--shadow)}
.hero .motivo{position:absolute;right:-8px;bottom:-38px;font-size:9rem;line-height:1;opacity:.18;pointer-events:none;user-select:none}
.hero .eyebrow{font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;color:#cfe3f6;font-weight:700;margin:0 0 8px}
.hero h1{color:var(--card);font-size:1.75rem;font-weight:800;margin:0}
.hero .sub{margin:6px 0 0;color:#e2edf8;font-size:.95rem;font-weight:500}
.hero .bigq{margin:16px 0 0;padding:13px 16px;background:rgba(255,255,255,.14);border-left:4px solid var(--celeste);border-radius:0 var(--r-sm) var(--r-sm) 0;font-size:1.02rem;font-weight:600}
.hero .meta{margin:14px 0 0;color:#dbe8f6;font-size:.83rem;display:flex;gap:8px;flex-wrap:wrap}
.hero .meta span{background:rgba(255,255,255,.16);padding:3px 10px;border-radius:999px}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow)}
.sec-title{display:flex;align-items:baseline;gap:10px;margin:28px 0 12px;flex-wrap:wrap}
.sec-title h2{font-size:1.15rem;color:var(--blue-dd);margin:0}
.sec-title .hint{font-size:.82rem;color:var(--grey)}
.btn-todo{margin-left:auto;border:1px solid var(--blue-d);background:var(--card);color:var(--blue-dd);border-radius:8px;padding:5px 12px;font-size:.82rem;font-weight:600;cursor:pointer}
.btn-todo:hover{background:var(--bg)}
@media print{.wk>.body{display:block!important}.btn-todo{display:none}}
.muted{color:var(--grey)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
ul.tight{margin:.3em 0 0;padding-left:1.15em}
ul.tight li{margin:.22em 0}

/* --- mapa de semanas --- */
.wk{background:var(--white);border:1px solid var(--line);border-left:5px solid var(--blue);
    border-radius:var(--r-sm);margin-bottom:10px;overflow:hidden}
.wk>summary{list-style:none;cursor:pointer;padding:13px 16px;display:flex;gap:12px;align-items:flex-start}
.wk>summary::-webkit-details-marker{display:none}
.wk>summary:hover{background:var(--bg)}
.wk .num{flex:0 0 auto;width:38px;height:38px;border-radius:10px;background:var(--bg);color:var(--blue-dd);
  font-weight:800;display:flex;align-items:center;justify-content:center;font-size:.95rem}
.wk .txt{flex:1;min-width:0}
.wk .foco{font-weight:700;color:var(--blue-dd);font-size:1rem}
.wk .fase{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--grey);font-weight:700}
.wk .ev{font-size:.78rem;font-weight:700;color:var(--blue-d);background:var(--bg);padding:3px 10px;border-radius:999px;white-space:nowrap;align-self:center}
.wk .body{padding:2px 16px 16px 66px;border-top:1px solid var(--line);margin-top:0}
.wk .hace{font-size:.9rem;margin:12px 0 14px}
.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.area{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;background:var(--card)}
.area.otra{background:var(--card);border-style:dashed}
.area.otra h5{color:var(--grey)}
.area h5{margin:0 0 5px;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--blue-d)}
.area h5 .ico{font-size:.95rem;margin-right:5px;letter-spacing:0;vertical-align:-1px}
.area ul{margin:0;padding-left:1.05em;font-size:.83rem;color:var(--ink)}
.area li{margin:.15em 0}
.pnote{font-size:.76rem;color:var(--grey);margin:10px 0 0}
/* La procedencia de una semana entera: en secundaria hay unidades sin
   contenido cargado y la pantalla tiene que decirlo donde se lee, no en
   una nota al pie que nadie abre. */
.nota-fuente{background:var(--card);border:1px solid #FDE68A;border-left:4px solid var(--gold);
  border-radius:8px;padding:9px 12px;color:var(--ink);font-size:.8rem;margin:0 0 12px}
.delDocx{font-size:.62rem;font-weight:700;color:var(--ink);background:var(--bg);
  padding:1px 6px;border-radius:999px;letter-spacing:0;text-transform:none}

/* --- el ingles de la casa dentro de la semana --- */
.ingles{margin-top:12px;border:1px solid #BFDBFE;background:var(--bg);border-radius:var(--r-sm);padding:11px 13px}
.ingles h5{margin:0 0 8px;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);
  display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ingles .ing-u{font-size:.72rem;font-weight:700;color:var(--ink);background:var(--accent-soft);
  padding:2px 8px;border-radius:999px;letter-spacing:0;text-transform:none}
.ing-b{margin-bottom:7px}
.ing-b h6{margin:0 0 2px;font-size:.78rem;color:var(--blue-dd);font-weight:700}
.ing-b ul{margin:0;padding-left:1.05em;font-size:.83rem}
.ing-b li{margin:.14em 0}
.ing-chips{display:flex;gap:8px;flex-wrap:wrap}
.ing-chips span{background:var(--bg);border:1px solid #BFDBFE;color:var(--blue-dd);
  border-radius:999px;padding:4px 11px;font-size:.82rem}
.ing-chips b{color:var(--ink)}

table.rub{width:100%;border-collapse:collapse;font-size:.86rem}
table.rub th,table.rub td{border:1px solid var(--line);padding:9px 11px;vertical-align:top;text-align:left}
table.rub th{background:var(--bg);color:var(--blue-dd);font-weight:700;font-size:.76rem;text-transform:uppercase;letter-spacing:.04em}
table.rub td.crit{background:var(--card);font-weight:600;width:32%}

.badge{display:inline-block;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:999px;margin-right:6px}
.badge.src{background:var(--bg);color:var(--ink)}
.badge.own{background:var(--card);color:#B45309}
.warnbox{background:var(--card);border:1px solid #FDE68A;border-radius:var(--r-sm);padding:13px 15px;font-size:.87rem}
.warnbox h4{margin:0 0 6px;color:var(--ink);font-size:.9rem}
.toddle{background:var(--bg);border:1px solid #DDD6FE;border-radius:var(--r-sm);padding:14px 16px;margin-bottom:16px}
.toddle h4{margin:0 0 8px;color:var(--ink);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}
.toddle ul{margin:0;padding-left:1.1em;font-size:.9rem}
.toddle li{margin:.25em 0}
.toddle .per{display:inline-block;min-width:26px;font-weight:800;color:var(--ink)}
.toddle .tipo{font-size:.76rem;color:var(--grey)}
.toddle a{color:var(--ink);text-decoration:none;font-weight:600}
.toddle a:hover{text-decoration:underline}
.srcbox{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:13px 15px;font-size:.82rem;color:var(--grey)}
.arcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
a.arc{display:block;text-decoration:none;color:var(--card);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-height:150px;position:relative;overflow:hidden}
a.arc .ic{font-size:2.4rem;line-height:1}
a.arc h3{margin:10px 0 3px;color:var(--card);font-size:1.08rem}
a.arc p{margin:0;font-size:.83rem;color:rgba(255,255,255,.86)}
a.arc .tag{position:absolute;top:14px;right:14px;font-size:.7rem;font-weight:700;background:rgba(255,255,255,.22);padding:3px 9px;border-radius:999px}
.center{text-align:center}
button.lang{background:rgba(255,255,255,.16);color:var(--card);border:none;padding:8px 14px;
  border-radius:var(--r-sm);font-weight:600;font-size:.9rem;font-family:inherit;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px}
button.lang:hover{background:rgba(255,255,255,.30)}
/* --- modelo de la entrega: la lamina que ensena que hay que producir ---
   Un nombre ("Evidence Map") no dice que forma tiene la cosa. La lamina de
   project-art.js se dibuja aqui, y al lado van sus partes, el ingles que hace
   falta para hacerla y como se mejora. */
.aliento{margin:12px 0 14px;padding:11px 14px 11px 16px;border-radius:var(--r-sm);
  background:var(--bg);border:1px solid #BBF7D0;border-left:4px solid var(--good);
  font-size:.95rem;font-weight:600;color:var(--ink);position:relative}
.aliento::before{content:'“';position:absolute;left:6px;top:-2px;font-size:1.7rem;color:#86EFAC;line-height:1}
.aliento span{display:block;font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink);font-weight:800;margin-bottom:3px}
.mdl{margin:14px 0 4px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card);overflow:hidden}
.mdl>h5{margin:0;padding:9px 13px;background:var(--bg);color:var(--blue-dd);
  font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;
  display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.mdl>h5 b{font-size:.86rem;letter-spacing:0;text-transform:none;color:var(--blue-dd)}
.mdl .cuerpo{display:grid;grid-template-columns:minmax(0,290px) minmax(0,1fr);gap:16px;padding:14px}
.mdl .lamina{border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--card);align-self:start}
.mdl .lamina p{margin:0;padding:6px 9px;background:var(--bg);border-top:1px solid var(--line);
  font-size:.7rem;color:var(--grey);text-align:center}
.mdl .que{margin:0 0 10px;font-size:.9rem}
.mdl h6{margin:12px 0 4px;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--blue-d)}
.mdl ul.partes{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:7px}
.mdl ul.partes li{font-size:.83rem;background:var(--bg);border:1px solid var(--line);
  border-radius:999px;padding:4px 12px 4px 9px}
.mdl ul.partes li::before{content:'✓';color:var(--good);font-weight:800;margin-right:5px}
.mdl .apoyo{display:flex;flex-wrap:wrap;gap:7px}
.mdl .apoyo code{background:var(--bg);border:1px solid #BFDBFE;color:var(--ink);border-radius:8px;
  padding:4px 10px;font-size:.83rem;font-family:inherit;font-style:italic}
.mdl .mejora{margin:12px 0 0;background:var(--card);border:1px solid #FDE68A;border-radius:var(--r-sm);
  padding:10px 13px;font-size:.86rem;color:var(--ink)}
.mdl .mejora b{color:var(--ink)}
.mdl-thumb{flex:0 0 auto;width:66px;border:1px solid var(--line);border-radius:7px;overflow:hidden;
  background:var(--card);align-self:center;display:block}
.mdl-thumb svg{display:block}
.tira{display:grid;grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:10px}
.tira a{text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:var(--r-sm);
  overflow:hidden;background:var(--card);display:block}
.tira a:hover{border-color:var(--blue);box-shadow:var(--shadow)}
.tira .pie{padding:6px 8px;border-top:1px solid var(--line)}
.tira .pie b{display:block;font-size:.68rem;color:var(--blue-d);letter-spacing:.06em}
.tira .pie span{display:block;font-size:.74rem;color:var(--ink);line-height:1.25}
.finalmdl{display:grid;grid-template-columns:minmax(0,330px) minmax(0,1fr);gap:18px;align-items:start}
a.arc .lam{position:absolute;right:10px;bottom:10px;width:104px;border-radius:8px;overflow:hidden;
  opacity:.94;box-shadow:0 4px 14px rgba(0,0,0,.18)}
a.arc .lam svg{display:block}
a.arc p{max-width:60%}
.cursos{margin-top:14px;border:1px solid #FDE68A;background:var(--card);border-radius:var(--r-sm);padding:11px 13px}
.cursos>h5{margin:0 0 9px;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);
  display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cursos .area.curso{background:var(--card);border-color:#FDE68A}
.cursos .area.curso h5{color:var(--ink);text-transform:none;letter-spacing:0;font-size:.8rem}
.cursos .area.curso p{margin:0;font-size:.85rem;line-height:1.4}
.cursos .area.curso.delplan{border-color:#BBF7D0;background:var(--bg)}
.cursos .area.curso.delplan h5{color:var(--ink)}
.cursos .area.curso h5 .badge{font-size:.6rem;padding:1px 6px;margin-left:4px;vertical-align:1px}
@media print{.mdl{break-inside:avoid}.tira{display:none}.cursos{break-inside:avoid}}
@media(max-width:760px){
  .mdl .cuerpo,.finalmdl{grid-template-columns:1fr}
  a.arc .lam{display:none}a.arc p{max-width:100%}
}
@media(max-width:640px){
  .wk .body{padding-left:16px}
  .hero h1{font-size:1.35rem}
  /* En el movil la cabecera de la semana no tiene sitio para todo: la
     miniatura se quita (la lamina entera esta dentro igualmente) y el chip
     de la entrega deja de ir en una sola linea, que era lo que lo montaba
     encima del titulo. */
  .mdl-thumb{display:none}
  .wk>summary{flex-wrap:wrap}
  .wk .ev{white-space:normal;align-self:flex-start;text-align:left}
}
</style>
</head>
<body>
<header>
  <img src="assets/logo-white-h.svg" alt="Nordic International School" onerror="this.style.display='none'">
  <div class="spacer"></div>
  <button class="lang" id="lang" type="button">&#127760; Español</button>
  <a class="back" id="back" href="./">&#8592; Back</a>
</header>

<div class="wrap" id="app"><p class="muted">Loading…</p></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="config.js?v=68725f64"></script>

<script src="project-art.js?v=439f0576"></script>
<script src="project-models.js?v=5b2d5af7"></script>
<script src="project-cursos.js?v=c8aeeb5e"></script>
<script src="project-cursos-en.js?v=fa565fc1"></script>
<script src="project-arcs-sec.js?v=bb5518a4"></script>

<script src="project-arcs-sec11-en.js?v=d139d668"></script>
<script>
const $ = s => document.querySelector(s);
const P = new URLSearchParams(location.search);

/* ---------------- idioma ----------------
   La pagina nace ENTERA en ingles y el boton la pasa ENTERA a castellano.
   Lo unico que no cambia son los nombres propios: los titulos con que los
   proyectos estan dados de alta en Toddle y los nombres de producto que el
   colegio usa tal cual. Traducirlos seria falsear la fuente. */
let LANG = 'en';
try{ const g = localStorage.getItem('nis.project.lang'); if(g === 'es' || g === 'en') LANG = g; }catch(_){}

/* Acepta una cadena (igual en los dos idiomas) o un par {en, es}. */
function t(v){
  if(v == null) return '';
  if(typeof v === 'string') return v;
  return v[LANG] || v.en || v.es || '';
}

const UI = {
  cargando:    {en:'Loading…',                       es:'Cargando…'},
  volver:      {en:'&#8592; Back',                   es:'&#8592; Volver'},
  otroIdioma:  {en:'&#127760; Español',              es:'&#127760; English'},
  tituloIndice:{en:'Interdisciplinary projects',     es:'Proyectos interdisciplinarios'},
  subIndice:   {en:'One project per term, eleven or twelve weeks long, built on the crossings the school annual plan already has written down.',
                es:'Un proyecto por trimestre, de once o doce semanas, sobre los cruces que el plan anual del colegio ya tiene escritos.'},
  arco:        {en:'arc',  es:'arco'},
  arcos:       {en:'arcs', es:'arcos'},
  semanasCal:  {en:'34 weeks of calendar',           es:'34 semanas de calendario'},
  sinArcos:    {en:'This grade has no project declared yet.',
                es:'Este grado todavía no tiene ningún proyecto declarado.'},
  fueraTitulo: {en:'What is not inside an arc',      es:'Lo que no está en un arco'},
  fueraHint:   {en:'and why',                        es:'y por qué'},
  trimestre:   {en:'Term',                           es:'Trimestre'},
  semanas:     {en:'weeks',                          es:'semanas'},
  docColegio:  {en:'A school document',              es:'Documento del colegio'},
  toddleTit:   {en:'In Toddle, the school planner',  es:'En Toddle, el planificador del colegio'},
  toddleNada:  {en:'This term has no project entered there. What follows rests only on the annual plan spreadsheet.',
                es:'Este trimestre no tiene ningún proyecto dado de alta. Lo que sigue se apoya solo en el plan anual en Excel.'},
  mision:      {en:'The mission',                    es:'La misión'},
  misionHint:  {en:'what the student is told',       es:'lo que se le cuenta al alumno'},
  producto:    {en:'What you end up with',           es:'Con qué te quedas'},
  paraQuien:   {en:'Who it is for:',                 es:'Para quién:'},
  guia:        {en:'Guiding questions',              es:'Preguntas orientadoras'},
  guiaHint:    {en:'one per subject',                es:'una por área'},
  semana:      {en:'Week by week',                   es:'Semana a semana'},
  semanaHint:  {en:'the project on top, and underneath what each subject teaches that same week according to the annual plan',
                es:'el proyecto arriba, y debajo lo que cada área da esa misma semana según el plan anual'},
  planFallo:   {en:'The annual plan could not be read',
                es:'No se pudo leer el plan anual'},
  planFalloTxt:{en:'The weeks are drawn all the same, but without the content of each subject',
                es:'Las semanas se pintan igual, pero sin el contenido de cada área'},
  periodo:     {en:'Period',                         es:'Periodo'},
  periodoNota: {en:'the school calls it <i>Project %s</i> in the calendar',
                es:'el colegio lo llama <i>Project %s</i> en el calendario'},
  /* --- que hace cada curso esta semana --- */
  verPlan:     {en:'Printable plan: week by week and subject by subject',
                es:'Plan imprimible: semana a semana y curso por curso'},
  arco11:      {en:'The eleven-week arc', es:'El arco de once semanas'},
  enCurso:     {en:'now', es:'en curso'},
  arco11Hint:  {en:'two units in a row, one project, and what every subject does each week',
                es:'dos unidades seguidas, un proyecto, y lo que hace cada curso cada semana'},
  integraTit:  {en:'What each subject contributes to the final product',
                es:'Qué aporta cada curso al producto final'},
  integraHint: {en:'this is the interdisciplinary part: take one out and the product is incomplete',
                es:'esta es la parte interdisciplinaria: quita uno y el producto queda incompleto'},
  cursosInvol: {en:'Subjects involved', es:'Cursos involucrados'},
  verUnidades: {en:'The same arc, unit by unit', es:'El mismo arco, unidad por unidad'},
  arcoPropuesta:{en:'Portal proposal', es:'Propuesta del portal'},
  arcoPropTxt: {en:'This grade has no Project document written for these two periods, and the annual plan only loads English. Everything that is not English here is what this page proposes so that the term has a project: the teacher and coordination approve it, change it or drop it.',
                es:'Este grado no tiene documento Project escrito para estos dos periodos, y el plan anual solo carga inglés. Todo lo que aquí no es inglés es lo que esta página propone para que el trimestre tenga proyecto: la profesora y coordinación lo aprueban, lo cambian o lo descartan.'},
  yaPropuesto: {en:'Already has a proposal', es:'Ya tiene propuesta'},
  cursosTit:   {en:'What each subject does this week', es:'Lo que hace cada curso esta semana'},
  cursosHint:  {en:'the task of each subject inside the project', es:'la tarea de cada curso dentro del proyecto'},
  delPlanBadge:{en:'from the annual plan', es:'del plan anual'},
  delScopeBadge:{en:'from the English Scope', es:'del Scope de inglés'},
  cursosProp:  {en:'Portal proposal — to agree with each teacher',
                es:'Propuesta del portal — para acordar con cada profesor'},
  /* --- proyectos interdisciplinarios de secundaria --- */
  secProy:     {en:'Interdisciplinary projects', es:'Proyectos interdisciplinarios'},
  secProyHint: {en:'one per unit, six weeks each, built on what each subject already teaches',

/* ====================== el ingles de la casa, semana a semana =============
   Cada periodo del calendario es una unidad del Scope & Sequence (P1 = U1 ...
   P6 = U6). La unidad trae once bloques -phonics, vocabulario, lectura, plan
   lector, gramatica, escritura, listening y speaking- y el periodo tiene cinco
   o seis semanas: el reparto de abajo dice que toca cada semana.

   El reparto es NUESTRO, no del colegio; por eso sale marcado. El contenido de
   cada bloque no se retoca: sale tal cual del JSON. */
const ING_REPARTO = [
  ['Phonics', 'Vocabulary Development'],
  ['Reading Skills', 'Textual Comprehension'],
  ['Reading Plan', 'Listening Skills'],
  ['Language Conventions (Writing)', 'Idea Development & Process'],
  ['Speaking Skills', 'Text Types (Writing)'],
  ['Writing Reflection', 'Reading Plan']
];

/* Un arco puede declarar que su ingles es UNA sola unidad extendida por todo el
   arco (ingUnidad en project-arcs.js), en vez de una unidad por periodo. Ahi el
   reparto no cicla cada seis semanas: los once bloques caen uno por semana, en
   el orden en que se construye el proyecto — primero la lengua que se necesita,
   despues leer y escuchar, luego la gramatica, y al final escribir, presentar y
   reflexionar. Once bloques, once semanas, sin repetir ninguno. */
const ING_UNA_UNIDAD = [
  'Phonics', 'Vocabulary Development', 'Reading Skills', 'Reading Plan',
  'Textual Comprehension', 'Listening Skills', 'Language Conventions (Writing)',
  'Idea Development & Process', 'Text Types (Writing)', 'Speaking Skills',
  'Writing Reflection'
];

function gradoScope(grade){
  if(!SCOPE || !SCOPE.grados) return null;
  const g = String(grade || '').toUpperCase();
  return SCOPE.grados.find(x => String(x.grado).toUpperCase() === g) || null;
}

function unidadDe(grade, periodo){
  const g = gradoScope(grade);
  if(!g || !g.unidades) return null;
  return g.unidades.find(u => Number(u.n) === Number(periodo)) || null;
}

/* Lo que toca esa semana: uno o dos bloques de la unidad. */
function inglesSemana(grade, periodo, semana, arco, semanaArco){
  const fija = arco && arco.ingUnidad;
  const u = unidadDe(grade, fija || periodo);
  if(!u) return null;
  if(fija){
    const nombre = ING_UNA_UNIDAD[(Number(semanaArco || semana) - 1) % ING_UNA_UNIDAD.length];
    const b = (u.bloques || []).filter(x => x.bloque === nombre);
    return {unidad: u, bloques: b};
  }
  const quiere = ING_REPARTO[(Number(semana) - 1) % ING_REPARTO.length] || [];
  const bloques = (u.bloques || []).filter(b => quiere.indexOf(b.bloque) >= 0);
  return bloques.length ? {unidad: u, bloques: bloques} : {unidad: u, bloques: []};
}

function bloqueInglesHTML(grade, periodo, semana, arco, semanaArco){
  const x = inglesSemana(grade, periodo, semana, arco, semanaArco);
  if(!x) return '';
  const partes = x.bloques.map(b =>
    `<div class="ing-b"><h6>${esc(b.bloque)}</h6><ul>` +
    (b.puntos || []).slice(0, 4).map(p => `<li>${esc(p)}</li>`).join('') +
    `</ul></div>`).join('');
  return `<div class="ingles">
    <h5>${u('inglesTit')} <span class="ing-u">${u('unidad')} ${x.unidad.n} · ${esc(x.unidad.tema)}</span></h5>
    ${partes || '<p class="pnote" style="margin:0">' + u('inglesSinBloque') + '</p>'}
    <p class="pnote" style="margin:8px 0 0">${u('inglesFuente')}</p>
  </div>`;
}

/* La cabecera del trimestre: que examen prepara el grado, que se espera de el
   y que hito de Cambridge cae dentro. Sin esto, el proyecto no dice a donde
   lleva. */
function inglesDelArco(a){
  const g = gradoScope(a.grade);
  if(!g) return '';
  const via = (SCOPE.pathway || []).find(p => String(p.grado).toUpperCase() === String(a.grade).toUpperCase());
  const kpi = (SCOPE.benchmarks || []).find(p => String(p.grado).toUpperCase() === String(a.grade).toUpperCase());
  const unidades = a.ingUnidad ? [unidadDe(a.grade, a.ingUnidad)].filter(Boolean)
    : (a.periodos || []).map(p => unidadDe(a.grade, p)).filter(Boolean);

  const chips = [];
  if(via && via.examen)     chips.push(`<span><b>${u('examen')}</b> ${esc(via.examen)}</span>`);
  if(g.cefr)                chips.push(`<span><b>CEFR</b> ${esc(g.cefr)}</span>`);
  if(via && via.escritura)  chips.push(`<span><b>${u('escritura')}</b> ${esc(via.escritura)}</span>`);
  if(via && via.lectura)    chips.push(`<span><b>${u('lectura')}</b> ${esc(via.lectura)}</span>`);

  const filasKpi = kpi ? ['listening','speaking','reading','writing','lengua']
    .filter(k => kpi[k]).map(k =>
      `<tr><td class="crit">${u('kpi_' + k)}</td><td>${esc(kpi[k])}</td></tr>`).join('') : '';

  const lector = unidades.map(un => {
    const b = (un.bloques || []).find(x => x.bloque === 'Reading Plan');
    return b ? `<li><b>${u('unidad')} ${un.n}</b> — ${esc((b.puntos || []).join(' · '))}</li>` : '';
  }).join('');

  const gram = unidades.map(un => {
    const b = (un.bloques || []).find(x => x.bloque === 'Language Conventions (Writing)');
    return b ? `<li><b>${u('unidad')} ${un.n}</b> — ${esc((b.puntos || []).filter(p => p.indexOf('Bloom') < 0).join(' · '))}</li>` : '';
  }).join('');

  return `<div class="sec-title"><h2>${u('inglesArcoTit')}</h2>
      <span class="hint">${u('inglesArcoHint')}</span></div>
    <div class="card">
      <div class="ing-chips">${chips.join('')}</div>
      ${filasKpi ? `<h4 style="margin:16px 0 6px;font-size:.9rem">${u('kpiTit')}</h4>

/* ================= secundaria: 6.o a 11.o ================================
   Aqui no hay arcos ni matriz semana x area: secundaria no los tiene escritos.
   Se ensena la secuencia de ingles del grado -que si esta, unidad por unidad-
   y el mapa de lo que cada area tiene cargado en Toddle. Lo que falta se dice. */
const SEC_GRADOS = ['g6','g7','g8','g9','g10','g11'];
const SEC_LBL = {g6:'6th', g7:'7th', g8:'8th', g9:'9th', g10:'10th', g11:'11th'};

function esSecundaria(g){ return SEC_GRADOS.indexOf(String(g||'').toLowerCase()) >= 0; }

function areasToddle(grade){
  if(!SEC || !SEC.areas) return [];
  const n = Number(String(grade).replace('g',''));
  return SEC.areas.filter(a => (a.grados||[]).indexOf(n) >= 0).map(a => ({
    area: a.area,
    unidades: ((a.cobertura||{})[String(n)] || []),
    hueco: a.hueco || ''
  }));
}

/* ---- proyectos interdisciplinarios de secundaria ----------------------
   El colegio tiene los contenidos escritos por area y unidad, y la columna de
   conexiones practicamente vacia. Aqui se pintan las dos cosas juntas y se
   distingue siempre cual es cual: lo del colegio va marcado como suyo y la
   propuesta del portal, como propuesta. */
function proyectosDe(grade){
  const PS = window.PROJECT_SEC || {};
  return Object.keys(PS).filter(k => k.indexOf(grade + '.') === 0)
    .map(k => [k, PS[k]]).sort((a, b) => a[1].unidad - b[1].unidad);
}

/* Los contenidos reales de ese grado y unidad, indexados por clave de area. */
function contenidoSec(grado, unidad){
  if(!CONEX) return null;
  const pr = (CONEX.proyectos || []).find(x => x.unidad === unidad);
  if(!pr) return null;
  const g = pr.grados[String(grado)];
  if(!g) return null;
  const out = {};
  (g.areas || []).forEach(a => {
    const k = window.PROJECT_SEC_AREA_KEY(a.area);
    const key = k || ('otra:' + a.area);
    out[key] = out[key] || {nombre: a.area, contenidos: [], propias: []};
    out[key].contenidos = out[key].contenidos.concat(a.contenidos || []);
    out[key].propias = out[key].propias.concat(a.conexiones || []);
  });
  return {doc: g, areas: out};
}

function pintaSecundaria(grade){
  const g = gradoScope(grade);
  if(!g){ $('#app').innerHTML = '<p class="muted">'+u('secSinScope')+'</p>'; return; }
  const via = (SCOPE.pathway || []).find(p => String(p.grado).toUpperCase() === String(grade).toUpperCase()) || {};
  const kpi = (SCOPE.benchmarks || []).find(p => String(p.grado).toUpperCase() === String(grade).toUpperCase()) || {};
  const lbl = SEC_LBL[String(grade).toLowerCase()] || grade;

  let h = `<div class="hero" style="background:linear-gradient(135deg,#2f5f93,#4987c6)">
    <div class="motivo">🎓</div>
    <p class="eyebrow">${esc(lbl)} · 2026 · ${u('secundaria')}</p>
    <h1>${esc(u('secTit'))}</h1>
    <p class="sub">${esc(u('secSub'))}</p>
    <div class="meta"><span>${esc(via.examen || '—')}</span><span>CEFR ${esc(g.cefr||'')}</span>
      <span>${g.unidades.length} ${u('unidades')}</span></div></div>`;

  /* Los proyectos interdisciplinarios del grado. Van primero porque son lo
     que el colegio llama "Proyecto" en su propio calendario, y porque es la
     parte que coordinacion tiene que revisar. */
  /* El arco de once semanas va primero: es el proyecto del trimestre, y los
     de unidad son sus dos mitades. */
  const a11 = Object.keys(window.PROJECT_SEC11 || {})
    .filter(x => x.indexOf(String(grade).toLowerCase() + '.') === 0)
    .sort((a, b) => window.PROJECT_SEC11[a].trimestre - window.PROJECT_SEC11[b].trimestre);
  /* Cual de los arcos del grado es el de ahora. Los de secundaria no llevan
     fechas, llevan trimestre; el calendario del colegio los reparte marzo-mayo,
     junio-agosto y setiembre-noviembre. */
  const mes = new Date().getMonth();

/* Lo que en esta semana sale de los Project.docx y no de la hoja del plan. */
function deProyecto(grade, periodo, semana){
  if(grade !== 'g1' || !PLAN_G1) return null;
  const p = PLAN_G1.periodos && PLAN_G1.periodos[String(periodo)];
  return (p && p[String(semana)]) || null;
}

/* Semanas que el Excel del plan anual escribe de mas: el calendario da 34
   semanas de clase y algunas hojas cargan una sexta donde solo hay cinco. No
   se tira ese contenido — se avisa, que es lo unico honesto. */
function sobranteDe(grade, periodo){
  if(!PLAN) return [];
  const g = PLAN.grados && PLAN.grados[grade];
  if(!g) return [];
  const p = g.periodos.find(x => x.periodo === periodo);
  return (p && p.fuera_de_calendario) || [];
}

/* Contenido real del plan anual para un grado, periodo y semana. */
function contenidoDe(grade, periodo, semana){
  if(!PLAN) return null;
  const g = PLAN.grados && PLAN.grados[grade];
  if(!g) return null;
  const p = g.periodos.find(x => x.periodo === periodo);
  if(!p) return null;
  const s = p.semanas.find(x => x.n === semana);
  const base = s ? s.areas : null;
  const extra = deProyecto(grade, periodo, semana);
  if(!extra) return base;
  const junto = Object.assign({}, base || {});
  Object.keys(extra).forEach(a => { junto[a] = (junto[a] || []).concat(extra[a]); });
  return junto;
}

/* ---------------- quien mira ---------------- */
let CONEX = null;
let sb=null, me=null, esProfe=false;
async function conectar(){
  try{
    const cfg = window.NIS_CONFIG;
    if(cfg && window.supabase && window.supabase.createClient){
      sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_KEY);
      const {data} = await sb.auth.getSession();
      me = data && data.session ? data.session.user : null;
    }
  }catch(_){ me = null; }
  if(!me) return;
  try{
    const t = await sb.from('teacher_access').select('can_results').eq('profile_id',me.id).maybeSingle();
    esProfe = !!(t && t.data && t.data.can_results);
    if(!esProfe){
      const pr = await sb.from('profiles').select('role').eq('id',me.id).maybeSingle();
      const rol = pr && pr.data && pr.data.role;
      esProfe = (rol === 'admin' || rol === 'teacher');
    }
  }catch(_){ esProfe = false; }
}

/* ---------------- modelos de entrega ----------------
   El arco ya decia QUE se entrega cada semana ("Evidence Map"). Aqui se
   ensena QUE FORMA tiene: la lamina de project-art.js, sus partes, el ingles
   que hace falta para hacerla y la linea de como se mejora. Y la frase de
   aliento de esa semana, que es lo primero que se lee al abrirla.

   Todo esto es opcional: si un arco no tiene modelos, la pagina queda
   exactamente como estaba en vez de pintar huecos. */
function modelosDe(k){ return (window.PROJECT_MODELS || {})[k] || null; }

/* La lamina se dibuja con los textos YA traducidos: el SVG pinta un idioma,
   no un par. */
function lamina(m, cover, alto){
  if(!m || !window.modeloSVG) return '';
  return window.modeloSVG({tipo: m.tipo, titulo: t(m.titulo),
    partes: (m.partes || []).map(t)}, cover, {alto: alto || 210});
}
function miniatura(m, cover){
  if(!m || !window.modeloSVG) return '';
  return `<span class="mdl-thumb">${lamina(m, cover, 46)}</span>`;
}

function bloqueModelo(m, cover){
  if(!m) return '';
  return `<div class="mdl">
    <h5>${u('modeloTit')} <b>${esc(t(m.titulo))}</b></h5>
    <div class="cuerpo">
      <div class="lamina">${lamina(m, cover)}<p>${u('modeloPie')}</p></div>
      <div>
        <p class="que">${esc(t(m.que))}</p>
        <h6>${u('modeloQue')}</h6>
        <ul class="partes">${(m.partes || []).map(x=>`<li>${esc(t(x))}</li>`).join('')}</ul>
        ${(m.apoyo || []).length ? `<h6>${u('modeloApoyo')}</h6>
          <div class="apoyo">${m.apoyo.map(x=>`<code>${esc(x)}</code>`).join('')}</div>` : ''}
        <p class="mejora"><b>${u('modeloMejora')}</b> ${esc(t(m.mejora))}</p>
      </div>
    </div></div>`;
}

/* La tarea de cada curso dentro del proyecto, semana a semana. Es distinto
   del bloque del Annual Plan: aquel dice lo que el area DA esa semana (y es
   del colegio); este dice lo que ese curso APORTA AL PROYECTO (y es
   propuesta). Se pintan los dos, y cada uno con su etiqueta. */
/* La linea de cada curso, en el idioma del portal. Las traducciones viven
   en project-cursos-en.js (primaria) y project-arcs-sec11-en.js (secundaria),
   con las mismas claves; si falta la de un curso, se queda el castellano. */
/* Los nombres de area de secundaria estan en castellano en el documento del
   colegio; en la vista inglesa se rotulan en ingles. */
const AREA_NOMBRE_EN = {
  com:'Spanish', mat:'Math', cyt:'Science', ccss:'Social Studies', arte:'Art & Culture',
  ict:'ICT', ing:'English', sh:'Spiritual History', fr:'French', fil:'Philosophy',
  ent:'Enterprise', tutoria:'Tutoring', comunicacion:'Spanish'
};
const nombreArea = x => (LANG === 'en' && AREA_NOMBRE_EN[x]) || AREA_NOMBRE[x] || x;

function cursosEn(k, n, cursos){
  if(LANG !== 'en' || !cursos) return cursos;
  const p = ((window.PROJECT_CURSOS_EN || {})[k] || {}).semanas || {};
  const s = (((window.SEC11_EN || {})[k] || {}).semanas || {})[n] || {};
  const t = Object.assign({}, p[n] || {}, s.cursos || {});
  if(!Object.keys(t).length) return cursos;
  const out = {};
  Object.keys(cursos).forEach(c => { out[c] = t[c] || cursos[c]; });
  return out;
}
function notaEn(k, n, nota){
  if(LANG !== 'en' || !nota) return nota;
  const s = (((window.SEC11_EN || {})[k] || {}).semanas || {})[n] || {};
  return s.nota || nota;
}

function bloqueCursos(cursos){
  if(!cursos) return '';
  const ks = AREA_ORDEN.filter(x => cursos[x]).concat(
    Object.keys(cursos).filter(x => AREA_ORDEN.indexOf(x) < 0));
  if(!ks.length) return '';
  /* Una linea que empieza por "Del plan:" es contenido del colegio, copiado
     del Annual Plan de esa misma semana; el resto es propuesta del portal. */
  const tarjeta = x => {
    const txt = String(cursos[x] || '');
    const m = txt.match(RE_FUENTE);
    /* El parentesis del prefijo dice de que semana del plan sale la linea:
       se conserva al principio del texto, que es donde se lee. */
    const cuerpo = m ? ((m[2] ? m[2].trim() + ' ' : '') + txt.slice(m[0].length)) : txt;
    return `<div class="area curso${m ? ' delplan' : ''}">
      <h5><span class="ico" aria-hidden="true">${AREA_ICONO[x] || '\u2022'}</span>${nombreArea(x)}
        ${m ? `<span class="badge src">${u(m[1] === 'Scope' ? 'delScopeBadge' : 'delPlanBadge')}</span>` : ''}</h5>
      <p>${esc(cuerpo)}</p></div>`;
  };
  return `<div class="cursos">
    <h5>${u('cursosTit')} <span class="badge own">${u('cursosProp')}</span></h5>
    <div class="areas">${ks.map(tarjeta).join('')}</div></div>`;
}

function bloqueAliento(al){
  if(!al) return '';
  return `<p class="aliento"><span>${u('aliento')}</span>${esc(t(al))}</p>`;
}

/* La tira: las once entregas seguidas, antes de abrir ninguna semana. Es la
   respuesta visual a "de que va todo esto": se ve el camino entero. */
function tiraEntregas(k, a){
  const M = modelosDe(k);
  if(!M) return '';
  const items = a.fases.map(f => {
    const s = M.semanas[f.n];
    if(!s) return '';
    return `<a href="#w${f.n}" data-w="${f.n}">${lamina(s.modelo, a.cover, 78)}
      <span class="pie"><b>W${f.n}</b><span>${esc(t(s.modelo.titulo))}</span></span></a>`;
  }).join('');
  return `<div class="sec-title"><h2>${u('tiraTit')}</h2>
    <span class="hint">${u('tiraHint')}</span></div>
    <div class="tira">${items}</div>`;
}

/* ---------------- indice ---------------- */
function pintaIndice(){
  /* ?grade=g3 acota el indice al grado del alumno. Sin el, se ven todos:
     es la vista de coordinacion. */
  const soloGrado = P.get('grade') || '';
  const porGrado = {};
  Object.keys(ARCS).forEach(k => {
    const a = ARCS[k];
    if(soloGrado && a.grade !== soloGrado) return;
    (porGrado[a.grade] = porGrado[a.grade] || []).push([k, a]);
  });
  const grados = Object.keys(porGrado).sort();
  const nArcos = grados.reduce((n,g)=>n+porGrado[g].length,0);
  const etiqueta = soloGrado && grados.length ? porGrado[grados[0]][0][1].label : u('primaria');
  let h = `<div class="hero" style="background:linear-gradient(135deg,#244c77,#4987c6)">
    <div class="motivo">🧩</div>
    <p class="eyebrow">${esc(etiqueta)} · 2026</p>
    <h1>${u('tituloIndice')}</h1>
    <p class="sub">${u('subIndice')}</p>
    <div class="meta"><span>${nArcos} ${nArcos===1?u('arco'):u('arcos')}</span>
      <span>${u('semanasCal')}</span><span>P1–P6</span></div>
  </div>`;
  h += `<div class="card" style="border-left:5px solid var(--warn);margin-bottom:16px">
    <a href="unidad56.html?${soloGrado ? 'grado=' + soloGrado.replace('g','') : 'etapa=primaria'}"
      ><b>${u('verU56')}</b> &#8594;</a><br>
    <span class="hint">${u('verU56Hint')}</span></div>`;
  if(!nArcos){
    h += `<div class="card center"><p class="muted" style="margin:0">
      ${u('sinArcos')}</p></div>`;
  }

  grados.forEach(g => {
    h += `<div class="sec-title"><h2>${esc(porGrado[g][0][1].label)}</h2></div><div class="arcs">`;
    porGrado[g].sort((a,b)=>a[1].periodos[0]-b[1].periodos[0]).forEach(([k,a]) => {
      /* La tarjeta ensena la lamina del producto final: desde el indice ya se
         ve con que se acaba, que es la pregunta que hace todo el mundo. */
      const mk = modelosDe(k);
      h += `<a class="arc" href="project.html?arc=${encodeURIComponent(k)}"
        style="background:linear-gradient(135deg,${a.cover.from},${a.cover.to})">
        <span class="tag">P${a.periodos.join('+')} · ${a.semanas} ${u('semanas')}</span>
        <div class="ic">${a.cover.icon}</div>
        <h3>${esc(t(a.titulo))}</h3>
        <p>${esc(t(a.subtitulo))}</p>
        ${mk ? `<span class="lam">${lamina(mk.final, a.cover, 68)}</span>` : ''}</a>`;
    });
    h += `</div>`;
  });

  const sueltos = SUELTOS.filter(x => !soloGrado || x.grade === soloGrado);
  if(sueltos.length){
    h += `<div class="sec-title"><h2>${u('fueraTitulo')}</h2>
      <span class="hint">${u('fueraHint')}</span></div><div class="card">`;
    sueltos.forEach(s => {
      const urlS = urlToddle(s.grade, s.id);
      h += `<p style="margin:0 0 10px"><b>${urlS ? `<a href="${urlS}" target="_blank" rel="noopener">${esc(t(s.titulo))} &#8599;</a>` : esc(t(s.titulo))}</b>
        <span class="muted">— ${s.grade.toUpperCase()}, P${s.periodos.join(', P')}</span>
        ${s.resuelto ? `<span class="badge own" style="margin-left:6px">${u('yaPropuesto')}</span>` : ''}<br>
        <span class="muted" style="font-size:.88rem">${esc(t(s.motivo))}</span></p>`;
    });
    h += `</div>`;
  }
  $('#app').innerHTML = h;
}

/* ---------------- un arco ---------------- */
function pintaArco(k, a){
  const soloAlumno = !esProfe;
  const areasProy = [a.areaEje].concat(a.areasArticuladas || []);

  let h = `<div class="hero" style="background:linear-gradient(135deg,${a.cover.from},${a.cover.to})">
    <div class="motivo">${a.cover.icon}</div>
    <p class="eyebrow">${esc(a.label)} · ${a.cruzaTrimestre ? 'P'+a.periodos.join(' + P') : u('trimestre')+' '+a.trimestre}</p>
    <h1>${esc(t(a.titulo))}</h1>
    <p class="sub">${esc(t(a.subtitulo))}</p>
    <div class="bigq">${esc(t(a.preguntaEsencial))}</div>
    <div class="meta">
      <span>${a.semanas} ${u('semanas')}</span>
      <span>P${a.periodos.join(' + P')}</span>
      <span>${fecha(a.inicio)} → ${fecha(a.fin)}</span>
      <span>${areasProy.map(x=>AREA_NOMBRE[x]||x).join(' · ')}</span>
    </div></div>`;

  /* Un arco puede ser transcripcion de un documento del colegio (autoria) o
     propuesta del portal (propuesta). Nunca las dos cosas, y siempre se dice
     cual de las dos es. */
  if(a.propuesta){
    h += `<div class="card" style="border-left:5px solid var(--warn)">
      <span class="badge own">${u('arcoPropuesta')}</span>
      <p style="margin:8px 0 0;font-size:.9rem">${u('arcoPropTxt')}</p></div>`;
  }
  if(a.autoria){
    h += `<div class="card" style="border-left:5px solid var(--good)">
      <span class="badge src">${u('docColegio')}</span>
      <p style="margin:8px 0 0;font-size:.9rem">${esc(t(a.autoria))}</p></div>`;
  }

  /* Como se llama esto en Toddle. Va arriba porque es el nombre que el
     profesor tiene delante cuando planifica: si el portal lo llama de otra
     manera, lo primero que hay que ver es la equivalencia. */
  if((a.toddle||[]).length){
    h += `<div class="toddle"><h4>${u('toddleTit')}</h4>
      <ul>${a.toddle.map(x=>{
        const url = urlToddle(a.grade, x.id);
        const nom = url ? `<a href="${url}" target="_blank" rel="noopener">${esc(x.nombre)} &#8599;</a>`
                        : esc(x.nombre);
        return `<li><span class="per">P${x.periodo}</span> ${nom}
        <span class="tipo">· ${esc(t(x.tipo))} · ${x.semanas} ${u('semanas')} · ${esc(t(x.area))}</span></li>`;
      }).join('')}</ul>
      <p class="pnote" style="margin:8px 0 0">${u('abreEnToddle')}</p></div>`;
  } else if(a.toddle){
    h += `<div class="toddle"><h4>${u('toddleTit')}</h4>
      <p style="margin:0;font-size:.9rem">${u('toddleNada')}</p></div>`;
  }

  /* La narrativa es lo primero que ve el alumno. */
  h += `<div class="sec-title"><h2>${u('mision')}</h2>
    <span class="hint">${u('misionHint')}</span></div>
    <div class="card"><p style="margin:0;font-size:1rem">${esc(t(a.narrativa))}</p></div>`;

  /* Producto final. Con su lamina al lado: es lo primero que el alumno
     pregunta ("y esto que es?") y hasta ahora solo tenia un titulo. */
  const MOD = modelosDe(k);
  const fin = MOD ? MOD.final : null;
  h += `<div class="sec-title"><h2>${u('producto')}</h2>
    ${fin ? `<span class="hint">${u('finalMdl')}</span>` : ''}</div>
    <div class="card">
      <div class="${fin ? 'finalmdl' : ''}">
        ${fin ? `<div class="lamina" style="border:1px solid var(--line);border-radius:10px;overflow:hidden">
          ${lamina(fin, a.cover, 240)}</div>` : ''}
        <div>
          <h3 style="color:var(--blue-dd);margin:0 0 4px">${esc(t(a.producto.titulo))}</h3>
          <p style="margin:0 0 10px">${esc(t(a.producto.descripcion))}</p>
          <p class="muted" style="margin:0 0 10px;font-size:.88rem"><b>${u('paraQuien')}</b> ${esc(t(a.producto.audiencia))}</p>
          <ul class="tight">${a.producto.incluye.map(x=>`<li>${esc(t(x))}</li>`).join('')}</ul>
        </div>
      </div>
      ${fin ? `<div class="mdl" style="margin-top:16px"><h5>${u('modeloQue')}</h5>
        <div class="cuerpo" style="grid-template-columns:1fr">
          <div>
            <ul class="partes">${(fin.partes||[]).map(x=>`<li>${esc(t(x))}</li>`).join('')}</ul>
            ${(fin.apoyo||[]).length ? `<h6>${u('modeloApoyo')}</h6>
              <div class="apoyo">${fin.apoyo.map(x=>`<code>${esc(x)}</code>`).join('')}</div>` : ''}
            <p class="mejora"><b>${u('modeloMejora')}</b> ${esc(t(fin.mejora))}</p>
          </div></div></div>` : ''}
    </div>`;

  /* Preguntas orientadoras por area. */
  const or = a.orientadoras || {};
  const claves = AREA_ORDEN.filter(x => or[x]);
  if(claves.length){
    h += `<div class="sec-title"><h2>${u('guia')}</h2>
      <span class="hint">${u('guiaHint')}</span></div><div class="grid2">`;
    claves.forEach(x => {
      h += `<div class="card" style="margin:0"><h5 style="margin:0 0 6px;font-size:.72rem;
        letter-spacing:.08em;text-transform:uppercase;color:var(--blue-d)">${AREA_NOMBRE[x]||x}</h5>
        <p style="margin:0;font-size:.92rem">${esc(t(or[x]))}</p></div>`;
    });
    h += `</div>`;
  }

  /* Las once entregas seguidas, antes de abrir ninguna semana: el camino
     entero de un vistazo. Sin esto hay que abrir once desplegables para
     saber a donde va el proyecto. */
  h += tiraEntregas(k, a);

  /* Antes del mapa de semanas: a donde lleva el ingles de este trimestre. */
  h += inglesDelArco(a);

  /* El mapa de semanas: la parte que de verdad hace falta.

     Las once semanas salían plegadas, y eso hacía creer —a quien abre la página
     y también a quien la presenta— que solo hay una semana desarrollada. Están
     todas, con lo que da cada área esa semana. El botón las abre de golpe, que
     es como se enseña el plan a coordinación, y al imprimir salen abiertas. */
  h += `<div class="sec-title"><h2>${u('semana')}</h2>
    <span class="hint">${u('semanaHint')}</span>
    <button type="button" id="btnTodo" class="btn-todo">${u('verTodo')}</button></div>`;

  /* Cuando el plan anual del grado carga menos áreas de las que el proyecto
     usa, se dice antes de que el lector lo note y crea que falta la mitad. */
  if(a.notaPlan){
    h += `<p class="pnote" style="margin:0 0 10px">${esc(t(a.notaPlan))}</p>`;
  }

  if(planError){
    h += `<div class="warnbox" style="margin-bottom:12px"><h4>${u('planFallo')}</h4>
      <p style="margin:0">${u('planFalloTxt')}
      (<code>scope/annual-plan-primary-2026.json</code>: ${esc(planError)}).</p></div>`;
  }

  function cierraPeriodo(per){
    const sobra = sobranteDe(a.grade, per);
    if(!sobra.length) return '';
    /* La propuesta concreta de que semana se junta con cual: coordinacion
       solo tiene que aprobarla, no redactarla. */
    const prop = FUSION[a.grade + '.p' + per];
    const lineas = sobra.map(x => AREA_ORDEN.filter(k => x[k] && x[k].length)
      .map(k => `<li><b>${AREA_NOMBRE[k]||k}</b> — ${esc(x[k].join(' · '))}</li>`).join('')).join('');
    return `<div class="warnbox" style="margin:2px 0 14px"><h4>${u('sobraTit', per)}</h4>
      <p style="margin:0 0 6px">${u('sobraTxt', a.fases.filter(z=>z.periodo===per).length)}</p>
      <ul class="tight" style="margin:0">${lineas}</ul>
      ${prop ? `<p style="margin:10px 0 0;padding-top:9px;border-top:1px solid #FDE68A">
        <b>${u('propuesta')} — ${prop.estado === 'borrar' ? u('aBorrar') : u('aFusionar', prop.absorbe)}.</b>
        ${esc(t(prop.propuesta))} <i>${u('esperaSi')}</i></p>` : ''}
      </div>`;
  }

  let periodoPintado = null;
  a.fases.forEach(f => {
    if(f.periodo !== periodoPintado){
      if(periodoPintado !== null) h += cierraPeriodo(periodoPintado);
      periodoPintado = f.periodo;
      h += `<p class="pnote" style="margin:16px 0 8px"><b>${u('periodo')} ${f.periodo}</b>
        — ${u('periodoNota', f.periodo)}</p>`;
    }
    const cont = contenidoDe(a.grade, f.periodo, f.semana);
    let bloques = '';
    if(cont){
      const ks = AREA_ORDEN.filter(x => cont[x] && cont[x].length);
      const extra = deProyecto(a.grade, f.periodo, f.semana) || {};
      bloques = ks.map(x => `<div class="area${areasProy.indexOf(x)>=0?'':' otra'}">
        <h5><span class="ico" aria-hidden="true">${AREA_ICONO[x]||'•'}</span>${AREA_NOMBRE[x]||x}${extra[x] ? ' <span class="delDocx">'+u('delDocx')+'</span>' : ''}</h5>
        <ul>${cont[x].slice(0,6).map(l=>`<li>${esc(l)}</li>`).join('')}</ul></div>`).join('');
    }
    /* El modelo de la semana, si lo hay: miniatura en la cabecera para que se
       vea plegada, y dentro el aliento arriba y la lamina completa debajo del
       contenido de las areas. */
    const sm = MOD && MOD.semanas[f.n] ? MOD.semanas[f.n] : null;
    h += `<details class="wk" id="w${f.n}" style="border-left-color:${a.cover.from}">
      <summary>
        <div class="num">W${f.n}</div>
        ${sm ? miniatura(sm.modelo, a.cover) : ''}
        <div class="txt">
          <div class="fase">${esc(t(f.fase))} · P${f.periodo} W${f.semana}</div>
          <div class="foco">${esc(t(f.foco))}</div>
        </div>
        <div class="ev">${esc(t(f.evidencia))}</div>
      </summary>
      <div class="body">
        ${sm ? bloqueAliento(sm.aliento) : ''}
        <p class="hace">${esc(t(f.hace))}</p>
        ${bloques ? `<div class="areas">${bloques}</div>
          <p class="pnote">${u('delPlan')}</p>`
        : `<p class="pnote">${u('sinPlan')}</p>`}
        ${bloqueInglesHTML(a.grade, f.periodo, f.semana, a, f.n)}
        ${bloqueCursos(cursosEn(k, f.n, f.cursos || ((window.PROJECT_ARCS_CURSOS||{})[k]||{})[f.n]))}
        ${sm ? bloqueModelo(sm.modelo, a.cover) : ''}
      </div></details>`;
  });
  if(periodoPintado !== null) h += cierraPeriodo(periodoPintado);

  /* Evaluacion: la ve todo el mundo. Un criterio escondido no evalua. */
  h += `<div class="sec-title"><h2>${u('rubrica')}</h2>
    <span class="hint">${u('rubricaHint')}</span></div>
    <div class="card" style="padding:0;overflow-x:auto"><table class="rub">
    <tr><th>${u('criterio')}</th><th>${u('queSeMira')}</th></tr>
    ${a.evaluacion.map(c=>`<tr><td class="crit">${esc(t(c.criterio))}</td><td>${esc(t(c.descriptor))}</td></tr>`).join('')}
    </table></div>`;

  /* Diferenciacion y SAD. */
  h += `<div class="grid2">
    <div class="card" style="margin:0"><h3 style="font-size:1rem;color:var(--blue-dd)">${u('caminos')}</h3>
      <ul class="tight">${(a.diferenciacion||[]).map(x=>`<li>${esc(t(x))}</li>`).join('')}</ul></div>
    <div class="card" style="margin:0"><h3 style="font-size:1rem;color:var(--blue-dd)">${esc(t(a.sad.titulo))}</h3>
      <p style="margin:0;font-size:.92rem">${esc(t(a.sad.muestra))}</p></div>
  </div>`;

  /* Unidades del portal que ya ejecutan el arco. */
  if((a.unidades||[]).length){
    h += `<div class="sec-title"><h2>${u('enPortal')}</h2></div><div class="card">
      <p class="muted" style="margin:0 0 10px;font-size:.88rem">${u('enPortalTxt')}</p>
      ${a.unidades.map(x=>`<a href="unit.html?grade=${a.grade}&unit=${x.n}"
        style="display:inline-block;margin:0 8px 8px 0;background:#eef4fb;padding:8px 14px;
        border-radius:999px;text-decoration:none;font-weight:600;font-size:.88rem">
        ${UI.unidad[LANG]} ${x.n} — ${esc(t(x.titulo))}</a>`).join('')}</div>`;
  }

  /* Solo docente: situacion significativa, competencias CNEB y lo que falta. */
  if(!soloAlumno){
    h += `<div class="sec-title"><h2>${u('paraProfe')}</h2>
      <span class="hint">${u('paraProfeHint')}</span></div>
      <p style="margin:-4px 0 14px"><a href="informe.html">${u('verInforme')} &#8594;</a></p>`;

    h += `<div class="card"><h3 style="font-size:1rem;color:var(--blue-dd)">${u('situacion')}</h3>
      <p style="margin:0;font-size:.92rem">${esc(t(a.situacion))}</p></div>`;

    h += `<div class="card"><h3 style="font-size:1rem;color:var(--blue-dd)">${u('competencias')}</h3>`;
    a.competencias.forEach(c => {
      h += `<p style="margin:0 0 4px"><span class="badge src">${AREA_NOMBRE[c.area]||c.area}</span>
        <b style="font-size:.93rem">${esc(t(c.nombre))}</b></p>
        <ul class="tight" style="margin-bottom:12px;font-size:.87rem">
        ${c.capacidades.map(x=>`<li>${esc(t(x))}</li>`).join('')}</ul>`;
    });
    h += `</div>`;

    if(a.conceptos){
      h += `<div class="card"><h3 style="font-size:1rem;color:var(--blue-dd)">${u('conceptos')}</h3>
        <ul class="tight" style="font-size:.9rem">
        ${a.conceptos.map(c=>`<li><b>${esc(t(c.nombre))}</b> — ${esc(t(c.idea))}</li>`).join('')}</ul></div>`;
    }
    if(a.rolDocente){
      h += `<div class="card"><h3 style="font-size:1rem;color:var(--blue-dd)">${u('rolDocente')}</h3>
        <p style="margin:0;font-size:.92rem">${esc(t(a.rolDocente))}</p></div>`;
    }
    if((a.revisar||[]).length){
      h += `<div class="warnbox"><h4>${u('revisar')}</h4>
        <ul class="tight" style="margin:0">${a.revisar.map(x=>`<li>${esc(t(x))}</li>`).join('')}</ul></div>`;
    }
    h += `<div class="srcbox" style="margin-top:14px">
      ${u('fuente')}${a.autoria ? u('fuenteSuya') : u('fuenteNuestra')}
    </div>`;
  }

  h += `<p class="center" style="margin-top:24px">
    <a href="plan.html?arc=${encodeURIComponent(k)}">${u('verPlan')} &#8594;</a> &middot;
    <a href="project.html">${u('todos')}</a></p>`;

  $('#app').innerHTML = h;
  document.title = t(a.titulo) + ' · ' + a.label + ' · NIS';

  /* Abrir o plegar las once semanas de una vez. Va aquí, después de pintar,
     porque el HTML se arma entero en una cadena y antes el botón no existe. */
  const bt = $('#btnTodo');
  if(bt) bt.onclick = function(){
    const ws = document.querySelectorAll('details.wk');
    const abrir = ![...ws].every(d => d.open);
    ws.forEach(d => { d.open = abrir; });
    bt.textContent = u(abrir ? 'plegarTodo' : 'verTodo');
  };

  /* La tira de entregas lleva a su semana. Un ancla sola no basta: la semana
     es un <details> y el navegador salta a el sin abrirlo, asi que parece que
     el enlace no hace nada. Hay que abrirlo a mano. */
  document.querySelectorAll('.tira a[data-w]').forEach(el => {
    el.onclick = function(ev){
      ev.preventDefault();
      const d = document.getElementById('w' + el.dataset.w);
      if(!d) return;
      d.open = true;
      d.scrollIntoView({behavior: 'smooth', block: 'center'});
    };
  });
}

/* Se pinta en cuanto esta el plan anual, sin esperar a Supabase: averiguar
   quien mira puede tardar segundos (getSession renueva el token contra la
   red) y la pagina no depende de eso para su mitad de alumno. Cuando se sabe
   que quien mira es profesor, se repinta con la parte docente. Es la misma
   leccion del arranque de unit.html: no dejar la pantalla en "Loading" por
   una consulta que puede no volver. */
function pinta(){
  /* Secundaria no tiene arcos: se le ensena su secuencia de ingles y lo que
     cada area tiene cargado en Toddle. */
  const gq = (P.get('grade') || '').toLowerCase();
  /* ?sec=g9.u2 abre un proyecto interdisciplinario de secundaria. */
  /* ?arco11=g9.t2 abre el arco de once semanas; ?sec=g9.u2, un proyecto de unidad. */
  const aq = P.get('arco11');
  if(aq){ pintaArco11(aq); return; }
  const sq = P.get('sec');
  if(sq){ pintaProyectoSec(sq); return; }
  if(!ARC && esSecundaria(gq)){ pintaSecundaria(gq); return; }
  if(!ARC){ pintaIndice(); return; }
  const a = ARCS[ARC];
  if(!a){
    $('#app').innerHTML = `<div class="card center" style="max-width:620px;margin:50px auto">
      <div style="font-size:3rem">🧩</div><h2>${u('noExiste')}</h2>
      <p class="muted">${u('noExisteTxt')}</p>
      <p><a href="project.html">${u('verTodos')}</a></p></div>`;
    return;
  }
  pintaArco(ARC, a);
}

(async function(){
  const vuelta = P.get('back');
  if(vuelta) $('#back').href = vuelta;
  $('#lang').addEventListener('click', cambiaIdioma);
  aplicaIdioma();
  $('#app').innerHTML = '<p class="muted">' + u('cargando') + '</p>';
  await cargaPlan();
  pinta();
  await conectar();
  if(esProfe) pinta();          // ahora si, con la parte del profesor
})();
</script>
