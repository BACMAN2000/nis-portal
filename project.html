<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project · Nordic International School</title>
<link rel="icon" href="assets/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#4987c6; --blue-d:#2f5f93; --blue-dd:#244c77;
  --bg:#f2f3ff; --white:#fff; --grey:#636465; --line:#e3e5f3;
  --lila:#d1d2ea; --celeste:#76cbe5;
  --good:#16a34a; --warn:#b45309; --bad:#dc2626;
  --ink:#2b2c33; --r:16px; --r-sm:10px;
  --shadow:0 10px 30px rgba(36,76,119,.10);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Montserrat',system-ui,Segoe UI,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5}
h1,h2,h3,h4{line-height:1.2;margin:0 0 .4em;font-weight:700}
a{color:var(--blue-d)}
header{display:flex;align-items:center;gap:14px;background:var(--blue);padding:12px 22px;color:#fff;box-shadow:var(--shadow)}
header img{height:34px;width:auto;display:block}
header .spacer{flex:1}
header a.back{background:rgba(255,255,255,.16);color:#fff;border:none;padding:8px 14px;border-radius:var(--r-sm);font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:7px;text-decoration:none}
header a.back:hover{background:rgba(255,255,255,.28)}
.wrap{max-width:1060px;margin:0 auto;padding:22px 18px 80px}
.hero{position:relative;overflow:hidden;color:#fff;border-radius:var(--r);padding:26px 28px;margin-bottom:20px;box-shadow:var(--shadow)}
.hero .motivo{position:absolute;right:-8px;bottom:-38px;font-size:9rem;line-height:1;opacity:.18;pointer-events:none;user-select:none}
.hero .eyebrow{font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;color:#cfe3f6;font-weight:700;margin:0 0 8px}
.hero h1{color:#fff;font-size:1.75rem;font-weight:800;margin:0}
.hero .sub{margin:6px 0 0;color:#e2edf8;font-size:.95rem;font-weight:500}
.hero .bigq{margin:16px 0 0;padding:13px 16px;background:rgba(255,255,255,.14);border-left:4px solid var(--celeste);border-radius:0 var(--r-sm) var(--r-sm) 0;font-size:1.02rem;font-weight:600}
.hero .meta{margin:14px 0 0;color:#dbe8f6;font-size:.83rem;display:flex;gap:8px;flex-wrap:wrap}
.hero .meta span{background:rgba(255,255,255,.16);padding:3px 10px;border-radius:999px}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow)}
.sec-title{display:flex;align-items:baseline;gap:10px;margin:28px 0 12px;flex-wrap:wrap}
.sec-title h2{font-size:1.15rem;color:var(--blue-dd);margin:0}
.sec-title .hint{font-size:.82rem;color:var(--grey)}
.muted{color:var(--grey)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
ul.tight{margin:.3em 0 0;padding-left:1.15em}
ul.tight li{margin:.22em 0}

/* --- mapa de semanas --- */
.wk{background:var(--white);border:1px solid var(--line);border-left:5px solid var(--blue);
    border-radius:var(--r-sm);margin-bottom:10px;overflow:hidden}
.wk>summary{list-style:none;cursor:pointer;padding:13px 16px;display:flex;gap:12px;align-items:flex-start}
.wk>summary::-webkit-details-marker{display:none}
.wk>summary:hover{background:#f7f9fd}
.wk .num{flex:0 0 auto;width:38px;height:38px;border-radius:10px;background:#eef4fb;color:var(--blue-dd);
  font-weight:800;display:flex;align-items:center;justify-content:center;font-size:.95rem}
.wk .txt{flex:1;min-width:0}
.wk .foco{font-weight:700;color:var(--blue-dd);font-size:1rem}
.wk .fase{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--grey);font-weight:700}
.wk .ev{font-size:.78rem;font-weight:700;color:var(--blue-d);background:#eef4fb;padding:3px 10px;border-radius:999px;white-space:nowrap;align-self:center}
.wk .body{padding:2px 16px 16px 66px;border-top:1px solid var(--line);margin-top:0}
.wk .hace{font-size:.9rem;margin:12px 0 14px}
.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.area{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;background:#fbfcff}
.area.otra{background:#fff;border-style:dashed}
.area.otra h5{color:var(--grey)}
.area h5{margin:0 0 5px;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--blue-d)}
.area ul{margin:0;padding-left:1.05em;font-size:.83rem;color:var(--ink)}
.area li{margin:.15em 0}
.pnote{font-size:.76rem;color:var(--grey);margin:10px 0 0}

table.rub{width:100%;border-collapse:collapse;font-size:.86rem}
table.rub th,table.rub td{border:1px solid var(--line);padding:9px 11px;vertical-align:top;text-align:left}
table.rub th{background:#eef4fb;color:var(--blue-dd);font-weight:700;font-size:.76rem;text-transform:uppercase;letter-spacing:.04em}
table.rub td.crit{background:#fafbff;font-weight:600;width:32%}

.badge{display:inline-block;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:999px;margin-right:6px}
.badge.src{background:#ECFDF5;color:#059669}
.badge.own{background:#FFFBEB;color:#B45309}
.warnbox{background:#FFFBEB;border:1px solid #FDE68A;border-radius:var(--r-sm);padding:13px 15px;font-size:.87rem}
.warnbox h4{margin:0 0 6px;color:#92400E;font-size:.9rem}
.srcbox{background:#F8FAFC;border:1px solid var(--line);border-radius:var(--r-sm);padding:13px 15px;font-size:.82rem;color:var(--grey)}
.arcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
a.arc{display:block;text-decoration:none;color:#fff;border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-height:150px;position:relative;overflow:hidden}
a.arc .ic{font-size:2.4rem;line-height:1}
a.arc h3{margin:10px 0 3px;color:#fff;font-size:1.08rem}
a.arc p{margin:0;font-size:.83rem;color:rgba(255,255,255,.86)}
a.arc .tag{position:absolute;top:14px;right:14px;font-size:.7rem;font-weight:700;background:rgba(255,255,255,.22);padding:3px 9px;border-radius:999px}
.center{text-align:center}
@media(max-width:640px){
  .wk .body{padding-left:16px}
  .hero h1{font-size:1.35rem}
}
</style>
</head>
<body>
<header>
  <img src="assets/logo-white-h.svg" alt="Nordic International School" onerror="this.style.display='none'">
  <div class="spacer"></div>
  <a class="back" id="back" href="./">&#8592; Back</a>
</header>

<div class="wrap" id="app"><p class="muted">Loading…</p></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="config.js"></script>
<script src="project-arcs.js?v=3"></script>
<script>
const $ = s => document.querySelector(s);
const P = new URLSearchParams(location.search);
const ARC = P.get('arc') || '';
const ARCS = window.PROJECT_ARCS || {};
const SUELTOS = window.PROJECT_ARCS_SUELTOS || [];

/* El contenido por area y semana NO vive en project-arcs.js: se lee del
   volcado del Annual Plan del colegio. Si el JSON no esta, la pagina sigue
   funcionando y lo dice — media pagina en blanco enseña menos que decirlo. */
let PLAN = null, planError = '';

const AREA_NOMBRE = {
  science:'Science', social:'Social Studies', math:'Math', english:'English',
  comunicacion:'Comunicación', tutoria:'Tutoría', pe:'PE',
  art:'Art', music:'Music', drama:'Drama', spiritual:'Spiritual History'
};
const AREA_ORDEN = ['science','social','math','english','comunicacion','pe','tutoria','art','music','drama','spiritual'];

function esc(s){ return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function fecha(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-').map(Number);
  const MES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return d + ' ' + MES[m-1];
}

async function cargaPlan(){
  try{
    const r = await fetch('scope/annual-plan-primary-2026.json', {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP ' + r.status);
    PLAN = await r.json();
  }catch(e){ planError = e.message || String(e); }
}

/* Semanas que el Excel del plan anual escribe de mas: el calendario da 34
   semanas de clase y algunas hojas cargan una sexta donde solo hay cinco. No
   se tira ese contenido — se avisa, que es lo unico honesto. */
function sobranteDe(grade, periodo){
  if(!PLAN) return [];
  const g = PLAN.grados && PLAN.grados[grade];
  if(!g) return [];
  const p = g.periodos.find(x => x.periodo === periodo);
  return (p && p.fuera_de_calendario) || [];
}

/* Contenido real del plan anual para un grado, periodo y semana. */
function contenidoDe(grade, periodo, semana){
  if(!PLAN) return null;
  const g = PLAN.grados && PLAN.grados[grade];
  if(!g) return null;
  const p = g.periodos.find(x => x.periodo === periodo);
  if(!p) return null;
  const s = p.semanas.find(x => x.n === semana);
  return s ? s.areas : null;
}

/* ---------------- quien mira ---------------- */
let sb=null, me=null, esProfe=false;
async function conectar(){
  try{
    const cfg = window.NIS_CONFIG;
    if(cfg && window.supabase && window.supabase.createClient){
      sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_KEY);
      const {data} = await sb.auth.getSession();
      me = data && data.session ? data.session.user : null;
    }
  }catch(_){ me = null; }
  if(!me) return;
  try{
    const t = await sb.from('teacher_access').select('can_results').eq('profile_id',me.id).maybeSingle();
    esProfe = !!(t && t.data && t.data.can_results);
    if(!esProfe){
      const pr = await sb.from('profiles').select('role').eq('id',me.id).maybeSingle();
      const rol = pr && pr.data && pr.data.role;
      esProfe = (rol === 'admin' || rol === 'teacher');
    }
  }catch(_){ esProfe = false; }
}

/* ---------------- indice ---------------- */
function pintaIndice(){
  /* ?grade=g3 acota el indice al grado del alumno. Sin el, se ven todos:
     es la vista de coordinacion. */
  const soloGrado = P.get('grade') || '';
  const porGrado = {};
  Object.keys(ARCS).forEach(k => {
    const a = ARCS[k];
    if(soloGrado && a.grade !== soloGrado) return;
    (porGrado[a.grade] = porGrado[a.grade] || []).push([k, a]);
  });
  const grados = Object.keys(porGrado).sort();
  const nArcos = grados.reduce((n,g)=>n+porGrado[g].length,0);
  const etiqueta = soloGrado && grados.length ? porGrado[grados[0]][0][1].label : 'Primary';
  let h = `<div class="hero" style="background:linear-gradient(135deg,#244c77,#4987c6)">
    <div class="motivo">🧩</div>
    <p class="eyebrow">${esc(etiqueta)} · 2026</p>
    <h1>Interdisciplinary projects</h1>
    <p class="sub">Un proyecto por trimestre, de once o doce semanas, sobre los cruces que el
      plan anual del colegio ya tiene escritos.</p>
    <div class="meta"><span>${nArcos} ${nArcos===1?'arco':'arcos'}</span>
      <span>34 semanas de calendario</span><span>P1–P6</span></div>
  </div>`;
  if(!nArcos){
    h += `<div class="card center"><p class="muted" style="margin:0">
      Este grado todavía no tiene ningún proyecto declarado.</p></div>`;
  }

  grados.forEach(g => {
    h += `<div class="sec-title"><h2>${esc(porGrado[g][0][1].label)}</h2></div><div class="arcs">`;
    porGrado[g].sort((a,b)=>a[1].periodos[0]-b[1].periodos[0]).forEach(([k,a]) => {
      h += `<a class="arc" href="project.html?arc=${encodeURIComponent(k)}"
        style="background:linear-gradient(135deg,${a.cover.from},${a.cover.to})">
        <span class="tag">P${a.periodos.join('+')} · ${a.semanas} sem</span>
        <div class="ic">${a.cover.icon}</div>
        <h3>${esc(a.titulo)}</h3>
        <p>${esc(a.subtitulo)}</p></a>`;
    });
    h += `</div>`;
  });

  const sueltos = SUELTOS.filter(x => !soloGrado || x.grade === soloGrado);
  if(sueltos.length){
    h += `<div class="sec-title"><h2>Lo que no está en un arco</h2>
      <span class="hint">y por qué</span></div><div class="card">`;
    sueltos.forEach(s => {
      h += `<p style="margin:0 0 10px"><b>${esc(s.titulo)}</b>
        <span class="muted">— ${s.grade.toUpperCase()}, P${s.periodos.join(', P')}</span><br>
        <span class="muted" style="font-size:.88rem">${esc(s.motivo)}</span></p>`;
    });
    h += `</div>`;
  }
  $('#app').innerHTML = h;
}

/* ---------------- un arco ---------------- */
function pintaArco(k, a){
  const soloAlumno = !esProfe;
  const areasProy = [a.areaEje].concat(a.areasArticuladas || []);

  let h = `<div class="hero" style="background:linear-gradient(135deg,${a.cover.from},${a.cover.to})">
    <div class="motivo">${a.cover.icon}</div>
    <p class="eyebrow">${esc(a.label)} · ${a.cruzaTrimestre ? 'P'+a.periodos.join(' + P') : 'Trimestre '+a.trimestre}</p>
    <h1>${esc(a.titulo)}</h1>
    <p class="sub">${esc(a.subtitulo)}</p>
    <div class="bigq">${esc(a.preguntaEsencial)}</div>
    <div class="meta">
      <span>${a.semanas} semanas</span>
      <span>P${a.periodos.join(' + P')}</span>
      <span>${fecha(a.inicio)} → ${fecha(a.fin)}</span>
      <span>${areasProy.map(x=>AREA_NOMBRE[x]||x).join(' · ')}</span>
    </div></div>`;

  if(a.autoria){
    h += `<div class="card" style="border-left:5px solid var(--good)">
      <span class="badge src">Documento del colegio</span>
      <p style="margin:8px 0 0;font-size:.9rem">${esc(a.autoria)}</p></div>`;
  }

  /* La narrativa es lo primero que ve el alumno. */
  h += `<div class="sec-title"><h2>The mission</h2>
    <span class="hint">lo que se le cuenta al alumno</span></div>
    <div class="card"><p style="margin:0;font-size:1rem">${esc(a.narrativa)}</p></div>`;

  /* Producto final. */
  h += `<div class="sec-title"><h2>What you end up with</h2></div>
    <div class="card">
      <h3 style="color:var(--blue-dd);margin:0 0 4px">${esc(a.producto.titulo)}</h3>
      <p style="margin:0 0 10px">${esc(a.producto.descripcion)}</p>
      <p class="muted" style="margin:0 0 10px;font-size:.88rem"><b>Para quién:</b> ${esc(a.producto.audiencia)}</p>
      <ul class="tight">${a.producto.incluye.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
    </div>`;

  /* Preguntas orientadoras por area. */
  const or = a.orientadoras || {};
  const claves = AREA_ORDEN.filter(x => or[x]);
  if(claves.length){
    h += `<div class="sec-title"><h2>Guiding questions</h2>
      <span class="hint">una por área</span></div><div class="grid2">`;
    claves.forEach(x => {
      h += `<div class="card" style="margin:0"><h5 style="margin:0 0 6px;font-size:.72rem;
        letter-spacing:.08em;text-transform:uppercase;color:var(--blue-d)">${AREA_NOMBRE[x]||x}</h5>
        <p style="margin:0;font-size:.92rem">${esc(or[x])}</p></div>`;
    });
    h += `</div>`;
  }

  /* El mapa de semanas: la parte que de verdad hace falta. */
  h += `<div class="sec-title"><h2>Week by week</h2>
    <span class="hint">el proyecto arriba, y debajo lo que cada área da esa misma semana según el plan anual</span></div>`;

  /* Cuando el plan anual del grado carga menos áreas de las que el proyecto
     usa, se dice antes de que el lector lo note y crea que falta la mitad. */
  if(a.notaPlan){
    h += `<p class="pnote" style="margin:0 0 10px">${esc(a.notaPlan)}</p>`;
  }

  if(planError){
    h += `<div class="warnbox" style="margin-bottom:12px"><h4>No se pudo leer el plan anual</h4>
      <p style="margin:0">Las semanas se pintan igual, pero sin el contenido de cada área
      (<code>scope/annual-plan-primary-2026.json</code>: ${esc(planError)}).</p></div>`;
  }

  function cierraPeriodo(per){
    const sobra = sobranteDe(a.grade, per);
    if(!sobra.length) return '';
    const lineas = sobra.map(x => AREA_ORDEN.filter(k => x[k] && x[k].length)
      .map(k => `<li><b>${AREA_NOMBRE[k]||k}</b> — ${esc(x[k].join(' · '))}</li>`).join('')).join('');
    return `<div class="warnbox" style="margin:2px 0 14px"><h4>El plan anual escribe una semana de más en P${per}</h4>
      <p style="margin:0 0 6px">El calendario del colegio da ${a.fases.filter(z=>z.periodo===per).length}
      semanas de clase en este periodo, y el Excel carga contenido para una más. Esto es lo que queda fuera:</p>
      <ul class="tight" style="margin:0">${lineas}</ul></div>`;
  }

  let periodoPintado = null;
  a.fases.forEach(f => {
    if(f.periodo !== periodoPintado){
      if(periodoPintado !== null) h += cierraPeriodo(periodoPintado);
      periodoPintado = f.periodo;
      h += `<p class="pnote" style="margin:16px 0 8px"><b>Period ${f.periodo}</b>
        — el colegio lo llama <i>Project ${f.periodo}</i> en el calendario</p>`;
    }
    const cont = contenidoDe(a.grade, f.periodo, f.semana);
    let bloques = '';
    if(cont){
      const ks = AREA_ORDEN.filter(x => cont[x] && cont[x].length);
      bloques = ks.map(x => `<div class="area${areasProy.indexOf(x)>=0?'':' otra'}">
        <h5>${AREA_NOMBRE[x]||x}</h5>
        <ul>${cont[x].slice(0,6).map(l=>`<li>${esc(l)}</li>`).join('')}</ul></div>`).join('');
    }
    h += `<details class="wk" style="border-left-color:${a.cover.from}">
      <summary>
        <div class="num">W${f.n}</div>
        <div class="txt">
          <div class="fase">${esc(f.fase)} · P${f.periodo} W${f.semana}</div>
          <div class="foco">${esc(f.foco)}</div>
        </div>
        <div class="ev">${esc(f.evidencia)}</div>
      </summary>
      <div class="body">
        <p class="hace">${esc(f.hace)}</p>
        ${bloques ? `<div class="areas">${bloques}</div>
          <p class="pnote">Del <i>Annual Plan Primary 2026</i> del colegio, tal cual está escrito.</p>`
        : `<p class="pnote">El plan anual no tiene contenido cargado para esta semana.</p>`}
      </div></details>`;
  });
  if(periodoPintado !== null) h += cierraPeriodo(periodoPintado);

  /* Evaluacion: la ve todo el mundo. Un criterio escondido no evalua. */
  h += `<div class="sec-title"><h2>How it is marked</h2>
    <span class="hint">desde el primer día</span></div>
    <div class="card" style="padding:0;overflow-x:auto"><table class="rub">
    <tr><th>Criterio</th><th>Qué se mira</th></tr>
    ${a.evaluacion.map(c=>`<tr><td class="crit">${esc(c.criterio)}</td><td>${esc(c.descriptor)}</td></tr>`).join('')}
    </table></div>`;

  /* Diferenciacion y SAD. */
  h += `<div class="grid2">
    <div class="card" style="margin:0"><h3 style="font-size:1rem;color:var(--blue-dd)">Distintos caminos</h3>
      <ul class="tight">${(a.diferenciacion||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
    <div class="card" style="margin:0"><h3 style="font-size:1rem;color:var(--blue-dd)">${esc(a.sad.titulo)}</h3>
      <p style="margin:0;font-size:.92rem">${esc(a.sad.muestra)}</p></div>
  </div>`;

  /* Unidades del portal que ya ejecutan el arco. */
  if((a.unidades||[]).length){
    h += `<div class="sec-title"><h2>En el portal</h2></div><div class="card">
      <p class="muted" style="margin:0 0 10px;font-size:.88rem">Estas unidades ya están montadas y
      son las que el alumno abre para trabajar y entregar.</p>
      ${a.unidades.map(u=>`<a href="unit.html?grade=${a.grade}&unit=${u.n}"
        style="display:inline-block;margin:0 8px 8px 0;background:#eef4fb;padding:8px 14px;
        border-radius:999px;text-decoration:none;font-weight:600;font-size:.88rem">
        Unit ${u.n} — ${esc(u.titulo)}</a>`).join('')}</div>`;
  }

  /* Solo docente: situacion significativa, competencias CNEB y lo que falta. */
  if(!soloAlumno){
    h += `<div class="sec-title"><h2>Para el profesor</h2>
      <span class="hint">no se muestra al alumno</span></div>`;

    h += `<div class="card"><h3 style="font-size:1rem;color:var(--blue-dd)">Situación significativa</h3>
      <p style="margin:0;font-size:.92rem">${esc(a.situacion)}</p></div>`;

    h += `<div class="card"><h3 style="font-size:1rem;color:var(--blue-dd)">Competencias CNEB</h3>`;
    a.competencias.forEach(c => {
      h += `<p style="margin:0 0 4px"><span class="badge src">${AREA_NOMBRE[c.area]||c.area}</span>
        <b style="font-size:.93rem">${esc(c.nombre)}</b></p>
        <ul class="tight" style="margin-bottom:12px;font-size:.87rem">
        ${c.capacidades.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
    });
    h += `</div>`;

    if(a.conceptos){
      h += `<div class="card"><h3 style="font-size:1rem;color:var(--blue-dd)">Conceptos centrales</h3>
        <ul class="tight" style="font-size:.9rem">
        ${a.conceptos.map(c=>`<li><b>${esc(c.nombre)}</b> — ${esc(c.idea)}</li>`).join('')}</ul></div>`;
    }
    if(a.rolDocente){
      h += `<div class="card"><h3 style="font-size:1rem;color:var(--blue-dd)">Rol docente</h3>
        <p style="margin:0;font-size:.92rem">${esc(a.rolDocente)}</p></div>`;
    }
    if((a.revisar||[]).length){
      h += `<div class="warnbox"><h4>Antes de ejecutarlo, hay que resolver esto</h4>
        <ul class="tight" style="margin:0">${a.revisar.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
    }
    h += `<div class="srcbox" style="margin-top:14px">
      <b>De dónde sale.</b> El calendario y las semanas, de <i>Primary Calendar 2026.xlsx</i>.
      El contenido de cada área por semana, de <i>Annual Plan Primary 2026.xlsx</i>, sin retocar.
      Los campos de planificación siguen el <i>Project Planner Template</i> del colegio.
      ${a.autoria ? 'El proyecto entero es del equipo del grado.' :
        'El título, la pregunta esencial, la narrativa, el producto y el reparto de fases son la propuesta del portal, y hay que validarlos con coordinación.'}
    </div>`;
  }

  h += `<p class="center" style="margin-top:24px">
    <a href="project.html">← todos los proyectos de primaria</a></p>`;

  $('#app').innerHTML = h;
  document.title = a.titulo + ' · ' + a.label + ' · NIS';
}

/* Se pinta en cuanto esta el plan anual, sin esperar a Supabase: averiguar
   quien mira puede tardar segundos (getSession renueva el token contra la
   red) y la pagina no depende de eso para su mitad de alumno. Cuando se sabe
   que quien mira es profesor, se repinta con la parte docente. Es la misma
   leccion del arranque de unit.html: no dejar la pantalla en "Loading" por
   una consulta que puede no volver. */
function pinta(){
  if(!ARC){ pintaIndice(); return; }
  const a = ARCS[ARC];
  if(!a){
    $('#app').innerHTML = `<div class="card center" style="max-width:620px;margin:50px auto">
      <div style="font-size:3rem">🧩</div><h2>Ese proyecto no existe</h2>
      <p class="muted">Puede que se haya renombrado.</p>
      <p><a href="project.html">Ver todos los proyectos</a></p></div>`;
    return;
  }
  pintaArco(ARC, a);
}

(async function(){
  const vuelta = P.get('back');
  if(vuelta) $('#back').href = vuelta;
  await cargaPlan();
  pinta();
  await conectar();
  if(esProfe) pinta();          // ahora si, con la parte del profesor
})();
</script>
