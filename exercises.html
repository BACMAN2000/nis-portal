<style>
  :root{--bg:#eef1f9;--card:#fff;--ink:#1e2433;--muted:#67718a;--accent:#3b5bdb;--accent-d:#2d4ac0;
    --soft:#e7ecfd;--good:#2f9e44;--good-soft:#d3f4dc;--bad:#e03131;--bad-soft:#ffe3e3;--gold:#f59f00;--line:#e2e8f0;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);padding:14px}
  header{max-width:900px;margin:0 auto 6px;text-align:center}
  header h1{font-size:1.35rem}
  header p{color:var(--muted);font-size:.85rem;margin-top:3px}
  a.back{display:inline-block;margin-top:8px;text-decoration:none;background:#2d5a8d;color:#fff;font-weight:700;font-size:.8rem;padding:7px 13px;border-radius:9px}
  .row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px auto;max-width:900px}
  .cat{border:2px solid transparent;background:var(--card);color:var(--ink);padding:8px 14px;border-radius:22px;font-weight:800;font-size:.85rem;cursor:pointer;box-shadow:0 1px 3px rgba(20,30,60,.12)}
  .cat.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .lv{border:2px solid transparent;background:var(--card);color:var(--ink);padding:6px 14px;border-radius:20px;font-weight:800;font-size:.82rem;cursor:pointer;box-shadow:0 1px 3px rgba(20,30,60,.1)}
  .lv.on{background:var(--gold);color:#fff;border-color:var(--gold)}
  .wrap{max-width:760px;margin:10px auto 0}
  .scorebar{position:sticky;top:0;z-index:5;background:var(--card);border-radius:12px;padding:10px 14px;box-shadow:0 2px 10px rgba(20,30,60,.08);display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .scorebar b{color:var(--accent)}
  .scorebar .best{margin-left:auto;font-size:.8rem;color:var(--muted)}
  .q{background:var(--card);border-radius:14px;padding:15px 16px;box-shadow:0 2px 10px rgba(20,30,60,.07);margin-bottom:12px;border-left:5px solid var(--accent)}
  .q .num{font-size:.72rem;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.5px}
  .q .qt{font-size:.98rem;font-weight:600;margin:5px 0 10px;line-height:1.4}
  .opt{display:block;width:100%;text-align:left;background:#f7f9fe;border:2px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0;font:inherit;font-size:.9rem;cursor:pointer;transition:.12s}
  .opt:hover{border-color:var(--accent)}
  .opt.correct{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:700}
  .opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
  .opt:disabled{cursor:default}
  .why{display:none;margin-top:8px;font-size:.84rem;background:#f1f5ff;border-left:4px solid var(--accent);border-radius:8px;padding:8px 10px;line-height:1.4}
  .why.show{display:block}
  .why.bad{background:var(--bad-soft);border-color:var(--bad)}
  .actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:6px 0 20px}
  button.act{border:none;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;font-size:.85rem;cursor:pointer}
  .b-restart{background:#e9ecf3;color:var(--ink)}.b-send{background:var(--good);color:#fff}
  .done{display:none;background:linear-gradient(135deg,var(--accent),#5b78e6);color:#fff;border-radius:14px;padding:18px;text-align:center;margin-bottom:12px}
  .done.show{display:block}
  .done .pct{font-size:2.4rem;font-weight:800;line-height:1}
  .msg{display:none;text-align:center;font-weight:700;font-size:.85rem;margin:6px 0;padding:8px;border-radius:9px}
  .msg.ok{display:block;background:var(--good-soft);color:var(--good)}
  .msg.warn{display:block;background:#fff4e6;color:var(--gold)}
  @media(max-width:480px){body{padding:8px}}
</style>

var cat="g", level="A2";
function key(){ return "nis_ex_best_"+cat+"_"+level; }
function buildBars(){
  var c=document.getElementById('cats'); c.innerHTML='';
  CATS.forEach(function(t){ var b=document.createElement('button'); b.className='cat'+(t[0]===cat?' on':''); b.textContent=t[1]; b.onclick=function(){cat=t[0];render();}; c.appendChild(b); });
  var l=document.getElementById('levels'); l.innerHTML='';
  LEVELS.forEach(function(lv){ var b=document.createElement('button'); b.className='lv'+(lv===level?' on':''); b.textContent=lv; b.onclick=function(){level=lv;render();}; l.appendChild(b); });
}
var items=[], answered=0, score=0;
function shuffle(arr){ for(var i=arr.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=arr[i];arr[i]=arr[j];arr[j]=t; } return arr; }
function render(){
  buildBars();
  items=shuffle((EX[cat][level]||[]).slice());
  answered=0; score=0;
  document.getElementById('total').textContent=items.length;
  document.getElementById('score').textContent=0;
  document.getElementById('streak').textContent='';
  document.getElementById('done').className='done';
  var best=localStorage.getItem(key());
  document.getElementById('best').textContent=best?('Best: '+best+'%'):'';
  var L=document.getElementById('list'); L.innerHTML='';
  items.forEach(function(it,i){
    var d=document.createElement('div'); d.className='q';
    var opts=it.o.map(function(o,oi){ return '<button class="opt" data-i="'+i+'" data-o="'+oi+'">'+o+'</button>'; }).join('');
    d.innerHTML='<div class="num">Question '+(i+1)+' / '+items.length+'</div><div class="qt">'+it.q+'</div>'+opts+'<div class="why" id="why'+i+'"></div>';
    L.appendChild(d);
  });
  var btns=L.querySelectorAll('.opt');
  for(var k=0;k<btns.length;k++){ btns[k].addEventListener('click',onAnswer); }
}
function onAnswer(e){
  var b=e.target, i=+b.getAttribute('data-i'), oi=+b.getAttribute('data-o');
  var it=items[i];
  var parent=b.parentNode;
  if(parent.getAttribute('data-done'))return;
  parent.setAttribute('data-done','1');
  var opts=parent.querySelectorAll('.opt');
  for(var k=0;k<opts.length;k++){ opts[k].disabled=true; if(+opts[k].getAttribute('data-o')===it.a) opts[k].classList.add('correct'); }
  var why=document.getElementById('why'+i);
  if(oi===it.a){ score++; why.className='why show'; why.innerHTML='✅ Correct. '+it.w; }
  else { b.classList.add('wrong'); why.className='why show bad'; why.innerHTML='❌ Not quite. '+it.w; }
  answered++;
  document.getElementById('score').textContent=score;
  if(answered===items.length) finish();
}
function finish(){
  var pct=Math.round(score/items.length*100);
  var best=+(localStorage.getItem(key())||0);
  if(pct>best){ localStorage.setItem(key(),pct); document.getElementById('best').textContent='Best: '+pct+'%'; }
  var d=document.getElementById('done');
  var emoji=pct>=80?'\u{1F389}':pct>=60?'\u{1F44D}':'\u{1F4AA}';
  var note=pct>=80?'Excellent!':pct>=60?'Good job!':'Keep practising!';
  d.innerHTML='<div class="pct">'+pct+'%</div><div>'+emoji+' '+note+' You got '+score+' / '+items.length+'.</div>';
  d.className='done show';
}
function restart(){ document.getElementById('msg').className='msg'; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function msg(t,c){ var m=document.getElementById('msg'); m.textContent=t; m.className='msg '+c; setTimeout(function(){m.className='msg';},4000); }
function sendScore(){
  if(answered<items.length){ msg('Finish the set first, then send your score.','warn'); return; }
  var pct=Math.round(score/items.length*100);
  var catName=(CATS.filter(function(x){return x[0]===cat;})[0]||['',''])[1];
  var done=function(name,email){
    if(!email){ msg('Log in to the portal first to send your score.','warn'); return; }
    try{ fetch(NIS_CONFIG.WRITING_WEBHOOK,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({skill:'Exercise',name:name,email:email,level:level,examTitle:'Exercises - '+catName,examType:'exercises',score:score,total:items.length,percent:pct})});
      msg('Sent to your teacher and your email!','ok'); }catch(e){ msg('Could not send right now.','warn'); }
  };
  try{ if(window.supabase&&window.NIS_CONFIG){ var sb=window.supabase.createClient(NIS_CONFIG.SUPABASE_URL,NIS_CONFIG.SUPABASE_KEY);
    sb.auth.getUser().then(function(u){ if(u&&u.data&&u.data.user){ sb.from('profiles').select('full_name,email').eq('id',u.data.user.id).maybeSingle().then(function(p){
      var name=(p&&p.data&&p.data.full_name)||''; var email=u.data.user.email||(p&&p.data&&p.data.email)||''; done(name,email); }); } else { done('',''); } }, function(){ done('',''); }); }
    else { done('',''); } }catch(e){ done('',''); }
}
render();
</script>
