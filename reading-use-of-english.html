<style>

<script>
const $ = id => document.getElementById(id);
const LEVELS = {
  b2:{name:'B2 First', sub:'Upper-intermediate · FCE', min:2, max:5, minW:'two', maxW:'five'},
  c1:{name:'C1 Advanced', sub:'Advanced · CAE', min:3, max:6, minW:'three', maxW:'six'}
};
const SET = 6;               // preguntas por bloque: la Part 4 del examen tiene 6
let level = 'b2', part = 4, cur = null, view = 'menu';
/* STORE['b2:passive'] = {a:{i:'…'}, f:{i:true}, q:i, checked, score} */
const STORE = {};
const keyOf = (lv, id) => lv + ':' + id;
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---- Corrección --------------------------------------------------------
   Se comparan las dos cadenas tras expandir contracciones (hasn't = has not),
   así el alumno puede escribir la forma corta o la larga. 'd es ambiguo
   (had / would): se prueban las dos lecturas. Mayúsculas y minúsculas dan
   igual, como al teclear en el examen digital. */
function base(s){
  return String(s||'').toLowerCase()
    .replace(/[’‘`´]/g,"'").replace(/[“”]/g,'"')
    .replace(/\b(apologi|reali|recogni|organi)z/g,'$1s').replace(/\bfavor\b/g,'favour')
    .replace(/\bcan't\b/g,'cannot').replace(/\bcan not\b/g,'cannot')
    .replace(/\bwon't\b/g,'will not').replace(/\bshan't\b/g,'shall not')
    .replace(/n't\b/g,' not')
    .replace(/'m\b/g,' am').replace(/'re\b/g,' are').replace(/'ve\b/g,' have').replace(/'ll\b/g,' will')
    .replace(/\b(he|she|it|that|there|what|who)'s been\b/g,'$1 has been')
    .replace(/[.,;:!?"]/g,' ').replace(/\s+/g,' ').trim();
}
function forms(s){
  const b = base(s);
  if(!/'d\b/.test(b)) return [b];
  return [b.replace(/'d\b/g,' would'), b.replace(/'d\b/g,' had')].map(x=>x.replace(/\s+/g,' ').trim());
}
/* Palabras al estilo Cambridge: las contracciones cuentan como dos
   (hasn't = has not), «cannot» como una. */
function words(s){ const f = forms(s)[0]; return f ? f.split(' ').length : 0; }
function answersOf(it){ return it[4].split('|'); }
function isRight(it, txt){
  const mine = forms(txt);
  return answersOf(it).some(a => forms(a).some(f => mine.includes(f)));
}
function hasKey(it, txt){
  const k = ' ' + base(it[1]) + ' ';
  return forms(txt).some(f => (' ' + f + ' ').includes(k));
}

/* ---- Vistas --------------------------------------------------------------
   El hash manda: #b2 (menú) · #b2/passive (gramática) · #b2/passive/exam ·
   #b2/passive/review. Así el «atrás» del navegador también funciona. */
function show(v){
  view = v;
  ['menu','grammar','review'].forEach(id => $(id).classList.toggle('hidden', id !== v));
  $('exam').classList.toggle('hidden', v !== 'exam');
  document.body.style.overflow = v === 'exam' ? 'hidden' : '';
  // La barra Save / Submit del portal va fija abajo: el examen termina encima.
  if(v === 'exam'){ const bar = document.querySelector('.nisw'); $('exam').style.bottom = bar ? bar.offsetHeight + 'px' : '0'; }
  window.scrollTo({top:0});
}
function setHash(h){ if(location.hash !== h) location.hash = h; else route(); }
function route(){
  const m = location.hash.match(/^#(b2|c1)(?:\/(\w+))?(?:\/(exam|review))?$/);
  if(m) level = m[1];
  const t = m && m[2] && RUOE_P4.find(x => x.id === m[2] && x[level]);
  if(!t){ cur = null; renderLevels(); renderParts(); show('menu'); return; }
  if(!cur || cur.t !== t || cur.level !== level) cur = {t, level, st: stateOf(level, t.id)};
  const sub = m[3];
  if(sub === 'exam'){ if(cur.st.checked){ setHash('#'+level+'/'+t.id+'/review'); return; } renderExam(); show('exam'); setTimeout(focusInput, 30); }
  else if(sub === 'review'){ if(!cur.st.checked){ setHash('#'+level+'/'+t.id+'/exam'); return; } renderReview(); show('review'); }
  else { renderGrammar(); show('grammar'); }
}
window.addEventListener('hashchange', route);
function stateOf(lv, id){
  const k = keyOf(lv, id);
  if(!STORE[k]) STORE[k] = {a:{}, f:{}, q:0, checked:false, score:null};
  const s = STORE[k]; s.a = s.a || {}; s.f = s.f || {}; s.q = s.q || 0;
  return s;
}
window.goMenu = () => setHash('#' + level);
window.openGrammar = () => cur && setHash('#' + cur.level + '/' + cur.t.id);
window.startExam = () => cur && setHash('#' + cur.level + '/' + cur.t.id + '/exam');

/* ---- 1 · Menú ------------------------------------------------------------ */
function topicsFor(lv){ return RUOE_P4.filter(t => t[lv] && t[lv].length); }
function renderLevels(){
  $('levels').innerHTML = Object.keys(LEVELS).map(k => {
    const L = LEVELS[k];
    return `<button type="button" class="lvl ${k} ${k===level?'on':''}" onclick="setLevel('${k}')">
      <b>${L.name}</b><span>${L.sub} · Part 4 answers: ${L.min}–${L.max} words</span></button>`;
  }).join('');
}
function renderParts(){
  $('parts').innerHTML = RUOE_PARTS.map(p => p.ready
    ? `<button type="button" class="part ${p.n===part?'on':''}" onclick="setPart(${p.n})"><div class="pn">Part ${p.n}</div><div class="pd">${p.name}</div></button>`
    : `<button type="button" class="part soon ${p.n===part?'on':''}" onclick="setPart(${p.n})"><div class="pn">Part ${p.n}</div><div class="pd">${p.name}</div><span class="soon-tag">🚧 Under construction</span></button>`
  ).join('');
  const P = RUOE_PARTS.find(p => p.n === part);
  if(!P.ready){
    $('partBody').innerHTML = `<div class="rule">🚧 <b>Part ${P.n} · ${P.name}</b> is under construction. It will be available soon. Meanwhile, practise <b>Part 4 · Key word transformations</b>.</div>`;
    return;
  }
  const L = LEVELS[level], list = topicsFor(level);
  $('partBody').innerHTML = `<div class="rule ${level}">
      <b>${L.name} · Part 4 — Key word transformations.</b> Complete the second sentence so that it means the same as the first. <b>Do not change the word given.</b> You must use between <b>${L.minW} and ${L.maxW} words</b>, including the word given. Contractions count as two words (<i>don't</i> = do not).
    </div>
    <div class="sec-title">3 · Choose a grammar point (${list.length})</div>
    <div class="topics">${list.map(t => {
      const n = t[level].length, g = STORE[keyOf(level,t.id)], done = g && g.checked ? g.score : null;
      const ans = g ? Object.values(g.a||{}).filter(v => (v||'').trim()).length : 0;
      const pct = done == null ? Math.round(ans / n * 100) : Math.round(done / n * 100);
      const meta = done != null ? ` · score <b>${done}/${n}</b>` : (ans ? ` · ${ans} answered` : '');
      return `<button type="button" class="topic" onclick="openTopic('${t.id}')">
        <div class="em">${t.emoji}</div><h3>${t.title}</h3>
        <div class="meta">${n} questions${meta}</div>
        <div class="prog"><i style="width:${pct}%;${done == null ? 'background:var(--blue)' : ''}"></i></div></button>`;
    }).join('')}</div>`;
}
window.setLevel = lv => { level = lv; history.replaceState(null, '', '#' + lv); renderLevels(); renderParts(); };
window.setPart = n => { part = n; renderParts(); };
window.openTopic = id => setHash('#' + level + '/' + id);

/* ---- 2 · Gramática ------------------------------------------------------- */
function renderGrammar(){
  const {t, level:lv} = cur, L = LEVELS[lv], n = t[lv].length;
  $('focus').innerHTML = `<h2>${t.emoji} ${t.title}<span class="badge ${lv}">${L.name}</span></h2>
    <p><b>Grammar focus.</b> ${t.focus}</p>
    <table class="pat">${t.patterns.map(p => `<tr><td>${p[0]}</td><td>${p[1]}</td></tr>`).join('')}</table>`;
  $('gRule').className = 'rule ' + lv;
  $('gRule').innerHTML = `<b>How the exercises work.</b> They follow the digital exam: one question per screen. Read the first sentence, use the <b>KEY WORD</b> without changing it and type between <b>${L.minW} and ${L.maxW} words</b> in the box. Move with ◀ ▶ or the question numbers at the bottom, flag any question you want to come back to, and press <b>Submit ✓</b> to see your score.`;
  const st = cur.st, ans = Object.values(st.a).filter(v => (v||'').trim()).length;
  $('gInfo').innerHTML = `${n} questions · ${Math.ceil(n / SET)} set${n > SET ? 's' : ''} of up to ${SET}` +
    (st.checked ? ` · last score <b>${st.score}/${n}</b>` : (ans ? ` · ${ans} answered so far` : ''));
}

/* ---- 3 · Examen ----------------------------------------------------------
   Mismo marco y mismo comportamiento que la Part 4 de los Practice Tests: una
   transformación por pantalla, números abajo por bloque de 6 (la Part 4 del
   examen tiene 6 preguntas), banderita, flechas y página de entrega. */
function items(){ return cur.t[cur.level]; }
function setOf(i){ return Math.floor(i / SET); }
let fsPct = 100, timer = null;
window.fontSize = d => { fsPct = Math.max(80, Math.min(160, fsPct + d * 10)); $('exam').style.setProperty('--exam-fs', (fsPct/100) + 'rem'); $('fsLabel').textContent = fsPct + '%'; };
function startTimer(){
  clearInterval(timer);
  const st = cur.st; st.secs = st.secs || 0;
  const paint = () => { const m = Math.floor(st.secs / 60), s = st.secs % 60; $('timer').textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0'); };
  paint(); timer = setInterval(() => { if(view !== 'exam'){ clearInterval(timer); return; } st.secs++; paint(); }, 1000);
}
function renderExam(){
  const L = LEVELS[cur.level];
  $('exCand').innerHTML = `${esc(cur.t.title)} · <strong>${L.name}</strong>`;
  $('submitPage').hidden = true; $('exInner').hidden = false;
  renderQuestion(); startTimer();
}
function renderQuestion(){
  const its = items(), st = cur.st, L = LEVELS[cur.level];
  if(st.q >= its.length) st.q = 0;
  const i = st.q, it = its[i], s = setOf(i), first = s * SET + 1, last = Math.min(its.length, (s + 1) * SET);
  const wr = L.min + '–' + L.max;
  $('exInner').innerHTML = `<div class="inspera-title"><h1>Reading and Use of English — Part 4</h1></div>
    <div class="inspera-instruction"><strong>Questions ${first}–${last}</strong>
      <p>For each question, complete the second sentence so that it means the same as the first. <b>Do not change the word given.</b> You must use between <b>${L.minW}</b> and <b>${L.maxW}</b> words, including the word given.</p></div>
    <div class="inspera-content">
      <div class="paged-counter">Question ${i - s * SET + 1} of ${last - first + 1}</div>
      <div class="q transform-q">
        <div class="stem">${i+1}. ${esc(it[0])}</div>
        <div class="kw-line">${esc(it[1])}</div>
        <div class="transform-second">${it[2] ? esc(it[2]) : ''}<input class="gap-inline-wide" id="exInput" type="text" placeholder="${wr} words" aria-label="Question ${i+1}" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(st.a[i]||'')}">${it[3] && it[3] !== '.' ? esc(it[3]) : '.'}</div>
        <div class="transform-hint">Write ${wr} words, including the key word.</div>
        <button type="button" class="q-flag ${st.f[i]?'on':''}" onclick="toggleFlag()" aria-pressed="${!!st.f[i]}">${st.f[i] ? '⚑ Flagged question ' : '⚐ Flag question '}${i+1}</button>
      </div>
    </div>`;
  const inp = $('exInput');
  inp.addEventListener('input', () => { st.a[i] = inp.value; renderTabs(); touch(); });
  inp.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); move(1); } });
  $('flagBtn').textContent = (st.f[i] ? '⚑ Flagged question ' : '⚐ Flag question ') + (i+1);
  $('flagBtn').classList.toggle('active', !!st.f[i]);
  $('prevBtn').disabled = i === 0;
  $('nextBtn').disabled = i === its.length - 1;
  renderTabs();
}
function renderTabs(){
  const its = items(), st = cur.st, cs = setOf(st.q), nSets = Math.ceil(its.length / SET);
  let h = '';
  for(let s = 0; s < nSets; s++){
    const a = s * SET, b = Math.min(its.length, a + SET);
    let qs = '', done = 0;
    for(let i = a; i < b; i++){
      const ans = !!(st.a[i]||'').trim(); if(ans) done++;
      qs += `<button type="button" class="qnum${ans?' answered':''}${st.f[i]?' flagged':''}${i===st.q?' current':''}" onclick="event.stopPropagation();goQ(${i})">${i+1}</button>`;
    }
    h += `<div class="part-tab${s===cs?' active':''}" onclick="goQ(${a})">
      <div class="pname">${nSets > 1 ? 'Set ' + (s+1) : 'Part 4'}</div>
      <div class="pprog">${done} of ${b - a}</div>
      <div class="qnums">${qs}</div></div>`;
  }
  $('exTabs').innerHTML = h;
}
function focusInput(){ const i = $('exInput'); if(i && window.innerWidth > 700) i.focus(); }
window.goQ = i => { $('submitPage').hidden = true; $('exInner').hidden = false; cur.st.q = i; renderQuestion(); focusInput(); touch(); };
window.move = d => { const n = cur.st.q + d; if(n >= 0 && n < items().length) goQ(n); };
window.toggleFlag = () => { const st = cur.st, i = st.q; if(st.f[i]) delete st.f[i]; else st.f[i] = true; renderQuestion(); touch(); };
/* Página de entrega: qué falta y qué está marcado, por bloque, antes de enviar. */
window.openSubmitPage = () => {
  const its = items(), st = cur.st, nSets = Math.ceil(its.length / SET);
  let rows = '', answered = 0, flagged = 0;
  for(let s = 0; s < nSets; s++){
    const a = s * SET, b = Math.min(its.length, a + SET);
    let done = 0, miss = '', flg = '';
    for(let i = a; i < b; i++){
      const isDone = !!(st.a[i]||'').trim(), isFlag = !!st.f[i];
      if(isDone) done++; else miss += `<button type="button" class="sp-num${isFlag?' flagged':''}" onclick="goQ(${i})">${i+1}</button>`;
      if(isFlag){ flagged++; flg += `<button type="button" class="sp-num flagged" onclick="goQ(${i})">${i+1}</button>`; }
    }
    answered += done;
    rows += `<tr><td class="sp-part">${nSets > 1 ? 'Set ' + (s+1) : 'Part 4'}</td><td>${done} of ${b - a}</td><td>${miss || '<span class="sp-ok">—</span>'}</td><td>${flg || '<span class="sp-ok">—</span>'}</td></tr>`;
  }
  const missing = its.length - answered, bits = [];
  if(missing) bits.push(`<strong>${missing}</strong> question${missing === 1 ? '' : 's'} not answered`);
  if(flagged) bits.push(`<strong>${flagged}</strong> flagged`);
  $('submitPage').innerHTML = `<h2>Submission page</h2>
    <p class="submit-summary">You have attempted <strong>${answered} of ${its.length}</strong> questions. Check the table, then press <strong>Submit test</strong>. You will not be able to change your answers after that.</p>
    ${bits.length ? `<div class="submit-warn">⚠ You still have ${bits.join(' and ')}. Click a number to go back to that question.</div>` : ''}
    <table class="submit-table"><thead><tr><th>Part</th><th>Attempted</th><th>Not answered</th><th>Flagged</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="submit-actions"><button type="button" class="sp-back" onclick="goQ(cur.st.q)">◀ Back to the questions</button><button type="button" class="sp-final" onclick="submitExam()">Submit test ✓</button></div>`;
  $('exInner').hidden = true; $('submitPage').hidden = false;
};
window.submitExam = () => {
  const its = items(), st = cur.st;
  st.score = its.filter((it, i) => (st.a[i]||'').trim() && isRight(it, st.a[i])).length;
  st.checked = true; clearInterval(timer); touch();
  setHash('#' + cur.level + '/' + cur.t.id + '/review');
};

/* ---- 4 · Corrección ------------------------------------------------------ */
function renderReview(){
  const its = items(), st = cur.st, L = LEVELS[cur.level], n = its.length;
  const pct = Math.round(st.score / n * 100);
  $('rvHead').innerHTML = `<div class="sec-title">${esc(cur.t.title)} · ${L.name}</div>
    <div class="bigscore">${st.score} / ${n} <span style="font-size:1rem;color:var(--muted)">(${pct}%)</span></div>
    <div style="font-size:.88rem;color:var(--muted)">${pct >= 80 ? 'Excellent — you are ready for this grammar point.' : pct >= 60 ? 'Good work. Review the answers marked in red.' : 'Read the grammar explanation again and try once more.'}</div>`;
  $('rvList').innerHTML = its.map((it, i) => {
    const v = (st.a[i]||'').trim(), ok = v && isRight(it, v), a = answersOf(it);
    let why = '';
    if(!ok && v){
      const w = words(v);
      if(!hasKey(it, v)) why = `You must use the key word <b>${esc(it[1])}</b> without changing it.`;
      else if(w < L.min || w > L.max) why = `Your answer has ${w} words; it must have ${L.min}–${L.max}.`;
    }
    const full = s => `${it[2] ? esc(it[2]) + ' ' : ''}<b>${esc(s)}</b>${it[3] && it[3] !== '.' ? ' ' + esc(it[3]) : '.'}`;
    return `<div class="q">
      <div class="qhead"><span class="qnum">${i+1}</span><div>${esc(it[0])} <b>(${esc(it[1])})</b></div></div>
      <div class="rv">
        <span class="yours ${ok?'ok':'bad'}">${ok ? '✓' : '✗'} ${v ? esc(v) : '<i>no answer</i>'}</span>
        ${why ? `<div class="why">${why}</div>` : ''}
        <div>${full(a[0])}</div>
        ${a.length > 1 ? `<div class="alt">Also accepted: ${a.slice(1).map(esc).join(' · ')}</div>` : ''}
      </div></div>`;
  }).join('');
}
window.retry = () => {
  const k = keyOf(cur.level, cur.t.id);
  STORE[k] = {a:{}, f:{}, q:0, secs:0, checked:false, score:null}; cur.st = STORE[k]; touch();
  setHash('#' + cur.level + '/' + cur.t.id + '/exam');
};

/* ◀ Back del portal: un paso atrás dentro de la página antes de salir. */
if(window.NISNAV) NISNAV.setBackHandler(() => {
  if(view === 'exam' || view === 'review'){ openGrammar(); return true; }
  if(view === 'grammar'){ goMenu(); return true; }
  return false;
});

/* ---- Guardado y entrega (barra Save / Submit) ---------------------------- */
function touch(){ if(window.NIS_WORK) NIS_WORK.touch(); }
if(window.NIS_WORK) NIS_WORK.attach(Object.assign(NIS_WORK.ficha(), {
  title: document.title,
  read:  function(){ return { store: STORE, level: level }; },
  write: function(d){
    const p = (d && d.store) || {};
    Object.keys(p).forEach(k => { STORE[k] = p[k]; });
    if(d && LEVELS[d.level] && !location.hash) level = d.level;
  },
  after: function(){ cur = null; route(); },
  count: function(d){
    const p = (d && d.store) || {};
    return Object.keys(p).reduce((n, k) => n + Object.values((p[k]||{}).a || {}).filter(v => (v||'').trim()).length, 0);
  },
  answers: function(d){
    const p = (d && d.store) || {}, out = {};
    Object.keys(p).forEach(k => {
      const x = p[k] || {}, n = Object.values(x.a || {}).filter(v => (v||'').trim()).length;
      if(n || x.checked) out[k] = n + ' answered' + (x.checked ? ' / score ' + x.score : '');
    });
    return out;
  }
}));

route();
</script>
