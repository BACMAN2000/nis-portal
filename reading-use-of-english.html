<style>
  :root{
  --blue:#4987c6;
  --blue-d:#2f5f93;
  --line:#e2e8f0;
  --good-bg:#ecfdf3;
  --bad-bg:#fef2f2;
  --c1:#7c3aed
}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Gotham',Montserrat,system-ui,Segoe UI,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5}
  .wrap{max-width:900px;margin:0 auto;padding:18px 16px 60px}
  header{background:linear-gradient(135deg,var(--blue-d),#1e3a5f);color:#fff;border-radius:16px;padding:18px 22px;margin-bottom:16px}
  header h1{margin:0 0 2px;font-size:1.3rem;color:#fff}
  header p{margin:0;opacity:.88;font-size:.85rem}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(20,40,80,.04)}
  .sec-title{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:4px 0 10px}
  .levels{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
  .lvl{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:14px 16px;cursor:pointer;text-align:left;font:inherit;color:var(--ink)}
  .lvl b{display:block;font-size:1.05rem;color:var(--blue-d)}
  .lvl span{font-size:.82rem;color:var(--muted)}
  .lvl.on{border-color:var(--blue);background:var(--bg)}
  .lvl.c1 b{color:var(--c1)} .lvl.c1.on{border-color:var(--c1)}
  .parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:6px}
  .part{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);font:inherit;text-align:left;color:var(--ink);cursor:pointer}
  .part .pn{font-weight:800;color:var(--blue-d);font-size:.95rem}
  .part .pd{font-size:.78rem;color:var(--muted)}
  .part.on{border-color:var(--blue);box-shadow:0 0 0 3px rgba(73,135,198,.18)}
  .part.soon{opacity:.62;cursor:not-allowed}
  .soon-tag{display:inline-block;margin-top:5px;font-size:.68rem;font-weight:700;background:#fef3c7;color:#92400e;border-radius:999px;padding:2px 8px}
  .rule{background:var(--bg);border-left:4px solid var(--blue);padding:10px 14px;border-radius:8px;font-size:.88rem;color:var(--muted);margin:12px 0 14px}
  .rule.c1{border-left-color:var(--c1)}
  .topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
  .topic{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--card);cursor:pointer;font:inherit;text-align:left;color:var(--ink);transition:transform .12s,box-shadow .12s}
  .topic:hover{transform:translateY(-2px);box-shadow:0 8px 20px -12px rgba(20,40,80,.35)}
  .topic .em{font-size:1.6rem;line-height:1}
  .topic h3{margin:6px 0 4px;font-size:.98rem;color:var(--ink)}
  .topic .meta{font-size:.78rem;color:var(--muted)}
  .prog{height:6px;background:var(--line);border-radius:999px;margin-top:10px;overflow:hidden}
  .prog i{display:block;height:100%;background:var(--good);border-radius:999px}
  .backbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--blue-d);font:inherit;font-weight:700;font-size:.88rem;padding:8px 14px;border-radius:10px;cursor:pointer;margin-bottom:12px}
  .badge{display:inline-block;font-size:.72rem;font-weight:700;border-radius:999px;padding:3px 10px;background:#dbeafe;color:#1e40af;margin-left:6px;vertical-align:middle}
  .badge.c1{background:#ede9fe;color:#5b21b6}
  .focus h2{margin:0 0 8px;font-size:1.15rem;color:var(--blue-d)}
  .focus p{margin:0 0 12px}
  .pat{width:100%;border-collapse:collapse;font-size:.9rem}
  .pat td{border-top:1px solid var(--line);padding:9px 6px;vertical-align:top}
  .pat td:first-child{font-weight:700;color:var(--blue-d);width:32%}
  @media(max-width:620px){.pat td:first-child{width:auto;display:block;padding-bottom:0}.pat td:last-child{display:block;border-top:none}}
  .startrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
  .btn{border:none;border-radius:10px;padding:11px 20px;font:inherit;font-weight:700;cursor:pointer;font-size:.92rem}
  .btn.primary{background:var(--blue);color:#fff}
  .btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--blue-d)}
  .foot{font-size:.76rem;color:var(--muted);text-align:center;margin-top:18px}
  .hidden{display:none !important}
  /* Corrección */
  .q{border-top:1px solid var(--line);padding:14px 0}
  .q:first-child{border-top:none;padding-top:4px}
  .qhead{display:flex;gap:10px;align-items:flex-start}
  .qnum{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--blue-d);color:#fff;font-weight:700;font-size:.85rem;flex:0 0 auto}
  .rv{margin-left:38px;font-size:.92rem}
  .rv .yours{display:inline-block;padding:2px 8px;border-radius:6px;margin:4px 0}
  .rv .yours.ok{background:var(--good-bg);color:#065f46} .rv .yours.bad{background:var(--bad-bg);color:#991b1b}
  .rv .alt{color:var(--muted);font-size:.8rem}
  .rv .why{color:#b45309;font-size:.84rem;margin:2px 0}
  .rv .model{margin-top:4px}
  .rv .model span{font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-right:4px}
  .rv .gnote{margin-top:8px;background:var(--bg);border-left:4px solid var(--blue);border-radius:8px;padding:8px 12px;font-size:.87rem;line-height:1.55}
  .rv .gnote span{display:block;font-size:.74rem;font-weight:700;color:var(--blue-d);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
  .bigscore{font-size:1.6rem;font-weight:800;color:var(--blue-d)}
  @media(max-width:520px){.levels{grid-template-columns:1fr}.rv{margin-left:0}}

  /* ===== Pantalla de examen: el mismo marco «inspera» de los Practice Tests
     (mocks-cambridge/reading-quiz.html), copiado tal cual. ===== */
  .inspera-shell{position:fixed;inset:0;background:var(--bg);color:var(--ink);z-index:1000;font-family:"Montserrat","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;--exam-fs:1rem}
  .inspera-shell *{box-sizing:border-box}
  .inspera-header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .inspera-header .brand{display:inline-flex;align-items:center;text-decoration:none}
  .inspera-header .brand img{display:block;height:36px;width:auto}
  .inspera-header .candidate{color:var(--muted);font-size:.85rem}
  .inspera-header .right{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .inspera-header .timer{font-family:Consolas,"Segoe UI Mono",monospace;font-size:1.05rem;font-weight:800;color:var(--ink);background:var(--lila);padding:6px 14px;border-radius:8px;letter-spacing:2px;min-width:90px;text-align:center}
  .inspera-header button{background:var(--card);color:var(--muted);border:1px solid var(--line);padding:6px 14px;border-radius:6px;font-size:.85rem;font-weight:600;cursor:pointer;font-family:inherit}
  .inspera-header button.finish-btn{background:#2f5f93;color:var(--card);border-color:#2f5f93}
  .inspera-header button:hover{filter:brightness(0.97)}
  .inspera-header .tools{display:flex;gap:4px;flex-wrap:wrap}
  .inspera-header .tool-btn{background:var(--bg);color:var(--muted);border:1px solid var(--line);padding:6px 10px;border-radius:6px;font-size:.85rem;font-weight:600;cursor:pointer;font-family:"Montserrat","Segoe UI",sans-serif;display:inline-flex;align-items:center;gap:4px}
  .inspera-header .tool-btn:hover{background:var(--line);border-color:#94a3b8}
  .inspera-header .tool-btn.active{background:var(--amber50);border-color:var(--gold);color:var(--ink)}
  .inspera-header .fs-group{display:inline-flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .inspera-header .fs-group button{background:transparent;border:none;padding:6px 10px;font-weight:700;cursor:pointer;color:var(--muted);font-family:"Montserrat","Segoe UI",sans-serif}
  .inspera-header .fs-group .fs-label{padding:0 8px;color:#94a3b8;font-size:.78rem;border-left:1px solid var(--line);border-right:1px solid var(--line)}
  .inspera-main{flex:1;overflow-y:auto;padding:18px 32px 30px;width:100%}
  .inspera-main-inner{max-width:1000px;margin:0 auto}
  .inspera-title{margin:6px 0 10px}
  .inspera-title h1{font-size:1.35rem;margin:0;font-weight:700;color:var(--ink)}
  .inspera-instruction{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin:14px 0}
  .inspera-instruction strong{display:block;color:var(--ink);font-size:1rem;margin-bottom:4px;font-weight:700}
  .inspera-instruction p{color:var(--muted);font-size:.92rem;margin:0;line-height:1.5}
  .inspera-content{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:24px 28px;font-family:Georgia,"Times New Roman",serif;line-height:1.85;color:var(--ink);font-size:var(--exam-fs,1rem)}
  .inspera-content .q{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin:12px 0;font-family:"Montserrat","Segoe UI",sans-serif;font-size:var(--exam-fs,1rem)}
  .inspera-content .q .stem{font-weight:600;color:var(--ink);margin-bottom:10px}
  .paged-counter{font-size:.85rem;color:var(--muted);font-weight:600;margin-bottom:10px;font-family:"Montserrat","Segoe UI",sans-serif}
  .transform-q{font-family:Georgia,"Times New Roman",serif;line-height:1.75}
  .transform-q > .stem{font-family:inherit;font-weight:400;margin-bottom:8px}
  .kw-line{font-weight:700;letter-spacing:1.5px;color:var(--blue);margin:8px 0;padding-left:28px;font-family:"Montserrat","Segoe UI",sans-serif;font-size:1rem}
  .transform-second input.gap-inline-wide{display:inline-block;width:240px;max-width:100%;margin:0 6px;padding:4px 8px;border:none;border-bottom:1.5px dashed #94a3b8;background:var(--card);color:var(--ink);font-family:inherit;font-size:1rem;text-align:center}
  .transform-second input.gap-inline-wide:focus{outline:none;border-bottom-color:#4987c6}
  .transform-hint{font-family:"Montserrat","Segoe UI",sans-serif;font-size:.82rem;color:var(--muted);margin-top:8px}
  .inspera-shell .q-flag{display:inline-flex;align-items:center;gap:4px;margin-top:8px;background:transparent;border:1px solid var(--line);border-radius:6px;padding:4px 10px;font:600 .78rem "Montserrat","Segoe UI",system-ui,sans-serif;color:var(--muted);cursor:pointer}
  .inspera-shell .q-flag:hover{border-color:var(--gold,#d97706);color:var(--ink)}
  .inspera-shell .q-flag.on{background:var(--amber50,#fef3c7);border-color:var(--gold,#d97706);color:var(--ink)}
  .inspera-footer{background:var(--card);border-top:1px solid var(--line);padding:8px 14px;display:flex;align-items:stretch;gap:8px;box-shadow:0 -1px 3px rgba(0,0,0,.05);overflow-x:auto}
  .part-tabs{display:flex;gap:6px;flex:1;align-items:stretch}
  .part-tab{padding:8px 14px;border-radius:8px;cursor:pointer;flex-shrink:0;min-width:90px;background:var(--bg);border:1px solid var(--line);color:var(--muted);font-size:.82rem;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:2px}
  .part-tab .pname{font-weight:700;font-size:.82rem;color:var(--ink)}
  .part-tab .pprog{font-size:.76rem;color:var(--muted)}
  .part-tab:hover{border-color:#94a3b8}
  .part-tab.active{background:var(--card);border-color:#4987c6;color:var(--ink);box-shadow:0 0 0 2px #d1d2ea}
  .part-tab.active .pname{color:var(--blue)}
  .part-tab .qnums{display:none}
  .part-tab.active .pprog{display:none}
  .part-tab.active .qnums{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:3px}
  .qnum{position:relative;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:5px;background:var(--card);color:var(--muted);font-size:.78rem;font-weight:600;cursor:pointer;padding:0;line-height:1;font-family:inherit}
  .qnum:hover{border-color:#4987c6;color:var(--blue)}
  .qnum.answered{background:#2f5f93;border-color:#2f5f93;color:var(--card)}
  .qnum.current{box-shadow:0 0 0 2px #d1d2ea;border-color:#4987c6}
  .inspera-shell .qnum.flagged::after,.inspera-shell .sp-num.flagged::after{content:'';position:absolute;top:-1px;right:-1px;border:5px solid transparent;border-top-color:var(--gold,#d97706);border-right-color:var(--gold,#d97706);border-radius:0 5px 0 0}
  .nav-arrows{display:flex;gap:6px;flex-shrink:0;align-items:center;padding-left:8px;border-left:1px solid var(--line);margin-left:4px}
  .nav-arrows button{background:#2f5f93;color:var(--card);border:none;padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.95rem;min-width:46px}
  .nav-arrows button:disabled{background:var(--line-2);cursor:not-allowed}
  .inspera-shell .submit-page{max-width:900px;margin:0 auto;padding:10px 0 30px;font-family:"Montserrat","Segoe UI",system-ui,sans-serif}
  .inspera-shell .submit-page h2{font-size:1.3rem;margin:6px 0 8px;color:var(--ink);font-weight:700}
  .inspera-shell .submit-page .submit-summary{color:var(--muted);margin:0 0 14px;font-size:.95rem;line-height:1.5}
  .inspera-shell .submit-page .submit-summary strong{color:var(--ink)}
  .inspera-shell .submit-page .submit-warn{background:var(--amber50,#fef3c7);border:1px solid var(--gold,#d97706);color:var(--ink);border-radius:8px;padding:10px 14px;margin:0 0 14px;font-size:.92rem}
  .inspera-shell .submit-table{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:.92rem}
  .inspera-shell .submit-table th,.inspera-shell .submit-table td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;color:var(--ink)}
  .inspera-shell .submit-table th{background:var(--bg);color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.03em}
  .inspera-shell .submit-table tr:last-child td{border-bottom:none}
  .inspera-shell .submit-table td.sp-part{font-weight:700;white-space:nowrap}
  .inspera-shell .submit-table .sp-ok{color:var(--muted)}
  .inspera-shell .sp-num{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink);font-size:.8rem;font-weight:600;cursor:pointer;margin:2px 3px 2px 0;position:relative;font-family:inherit}
  .inspera-shell .submit-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
  .inspera-shell .submit-actions button{border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer;font-family:inherit;font-size:.92rem}
  .inspera-shell .submit-actions .sp-back{background:var(--card);color:var(--muted);border:1px solid var(--line)}
  .inspera-shell .submit-actions .sp-final{background:#2f5f93;color:#fff;border:1px solid #2f5f93}
  @media(max-width:640px){
    .inspera-header{padding:10px 14px}
    .inspera-header .candidate{display:none}
    .inspera-main{padding:14px}
    .inspera-content{padding:16px 18px}
    .part-tab{min-width:70px;padding:6px 10px}
  }
  /* Partes de texto (1-3, 5-7): mismas reglas que mocks-cambridge/reading-quiz.html */
  .chips{margin:4px 0 2px}
  .chip{display:inline-block;font-size:.7rem;font-weight:700;background:#e0f2fe;color:#075985;border-radius:999px;padding:2px 8px;margin:2px 3px 0 0}
  .inspera-content h3{font-family:"Montserrat","Segoe UI",sans-serif;font-size:1.18rem;margin:0 0 14px;font-weight:700;color:var(--ink)}
  .inspera-content .passage{color:var(--ink);font-family:Georgia,"Times New Roman",serif;font-size:var(--exam-fs,1rem);line-height:1.85;white-space:pre-line;margin:0 0 18px}
  .inspera-content .passage p{margin:0 0 12px;white-space:normal}
  .inspera-content .notice{background:var(--bg);border:1px solid var(--line);color:var(--muted);padding:10px 14px;border-radius:8px;font-style:italic;margin-bottom:12px;font-size:.92rem;font-family:"Montserrat","Segoe UI",sans-serif}
  .inspera-content.two-col{padding:0;display:grid;grid-template-columns:1fr 1fr;gap:0;overflow:hidden}
  .inspera-content.two-col > .col-left{padding:22px 24px;border-right:1px solid var(--line);overflow-y:auto;max-height:calc(100vh - 290px)}
  .inspera-content.two-col > .col-right{padding:22px 24px;overflow-y:auto;max-height:calc(100vh - 290px);background:var(--bg)}
  @media(max-width:780px){.inspera-content.two-col{display:block}.inspera-content.two-col > .col-left{border-right:none;border-bottom:1px solid var(--line);max-height:none}.inspera-content.two-col > .col-right{max-height:none}}
  .inspera-content .opt{display:block;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:9px 14px;margin:6px 0;cursor:pointer;color:var(--ink);font-size:.95rem;transition:.15s}
  .inspera-content .opt:hover{border-color:#4987c6;background:var(--bg)}
  .inspera-content .opt input[type="radio"]{margin-right:10px;accent-color:#4987c6}
  .gap-pill{display:inline-flex;align-items:center;justify-content:center;background:var(--card);color:var(--ink);border:1.5px solid #94a3b8;border-radius:6px;padding:0 10px;height:26px;min-width:26px;font-family:"Montserrat","Segoe UI",sans-serif;font-size:.92rem;font-weight:600;margin:0 3px;cursor:pointer;vertical-align:baseline;white-space:nowrap;transition:.12s}
  .gap-pill:hover{border-color:#4987c6}
  .gap-pill.answered{background:#2f5f93;color:#fff;border-color:#2f5f93}
  .gap-popup{position:fixed;background:#0f172a;color:#fff;border-radius:10px;padding:5px;display:flex;flex-direction:row;gap:3px;box-shadow:0 12px 32px rgba(0,0,0,.45);z-index:3000;align-items:center;flex-wrap:wrap;max-width:520px}
  .gap-popup button{background:#1e293b;color:#fff;border:none;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:.92rem;font-family:"Montserrat","Segoe UI",sans-serif;font-weight:500;white-space:nowrap}
  .gap-popup button:hover{background:#4987c6}
  .gap-popup .close-x{background:transparent;color:#94a3b8;padding:6px 8px;font-weight:700;border-right:1px solid #334155;border-radius:0;margin-right:2px}
  .gapped-select{display:inline-block;background:var(--card);color:var(--ink);border:1.5px solid #94a3b8;border-radius:6px;padding:2px 6px 2px 10px;font-family:"Montserrat","Segoe UI",sans-serif;font-size:.92rem;font-weight:600;margin:0 3px;cursor:pointer;vertical-align:baseline}
  .gapped-select.answered{background:#2f5f93;color:#fff;border-color:#2f5f93}
  .cloze-input{display:inline-block;background:var(--card);color:var(--ink);border:none;border-bottom:1.5px solid #94a3b8;padding:2px 6px;font-family:"Montserrat","Segoe UI",sans-serif;font-size:.95rem;margin:0 3px;width:110px;text-align:center;font-weight:500}
  .cloze-input:focus{outline:none;border-bottom-color:#4987c6;border-bottom-width:2px}
  .inspera-content .bank{background:var(--bg);border:1px solid var(--line);color:var(--ink);font-family:"Montserrat","Segoe UI",sans-serif;font-size:.92rem;border-radius:8px;padding:12px;margin:0 0 14px}
  .inspera-content .bank ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
  .inspera-content select{background:var(--card);color:var(--ink);border:1.5px solid #94a3b8;border-radius:6px;padding:6px 10px;font-family:"Montserrat","Segoe UI",sans-serif;font-size:.95rem;max-width:100%}
  .wordform-grid{display:grid;grid-template-columns:auto max-content;justify-content:start;gap:2px 14px;background:var(--bg);border:1px solid var(--line);border-left:4px solid #4987c6;padding:18px 22px;border-radius:8px;margin:8px 0;font-family:Georgia,"Times New Roman",serif;line-height:1.85;align-items:baseline;color:var(--ink);font-size:var(--exam-fs,1rem)}

/* STORE['b2:passive'] = {a:{i:'…'}, f:{i:true}, q:i, checked, score} */

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---- Corrección --------------------------------------------------------
   Se comparan las dos cadenas tras expandir contracciones (hasn't = has not),
   así el alumno puede escribir la forma corta o la larga. 'd es ambiguo
   (had / would): se prueban las dos lecturas. Mayúsculas y minúsculas dan
   igual, como al teclear en el examen digital. */
function base(s){
  return String(s||'').toLowerCase()
    .replace(/[’‘`´]/g,"'").replace(/[“”]/g,'"')
    .replace(/\b(apologi|reali|recogni|organi)z/g,'$1s').replace(/\bfavor\b/g,'favour')
    .replace(/\bcan't\b/g,'cannot').replace(/\bcan not\b/g,'cannot')
    .replace(/\bwon't\b/g,'will not').replace(/\bshan't\b/g,'shall not')
    .replace(/n't\b/g,' not')
    .replace(/'m\b/g,' am').replace(/'re\b/g,' are').replace(/'ve\b/g,' have').replace(/'ll\b/g,' will')
    .replace(/\b(he|she|it|that|there|what|who)'s been\b/g,'$1 has been')
    .replace(/[.,;:!?"]/g,' ').replace(/\s+/g,' ').trim();
}
function forms(s){
  const b = base(s);
  if(!/'d\b/.test(b)) return [b];
  return [b.replace(/'d\b/g,' would'), b.replace(/'d\b/g,' had')].map(x=>x.replace(/\s+/g,' ').trim());
}
/* Palabras al estilo Cambridge: las contracciones cuentan como dos
   (hasn't = has not), «cannot» como una. */
function words(s){ const f = forms(s)[0]; return f ? f.split(' ').length : 0; }
function answersOf(it){ return it[4].split('|'); }
function isRight(it, txt){
  const mine = forms(txt);
  return answersOf(it).some(a => forms(a).some(f => mine.includes(f)));
}
function hasKey(it, txt){
  const k = ' ' + base(it[1]) + ' ';
  return forms(txt).some(f => (' ' + f + ' ').includes(k));
}

/* ---- Contenido de B2 (Parts 1-3 y 5-7) ----------------------------------

        focus:'Mixed key word transformations from the B2 tests: quantifiers, pronouns, word choice, fixed phrases and inversion. Each one changes the structure of the sentence while keeping its meaning — look carefully at the key word and decide which structure it belongs to.',
        patterns:[['Quantifiers','<b>few / a few</b> · <b>little / a little</b> · <b>hardly any</b> · <b>none of</b> · <b>neither of</b>'],

  if(!RUOE_PARTS.find(p => p.n === 8)) RUOE_PARTS.push({n:8, name:'Multiple matching', desc:'One text in sections · 10 questions'});

const GUIDE57 = {
  5:{focus:'Part 5 is a long text followed by <b>multiple-choice questions</b> (A, B, C or D). The questions follow the order of the text. They test <b>detail</b>, <b>opinion and attitude</b>, the <b>purpose</b> of a paragraph, the meaning of a <b>word or phrase in context</b> and what a <b>reference word</b> (it, this, they) refers to.',
     patterns:[['Strategy','Read the text quickly first. Then, for each question, find the part of the text it refers to and read it carefully <b>before</b> you look at the options.'],
       ['Distractors','Wrong options often repeat <b>words from the text</b> but change the meaning, or say something that is true but does not answer the question.'],

const GUIDE_C1 = {
  6:{focus:'Part 6 has <b>four short texts</b> (A–D) by different writers on the same topic, and <b>4 questions</b>. You do not look for a fact in one text: you <b>compare opinions</b> across the four. Typical questions: <i>Which writer has a different view from the others on…? · Which writer shares A’s opinion about…? · Which writer expresses a similar view to C regarding…?</i>',

  7:{focus:'Part 7 is a long text with <b>six paragraphs removed</b>. You choose the paragraph (A–G) that fits each gap; one paragraph is extra. It tests how a text <b>holds together</b>: the paragraph must connect with the text before the gap <b>and</b> after it.',
     patterns:[['Reference','<b>this, such, the latter, she, there, these figures</b> must point back to something just mentioned. If nothing before the gap matches, the paragraph does not belong there.'],

     patterns:[['Strategy','Read the questions first and underline the key idea (e.g. <i>admits</i>, <i>initially</i>, <i>surprised</i>). Then read section by section and note which questions each one answers.'],

};

/* Palabras de las apps de vocabulario del portal que salen en un texto (lx). */

/* Nota por categoría para la corrección de las Parts 1 y 2. */
const TAGNOTE = {
  prepositions:'<b>Preposition.</b> Check the word before the gap: many verbs, adjectives and nouns take a fixed preposition (<i>interested in, depend on, the reason for</i>), and time/place expressions have fixed ones too.',

  passive:'<b>Passive.</b> The subject receives the action, so you need a form of <i>be</i> + past participle.',
  inversion:'<b>Inversion / emphasis.</b> After a negative adverbial (<i>Not only, Never, Hardly</i>) the auxiliary comes before the subject.',

   El hash manda: #b2/part-3 (menú en esa parte) · #b2/<tema> (Part 4) ·

   cada uno con /exam y /review. El «atrás» del navegador también funciona. */
function show(v){
  view = v;
  ['menu','grammar','review'].forEach(id => $(id).classList.toggle('hidden', id !== v));
  $('exam').classList.toggle('hidden', v !== 'exam');
  document.body.style.overflow = v === 'exam' ? 'hidden' : '';

  document.querySelectorAll('.backlbl').forEach(s => s.textContent = cur && cur.k === 'kwt' ? 'Back to grammar points' : 'Back to Part ' + part);
  document.querySelectorAll('.gap-popup').forEach(p => p.remove());
  window.scrollTo({top:0});
}
function setHash(h){ if(location.hash !== h) location.hash = h; else route(); }
function findItem(lv, id){
  if(!id) return null;
  if(id.startsWith('m-')){ const m = ((DX(lv).p3||{}).modules||[]).find(x => 'm-' + x.id === id); return m ? {k:'wfm', p:3, r:3, m, title:m.title} : null; }
  if(id.startsWith('x-')){
    for(const p of [1,2,3,5,6,7,8]){ const x = ((DX(lv)['p'+p]||{}).ex||[]).find(e => 'x-' + e.id === id); if(x) return {k:'text', p, r:KIND(lv, p), x, title:x.title}; }
    return null;
  }
  const t = RUOE_P4.find(x => x.id === id && x[lv]);
  return t ? {k:'kwt', p:4, t, title:t.title} : null;
}
function route(){
  const m = location.hash.match(/^#(b2|c1)(?:\/([\w-]+))?(?:\/(exam|review))?$/);
  if(m) level = m[1];
  const id = m && m[2];
  if(id && /^part-[1-8]$/.test(id)) part = +id.slice(5);
  if(level === 'b2' && part === 8) part = 4;
  const f = findItem(level, id);
  if(!f){ cur = null; renderLevels(); renderParts(); show('menu'); return; }
  if(!cur || cur.id !== id || cur.level !== level) cur = Object.assign(f, {id, level, st: stateOf(level, id)});
  part = cur.p;

/* Popup de opciones de la Part 1: el mismo de los Practice Tests. */

    for(let i = a; i < b; i++){
      const ans = filled(i); if(ans) done++;
      qs += `<button type="button" class="qnum${ans?' answered':''}${st.f[i]?' flagged':''}${i===st.q?' current':''}" onclick="event.stopPropagation();goQ(${i})">${numOf(i)}</button>`;
    }
    h += `<div class="part-tab${s===cs?' active':''}" onclick="goQ(${a})">
      <div class="pname">${label(s)}</div>
      <div class="pprog">${done} of ${b - a}</div>
      <div class="qnums">${qs}</div></div>`;
  }
  $('exTabs').innerHTML = h;
}
function focusInput(){
  if(window.innerWidth <= 700) return;
  const i = cur && cur.k === 'text' ? $('exInner').querySelector(`input[type=text][data-i="${cur.st.q}"]`) : $('exInput');
  if(i) i.focus({preventScroll: cur.k === 'text'});
}
window.goQ = i => {
  $('submitPage').hidden = true; $('exInner').hidden = false; cur.st.q = i;
  renderQuestion(); focusInput(); touch();
};
window.move = d => { const n = cur.st.q + d; if(n >= 0 && n < count()) goQ(n); };
window.toggleFlag = (j) => {
  const st = cur.st, i = (typeof j === 'number') ? j : st.q;
  if(st.f[i]) delete st.f[i]; else st.f[i] = true;
  if(cur.k === 'text'){ st.q = i; const b = $('exInner').querySelector(`[data-flag="${i}"]`); if(b){ b.classList.toggle('on', !!st.f[i]); b.textContent = flagLabel(i); } chrome(); }
  else renderQuestion();
  touch();
};
/* Página de entrega: qué falta y qué está marcado, por bloque, antes de enviar. */
window.openSubmitPage = () => {
  const n = count(), st = cur.st, per = setSize(), nSets = Math.ceil(n / per);
  let rows = '', answered = 0, flagged = 0;
  for(let s = 0; s < nSets; s++){
    const a = s * per, b = Math.min(n, a + per);
    let done = 0, miss = '', flg = '';
    for(let i = a; i < b; i++){
      const isDone = filled(i), isFlag = !!st.f[i];
      if(isDone) done++; else miss += `<button type="button" class="sp-num${isFlag?' flagged':''}" onclick="goQ(${i})">${numOf(i)}</button>`;
      if(isFlag){ flagged++; flg += `<button type="button" class="sp-num flagged" onclick="goQ(${i})">${numOf(i)}</button>`; }
    }
    answered += done;
    rows += `<tr><td class="sp-part">${nSets > 1 ? 'Set ' + (s+1) : 'Part ' + cur.p}</td><td>${done} of ${b - a}</td><td>${miss || '<span class="sp-ok">—</span>'}</td><td>${flg || '<span class="sp-ok">—</span>'}</td></tr>`;
  }
  const missing = n - answered, bits = [];
  if(missing) bits.push(`<strong>${missing}</strong> question${missing === 1 ? '' : 's'} not answered`);
  if(flagged) bits.push(`<strong>${flagged}</strong> flagged`);
  $('submitPage').innerHTML = `<h2>Submission page</h2>
    <p class="submit-summary">You have attempted <strong>${answered} of ${n}</strong> questions. Check the table, then press <strong>Submit test</strong>. You will not be able to change your answers after that.</p>
    ${bits.length ? `<div class="submit-warn">⚠ You still have ${bits.join(' and ')}. Click a number to go back to that question.</div>` : ''}
    <table class="submit-table"><thead><tr><th>Part</th><th>Attempted</th><th>Not answered</th><th>Flagged</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="submit-actions"><button type="button" class="sp-back" onclick="goQ(cur.st.q)">◀ Back to the questions</button><button type="button" class="sp-final" onclick="submitExam()">Submit test ✓</button></div>`;
  $('exInner').hidden = true; $('submitPage').hidden = false;
  document.querySelectorAll('.gap-popup').forEach(p => p.remove());
};
window.submitExam = () => {
  const st = cur.st; let sc = 0;
  for(let i = 0; i < count(); i++) if(correctAt(i)) sc++;
  st.score = sc; st.checked = true; clearInterval(timer); touch();
  setHash('#' + cur.level + '/' + cur.id + '/review');
};

/* ---- 4 · Corrección ------------------------------------------------------ */
function renderReview(){
  const its = items(), st = cur.st, L = LEVELS[cur.level], n = its.length;
  const pct = Math.round(st.score / n * 100);
  $('rvHead').innerHTML = `<div class="sec-title">${esc(cur.title)} · ${L.name}${cur.k !== 'kwt' ? ' · Part ' + cur.p : ''}</div>
    <div class="bigscore">${st.score} / ${n} <span style="font-size:1rem;color:var(--muted)">(${pct}%)</span></div>
    <div style="font-size:.88rem;color:var(--muted)">${pct >= 80 ? 'Excellent — well done.' : pct >= 60 ? 'Good work. Review the answers marked in red.' : 'Read the explanation again and try once more.'}</div>`;
  $('rvGrammarBtn').textContent = cur.k === 'kwt' ? '📖 Grammar explanation' : '📖 How this part works';
  $('rvList').innerHTML = its.map((it, i) => reviewItem(it, i, L)).join('');
}
/* Nota de cada hueco (it.w, como RUOE_WHY en la Part 4); si falta, la de su categoría. */
function gapNote(it){
  const txt = it.w || TAGNOTE[it.t];
  return txt ? `<div class="gnote"><span>📘 ${TAGLABEL[it.t] || it.t || 'Grammar'}</span>${txt}</div>` : '';
}
function yours(ok, txt){ return `<span class="yours ${ok?'ok':'bad'}">${ok ? '✓' : '✗'} ${txt ? txt : '<i>no answer</i>'}</span>`; }
function reviewItem(it, i, L){
  const st = cur.st, v = st.a[i], has = filled(i), ok = correctAt(i), num = numOf(i);
  const q = (head, inner) => `<div class="q"><div class="qhead"><span class="qnum">${num}</span><div>${head}</div></div><div class="rv">${inner}</div></div>`;
  if(cur.k === 'kwt') return reviewKwt(it, i, L);
  if(cur.k === 'wfm'){
    const a = it[2].split('|'), full = esc(it[0]).replace('___', `<b>${esc(a[0])}</b>`);
    return q(`${esc(it[0]).replace('___', '______')} <b>(${esc(it[1])})</b>`,
      yours(ok, has && esc(v)) + `<div class="model"><span>Answer:</span> ${full}</div>` +
      (a.length > 1 ? `<div class="alt">Also accepted: ${a.slice(1).map(esc).join(' · ')}</div>` : '') +
      `<div class="gnote"><span>📘 ${esc(cur.m.title.split(':')[0])}</span>${esc(it[1])} → <b>${esc(a[0])}</b></div>`);
  }
  const p = cur.r, lx = lxNote(it);
  if(p === 1){
    const L4 = j => String.fromCharCode(65 + j);
    return q(`Options: ${it.o.map((o, j) => `${L4(j)} ${esc(o)}`).join(' · ')}`,
      yours(ok, has && `${L4(+v)} ${esc(it.o[+v])}`) + `<div class="model"><span>Answer:</span> <b>${L4(it.a)} ${esc(it.o[it.a])}</b></div>` +
      gapNote(it) + lx);
  }
  if(p === 2 || p === 3){
    const head = p === 3 ? `Word given: <b>${esc(it.r)}</b>` : `Gap ${num}`;
    const note = p === 3 ? `<div class="gnote"><span>📘 Word formation${it.x ? ' · ' + esc(it.x) : ''}</span>${it.w || `${esc(it.r)} → <b>${esc(it.a[0])}</b>`}</div>`
                         : gapNote(it);
    return q(head, yours(ok, has && esc(v)) + `<div class="model"><span>Answer:</span> <b>${esc(it.a[0])}</b></div>` +
      (it.a.length > 1 ? `<div class="alt">Also accepted: ${it.a.slice(1).map(esc).join(' · ')}</div>` : '') + note + lx);
  }
  /* Parts 5-7: la nota dice dónde está la respuesta en el texto. */
  const readNote = w => w ? `<div class="gnote"><span>📘 Why</span>${w}</div>` : '';
  if(p === 5){
    const L4 = j => String.fromCharCode(65 + j);
    return q(esc(it.s), yours(ok, has && `${L4(+v)}) ${esc(it.o[+v])}`) + `<div class="model"><span>Answer:</span> <b>${L4(it.a)}) ${esc(it.o[it.a])}</b></div>` + readNote(it.w) + lx);
  }
  if(p === 6){
    const bank = cur.x.bank, w = (cur.x.w || {})[String(i + 1)] || (cur.x.w || {})[String(it.n)];
    return q(`Gap ${num}`, yours(ok, has && `${esc(v)} — ${esc(bank[v] || '')}`) + `<div class="model"><span>Answer:</span> <b>${esc(it.a)}</b> — ${esc(bank[it.a] || '')}</div>` + readNote(w));
  }
  const sec = l => { const s = cur.x.sections.find(z => z.l === l); return s ? `${l}${s.h ? ' — ' + esc(s.h) : ''}` : esc(l); };
  return q(esc(it.s), yours(ok, has && sec(v)) + `<div class="model"><span>Answer:</span> <b>${sec(it.a)}</b></div>` + readNote(it.w));
}
function reviewKwt(it, i, L){
  const st = cur.st, v = (st.a[i]||'').trim(), ok = v && isRight(it, v), a = answersOf(it);
  /* Diagnóstico de la respuesta (lo que falló en concreto) + la explicación
     gramatical del ítem (RUOE_WHY), que se muestra siempre, también si acertó. */
  const why = [];
  if(!ok && v){
    const w = words(v), mine = forms(v)[0].split(' ');
    const pre = base(it[2]).split(' ').filter(Boolean), post = base(it[3]).split(' ').filter(Boolean);
    if(!hasKey(it, v)) why.push(`The key word <b>${esc(it[1])}</b> is missing or has been changed. In Part 4 you must use it exactly as it is given.`);
    if(w < L.min || w > L.max) why.push(`Your answer has ${w} word${w===1?'':'s'}; at ${L.name} it must have ${L.min}–${L.max} (contractions count as two words).`);
    const preW = String(it[2]).trim().split(/\s+/).pop(), postW = String(it[3]).trim().split(/\s+/)[0].replace(/[.,!?]$/,'');
    if(pre.length && mine[0] === pre[pre.length-1]) why.push(`Don’t repeat <b>“${esc(preW)}”</b> — it is already written before the gap.`);
    if(post.length && mine[mine.length-1] === post[0]) why.push(`Don’t repeat <b>“${esc(postW)}”</b> — it is already written after the gap.`);
    if(!why.length) why.push('You used the key word and the right number of words, but the structure does not keep the meaning of the first sentence. Compare it with the model answer and read the grammar note.');
  }
  const note = (window.RUOE_WHY || {})[cur.t.id + ':' + cur.level + ':' + i];
  const full = s => `${it[2] ? esc(it[2]) + ' ' : ''}<b>${esc(s)}</b>${it[3] && it[3] !== '.' ? ' ' + esc(it[3]) : '.'}`;
  return `<div class="q">
    <div class="qhead"><span class="qnum">${i+1}</span><div>${esc(it[0])} <b>(${esc(it[1])})</b></div></div>
    <div class="rv">
      <span class="yours ${ok?'ok':'bad'}">${ok ? '✓' : '✗'} ${v ? esc(v) : '<i>no answer</i>'}</span>
      ${why.map(x => `<div class="why">⚠ ${x}</div>`).join('')}
      <div class="model"><span>Model answer:</span> ${full(a[0])}</div>
      ${a.length > 1 ? `<div class="alt">Also accepted: ${a.slice(1).map(esc).join(' · ')}</div>` : ''}
      ${note ? `<div class="gnote"><span>📘 Grammar</span>${note}</div>` : ''}
    </div></div>`;
}
window.retry = () => {
  const k = keyOf(cur.level, cur.id);
  STORE[k] = {a:{}, f:{}, q:0, secs:0, checked:false, score:null}; cur.st = STORE[k]; touch();
  setHash('#' + cur.level + '/' + cur.id + '/exam');
};

/* ◀ Back del portal: un paso atrás dentro de la página antes de salir. */
if(window.NISNAV) NISNAV.setBackHandler(() => {
  if(view === 'exam' || view === 'review'){ openGrammar(); return true; }
  if(view === 'grammar'){ goMenu(); return true; }
  return false;
});

/* ---- Guardado y entrega (barra Save / Submit) ---------------------------- */
function touch(){ if(window.NIS_WORK) NIS_WORK.touch(); }
if(window.NIS_WORK) NIS_WORK.attach(Object.assign(NIS_WORK.ficha(), {
  title: document.title,
  read:  function(){ return { store: STORE, level: level }; },
  write: function(d){
    const p = (d && d.store) || {};
    Object.keys(p).forEach(k => { STORE[k] = p[k]; });
    if(d && LEVELS[d.level] && !location.hash) level = d.level;
  },
  after: function(){ cur = null; route(); },
  count: function(d){
    const p = (d && d.store) || {};
    return Object.keys(p).reduce((n, k) => n + Object.values((p[k]||{}).a || {}).filter(v => (v||'').trim()).length, 0);
  },
  answers: function(d){
    const p = (d && d.store) || {}, out = {};
    Object.keys(p).forEach(k => {
      const x = p[k] || {}, n = Object.values(x.a || {}).filter(v => (v||'').trim()).length;
      if(n || x.checked) out[k] = n + ' answered' + (x.checked ? ' / score ' + x.score : '');
    });
    return out;
  }
}));

route();
</script>
