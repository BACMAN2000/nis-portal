<style>
  :root{ --blue:#1d6fb8; --blue-d:#154e7f; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --gold:#b8934a }
  *{ box-sizing:border-box; margin:0 }
  body{ font-family:'Montserrat',system-ui,sans-serif; background:#f1f5f9; color:var(--ink); min-height:100vh }
  header{ background:#fff; border-bottom:1px solid var(--line); padding:10px 18px; display:flex; gap:14px; align-items:center;
    position:sticky; top:0; z-index:20 }
  header img{ height:34px }
  header .sub{ font-size:11px; font-weight:800; letter-spacing:1.5px; color:var(--muted) }
  .backbtn{ margin-left:auto; background:#eef2f9; color:var(--blue-d); border:none; border-radius:9px; padding:8px 14px;
    font-family:inherit; font-weight:700; cursor:pointer; font-size:13px }
  .backbtn:hover{ background:#dbe4f3 }
  main{ max-width:900px; margin:0 auto; padding:22px 16px 60px }
  h1{ font-size:1.5rem; color:var(--blue-d) }
  .lead{ color:var(--muted); font-size:14px; margin:6px 0 18px }
  .grid{ display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)) }
  .card{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px; cursor:pointer;
    box-shadow:0 6px 18px rgba(15,23,42,.06); transition:.15s; position:relative }
  .card:hover{ transform:translateY(-2px); box-shadow:0 10px 26px rgba(15,23,42,.12); border-color:#93c5fd }
  .card h2{ font-size:15.5px; color:var(--blue-d); margin:6px 0 4px }
  .card .desc{ font-size:13px; color:var(--muted) }
  .card .ico{ font-size:2rem }
  .card.locked{ opacity:.62; cursor:default }
  .card.locked:hover{ transform:none; border-color:var(--line) }
  .chip{ display:inline-block; background:#eef2f9; color:var(--blue-d); font-weight:700; font-size:11.5px;
    border-radius:9px; padding:3px 10px; margin-top:8px }
  .chip.ok{ background:#dcfce7; color:#065f46 }
  .chip.no{ background:#fee2e2; color:#991b1b }
  .hero{ background:linear-gradient(135deg,#7f1d1d,#1c1712); color:#fde68a; border-radius:18px; padding:20px 18px;
    margin-bottom:18px; position:relative; overflow:hidden; border:1px solid var(--gold) }
  .hero::after{ content:"EXAM"; position:absolute; top:16px; right:-30px; transform:rotate(35deg); background:#b91c1c;
    color:#fff; font-weight:800; font-size:11px; letter-spacing:2px; padding:4px 42px }
  .hero p{ color:#e7d5ac; font-size:13px; margin-top:4px }
  .note{ background:#fffbeb; border-left:4px solid #f59e0b; border-radius:10px; padding:10px 14px; font-size:13px;
    color:#78350f; margin-bottom:16px }
  /* interruptor del docente */
  .tgl{ display:flex; gap:8px; align-items:center; margin-top:10px; font-size:12px; font-weight:700 }
  .tgl button{ border:none; border-radius:20px; width:46px; height:24px; cursor:pointer; position:relative; transition:.2s; flex:none }
  .tgl button::after{ content:""; position:absolute; top:3px; width:18px; height:18px; border-radius:50%; background:#fff; transition:.2s }
  .tgl button.off{ background:#cbd5e1 } .tgl button.off::after{ left:3px }
  .tgl button.on{ background:#16a34a } .tgl button.on::after{ left:25px }
  /* examen */
  .exam-top{ position:sticky; top:56px; z-index:10; background:#fff; border:1.5px solid var(--line); border-radius:14px;
    padding:10px 16px; margin-bottom:16px; box-shadow:0 8px 20px rgba(15,23,42,.1); display:flex; gap:14px; align-items:center; flex-wrap:wrap }
  .exam-top b{ color:var(--blue-d) }
  .timer{ font-variant-numeric:tabular-nums; font-weight:800; font-size:17px; color:var(--blue-d) }
  .timer.low{ color:#dc2626; animation:blink 1s infinite }
  @keyframes blink{ 50%{ opacity:.45 } }
  .tprog{ flex:1; min-width:120px; height:8px; background:#e2e8f0; border-radius:5px; overflow:hidden }
  .tprog span{ display:block; height:100%; background:var(--blue); transition:width 1s linear }
  .q{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-bottom:14px }
  .q .tag{ font-size:10.5px; font-weight:800; letter-spacing:.6px; color:var(--gold); text-transform:uppercase }
  .q h3{ font-size:15px; margin:4px 0 10px; line-height:1.5 }
  .opt{ display:block; width:100%; text-align:left; background:#f8fafc; border:1.5px solid var(--line); border-radius:11px;

  .opt:hover{ border-color:#93c5fd }
  .opt.sel{ background:#dbeafe; border-color:var(--blue) }
  .opt.correct{ background:#dcfce7; border-color:#4ade80; color:#065f46 }
  .opt.wrong{ background:#fee2e2; border-color:#f87171; color:#991b1b }
  input.tin{ border:none; border-bottom:2.5px solid var(--blue); font-family:inherit; font-size:16px; font-weight:700;
    color:var(--blue-d); width:200px; text-align:center; padding:6px; background:#f8fafc; border-radius:8px 8px 0 0 }

<script>
/* =====================================================================
   READER EXAMS — un examen autocorregible por capítulo y por nivel.
   Secciones (ensambladas del banco del nivel attwn-data-<lvl>.js):
     A · Comprehension (8 MC)        B · True/False (6)
     C · Vocabulary (6: MC, y en B2/C1 2 de ellas ESCRITAS)
     D · Listening (4 huecos escritos con el audio del capítulo)
     E · Story order (3 MC "what happened first?")
     [solo Cap. 1] F · Author & characters (8 MC)
   = 27 preguntas (35 en el examen 1). 25 min A2/B1 · 35 min B2/C1.
   Se muestran DE DOS EN DOS con flechas ◀ ▶ y Submit al final.
   CANDADOS: tabla reader_exam_access (sin fila = BLOQUEADO para el
   alumno); docente/admin ven interruptores y siempre pueden entrar.
   ===================================================================== */
const READERS=[{id:'attwn', icon:'🏝️', title:'And Then There Were None', by:'Agatha Christie',
  levels:['a2','b1','b2','c1'], chapters:10}];
const LVL_META={a2:['🐣','A2 · Elementary',25], b1:['🏝️','B1 · Intermediate',25],
                b2:['🚀','B2 · Upper-intermediate',35], c1:['🎓','C1 · Advanced',35]};
const $=s=>document.querySelector(s);
const shuffle=a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const norm=s=>String(s||'').toLowerCase().replace(/[^a-z]/g,'');

/* Sección F del examen del CAPÍTULO 1: autor y personajes (todos los niveles). */
const CH1_EXTRA=[
  ['Author',"Who wrote <i>And Then There Were None</i>?",["Agatha Christie","Arthur Conan Doyle","Charles Dickens","Daphne du Maurier"],0,
   "Agatha Christie (1890–1976), the best-selling novelist of all time."],
  ['Author',"When was the novel first published?",["1919","1939","1959","1979"],1,
   "It was first published in 1939."],
  ['Author',"Which famous detective did Agatha Christie create?",["Sherlock Holmes","Hercule Poirot","Philip Marlowe","Father Brown"],1,
   "Hercule Poirot, the clever Belgian detective — along with Miss Marple."],
  ['Author',"Why is <i>And Then There Were None</i> special among crime novels?",["It was her first book","It is the best-selling crime novel of all time","It has no deaths","It was never finished"],1,
   "With over 100 million copies sold, it is the best-selling crime novel in the world."],
  ['Characters',"Who brings a revolver to Soldier Island — just to be safe?",["Dr Armstrong","Philip Lombard","Anthony Marston","General Macarthur"],1,
   "Lombard, the soldier of fortune, was paid to come 'ready for trouble'."],
  ['Characters',"Who believes she has been hired as a secretary?",["Emily Brent","Ethel Rogers","Vera Claythorne","Constance Culmington"],2,
   "Vera Claythorne accepts a job as holiday secretary for Mrs Owen."],
  ['Characters',"Who travels under the false name of ‘Davis’?",["William Blore","Judge Wargrave","Thomas Rogers","Fred Narracott"],0,
   "Blore, the ex-police inspector, pretends to be a Mr Davis from South Africa."],
  ['Characters',"Who are the servants who receive the guests at the house?",["Fred and Mary Narracott","Thomas and Ethel Rogers","Mr and Mrs Owen","Hugo and Beatrice"],1,
   "Rogers the butler and his wife Ethel, the cook."]
];

let sb=null, me=null, locks={};
const dataCache={};

async function boot(){
  if(window.supabase && window.NIS_CONFIG){
    sb=window.supabase.createClient(NIS_CONFIG.SUPABASE_URL,NIS_CONFIG.SUPABASE_KEY);
    try{
      const u=await sb.auth.getUser();
      if(u&&u.data&&u.data.user){
        const p=await sb.from('profiles').select('full_name,first_name,email,role').eq('id',u.data.user.id).maybeSingle();
        me=Object.assign({uid:u.data.user.id,email:u.data.user.email},(p&&p.data)||{});
      }
      const l=await sb.from('reader_exam_access').select('key,unlocked');
      (l.data||[]).forEach(r=>locks[r.key]=!!r.unlocked);
    }catch(e){}
  }
  viewReaders();
}
const isStaff=()=>me && (me.role==='teacher'||me.role==='admin');
const lockKey=(r,l,ch)=>r+':'+l+':ch'+ch;
const isOpen=k=>!!locks[k];
const audBase=lvl=>'attwn-audio/'+(lvl==='b1'?'':lvl+'/');

function loadLevel(lvl){
  return new Promise((res,rej)=>{
    if(dataCache[lvl]) return res(dataCache[lvl]);
    const s=document.createElement('script'); s.src='attwn-data-'+lvl+'.js?v=1';
    s.onload=()=>{ dataCache[lvl]=window.ATTWN_DATA; res(dataCache[lvl]); };
    s.onerror=rej; document.head.appendChild(s);
  });
}

/* ---------- pantalla 1: readers ---------- */
function viewReaders(){
  $('#main').innerHTML=`
    <div class="hero"><h1 style="color:#fde68a">📝 Reader Exams</h1>
      <p>One exam per chapter, at your level: comprehension, true/false, vocabulary, listening and story order —
      corrected automatically with feedback. ${isStaff()?'<b>Teacher mode:</b> use the switches to unlock each exam for students.':'Your teacher unlocks each exam when your class is ready.'}</p></div>
    <div class="grid">
      ${READERS.map(r=>`<div class="card" onclick="viewLevels('${r.id}')">
        <div class="ico">${r.icon}</div><h2>${r.title}</h2>
        <div class="desc">${r.by} · ${r.chapters} chapter exams × 4 levels</div>
        <span class="chip">A2 · B1 · B2 · C1</span></div>`).join('')}
    </div>`;
}

/* ---------- pantalla 2: niveles ---------- */
window.viewLevels=(rid)=>{
  const r=READERS.find(x=>x.id===rid);
  $('#main').innerHTML=`
    <h1>${r.icon} ${r.title} — choose the exam level</h1>
    <p class="lead">Take the exam at the level you are reading. Higher level = harder texts and questions, written answers, and more time.</p>
    <div class="grid">
      ${r.levels.map(l=>{ const m=LVL_META[l];
        const open=Array.from({length:r.chapters},(_,i)=>isOpen(lockKey(rid,l,i+1))).filter(Boolean).length;
        return `<div class="card" onclick="viewChapters('${rid}','${l}')">
          <div class="ico">${m[0]}</div><h2>${m[1]}</h2>
          <div class="desc">${r.chapters} chapter exams · 27 questions (35 in exam 1) · ${m[2]} minutes each</div>
          <span class="chip ${open? 'ok':''}">${open}/${r.chapters} unlocked</span></div>`; }).join('')}
    </div>
    <div style="margin-top:16px"><button class="btn ghost" onclick="viewReaders()">← Back</button></div>`;
};

/* ---------- pantalla 3: capítulos + candados ---------- */
window.viewChapters=async(rid,lvl)=>{
  $('#main').innerHTML='<p class="muted">Loading chapters…</p>';
  const data=await loadLevel(lvl);
  const r=READERS.find(x=>x.id===rid); const m=LVL_META[lvl];
  const staff=isStaff();
  $('#main').innerHTML=`
    <h1>${m[0]} ${r.title} · ${m[1]}</h1>
    <p class="lead">One exam per chapter — ${m[2]} minutes: comprehension, true/false, vocabulary${lvl==='b2'||lvl==='c1'?' (with written answers)':''}, listening and story order. Two questions per screen; corrected automatically with feedback at the end.</p>
    ${staff?`<div class="note">👩‍🏫 <b>Teacher controls:</b> exams are created LOCKED. Flip a switch to open that chapter's exam for students, or use:
      <button class="btn ghost" style="padding:6px 12px;font-size:12px" onclick="lockAll('${rid}','${lvl}',true)">🔓 Unlock all</button>
      <button class="btn ghost" style="padding:6px 12px;font-size:12px" onclick="lockAll('${rid}','${lvl}',false)">🔒 Lock all</button></div>`:''}
    <div class="grid" id="chGrid">
      ${data.CHAPTERS.map(c=>{ const k=lockKey(rid,lvl,c.n); const open=isOpen(k);
        const canEnter=staff||open;
        return `<div class="card ${canEnter?'':'locked'}" id="cc-${c.n}" ${canEnter?`onclick="startExam('${rid}','${lvl}',${c.n})"`:''}>
          <div class="ico">${open?'📝':'🔒'}</div>
          <h2>Chapter ${c.n} · ${esc(c.title)}</h2>
          <div class="desc">${esc(c.sum).slice(0,90)}…</div>
          <span class="chip ${open?'ok':'no'}" id="st-${c.n}">${open?'✅ Open for students':'🔒 Locked for students'}</span>
          ${staff?`<div class="tgl" onclick="event.stopPropagation()"><button class="${open?'on':'off'}" id="tg-${c.n}"
              onclick="toggleLock('${k}',${c.n},this)"></button><span>${open?'students CAN take it':'hidden from students'}</span></div>`:''}
        </div>`; }).join('')}
    </div>
    <div style="margin-top:16px"><button class="btn ghost" onclick="viewLevels('${rid}')">← Levels</button></div>`;
};
window.toggleLock=async(k,n,btn)=>{
  const now=!isOpen(k);
  btn.className=now?'on':'off';
  try{
    const r=await sb.from('reader_exam_access').upsert({key:k,unlocked:now,updated_at:new Date().toISOString()});
    if(r.error) throw r.error;
    locks[k]=now;
    const st=$('#st-'+n); if(st){ st.className='chip '+(now?'ok':'no'); st.textContent=now?'✅ Open for students':'🔒 Locked for students'; }
    btn.nextElementSibling.textContent=now?'students CAN take it':'hidden from students';
  }catch(e){ btn.className=isOpen(k)?'on':'off'; alert('No se pudo guardar (¿sesión de docente activa?): '+(e.message||e)); }
};
window.lockAll=async(rid,lvl,open)=>{
  const rows=Array.from({length:READERS.find(x=>x.id===rid).chapters},(_,i)=>({key:lockKey(rid,lvl,i+1),unlocked:open,updated_at:new Date().toISOString()}));
  try{
    const r=await sb.from('reader_exam_access').upsert(rows);
    if(r.error) throw r.error;
    rows.forEach(x=>locks[x.key]=open);
    viewChapters(rid,lvl);
  }catch(e){ alert('No se pudo guardar: '+(e.message||e)); }
};

/* ---------- construcción del examen ---------- */
function gapItems(data,ch,lvl){
  // 4 huecos de listening: una oración del retelling con una palabra del
  // vocabulario borrada; guarda el nº de párrafo para reproducir SU audio.
  const paras=data.READINGS[ch]||[]; const c=data.CHAPTERS[ch-1];
  const items=[]; const used=new Set();
  for(const v of shuffle(c.vocab)){
    if(items.length>=4) break;
    const w=v[0].toLowerCase(); const re=new RegExp('\\b('+w+'s?)\\b','i');
    for(let p=0;p<paras.length;p++){
      const s=paras[p].split(/(?<=[.!?…’”])\s+/).find(s=>re.test(s)&&s.split(/\s+/).length<=30&&!used.has(s));
      if(s){ used.add(s); const m=s.match(re);
        items.push({sent:s.replace(re,'______'), answer:m[1], para:p+1}); break; }
    }
  }
  return items;
}
function buildExam(data,ch,lvl){
  const c=data.CHAPTERS[ch-1]; const qs=[]; const hard=(lvl==='b2'||lvl==='c1');
  // A · comprensión
  c.comp.forEach(q=>qs.push({tag:'Comprehension', type:'mc', q:q[0],
    opts:shuffle(q[1].map((t,i)=>({t,ok:i===q[2]}))), ex:q[3]}));
  // B · true/false
  c.tf.forEach(t=>qs.push({tag:'True / False', type:'mc', q:t[0],
    opts:[{t:'True',ok:t[1]===true},{t:'False',ok:t[1]===false}], ex:t[2]}));
  // C · vocabulario (en B2/C1, 2 de las 6 se ESCRIBEN)
  const vv=shuffle(c.vocab).slice(0,6);
  vv.forEach((v,i)=>{
    if(hard && i<2){
      qs.push({tag:'Vocabulary · write', type:'type', q:'Write the word: <i>'+esc(v[1])+'</i> (it starts with “'+v[0][0]+'”)',
        answer:v[0], ex:v[0]+' = '+v[1]});
    }else{
      const wrong=shuffle(c.vocab.filter(x=>x[0]!==v[0])).slice(0,3).map(x=>x[1]);
      qs.push({tag:'Vocabulary', type:'mc', q:'What does “'+v[0]+'” mean?',
        opts:shuffle([{t:v[1],ok:true},...wrong.map(t=>({t,ok:false}))]), ex:v[0]+' = '+v[1]});
    }
  });
  // D · listening (escribe la palabra que oyes)
  gapItems(data,ch,lvl).forEach(g=>qs.push({tag:'Listening', type:'type',
    q:'🎧 Listen to the paragraph and complete: <br><i>'+esc(g.sent)+'</i>',
    audio:audBase(lvl)+'ch'+ch+'-p'+g.para+'.mp3', answer:g.answer,
    ex:'The missing word was “'+g.answer+'”.'}));
  // E · orden de la historia (¿qué pasó primero?)
  const ev=(data.EVENTS[ch]||{}).ev||[];
  for(let k=0;k<3 && ev.length>=3;k++){
    const trio=shuffle(ev.map((t,i)=>({t,i}))).slice(0,3);
    const first=trio.reduce((a,b)=>a.i<b.i?a:b);
    qs.push({tag:'Story order', type:'mc', q:'Which of these happened FIRST in this chapter?',
      opts:shuffle(trio.map(x=>({t:x.t,ok:x===first}))),
      ex:'Order in the chapter: '+trio.slice().sort((a,b)=>a.i-b.i).map(x=>'“'+x.t.slice(0,40)+'…”').join(' → ')});
  }
  const exam=shuffle(qs);
  // F · el examen del capítulo 1 añade autor y personajes (al final, fijas)
  if(ch===1) CH1_EXTRA.forEach(x=>exam.push({tag:x[0], type:'mc', q:x[1],
    opts:shuffle(x[2].map((t,i)=>({t,ok:i===x[3]}))), ex:x[4]}));
  return exam;
}

/* ---------- el examen: 2 preguntas por pantalla, ◀ ▶, Submit al final ---------- */
let EX=null, _qaud=null;
function stopQAudio(){ if(_qaud){ _qaud.pause(); _qaud=null; } }
window.playQAudio=(url,btn)=>{
  if(_qaud){ stopQAudio(); btn.textContent='🔊 Play the audio'; return; }
  _qaud=new Audio(url);
  _qaud.onended=()=>{ _qaud=null; btn.textContent='🔊 Play the audio'; };
  _qaud.onerror=()=>{ _qaud=null; btn.textContent='⚠️ Audio not available'; };
  btn.textContent='⏸ Stop'; _qaud.play().catch(()=>_qaud&&_qaud.onerror());
};
window.startExam=async(rid,lvl,ch)=>{
  const data=await loadLevel(lvl);
  const k=lockKey(rid,lvl,ch);
  if(!isStaff() && !isOpen(k)){ alert('This exam is locked. Ask your teacher.'); return; }
  const c=data.CHAPTERS[ch-1]; const mins=LVL_META[lvl][2];
  EX={rid,lvl,ch,title:c.title,qs:buildExam(data,ch,lvl),ans:{},page:0,t0:Date.now(),secs:mins*60,timer:null,done:false,previewLocked:isStaff()&&!isOpen(k)};
  EX.pages=Math.ceil(EX.qs.length/2);
  $('#main').innerHTML=`
    <div class="exam-top">
      <b>${LVL_META[lvl][0]} ${LVL_META[lvl][1].split(' · ')[0]} · Ch. ${ch} — ${esc(c.title)}</b>
      <div class="tprog"><span id="tb" style="width:100%"></span></div>
      <span class="timer" id="tm">${mins}:00</span>
    </div>
    <div id="exBody"></div>`;
  EX.timer=setInterval(()=>{
    EX.secs--; const m=Math.floor(EX.secs/60), s=EX.secs%60;
    const tm=$('#tm'); if(tm){ tm.textContent=m+':'+String(s).padStart(2,'0'); if(EX.secs<=60) tm.classList.add('low'); }
    const tb=$('#tb'); if(tb) tb.style.width=(EX.secs/(mins*60)*100)+'%';
    if(EX.secs<=0){ clearInterval(EX.timer); alert('⏰ Time is up! Your exam will be submitted now.'); submitExam(true); }
  },1000);
  renderPage();
};
function qHTML(q,i){
  const a=EX.ans[i];
  let body='';
  if(q.type==='mc'){
    body=q.opts.map((o,j)=>`<button class="opt ${a===j?'sel':''}" id="o${i}-${j}" onclick="pick(${i},${j})">${esc(o.t)}</button>`).join('');
  }else{
    body=`${q.audio?`<button class="aud-btn" onclick="playQAudio('${q.audio}',this)">🔊 Play the audio</button><br>`:''}
      <input class="tin" id="t${i}" autocomplete="off" autocapitalize="off" placeholder="type your answer"
        value="${a!=null?esc(a):''}" oninput="typed(${i},this.value)">`;
  }
  return `<div class="q" id="q${i}">
    <div class="tag">${q.tag} · question ${i+1} of ${EX.qs.length}</div>
    <h3>${q.q}</h3>${body}<div class="fb"></div></div>`;
}
function answeredCount(){ return EX.qs.filter((q,i)=>{ const a=EX.ans[i]; return q.type==='mc' ? a!=null : (a!=null&&String(a).trim()!==''); }).length; }
function pageAnswered(p){ const i1=p*2, i2=Math.min(p*2+1,EX.qs.length-1);
  return [i1,i2].filter((v,idx,arr)=>arr.indexOf(v)===idx).every(i=>{ const a=EX.ans[i]; return EX.qs[i].type==='mc'? a!=null : (a!=null&&String(a).trim()!==''); }); }
function renderPage(){
  stopQAudio();
  const p=EX.page, i1=p*2, qs=EX.qs.slice(i1,i1+2);
  const last=p===EX.pages-1;
  $('#exBody').innerHTML=`
    ${EX.previewLocked?'<div class="note">👩‍🏫 Teacher preview — this exam is still locked for students.</div>':''}
    ${qs.map((q,off)=>qHTML(q,i1+off)).join('')}
    <div class="pager">
      <button class="arrow" onclick="goPage(-1)" ${p===0?'disabled':''} title="Previous">◀</button>
      <div class="pgdots">
        Screen ${p+1} / ${EX.pages} · <span id="ansN">${answeredCount()}</span>/${EX.qs.length} answered<br>
        ${Array.from({length:EX.pages},(_,x)=>`<span class="dot ${x===p?'now':(pageAnswered(x)?'done':'')}"></span>`).join('')}
      </div>
      ${last?`<button class="btn" style="flex:none" onclick="submitExam()">✅ Submit</button>`
           :`<button class="arrow" onclick="goPage(1)" title="Next">▶</button>`}
    </div>`;
  window.scrollTo(0,0);
}
window.goPage=(d)=>{ if(EX.done) return; EX.page=Math.min(Math.max(0,EX.page+d),EX.pages-1); renderPage(); };
window.pick=(i,j)=>{
  if(EX.done) return;
  EX.ans[i]=j;
  EX.qs[i].opts.forEach((_,x)=>{ const b=$('#o'+i+'-'+x); if(b) b.classList.toggle('sel',x===j); });
  const n=$('#ansN'); if(n) n.textContent=answeredCount();
};
window.typed=(i,v)=>{ if(EX.done) return; EX.ans[i]=v; const n=$('#ansN'); if(n) n.textContent=answeredCount(); };

window.submitExam=async(force)=>{
  if(!EX||EX.done) return;
  const n=answeredCount();
  if(!force && n<EX.qs.length && !confirm('You have answered '+n+'/'+EX.qs.length+'. Submit anyway?')) return;
  EX.done=true; clearInterval(EX.timer); stopQAudio();
  let score=0;
  const review=EX.qs.map((q,i)=>{
    const a=EX.ans[i]; let good=false, your='—';
    if(q.type==='mc'){ good=a!=null&&q.opts[a].ok; your=a!=null?q.opts[a].t:'—'; }
    else{ good=norm(a)===norm(q.answer); your=(a&&String(a).trim())||'—'; }
    if(good) score++;
    let body='';
    if(q.type==='mc'){
      body=q.opts.map((o,j)=>`<button class="opt ${o.ok?'correct':(j===a?'wrong':'')}" disabled>${esc(o.t)}</button>`).join('');
    }else{
      body=`<input class="tin ${good?'correct':'wrong'}" value="${esc(good?q.answer:(your+'  →  '+q.answer))}" disabled>`;
    }
    return `<div class="q">
      <div class="tag">${q.tag} · ${i+1}/${EX.qs.length}</div>
      <h3>${q.q}</h3>${body}
      <div class="explain">${good?'✅':'❌'} ${esc(q.ex||'')}</div></div>`;
  });
  const pct=Math.round(score/EX.qs.length*100);
  const band=pct>=90?['🏅 Grade A — Excellent!','#059669']:pct>=80?['🥈 Grade B — Very good','#0d9488']
           :pct>=70?['🥉 Grade C — Pass','#b45309']:['📖 Not yet — review the chapter and try again','#dc2626'];
  const dur=Math.max(1,Math.round((Date.now()-EX.t0)/1000));
  try{
    if(sb&&me&&me.uid){
      await sb.from('activity_attempts').insert({student_id:me.uid,activity:'attwn-exam-'+EX.lvl+'-ch'+EX.ch,
        title:'ATTWN EXAM '+EX.lvl.toUpperCase()+' · Ch.'+EX.ch+' '+EX.title,level:EX.lvl.toUpperCase(),
        score,total:EX.qs.length,hints_used:0,lives_left:3,duration_sec:dur});
      const mm=Math.floor(dur/60), ss=dur%60;
      fetch(NIS_CONFIG.WRITING_WEBHOOK,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify({skill:'Reader Exam',name:me.full_name||me.first_name||'',email:me.email||'',
          level:EX.lvl.toUpperCase(),examTitle:'ATTWN Exam '+EX.lvl.toUpperCase()+' Ch.'+EX.ch+' - Time '+mm+'m '+String(ss).padStart(2,'0')+'s',
          examType:'attwn-exam-'+EX.lvl+'-ch'+EX.ch,score,total:EX.qs.length,duration_min:Math.max(1,Math.round(dur/60))})});
    }
  }catch(e){}
  $('#exBody').innerHTML=`
    <div class="q center">
      <div class="score">${score}/${EX.qs.length}</div>
      <div class="band" style="color:${band[1]}">${band[0]}</div>
      <p class="muted">${pct}% · Chapter ${EX.ch} · ${LVL_META[EX.lvl][1]}. Below is the full correction with feedback.</p>
      <div style="margin-top:12px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="btn ghost" onclick="viewChapters('${EX.rid}','${EX.lvl}')">← Other chapters</button>
        <button class="btn" onclick="startExam('${EX.rid}','${EX.lvl}',${EX.ch})">🔄 Try again</button>
      </div>
    </div>
    ${review.join('')}
    <div class="center" style="margin-top:14px"><button class="btn ghost" onclick="viewChapters('${EX.rid}','${EX.lvl}')">← Back to the chapters</button></div>`;
  window.scrollTo(0,0);
};
boot();
</script>
</body>
</html>
