<!doctype html>
<html lang="en" translate="no">
<head>
<meta name="google" content="notranslate">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Help · NIS Portal</title>

<style>
  :root{
  --blue:#4987c6;
  --blue-d:#2f5f93;
  --blue-dd:#244c77;
  --line:#e2e8f0;
  --lila:#eef1fb
}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Gotham',Montserrat,system-ui,Segoe UI,sans-serif;color:var(--ink);
       background:var(--bg);line-height:1.55}
  .wrap{max-width:1040px;margin:0 auto;padding:18px 16px 70px}
  header.top{background:var(--blue-d);color:var(--card);border-radius:16px;padding:18px 22px;margin-bottom:16px;
             display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header.top h1{margin:0 0 2px;font-size:1.3rem}
  header.top p{margin:0;opacity:.85;font-size:.85rem;max-width:64ch}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .tab{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 18px;cursor:pointer;
       font-weight:600;color:var(--blue-d);font-size:.9rem;font-family:inherit}
  .tab.on{background:var(--blue);border-color:var(--blue);color:var(--card)}
  .buscador{display:flex;gap:8px;align-items:center;margin-bottom:16px}
  .buscador input{flex:1;font-family:inherit;font-size:.92rem;padding:11px 14px;border:1px solid var(--line);
                  border-radius:12px;background:var(--card);color:var(--ink)}
  .buscador input:focus{outline:2px solid var(--blue);outline-offset:1px}
  .buscador .n{font-size:.8rem;color:var(--muted);white-space:nowrap}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:14px;
        box-shadow:0 1px 3px rgba(20,40,80,.05)}
  .card > h2{margin:0 0 3px;font-size:1.06rem;color:var(--blue-d);display:flex;align-items:center;gap:9px}
  .card .sub{color:var(--muted);font-size:.85rem;margin:0 0 12px}
  .card h3{margin:16px 0 6px;font-size:.92rem;color:var(--blue-dd)}
  .card p{margin:0 0 10px;font-size:.9rem}
  ol.pasos{margin:0 0 10px;padding-left:0;counter-reset:paso;list-style:none}
  ol.pasos li{counter-increment:paso;position:relative;padding:0 0 9px 34px;font-size:.9rem}
  ol.pasos li::before{content:counter(paso);position:absolute;left:0;top:0;width:23px;height:23px;
      border-radius:50%;background:var(--blue);color:var(--card);font-size:.76rem;font-weight:700;
      display:flex;align-items:center;justify-content:center}
  ul.simple{margin:0 0 10px;padding-left:20px;font-size:.9rem}
  ul.simple li{margin-bottom:5px}
  table{width:100%;border-collapse:collapse;font-size:.86rem}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700}
  tbody tr:last-child td{border-bottom:none}
  .scroll{overflow-x:auto}
  .ruta{font-weight:600;color:var(--blue-d)}
  .note{background:var(--bg);border-left:4px solid var(--blue);padding:11px 14px;border-radius:8px;
        font-size:.86rem;color:var(--muted);margin:12px 0}
  .note.warn{background:#fff7ea;border-left-color:var(--gold);color:var(--ink)}
  .note.bad{background:var(--bg);border-left-color:var(--bad);color:var(--ink)}
  .pill{display:inline-block;border-radius:999px;padding:3px 11px;font-size:.73rem;font-weight:700;
        background:var(--bg);color:var(--blue-dd);border:1px solid var(--line)}
  kbd{font-family:inherit;font-size:.78rem;font-weight:700;background:var(--card);border:1px solid var(--line);
      border-bottom-width:2px;border-radius:6px;padding:1px 6px;color:var(--blue-dd)}
  .vacio{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:34px 20px;text-align:center;
         color:var(--muted);font-size:.9rem}
  footer.src{color:var(--muted);font-size:.78rem;text-align:center;margin-top:26px}
  @media print{
    body{background:var(--card)}
    .tabs,.buscador,.noprint{display:none!important}
    .wrap{max-width:none;padding:0}
    .card{break-inside:avoid;box-shadow:none;border-color:#ccc;margin-bottom:10px}
    header.top{background:#2d5a8d!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
<script src="config.js?v=16566e1a"></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <img src="assets/logo-white-h.svg" alt="Nordic International School" style="height:34px" onerror="this.style.display='none'">
    <div>
      <h1>❓ NIS Portal help</h1>
      <p>Where everything is and how to do it, depending on who you are. Type what you’re
         looking for and the guide keeps only what answers it.</p>
    </div>
  </header>

  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="buscador noprint">
    <input id="q" type="search" placeholder="Search: submit a worksheet, open an exam, change the password…"
           autocomplete="off" aria-label="Search the help">
    <span class="n" id="n"></span>
  </div>
  <div id="guia"></div>
  <footer class="src">Nordic International School of Lima · nis.cohasset.pe ·
    Is something missing from this help? Write to <b>pbaca@nordic-school.edu.pe</b>.</footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="ayuda-datos.js?v=5968a0fd"></script>
<script>
/* La ayuda vive en un solo sitio y se usa de tres formas: embebida en el
   portal (que le pasa ?role=), abierta suelta (mira la sesion de Supabase) e
   impresa. El rol solo elige que pestaña se abre primero: las tres guias estan
   siempre disponibles, porque el admin necesita ver lo que ve el alumno para
   poder explicarselo por telefono. */
(function(){
  const P = new URLSearchParams(location.search);
  const ROLES = [['student','🎒 Student'],['teacher','👨‍🏫 Teacher'],['admin','🛠️ Admin']];
  let rol = P.get('role');
  if(!ROLES.some(r=>r[0]===rol)) rol = null;

  const $ = s=>document.querySelector(s);
  const esc = t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  let actual = 'student';
  function texto(s){
    return (s.titulo+' '+(s.busca||'')+' '+JSON.stringify(s.cuerpo))
      .toLowerCase().replace(/<[^>]+>/g,' ');
  }
  function bloque(b){
    if(typeof b === 'string') return '<p>'+b+'</p>';
    if(b.h) return '<h3>'+b.h+'</h3>';
    if(b.pasos) return '<ol class="pasos">'+b.pasos.map(p=>'<li>'+p+'</li>').join('')+'</ol>';
    if(b.lista) return '<ul class="simple">'+b.lista.map(p=>'<li>'+p+'</li>').join('')+'</ul>';
    if(b.nota) return '<div class="note '+(b.tipo||'')+'">'+b.nota+'</div>';
    if(b.tabla) return '<div class="scroll"><table><thead><tr>'
      + b.tabla.cols.map(c=>'<th>'+esc(c)+'</th>').join('')
      + '</tr></thead><tbody>'
      + b.tabla.filas.map(f=>'<tr>'+f.map((c,i)=>'<td'+(i===0?' class="ruta"':'')+'>'+c+'</td>').join('')+'</tr>').join('')
      + '</tbody></table></div>';
    return '';
  }
  function pinta(r){
    actual = r;
    const g = window.AYUDA[r];
    $('#guia').innerHTML = g.secciones.map(s=>
      '<section class="card" data-buscar="' + esc(texto(s)) + '"><h2>'+s.icon+' '+esc(s.titulo)+'</h2>'
      + (s.sub ? '<p class="sub">'+esc(s.sub)+'</p>' : '')
      + s.cuerpo.map(bloque).join('')
      + '</section>').join('');
    document.querySelectorAll('#tabs .tab').forEach(t=>t.classList.toggle('on', t.dataset.rol===r));
    filtra();
  }
  function filtra(){
    const q = ($('#q').value||'').trim().toLowerCase();
    const cards = [...document.querySelectorAll('#guia .card')];
    let n = 0;
    cards.forEach(c=>{
      const ok = !q || c.dataset.buscar.indexOf(q) >= 0;
      c.hidden = !ok; if(ok) n++;
    });
    $('#n').textContent = q ? (n+' of '+cards.length) : '';
    const antes = $('#guia .vacio'); if(antes) antes.remove();
    if(q && !n){
      // Buscar algo y que no salga nada suele significar que esta en OTRA
      // guia, no que no exista: se dice donde, en vez de dejar al lector con
      // la sensacion de que la plataforma no lo tiene.
      const otras = ROLES.filter(r=>r[0]!==actual)
        .filter(r=>(window.AYUDA[r[0]].secciones||[]).some(x=>texto(x).indexOf(q)>=0));
      $('#guia').insertAdjacentHTML('beforeend',
        '<div class="vacio">We found nothing for <b>'+esc(q)+'</b> in this guide.'
        + (otras.length
            ? '<br>It does appear in: '+otras.map(r=>'<button class="tab" type="button" data-salta="'+r[0]+'">'+r[1]+'</button>').join(' ')
            : '<br>Try a single word — «worksheet», «exam», «password» — or write to us.')
        + '</div>');
      const caja = $('#guia .vacio');
      if(caja) caja.onclick = e => { const b = e.target.closest('[data-salta]'); if(b) pinta(b.dataset.salta); };
    }
  }

  $('#tabs').innerHTML = ROLES.map(r=>
    '<button class="tab" type="button" role="tab" data-rol="'+r[0]+'">'+r[1]+'</button>').join('');
  $('#tabs').onclick = e => { const b = e.target.closest('.tab'); if(b) pinta(b.dataset.rol); };
  $('#q').oninput = filtra;

  // Sin ?role=, se mira quien esta dentro. Si no hay sesion (o tarda), se abre
  // la del alumno: es la que mas gente necesita.
  pinta(rol || 'student');
  if(!rol && window.supabase && window.NIS_CONFIG){
    try{
      const sb = supabase.createClient(NIS_CONFIG.SUPABASE_URL, NIS_CONFIG.SUPABASE_KEY);
      sb.auth.getSession().then(function(res){
        const u = res && res.data && res.data.session && res.data.session.user;
        if(!u) return;
        return sb.from('profiles').select('role').eq('id',u.id).maybeSingle()
          .then(function(r){ if(r && r.data && r.data.role && r.data.role!=='student') pinta(r.data.role); });
      }).catch(function(){});
    }catch(_){}
  }
})();
</script>
<script src="nis-tema.js?v=410c4879" defer></script>
</body>
</html>
