<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reported Speech · Word Order — Portal NIS</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font:15px/1.55 "Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:#0f172a;background:linear-gradient(180deg,#d1d2ea 0%,#f8fafc 60%,#fff 100%);min-height:100vh}
  header{background:#fff;padding:12px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    box-shadow:0 4px 16px rgba(15,23,42,.06);position:sticky;top:0;z-index:10;border-bottom:1px solid #e2e8f0}
  header img{display:block;height:38px;width:auto}
  header .sub{color:#636465;font-size:13px;margin-left:auto;font-weight:600}
  header a.back{margin-left:14px;text-decoration:none;background:#2d5a8d;color:#fff;font-weight:700;font-size:13px;padding:8px 14px;border-radius:9px;white-space:nowrap}
  main{max-width:760px;margin:0 auto;padding:22px 18px}
  h1{font-size:22px;margin:0 0 6px}
  p.lead{color:#475569;margin:0 0 14px}
  .switch{display:inline-block;text-decoration:none;background:#fff;border:2px solid #2d5a8d;color:#2d5a8d;font-weight:700;font-size:13px;padding:7px 13px;border-radius:9px;margin-bottom:16px}
  .panel{background:#fff;border:1px solid #e2e8f0;border-radius:16px;box-shadow:0 8px 24px rgba(15,23,42,.08);padding:22px}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .pill{background:#d1d2ea;color:#244c77;font-weight:700;font-size:13px;padding:6px 12px;border-radius:20px}
  .progress{flex:1;height:9px;background:#e2e8f0;border-radius:99px;overflow:hidden;min-width:120px}
  .progress>span{display:block;height:100%;background:#2d5a8d;width:0;transition:width .3s}
  .tagdir{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.5px;padding:4px 10px;border-radius:20px;text-transform:uppercase;background:#dbeafe;color:#1e40af}
  .direct{font-size:19px;font-weight:600;margin:10px 0 4px;line-height:1.4}
  .ask{color:#475569;font-size:14px;margin:2px 0 14px}
  .answer{min-height:58px;border:2px dashed #cbd5e1;border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;background:#f8fafc;margin-bottom:6px}
  .answer.empty::before{content:"Tap the words to build the sentence…";color:#94a3b8;font-size:14px}
  .answer.ok{border-color:#16a34a;border-style:solid;background:#f0fdf4}
  .answer.no{border-color:#dc2626;border-style:solid;background:#fef2f2}
  .pool{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
  .chip{background:#fff;border:2px solid #b9c6dd;border-radius:10px;padding:9px 13px;font:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:.1s;color:#1e3a5f}
  .chip:hover:not(:disabled){border-color:#2d5a8d;background:#eef4fb}
  .chip.placed{background:#2d5a8d;color:#fff;border-color:#2d5a8d}
  .chip:disabled{opacity:.5;cursor:default}
  .fb{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:14px;display:none}
  .fb.ok{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;display:block}
  .fb.no{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;display:block}
  .actions{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
  .btn{background:#2d5a8d;color:#fff;border:0;border-radius:10px;padding:11px 18px;font:inherit;font-weight:700;cursor:pointer}
  .btn.ghost{background:#fff;color:#2d5a8d;border:2px solid #2d5a8d}
  .btn.lite{background:#eef2f7;color:#475569}
  .btn:disabled{opacity:.45;cursor:default}
  .result{text-align:center;padding:18px 6px}
  .result .big{font-size:46px;font-weight:800;color:#2d5a8d;line-height:1}
  .result .msg{color:#475569;margin:10px 0 18px}
  .footer{color:#475569;font-size:12px;text-align:center;padding:22px 0 32px}
</style>
</head>
<body>
<header>
  <img src="assets/logo-h.svg" alt="Nordic International School" onerror="this.style.display='none'">
  <div class="sub">GRAMMAR · REPORTED SPEECH · ORDER</div>
  <a class="back" href="grammar.html">← Grammar</a>
</header>
<main>
  <h1>🔤 Reported Speech — Word Order</h1>
  <p class="lead">Read the sentence in <b>Direct speech</b>. Then put the words in order to form the correct <b>Reported speech</b>.</p>
  <a class="switch" href="reported-speech.html">🧩 Another game: Choose the correct option →</a>
  <div class="panel" id="panel"></div>
  <div class="footer">9th grade · Grammar — NIS English · 2026</div>
</main>

<script>
/* Banco ORIGINAL (NIS). Cada item: oración en direct y su reported correcto. */
const ITEMS = [
  {direct:'"I am tired," she said.',            reported:'She said she was tired.'},
  {direct:'"We live in Lima," they said.',      reported:'They said they lived in Lima.'},
  {direct:'"I will call you later," he said.',   reported:'He said he would call me later.'},
  {direct:'"I have lost my keys," Ana said.',    reported:'Ana said she had lost her keys.'},
  {direct:'"Do you like pizza?" he asked.',      reported:'He asked if I liked pizza.'},
  {direct:'"Where do you work?" she asked.',     reported:'She asked where I worked.'},
  {direct:'"Close the door," the teacher said.', reported:'The teacher told us to close the door.'},
  {direct:'"Don’t be late," Mum said.',     reported:'Mum told me not to be late.'},
  {direct:'"I can play the guitar," Leo said.',  reported:'Leo said he could play the guitar.'},
  {direct:'"I saw her yesterday," he said.',     reported:'He said he had seen her the day before.'},
];

let order=[], idx=0, score=0, solved=false, pool=[], answer=[];
const panel=document.getElementById('panel');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

function start(){ order=shuffle(ITEMS.map((_,i)=>i)); idx=0; score=0; load(); }

function load(){
  solved=false;
  const it=ITEMS[order[idx]];
  const words=it.reported.split(' ');
  // tiles con id único (soporta palabras repetidas)
  let tiles=words.map((w,i)=>({id:i,w}));
  let sh=shuffle(tiles);
  if(sh.map(t=>t.w).join(' ')===words.join(' ') && words.length>1) sh=shuffle(tiles); // evita empezar ya ordenado
  pool=sh; answer=[];
  render();
}

function render(){
  const it=ITEMS[order[idx]];
  const pct=Math.round(idx/ITEMS.length*100);
  panel.innerHTML=`
    <div class="bar">
      <span class="pill">Sentence ${idx+1}/${ITEMS.length}</span>
      <div class="progress"><span style="width:${pct}%"></span></div>
      <span class="pill">★ ${score}</span>
    </div>
    <span class="tagdir">Direct speech</span>
    <div class="direct">${it.direct}</div>
    <div class="ask">Put the <b>reported speech</b> in order:</div>
    <div class="answer ${answer.length?'':'empty'}" id="answer">
      ${answer.map(t=>`<button class="chip placed" onclick="unplace(${t.id})">${t.w}</button>`).join('')}
    </div>
    <div class="pool" id="pool">
      ${pool.map(t=>`<button class="chip" onclick="place(${t.id})">${t.w}</button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <div class="actions">
      <button class="btn lite" onclick="reset()">↺ Reset</button>
      <button class="btn ghost" id="reveal" onclick="reveal()">Show answer</button>
      <button class="btn" id="check" onclick="check()" ${answer.length?'':'disabled'}>Check</button>
    </div>`;
}

window.place=(id)=>{ if(solved)return; const i=pool.findIndex(t=>t.id===id); if(i<0)return; answer.push(pool[i]); pool.splice(i,1); render(); };
window.unplace=(id)=>{ if(solved)return; const i=answer.findIndex(t=>t.id===id); if(i<0)return; pool.push(answer[i]); answer.splice(i,1); render(); };
window.reset=()=>{ if(solved)return; pool=pool.concat(answer); answer=[]; render(); };

window.check=()=>{
  const it=ITEMS[order[idx]];
  const got=answer.map(t=>t.w).join(' ');
  const ans=document.getElementById('answer'), fb=document.getElementById('fb');
  if(got===it.reported){
    solved=true; score++;
    ans.classList.remove('no'); ans.classList.add('ok');
    document.querySelectorAll('#pool .chip,#answer .chip').forEach(b=>b.disabled=true);
    fb.className='fb ok'; fb.innerHTML='✅ <b>Correct!</b> '+it.reported;
    swapToNext();
  } else {
    ans.classList.add('no');
    fb.className='fb no'; fb.innerHTML='🤔 Not yet. Check the order (verb tense, pronouns) and try again.';
    setTimeout(()=>ans.classList.remove('no'),900);
  }
};
window.reveal=()=>{
  const it=ITEMS[order[idx]]; solved=true;
  const words=it.reported.split(' ');
  answer=words.map((w,i)=>({id:i,w})); pool=[];
  render();
  const ans=document.getElementById('answer'), fb=document.getElementById('fb');
  ans.classList.add('ok'); document.querySelectorAll('#answer .chip').forEach(b=>b.disabled=true);
  fb.className='fb ok'; fb.innerHTML='👀 Answer: <b>'+it.reported+'</b>';
  swapToNext();
};
function swapToNext(){
  const a=document.querySelector('.actions');
  a.innerHTML=`<button class="btn" onclick="next()">${idx===ITEMS.length-1?'See result':'Next →'}</button>`;
}
window.next=()=>{ if(idx<ITEMS.length-1){ idx++; load(); } else end(); };

function end(){
  const pct=Math.round(score/ITEMS.length*100);
  const msg = pct>=80?'Excellent ordering! 🌟' : pct>=60?'Good job. 👍' : pct>=40?'Getting better. 💪' : 'Review and try again. ✍️';
  panel.innerHTML=`<div class="result">
    <div class="big">${score}/${ITEMS.length}</div>
    <div class="msg">${pct}% &middot; ${msg}</div>
    <button class="btn" onclick="start()">↻ Play again</button>
    <a class="btn ghost" href="grammar.html" style="text-decoration:none;display:inline-block">← Grammar</a>
  </div>`;
}

start();
</script>
</body>
</html>
