<!doctype html>
<html lang="en" translate="no">
<head>
<meta name="google" content="notranslate">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rhymes &amp; chants · NIS Portal</title>
<link rel="icon" href="assets/favicon.svg">
<link href="vendor/fonts/montserrat-68a53b.css" rel="stylesheet">
<link rel="preload" href="fonts/GothamBook.woff2?v=a8d93b82" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="nis-fonts.css?v=72345e4f">
<script>try{var t=localStorage.getItem("nis-tema");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="stylesheet" href="nis-tokens.css?v=b3bffd5c">
<script src="config.js?v=720edc7d"></script>
<script src="activity-save.js?v=a082b30c"></script>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:'Gotham',Montserrat,system-ui,Segoe UI,sans-serif;color:var(--ink);
       background:var(--bg);line-height:1.55}
  .wrap{max-width:1100px;margin:0 auto;padding:18px 16px 70px}
  header.top{background:var(--blue-d);color:var(--card);border-radius:16px;padding:18px 22px;margin-bottom:16px;
             display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header.top .em{font-size:2rem;line-height:1}
  header.top h1{margin:0 0 2px;font-size:1.3rem}
  header.top p{margin:0;opacity:.85;font-size:.85rem;max-width:70ch}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .tab{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 18px;cursor:pointer;
       font-weight:600;color:var(--blue-d);font-size:.9rem;font-family:inherit}
  .tab.on{background:var(--blue-d);border-color:var(--blue-d);color:var(--card)}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .bar .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
  .chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;cursor:pointer;
        font-size:.8rem;font-weight:600;color:var(--ink);font-family:inherit}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip.lv.on.starters{background:#d97d0d;border-color:#d97d0d}
  .chip.lv.on.movers{background:#2e7d5b;border-color:#2e7d5b}
  .chip.lv.on.flyers{background:#2f5f93;border-color:#2f5f93}
  input.q{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 12px;
          font:inherit;font-size:.85rem;min-width:200px;flex:1}
  .count{color:var(--muted);font-size:.8rem;margin-left:auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;
        box-shadow:0 1px 3px rgba(20,40,80,.05);break-inside:avoid}
  .card h2{margin:0 0 6px;font-size:1.02rem;color:var(--blue-d);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .card h3{margin:14px 0 6px;font-size:.92rem;color:var(--blue-d)}
  .pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:.7rem;font-weight:700;
        background:var(--bg);color:var(--ink);border:1px solid var(--line);white-space:nowrap}
  .pill.lv{color:#fff;border:0}
  .pill.lv.starters{background:#d97d0d}
  .pill.lv.movers{background:#2e7d5b}
  .pill.lv.flyers{background:#2f5f93}
  .lyrics{white-space:pre-wrap;font-size:.95rem;line-height:1.5;margin:8px 0;padding:10px 12px;background:var(--bg);
          border-left:4px solid var(--accent);border-radius:8px}
  .lyrics.var{border-left-color:var(--line-2,var(--line))}
  .small{font-size:.82rem;color:var(--muted);margin:6px 0}
  .small b{color:var(--ink)}
  .words{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  .w{font-size:.72rem;border-radius:6px;padding:1px 6px;background:var(--bg);border:1px solid var(--line)}
  .w.starters{border-color:#d97d0d}
  .w.movers{border-color:#2e7d5b}
  .w.flyers{border-color:#2f5f93}
  .w.none{opacity:.55;border-style:dashed}
  .legend{font-size:.76rem;color:var(--muted);margin:0 0 12px}
  .legend .w{margin-right:4px}
  .cols{columns:2;column-gap:22px}
  .cols .card{margin:0 0 14px;display:inline-block;width:100%}
  ul.ph{margin:6px 0 0;padding-left:0;list-style:none}
  ul.ph li{padding:6px 0;border-bottom:1px solid var(--line);font-size:.95rem}
  ul.ph li:last-child{border-bottom:0}
  .note{background:var(--bg);border-left:4px solid var(--blue-d);padding:11px 14px;border-radius:8px;
        font-size:.85rem;color:var(--muted);margin:0 0 14px}
  .empty{color:var(--muted);padding:30px;text-align:center}
  .print{margin-left:6px}
  @media(max-width:700px){.cols{columns:1}.count{margin-left:0;width:100%}}
  @media print{
    body{background:#fff;color:#000}
    header.top,.tabs,.bar,.print{display:none}
    .wrap{max-width:none;padding:0}
    .grid{display:block}
    .card{border:1px solid #bbb;box-shadow:none;margin:0 0 10px;page-break-inside:avoid}
    .lyrics{background:#f6f6f6}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="em">🎶</div>
    <div style="flex:1;min-width:240px">
      <h1>Rhymes, chants &amp; first words</h1>
      <p>Traditional English playground rhymes (public domain), the first 100 words and everyday phrases for G1–G5.
         Every rhyme is tagged with the words it shares with the official Cambridge YLE wordlist.</p>
    </div>
  </header>

  <div class="tabs" id="tabs">
    <button class="tab on" data-t="rhymes" type="button">🎶 Rhymes &amp; chants</button>
    <button class="tab" data-t="words" type="button">🔤 First words</button>
    <button class="tab" data-t="phrases" type="button">💬 Everyday phrases</button>
  </div>

  <div id="main"><p class="empty">Loading…</p></div>
</div>

<script>
(function(){
  'use strict';
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const main = document.getElementById('main');
  const LV = ['starters', 'movers', 'flyers'];
  const LVNAME = {starters:'Starters', movers:'Movers', flyers:'Flyers'};
  const WORDGROUP = {
    people_family:'People & family', home_school:'Home & school', food_drink:'Food & drink', animals:'Animals',
    colours_size:'Colours & size', actions:'Actions', feelings_needs:'Feelings & needs', daily_routine:'Daily routine',
    places_nature:'Places & nature', function_words:'Function words',
  };
  const PHRASEGROUP = {
    greetings:'Greetings & introductions', classroom:'In the classroom', playground:'In the playground',
    needs_feelings:'Needs, feelings & manners', home:'At home',
  };

  let D = null, tab = 'rhymes';
  const f = { tipo: 'all', nivel: 'all', q: '' };
  // se recuerda el filtro entre visitas; si el navegador no deja, da igual
  try { Object.assign(f, JSON.parse(localStorage.getItem('nis-rhymes-f') || '{}')); } catch (e) {}
  const guarda = () => { try { localStorage.setItem('nis-rhymes-f', JSON.stringify(f)); } catch (e) {} };

  /* ---------- progreso: escuchada / aprendida (WP-E) ----------
     No hay audio grabado para las rimas: "escucharla entera" usa la voz del
     navegador (igual que Pronunciation Coach) y se marca al terminar el
     utterance. "Aprendida" la marca el alumno a mano. */
  const PKEY = 'nis-rhymes-p';
  let P = {};
  try { P = JSON.parse(localStorage.getItem(PKEY) || '{}') || {}; } catch (e) { P = {}; }
  const guardaP = () => { try { localStorage.setItem(PKEY, JSON.stringify(P)); } catch (e) {} if (window.NIS_WORK) NIS_WORK.touch(); };
  function leeRima(id) {
    if (!window.speechSynthesis || !D) return;
    const r = D.rimas.find(x => x.id === id);
    if (!r) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(r.letra + (r.coda ? ('. ' + r.coda) : ''));
    u.lang = 'en-US'; u.rate = 0.85;
    u.onend = () => { P[id] = P[id] || {}; P[id].escuchada = true; guardaP(); if (tab === 'rhymes') vistaRhymes(); };
    speechSynthesis.speak(u);
  }
  function marcaAprendida(id) {
    P[id] = P[id] || {}; P[id].aprendida = !P[id].aprendida; guardaP();
    if (tab === 'rhymes') vistaRhymes();
  }

  const yleWord = (w, lvl) => `<span class="w ${lvl || 'none'}" title="${lvl ? 'YLE ' + LVNAME[lvl] : 'not in the YLE list'}">${esc(w)}</span>`;

  /* ---------- rimas ---------- */
  function rhymeCard(r) {
    const lvlOf = {};
    LV.forEach(l => (r.palabras_yle || []).forEach(w => { if (!lvlOf[w] && D._yle[w] === l) lvlOf[w] = l; }));
    const p = P[r.id] || {};
    return `<article class="card">
      <h2>${esc(r.titulo)}
        <span class="pill lv ${esc(r.nivel_yle)}">${LVNAME[r.nivel_yle] || esc(r.nivel_yle)}</span>
        <span class="pill">${esc(D.tipos[r.tipo] || r.tipo)}</span>
        <span class="pill">age ${esc(r.edad)}</span>
      </h2>
      <div class="lyrics">${esc(r.letra)}</div>
      ${r.variante ? `<div class="lyrics var">${esc(r.variante)}</div>` : ''}
      ${r.coda ? `<p class="small"><b>Then:</b> ${esc(r.coda)}</p>` : ''}
      ${r.uso ? `<p class="small"><b>How to play:</b> ${esc(r.uso)}</p>` : ''}
      ${r.gramatica ? `<p class="small"><b>Language:</b> ${esc(r.gramatica)}</p>` : ''}
      ${r.nota ? `<p class="small"><b>Note:</b> ${esc(r.nota)}</p>` : ''}
      ${(r.palabras_yle || []).length ? `<p class="small" style="margin-bottom:0"><b>YLE words</b> (${r.palabras_yle.length})</p>
        <div class="words">${r.palabras_yle.map(w => yleWord(w, D._yle[w])).join('')}</div>` : ''}
      <div class="row" style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
        <button class="chip" type="button" data-listen="${esc(r.id)}">${p.escuchada ? '✓ Listened' : '🔊 Listen'}</button>
        <button class="chip" type="button" data-learn="${esc(r.id)}" aria-pressed="${!!p.aprendida}">${p.aprendida ? '✓ Learned' : 'Mark as learned'}</button>
      </div>
    </article>`;
  }

  function vistaRhymes() {
    const q = f.q.trim().toLowerCase();
    const lista = D.rimas.filter(r =>
      (f.tipo === 'all' || r.tipo === f.tipo) &&
      (f.nivel === 'all' || r.nivel_yle === f.nivel) &&
      (!q || (r.titulo + ' ' + r.letra + ' ' + (r.coda || '') + ' ' + (r.gramatica || '')).toLowerCase().includes(q)));
    const tipos = [['all', 'All']].concat(Object.entries(D.tipos));
    main.innerHTML = `
      <div class="bar">
        ${tipos.map(([k, t]) => `<button class="chip${f.tipo === k ? ' on' : ''}" data-tipo="${k}" type="button">${esc(t)}</button>`).join('')}
        <span class="sep"></span>
        ${LV.map(l => `<button class="chip lv ${l}${f.nivel === l ? ' on' : ''}" data-nivel="${l}" type="button">${LVNAME[l]}</button>`).join('')}
        <input class="q" id="q" type="search" placeholder="Search a word or a title…" value="${esc(f.q)}">
        <span class="count">${lista.length} of ${D.rimas.length}</span>
        <button class="chip print" type="button" onclick="window.print()">🖨️ Print</button>
      </div>
      <p class="legend">Level = the lowest YLE level that covers 9 in 10 of the rhyme's listed words.
        Word colour: ${yleWord('Starters', 'starters')}${yleWord('Movers', 'movers')}${yleWord('Flyers', 'flyers')}${yleWord('not in the list', null)}</p>
      ${lista.length ? `<div class="grid">${lista.map(rhymeCard).join('')}</div>` : '<p class="empty">Nothing matches. Try another filter.</p>'}`;
    main.querySelectorAll('[data-tipo]').forEach(b => b.onclick = () => { f.tipo = b.dataset.tipo; guarda(); vistaRhymes(); });
    main.querySelectorAll('[data-nivel]').forEach(b => b.onclick = () => { f.nivel = f.nivel === b.dataset.nivel ? 'all' : b.dataset.nivel; guarda(); vistaRhymes(); });
    main.querySelectorAll('[data-listen]').forEach(b => b.onclick = () => leeRima(b.dataset.listen));
    main.querySelectorAll('[data-learn]').forEach(b => b.onclick = () => marcaAprendida(b.dataset.learn));
    const q$ = main.querySelector('#q');
    let t;
    q$.oninput = () => { f.q = q$.value; guarda(); clearTimeout(t); t = setTimeout(() => { const pos = q$.selectionStart; vistaRhymes(); const n = main.querySelector('#q'); n.focus(); n.setSelectionRange(pos, pos); }, 250); };
  }

  /* ---------- primeras palabras ---------- */
  function vistaWords() {
    const V = D.vocabulario;
    const bloque = (titulo, lista, nota) => `<div class="card">
      <h2>${esc(titulo)} <span class="pill">${lista.length}</span></h2>
      ${nota ? `<p class="small">${esc(nota)}</p>` : ''}
      <div class="words">${lista.map(x => yleWord(x.palabra, x.yle)).join('')}</div></div>`;
    main.innerHTML = `
      <p class="note">The first 100 words a child meets, in ten groups, and the Dolch sight words — the words early readers
        should recognise on sight (they make up half of everything in a picture book). Coloured by the YLE level that lists them;
        dashed = not in the YLE list.</p>
      <div class="cols">
        ${Object.entries(V.primeras_100).map(([k, v]) => bloque(WORDGROUP[k] || k, v)).join('')}
        ${bloque('Dolch · pre-primer', V.dolch_pre_primer, 'The 40 words to read on sight before any reader (G1).')}
        ${bloque('Dolch · primer', V.dolch_primer, 'The next 52 (G1–G2).')}
      </div>`;
  }

  /* ---------- frases ---------- */
  function vistaPhrases() {
    main.innerHTML = `
      <p class="note">Ready-made chunks the children can use straight away, without building the sentence word by word.
        Fifty to a hundred of these cover almost everything a child needs to say in a school day.</p>
      <div class="cols">
        ${Object.entries(D.frases).map(([k, v]) => `<div class="card">
          <h2>${esc(PHRASEGROUP[k] || k)} <span class="pill">${v.length}</span></h2>
          <ul class="ph">${v.map(p => `<li>${esc(p)}</li>`).join('')}</ul></div>`).join('')}
      </div>`;
  }

  function draw() {
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
    if (tab === 'words') vistaWords();
    else if (tab === 'phrases') vistaPhrases();
    else vistaRhymes();
    window.scrollTo(0, 0);
  }
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => { tab = b.dataset.t; draw(); });

  /* ---------- carga ---------- */
  Promise.all([
    fetch('nis-fun/songs/tradicionales.json?v=49197a7a', {cache: 'no-cache'}).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }),
    fetch('yle/wordlist-2025.json', {cache: 'no-cache'}).then(r => r.ok ? r.json() : null).catch(() => null),
  ]).then(([d, yle]) => {
    D = d;
    // nivel de cada palabra de la lista oficial: el más bajo gana
    D._yle = {};
    if (yle) LV.forEach(l => (yle[l] || []).forEach(e => {
      e.replace(/\(.*?\)/g, '').toLowerCase().split(/[\/,]/).forEach(w => { w = w.trim().replace(/\.$/, ''); if (w && !D._yle[w]) D._yle[w] = l; });
    }));
    draw();
  }).catch(e => {
    main.innerHTML = `<div class="card"><p class="empty">Could not load the rhymes (${esc(e.message)}). <code>nis-fun/songs/tradicionales.json</code> is missing.</p></div>`;
  });

  /* Guardado en la cuenta del alumno (WP-E): practica libre, no cuelga de
     ninguna unidad. */
  if (window.NIS_WORK) NIS_WORK.attach({
    slug: 'rhymes', grade: 'g9', unit: 0, week: null, auto: true,
    title: document.title,
    vacio: 'Mark a rhyme as learned first — then you can hand it in.',
    read: () => ({ store: P }),
    write: (d) => { P = (d && d.store) || {}; try { localStorage.setItem(PKEY, JSON.stringify(P)); } catch (e) {} if (D && tab === 'rhymes') vistaRhymes(); },
    count: (d) => {
      const p = (d && d.store) || {}; let n = 0;
      Object.keys(p).forEach((k) => { if (p[k].aprendida || p[k].escuchada) n++; });
      return n;
    },
    answers: (d) => {
      const p = (d && d.store) || {}, out = {};
      Object.keys(p).forEach((k) => {
        const v = p[k], estados = [];
        if (v.escuchada) estados.push('listened');
        if (v.aprendida) estados.push('learned');
        if (estados.length) out[k] = estados.join(' + ');
      });
      return out;
    }
  });
})();
</script>
<script src="nis-nav.js?v=c6e39903"></script>
<script src="nis-presence.js?v=684f7b00" defer></script>
<script src="nis-i18n.js?v=90aa61ff" defer></script>
<script src="nis-tema.js?v=0ae7c164" defer></script>
</body>
</html>
