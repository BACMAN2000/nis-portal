<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Crosswords (Français) — Portal NIS</title>
<style>
  :root{--bg:#f4f6fb;--card:#fff;--ink:#1e2433;--muted:#67718a;--accent:#3b5bdb;--accent-soft:#e7ecfd;
    --good:#2f9e44;--good-soft:#d3f4dc;--bad:#e03131;--bad-soft:#ffe3e3;--gold:#f59f00;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{-webkit-touch-callout:none;font-family:'Segoe UI',system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);padding:14px}
  header{max-width:1100px;margin:0 auto 6px;text-align:center}
  header h1{font-size:1.35rem}
  header p{color:var(--muted);font-size:.85rem;margin-top:3px}
  a.back{display:inline-block;margin-top:8px;text-decoration:none;background:#2d5a8d;color:#fff;font-weight:700;font-size:.8rem;padding:7px 13px;border-radius:9px}
  .levels,.puzzles{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px auto;max-width:1100px}
  .lv{border:2px solid transparent;background:var(--card);color:var(--ink);padding:7px 16px;border-radius:22px;font-weight:800;font-size:.9rem;cursor:pointer;box-shadow:0 1px 3px rgba(20,30,60,.12)}
  .lv.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .pz{border:1px solid #d7def0;background:var(--card);color:var(--ink);padding:6px 11px;border-radius:14px;font-weight:700;font-size:.8rem;cursor:pointer}
  .pz small{display:block;font-weight:500;font-size:.66rem;color:var(--muted)}
  .pz.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .pz.on small{color:var(--accent)}
  .wrap{max-width:1100px;margin:0 auto;display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
  .board{max-width:100%;background:var(--card);border-radius:14px;padding:14px;box-shadow:0 2px 10px rgba(20,30,60,.08)}
  .gridbox{display:grid;gap:2px}
  .cell{position:relative;width:var(--cs);height:var(--cs);background:var(--accent-soft);border-radius:4px}
  .cell.block{background:transparent}
  .cell input{width:100%;height:100%;border:none;background:transparent;text-align:center;font-weight:800;font-size:calc(var(--cs)*.52);text-transform:uppercase;color:var(--ink);caret-color:var(--accent);border-radius:4px;outline:none}
  .cell input:focus{background:#cdd9ff}
  .cell.hl input{background:#dfe7ff}
  .cell .num{position:absolute;top:1px;left:3px;font-size:calc(var(--cs)*.28);font-weight:700;color:var(--accent);pointer-events:none}
  .cell.ok input{background:var(--good-soft);color:var(--good)}
  .cell.ko input{background:var(--bad-soft);color:var(--bad)}
  .lifebar{margin-top:10px;font-weight:800;font-size:1rem;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .watch{font-variant-numeric:tabular-nums;color:var(--accent)}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  button.act{border:none;border-radius:9px;padding:9px 15px;font-weight:700;font-size:.85rem;cursor:pointer}
  .b-check{background:var(--accent);color:#fff}.b-hint{background:var(--gold);color:#fff}.b-clear{background:#e9ecf3;color:var(--ink)}
  .side{flex:1 1 300px;min-width:270px;max-width:430px}
  .panel{background:var(--card);border-radius:14px;padding:14px 16px;box-shadow:0 2px 10px rgba(20,30,60,.08);margin-bottom:12px}
  .panel h3{font-size:.8rem;text-transform:uppercase;letter-spacing:1px;color:var(--accent);margin-bottom:8px}
  .clue{font-size:.85rem;padding:4px 6px;border-radius:6px;cursor:pointer;line-height:1.3}
  .clue:hover{background:var(--accent-soft)}
  .clue.cur{background:var(--accent-soft);font-weight:600}
  .clue.solved{color:var(--muted);text-decoration:line-through}
  .clue b{color:var(--accent);margin-right:3px}
  .score{font-size:.9rem;margin-top:10px;color:var(--muted);font-weight:600}
  .banner{display:none;margin-top:10px;padding:11px;border-radius:10px;background:var(--good-soft);color:var(--good);font-weight:800;text-align:center;font-size:.95rem}
  .banner.show{display:block}
  .staffnote{display:none;margin:8px auto;max-width:1100px;padding:9px 12px;border-radius:9px;background:#fff4e6;color:#b35309;font-weight:700;text-align:center;font-size:.85rem}
  @media (max-width:480px){body{padding:8px}.board{padding:10px}.gridbox{gap:1px}}
</style>
</head>

<header>

</div>

/* ===== Portal NIS activity bridge (save + email + role) ===== */
window.NISACT=(function(){
  let _sb=null,_role=null,_loaded=false,_cbs=[]; const api={_user:null};
  function client(){ if(_sb) return _sb; if(!window.supabase||!window.NIS_CONFIG) return null;
    _sb=window.supabase.createClient(NIS_CONFIG.SUPABASE_URL,NIS_CONFIG.SUPABASE_KEY); return _sb; }
  async function load(){
    const c=client(); if(!c){ _loaded=true; fire(); return; }
    try{ const u=await c.auth.getUser();
      if(u&&u.data&&u.data.user){
        const p=await c.from('profiles').select('full_name,first_name,email,role').eq('id',u.data.user.id).maybeSingle();
        if(p&&p.data){ _role=p.data.role; api._user={uid:u.data.user.id,email:u.data.user.email||p.data.email,full_name:p.data.full_name,first_name:p.data.first_name,role:p.data.role}; }
      }
    }catch(e){}
    _loaded=true; fire();
  }
  function fire(){ _cbs.forEach(f=>{try{f();}catch(e){}}); _cbs=[]; }
  api.onReady=function(f){ if(_loaded) f(); else _cbs.push(f); };
  api.isStaff=function(){ return _role==='teacher'||_role==='admin'; };
  api.submit=async function(r){
    if(!api._user) return {skipped:true};
    try{ await client().from('activity_attempts').insert({student_id:api._user.uid,activity:r.activity,title:r.title,level:r.level,score:r.score,total:r.total,hints_used:r.hints,lives_left:r.lives,duration_sec:r.duration}); }catch(e){}
    try{ const m=Math.floor(r.duration/60),sec=r.duration%60;
      await fetch(NIS_CONFIG.WRITING_WEBHOOK,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify({skill:'Activity',name:api._user.full_name||api._user.first_name||'',email:api._user.email||'',level:r.level,
          examTitle:r.title+' - Time '+m+'m '+String(sec).padStart(2,'0')+'s - Hints '+r.hints+' - Lives left '+r.lives,
          examType:r.activity,score:r.score,total:r.total,duration_min:Math.max(1,Math.round(r.duration/60))})}); }catch(e){}
    return {sent:true};
  };
  load(); return api;
})();

    g.appendChild(div);
  }
  const al=document.getElementById('acrossList'),dl=document.getElementById('downList'); al.innerHTML='';dl.innerHTML='';
  for(const w of entries){ const el=document.createElement('div'); el.className='clue'; el.id='clue_'+w.num+'_'+w.dir;
    el.innerHTML=`<b>${w.num}.</b> ${w.clue} <span style="color:var(--muted)">(${w.word.length})</span>`;
    el.onclick=()=>{setEntry(w);focusCell(w.row,w.col);}; (w.dir==='across'?al:dl).appendChild(el); }
  buildLevels(); buildPuzzles(); updateScore(); startWatch();
  if(staff()) revealAll();
}
function entryCells(w){ const dr=w.dir==='down'?1:0,dc=w.dir==='across'?1:0,out=[]; for(let i=0;i<w.word.length;i++)out.push(key(w.row+dr*i,w.col+dc*i)); return out; }
function setEntry(w){ curEntry=w;
  document.querySelectorAll('.cell.hl').forEach(e=>e.classList.remove('hl'));
  document.querySelectorAll('.clue.cur').forEach(e=>e.classList.remove('cur'));
  for(const k of entryCells(w)) cells[k].classList.add('hl');
  const el=document.getElementById('clue_'+w.num+'_'+w.dir); if(el){el.classList.add('cur');el.scrollIntoView({block:'nearest'});} }
function selectAt(r,c){ const hits=entries.filter(w=>entryCells(w).includes(key(r,c))); if(!hits.length)return;
  if(curEntry&&hits.includes(curEntry)){setEntry(curEntry);return;} setEntry(hits[0]); }
function focusCell(r,c){ const k=key(r,c); if(cells[k])cells[k].querySelector('input').focus(); }
function onInput(e){ const inp=e.target; inp.value=inp.value.replace(/[^a-zA-Z]/g,'').toUpperCase(); inp.parentElement.classList.remove('ok','ko');
  if(inp.value&&curEntry){ const ks=entryCells(curEntry),i=ks.indexOf(key(+inp.dataset.r,+inp.dataset.c));
    if(i>-1&&i<ks.length-1){const [r,c]=ks[i+1].split('_').map(Number);focusCell(r,c);} } liveCheck(); }
function onKey(e){ const r=+e.target.dataset.r,c=+e.target.dataset.c;
  const mv={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key];
  if(mv){e.preventDefault();let rr=r+mv[0],cc=c+mv[1];
    while(rr>=0&&cc>=0&&rr<DATA[level][pidx].height&&cc<DATA[level][pidx].width){ if(cells[key(rr,cc)]){focusCell(rr,cc);break;} rr+=mv[0];cc+=mv[1]; } }
  else if(e.key==='Backspace'&&!e.target.value&&curEntry){ const ks=entryCells(curEntry),i=ks.indexOf(key(r,c)); if(i>0){const [pr,pc]=ks[i-1].split('_').map(Number);focusCell(pr,pc);} } }
function wordSolved(w){ return entryCells(w).every(k=>cells[k].querySelector('input').value===sol[k]); }
function liveCheck(){ let solved=0;
  for(const w of entries){ const ok=wordSolved(w); const el=document.getElementById('clue_'+w.num+'_'+w.dir); if(el)el.classList.toggle('solved',ok); if(ok){ solved++; var _kk=w.num+'_'+w.dir; if(!_spoken.has(_kk)){ _spoken.add(_kk); try{speakFR(w);}catch(_){} } } }
  updateScore(solved);
  if(solved===entries.length&&!completed){ onComplete(); }
}
function onComplete(){
  completed=true; clearInterval(timerInt);
  Object.keys(cells).forEach(k=>{cells[k].classList.add('ok');cells[k].classList.remove('ko');});
  const b=document.getElementById('banner');
  if(staff()){ b.textContent='✅ Vue corrigée (prof/admin).'; b.classList.add('show'); return; }
  b.textContent=`🎉 Terminé en ${fmtT(elapsed)} ! Enregistré dans My Results et envoyé par e-mail.`; b.classList.add('show');
  if(window.NISACT) NISACT.submit({activity:'crossword',title:`Crossword ${pidx+1} — ${DATA[level][pidx].theme}`,level:level,score:entries.length,total:entries.length,hints:hintsUsed,lives:lives,duration:elapsed});
}
function updateScore(solved){ if(solved===undefined)solved=entries.filter(wordSolved).length;
  document.getElementById('score').textContent=`Mots : ${solved} / ${entries.length}`+(hintsUsed?` · Indices : ${hintsUsed}`:''); }
function checkAll(){ for(const k in cells){ const inp=cells[k].querySelector('input'); cells[k].classList.remove('ok','ko'); if(!inp.value)continue; cells[k].classList.add(inp.value===sol[k]?'ok':'ko'); } liveCheck(); }
function hintLetter(){ if(completed||staff())return;
  const empty=Object.keys(cells).filter(k=>cells[k].querySelector('input').value!==sol[k]); if(!empty.length)return;
  let pool=empty; if(curEntry){const inE=entryCells(curEntry).filter(k=>empty.includes(k)); if(inE.length)pool=inE;}
  const k=pool[Math.floor(Math.random()*pool.length)]; const inp=cells[k].querySelector('input'); inp.value=sol[k];
  cells[k].classList.remove('ko'); cells[k].classList.add('ok'); hintsUsed++;
  lives--; drawStatus();
  if(lives<=0&&!entries.every(wordSolved)){ setTimeout(()=>{ alert('💔 Plus de vies ! Ces mots croisés recommencent.'); load(); },150); return; }
  liveCheck();
}
function clearGrid(){ for(const k in cells){const inp=cells[k].querySelector('input');inp.value='';cells[k].classList.remove('ok','ko');} document.getElementById('banner').classList.remove('show'); liveCheck(); }
function revealAll(){ for(const k in cells){const inp=cells[k].querySelector('input');inp.value=sol[k];cells[k].classList.add('ok');} entries.forEach(w=>{const el=document.getElementById('clue_'+w.num+'_'+w.dir);if(el)el.classList.add('solved');}); clearInterval(timerInt); updateScore(entries.length); const b=document.getElementById('banner'); b.textContent='✅ Vue corrigée (prof/admin).'; b.classList.add('show'); drawStatus(); }
window.NISACT.onReady(()=>{ document.getElementById('staffnote').style.display=staff()?'block':'none'; load(); });
setTimeout(()=>{ if(!document.getElementById('grid').children.length) load(); },1500);

/* Pronunciacion francesa (Web Speech API) al resolver una entrada */
let _spoken=new Set(), _frVoice=null;
function _pickFrVoice(){ try{ var vs=speechSynthesis.getVoices(); _frVoice=vs.find(function(v){return /^fr/i.test(v.lang);})||vs.find(function(v){return /fran/i.test(v.name);})||null; }catch(e){} }
if('speechSynthesis' in window){ _pickFrVoice(); try{ speechSynthesis.onvoiceschanged=_pickFrVoice; }catch(e){} }
function speakFR(w){ if(!('speechSynthesis' in window))return; var t=(w&&(w.fr||w.word))||''; if(!t)return; var u=new SpeechSynthesisUtterance(t); u.lang='fr-FR'; if(_frVoice)u.voice=_frVoice; u.rate=0.9; try{speechSynthesis.cancel();}catch(e){} speechSynthesis.speak(u); }
</script>
