<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cambridge Main Suite · Nordic International School</title>
<link rel="icon" href="assets/favicon.svg">
<link href="vendor/fonts/montserrat-68a53b.css" rel="stylesheet">
<style>
  :root{--blue:#4987c6;--blue-d:#2f5f93;--blue-dd:#244c77;--line:#e3e5f3}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Montserrat',system-ui,'Segoe UI',sans-serif;background:#f2f3ff;color:#2b2c33}
  header{background:var(--blue);color:#fff;padding:14px 22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
  header h1{margin:0;font-size:1.15rem}
  header .lvl{background:rgba(255,255,255,.2);padding:3px 12px;border-radius:20px;font-size:.8rem;font-weight:700}
  header a{color:#fff;text-decoration:none;font-size:.85rem;opacity:.9}
  main{max-width:920px;margin:20px auto;padding:0 16px}
  .tabs{display:flex;gap:6px;background:#fff;border:1px solid #E2E8F0;border-radius:12px;padding:5px;margin-bottom:18px}
  .tabs button{flex:1;border:none;background:transparent;padding:11px;border-radius:8px;font-weight:700;cursor:pointer;font-family:inherit;color:#64748B}
  .tabs button.act{background:var(--blue-d);color:#fff}
  .card{background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:22px;margin-bottom:16px}
  .card h2{margin:0 0 10px;font-size:1.05rem}
  table{width:100%;border-collapse:collapse;font-size:.88rem;margin:8px 0}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #E2E8F0}
  th{font-size:.7rem;text-transform:uppercase;color:#64748B;letter-spacing:.5px}
  .acc{border:1px solid #E2E8F0;border-radius:10px;margin:8px 0;overflow:hidden}
  .acc>summary{cursor:pointer;padding:12px 14px;font-weight:600;background:#F8FAFC;list-style:none}
  .acc>div{padding:12px 14px;font-size:.9rem;color:#475569}
  .tip{background:#eef4fb;border-left:3px solid var(--blue);padding:10px 12px;border-radius:8px;margin:6px 0;font-size:.9rem}
  .test-item{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border:1px solid #E2E8F0;border-radius:10px;margin:8px 0}
  button.go{background:var(--blue-d);color:#fff;border:none;border-radius:9px;padding:9px 16px;font-weight:700;cursor:pointer;font-family:inherit}
  button.go.sec{background:#F1F5F9;color:#0F172A;border:1px solid #CBD5E1}
  .ex{border:1px solid #E2E8F0;border-radius:12px;padding:16px;margin:14px 0}
  .ex .ins{color:#64748B;font-size:.88rem;margin:2px 0 10px}
  .passage{background:#F8FAFC;border:1px solid #E2E8F0;border-radius:8px;padding:12px;font-size:.9rem;line-height:1.6;margin-bottom:12px}
  .q{margin:12px 0;padding-bottom:10px;border-bottom:1px dashed #E2E8F0}
  .q .opt{display:block;width:100%;text-align:left;padding:7px 10px;border:1px solid #CBD5E1;border-radius:8px;margin:5px 0;cursor:pointer;font-size:.92rem;font-family:inherit;color:inherit;background:#fff}
  .q .opt.sel{border-color:var(--blue);background:#eef4fb}
  .q .opt.ok{border-color:#15803D;background:#F0FDF4}
  .q .opt.bad{border-color:#DC2626;background:#FEF2F2}
  .q .opt:focus-visible{outline:3px solid #2563EB;outline-offset:2px}
  .q .opt .mark{font-weight:700;margin-left:6px}
  .q .opt.ok .mark{color:#15803D}
  .q .opt.bad .mark{color:#DC2626}
  .q input[type=text]{padding:7px 10px;border:1px solid #CBD5E1;border-radius:8px;font:inherit;width:160px}
  .q textarea{width:100%;padding:10px;border:1px solid #CBD5E1;border-radius:8px;font:inherit;min-height:120px}
  /* Hueco del texto: se pulsa el numero y salen las alternativas ahi mismo.
     Es el mismo formato de los examenes YLE y del curso. */
  .gapw{position:relative;display:inline-block;vertical-align:baseline;margin:0 2px}
  .gapb{border:0;border-bottom:2px solid #1D4ED8;background:#EEF3FB;border-radius:7px 7px 0 0;padding:1px 9px;font:600 .95rem inherit;color:#1D4ED8;cursor:pointer;min-width:62px}
  .gapb i{font-style:normal;font-weight:800;font-size:.78em;opacity:.7;margin-right:4px}
  .gapb.puesto{color:#0F172A;background:#fff}
  .gapm{position:absolute;z-index:30;left:0;top:calc(100% + 2px);background:#fff;border:1.5px solid #1D4ED8;border-radius:11px;box-shadow:0 12px 28px rgba(15,23,42,.2);padding:4px;display:flex;flex-wrap:wrap;align-items:center;width:max-content;gap:2px;max-width:min(92vw,34rem);max-height:46vh;overflow:auto}
  .gapx{border:0;background:#EEF3FB;color:#64748B;border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit;font-weight:700}
  .gapm.hidden{display:none}
  .gapm button{border:0;background:none;text-align:left;padding:7px 13px;border-radius:8px;font:inherit;font-size:.92rem;cursor:pointer;white-space:nowrap;color:#0F172A}
  .gapm button:hover,.gapm button.sel{background:#EEF3FB}
  .gapw.ok .gapb{background:#DCFCE7;border-bottom-color:#15803D}
  .gapw.bad .gapb{background:#FEE2E2;border-bottom-color:#DC2626}
  .lsn-audio{width:100%;max-width:36rem;margin:6px 0 10px}
  .kw{margin:4px 0}
  .kw-tag{background:#7c1d3f;color:#fff;border-radius:5px;padding:1px 7px;font-size:.7rem;font-weight:700;letter-spacing:.04em}
  .q input.wide{min-width:15rem}
  .raiz{background:#eef3fb;border-radius:6px;padding:1px 8px;font-weight:700;letter-spacing:.05em;font-size:.85rem;margin-left:6px}
  .sol{color:#15803D;font-weight:700}
  .res{font-weight:700;margin-top:10px}
  .muted{color:#64748B;font-size:.85rem}
  .hidden{display:none}
  /* --- Left-menu + card-by-card navigation (Reading & Use of English) --- */
  .cr-top{margin-bottom:14px}
  .cr-lay{display:grid;grid-template-columns:240px 1fr;gap:16px;align-items:start}
  .cr-sb{background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:8px;position:sticky;top:16px;max-height:calc(100vh - 36px);overflow-y:auto}
  .cr-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:none;background:transparent;border-radius:10px;padding:9px 10px;cursor:pointer;font-family:inherit;color:#0F172A;border-left:3px solid transparent;margin:2px 0}
  .cr-item:hover{background:#EFF6FF}
  .cr-item.act{background:#EFF6FF;border-left-color:#2563EB}
  .cr-item:focus-visible{outline:3px solid #2563EB;outline-offset:2px}
  .cr-n{width:28px;height:28px;flex-shrink:0;border-radius:8px;background:#F1F5F9;border:1px solid #E2E8F0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.78rem;color:#475569}
  .cr-item.act .cr-n{background:#2563EB;border-color:#2563EB;color:#fff}
  .cr-body{flex:1;min-width:0;display:flex;flex-direction:column}
  .cr-ttl{font-size:.82rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cr-sub{font-size:.68rem;color:#94A3B8;margin-top:1px}
  .cr-hand{opacity:0;font-size:.95rem;flex-shrink:0;transition:opacity .15s}
  .cr-item:hover .cr-hand,.cr-item.act .cr-hand{opacity:1}
  .cr-card{background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:18px}
  .cr-card .ex{border:none;padding:0;margin:0}
  .cr-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px;padding-top:14px;border-top:1px solid #E2E8F0}
  .cr-nav .go[disabled]{opacity:.4;cursor:not-allowed}
  .cr-prog{font-size:.8rem;color:#64748B;font-weight:600;text-align:center}
  @media(max-width:720px){
    .cr-lay{grid-template-columns:1fr}
    .cr-sb{position:static;max-height:none;display:flex;gap:6px;overflow-x:auto;padding:8px}
    .cr-item{flex:0 0 auto;width:auto;border-left:none;border-bottom:3px solid transparent;border-radius:10px 10px 0 0}
    .cr-item.act{border-left:none;border-bottom-color:#2563EB}
    .cr-body,.cr-item .cr-hand{display:none}
  }
  .sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
</head>
<body>
<header>
  <img src="assets/logo-white-h.svg" alt="Nordic International School" style="height:34px;width:auto"
       onerror="this.onerror=null;this.src='assets/logo-h.svg'">
  <h1 id="examName" style="margin:0 0 0 14px;font-size:1.1rem;font-weight:800">Cambridge</h1>
  <span class="lvl" id="examLvl">—</span>
  <span style="flex:1"></span>
  <a class="back" id="backBtn" href="./">← Portal</a>
</header>
<main>
  <div id="loadErr" class="card hidden" style="border-color:#FCA5A5;background:#FEF2F2"></div>
  <div class="tabs">
    <button id="tabExam" class="act" onclick="showTab('exam')">Examen</button>
    <button id="tabPrac" onclick="showTab('prac')">Tests de práctica</button>
  </div>
  <div id="viewExam"></div>
  <div id="viewPrac" class="hidden"></div>
</main>

<script>
const CEFR = {ket:"A2",pet:"B1",fce:"B2",cae:"C1",cpe:"C2"};
const qs = new URLSearchParams(location.search);
const LEVEL = (qs.get('level')||'ket').toLowerCase();
let CAM = null;

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function showTab(t){
  document.getElementById('viewExam').classList.toggle('hidden',t!=='exam');
  document.getElementById('viewPrac').classList.toggle('hidden',t!=='prac');
  document.getElementById('tabExam').classList.toggle('act',t==='exam');
  document.getElementById('tabPrac').classList.toggle('act',t==='prac');
}

function loadData(cb){
  if(!CEFR[LEVEL]){ fail('Nivel inválido. Usa ?level=ket|pet|fce|cae|cpe'); return; }
  const s=document.createElement('script');
  s.src='cambridge-data/cambridge-'+LEVEL+'.js?v=1';  // cache-bust: asegura cargar la versión con window.CAM_*
  s.onload=()=>{ CAM=window['CAM_'+LEVEL.toUpperCase()]; CAM?cb():fail('No se encontró el dataset.'); };
  s.onerror=()=>fail('No se pudo cargar cambridge-'+LEVEL+'.js');
  document.head.appendChild(s);
}
function fail(m){ const e=document.getElementById('loadErr'); e.textContent='⚠ '+m; e.classList.remove('hidden'); }

function renderExam(){
  const ei=CAM.examInfo||{};
  document.getElementById('examName').textContent=CAM.name||'Cambridge';
  document.getElementById('examLvl').textContent=CEFR[LEVEL]+' · '+(ei.title||'');
  let h=`<div class="card"><h2>Descripción</h2><p>${esc(ei.overview||'')}</p>`;
  if(ei.papers&&ei.papers.length){
    h+=`<h2>Estructura</h2><table><thead><tr><th>Paper</th><th>Duración</th><th>Partes</th><th>Preguntas</th></tr></thead><tbody>`;
    ei.papers.forEach(p=>h+=`<tr><td>${esc(p.name)}</td><td>${esc(p.duration)}</td><td>${p.parts??'—'}</td><td>${p.questions??'—'}</td></tr>`);
    h+=`</tbody></table>`;
  }
  h+=`</div>`;
  (ei.paperDetails||[]).forEach(pd=>{
    h+=`<div class="card"><h2>${esc(pd.paper)}</h2>`;
    (pd.parts||[]).forEach(pt=>h+=`<details class="acc"><summary>Parte ${pt.part}: ${esc(pt.name)} ${pt.questions?('· '+pt.questions+' preguntas'):''}</summary><div>${esc(pt.description||'')}</div></details>`);
    h+=`</div>`;
  });
  if(ei.tips&&ei.tips.length){
    h+=`<div class="card"><h2>Consejos</h2>`;
    ei.tips.forEach(t=>h+=`<div class="tip">${esc(typeof t==='string'?t:(t.tip||JSON.stringify(t)))}</div>`);
    h+=`</div>`;
  }
  document.getElementById('viewExam').innerHTML=h;
}

function renderPracList(){
  const ls=CAM.lessons||[];
  let h=`<div class="card"><h2>Tests de práctica (${ls.length})</h2><p class="muted">Inicia sesión (widget abajo a la derecha) para que tu progreso se guarde en el servidor.</p>`;
  ls.forEach((t,i)=>h+=`<div class="test-item"><span><b>${esc(t.t||('Test '+(i+1)))}</b> <span class="muted">· ${(t.exercises||[]).length} ejercicios</span></span><button class="go" onclick="openTest(${i})">Empezar</button></div>`);
  h+=`</div>`;
  document.getElementById('viewPrac').innerHTML=h;
}

function blockFor(tl){
  const m={Reading:'reading',Listening:'listening',Writing:'writing'};
  return m[tl]||'exercises';
}

// Nº de unidad para el menú: usa "Part N" del título si existe; si no, el orden.
function partNumber(ex,ei){ const m=(ex&&ex.title||'').match(/Part\s*(\d+)/i); return m?m[1]:String(ei+1); }

// HTML de UN solo ejercicio (mismos IDs que antes → grade/pick/wc/submitWr intactos).
function exerciseHtml(ti,ei){
  const ex=CAM.lessons[ti].exercises[ei];
  let h=`<div class="ex" id="ex-${ti}-${ei}"><b>${esc(ex.title||ex.tl||'Ejercicio')}</b><div class="ins">${esc(ex.ins||'')}</div>`;
  /* Listening: hasta ahora la pagina daba las preguntas y no habia nada que oir.
     El mp3 lo graba cambridge-data/gen_cambridge_audio.py con los guiones que ya
     estaban escritos en los datos. */
  if(ex.tl==='Listening'){
    h+=`<audio class="lsn-audio" controls preload="none" src="cambridge-audio/${LEVEL}/t${String(ti+1).padStart(2,'0')}-e${ei+1}.mp3"
          onerror="this.insertAdjacentHTML('afterend','<div class=\\'muted\\'>La grabación de este ejercicio todavía no está publicada.</div>');this.remove()"></audio>`;
  }
  /* Texto con huecos: el numero se pulsa y las alternativas salen donde esta. */
  const conHuecos = !!(ex.passage && /\((\d+)\)_{2,}/.test(ex.passage) && (ex.items||[]).length && (ex.items||[]).every(it=>it.opts));
  if(conHuecos){
    h+=`<div class="passage">`+esc(ex.passage).replace(/\((\d+)\)_{2,}/g,(m,n)=>{
      const qi=+n-1, it=(ex.items||[])[qi]||{};
      return `<span class="gapw" id="gw-${ti}-${ei}-${qi}"><button type="button" class="gapb" onclick="abreGap(event,${ti},${ei},${qi})"><i>${n}</i>…</button>`
        +`<span class="gapm hidden"><button type="button" class="gapx" onclick="event.stopPropagation();this.parentNode.classList.add('hidden')">✕</button>`+(it.opts||[]).map((o,oi)=>`<button type="button" id="o-${ti}-${ei}-${qi}-${oi}" onclick="pickGap(event,${ti},${ei},${qi},${oi})">${String.fromCharCode(65+oi)}. ${esc(o)}</button>`).join('')+`</span></span>`;
    })+`</div>`;
  } else if(ex.passage) h+=`<div class="passage">${esc(ex.passage)}</div>`;
  if(ex.type==='wr'){
    h+=`<p>${esc(ex.prompt||'').replace(/\n/g,'<br>')}</p>
        <textarea id="wr-${ti}-${ei}" oninput="wc(${ti},${ei},${ex.minWords||0})" placeholder="Escribe aquí…"></textarea>
        <div class="muted" id="wc-${ti}-${ei}">0 palabras (mínimo ${ex.minWords||0})</div>
        <div class="res" id="r-${ti}-${ei}"></div>
        <button class="go" style="margin-top:10px" onclick="submitWr(${ti},${ei})">Enviar</button>`;
  } else {
    (conHuecos ? [] : (ex.items||[])).forEach((it,qi)=>{
      h+=`<div class="q" id="q-${ti}-${ei}-${qi}">`;
      if(ex.type==='fl'){
        h+=`<div>${esc(it.pre||'')} <input type="text" aria-label="Respuesta ${qi+1}" id="i-${ti}-${ei}-${qi}"> ${esc(it.post||'')}</div>`;
      } else if(ex.type==='kt'){
        /* Key word transformations: la frase original, la palabra obligatoria y el
           hueco. Antes caian en la rama de opciones A-D, que no encontraba ni
           enunciado ni alternativas, y salia el numero a secas. */
        h+=`<div style="font-weight:600;margin-bottom:4px">${qi+1}. ${esc(it.src||'')}</div>
            <div class="kw"><span class="kw-tag">PALABRA CLAVE</span> <b>${esc(it.kw||'')}</b></div>
            <div><input type="text" class="wide" placeholder="2-5 palabras" aria-label="Respuesta ${qi+1}" id="i-${ti}-${ei}-${qi}"></div>
            ${it.hint?`<div class="muted" style="margin-top:4px">${esc(it.hint)}</div>`:''}`;
      } else if(ex.type==='wf'){
        /* Word formation: la raiz que hay que transformar va junto al hueco. */
        h+=`<div>${qi+1}. ${esc(it.pre||'')} <input type="text" aria-label="Respuesta ${qi+1}" id="i-${ti}-${ei}-${qi}"> ${esc(it.post||'')}
            <span class="raiz">${esc(it.root||'')}</span></div>`;
      } else {
        h+=`<div style="font-weight:600;margin-bottom:4px" id="ql-${ti}-${ei}-${qi}">${qi+1}. ${esc(it.q||'')}</div>`;
        h+=`<div role="radiogroup" aria-labelledby="ql-${ti}-${ei}-${qi}">`;
        (it.opts||[]).forEach((o,oi)=>h+=`<button type="button" class="opt" aria-pressed="false" onclick="pick(${ti},${ei},${qi},${oi})" id="o-${ti}-${ei}-${qi}-${oi}">${String.fromCharCode(65+oi)}. ${esc(o)}</button>`);
        h+=`</div>`;
      }
      h+=`</div>`;
    });
    h+=`<div class="res" id="r-${ti}-${ei}"></div><button class="go" style="margin-top:8px" onclick="grade(${ti},${ei})">Revisar</button>`;
  }
  h+=`</div>`;
  return h;
}

/* Huecos del texto: abrir uno cierra los demas; elegir usa el mismo pick() de
   siempre, asi que la correccion y el guardado no cambian. */
function abreGap(e,ti,ei,qi){
  e.stopPropagation();
  const w=document.getElementById(`gw-${ti}-${ei}-${qi}`), m=w.querySelector('.gapm');
  const abierto=!m.classList.contains('hidden');
  document.querySelectorAll('.gapm').forEach(x=>x.classList.add('hidden'));
  if(abierto) return;
  m.classList.remove('hidden'); m.style.left='0'; m.style.right='auto'; m.style.marginLeft='0';
  /* la barra se corre lo justo para no salirse por ningun lado */
  const caja=(document.getElementById('crMain')||document.body).getBoundingClientRect(), r=m.getBoundingClientRect();
  let dx=0;
  if(r.right>caja.right-6) dx=(caja.right-6)-r.right;
  if(r.left+dx<caja.left+6) dx=(caja.left+6)-r.left;
  m.style.marginLeft=Math.round(dx)+'px';
}
function pickGap(e,ti,ei,qi,oi){
  e.stopPropagation();
  pick(ti,ei,qi,oi);
  const w=document.getElementById(`gw-${ti}-${ei}-${qi}`);
  const b=w.querySelector('.gapb'), op=document.getElementById(`o-${ti}-${ei}-${qi}-${oi}`);
  b.textContent=(op.textContent||'').replace(/^[A-Z]\.\s*/,''); b.classList.add('puesto');
  w.querySelector('.gapm').classList.add('hidden');
}
document.addEventListener('click',()=>document.querySelectorAll('.gapm').forEach(x=>x.classList.add('hidden')));

// Guarda/restaura lo escrito y lo seleccionado para no perder respuestas al cambiar de tarjeta.
const _vals={};
function _saveVals(){ document.querySelectorAll('#crMain input,#crMain textarea').forEach(el=>{ if(el.id) _vals[el.id]=el.value; }); }
function _restoreVals(ti,ei){
  document.querySelectorAll('#crMain input,#crMain textarea').forEach(el=>{ if(el.id&&_vals[el.id]!=null) el.value=_vals[el.id]; });
  const ex=CAM.lessons[ti].exercises[ei];
  if(ex && ex.type!=='wr' && ex.type!=='fl'){
    (ex.items||[]).forEach((it,qi)=>{ const sel=_sel[`${ti}-${ei}-${qi}`]; if(sel!=null){ const el=document.getElementById(`o-${ti}-${ei}-${qi}-${sel}`); if(el){ el.classList.add('sel'); el.setAttribute('aria-pressed','true'); } } });
  }
  if(ex && ex.type==='wr'){ const t=document.getElementById(`wr-${ti}-${ei}`); if(t) wc(ti,ei,ex.minWords||0); }
}

function openTest(ti){
  const test=CAM.lessons[ti];
  const exs=test.exercises||[];
  window._ti=ti; window._part=0;
  const menu=exs.map((ex,ei)=>`<button type="button" class="cr-item" id="cr-item-${ei}" aria-pressed="false" onclick="showPart(${ei})">
      <span class="cr-n">${esc(partNumber(ex,ei))}</span>
      <span class="cr-body"><span class="cr-ttl">${esc(ex.title||ex.tl||('Ejercicio '+(ei+1)))}</span>${ex.tl?`<span class="cr-sub">${esc(ex.tl)}</span>`:''}</span>
      <span class="cr-hand" aria-hidden="true">👆</span>
    </button>`).join('');
  const h=`<div class="card cr-top"><button class="go sec" onclick="renderPracList()">← Tests</button> <h2 style="display:inline;margin-left:8px">${esc(test.t)}</h2></div>
    <div class="cr-lay">
      <aside class="cr-sb" id="crSb" aria-label="Unidades del test">${menu||'<p class="muted" style="padding:8px">Sin unidades.</p>'}</aside>
      <div class="cr-main" id="crMain"></div>
    </div>`;
  const v=document.getElementById('viewPrac'); v.innerHTML=h; v.scrollIntoView({behavior:'smooth'});
  if(exs.length) showPart(0);
}

function showPart(ei){
  const ti=window._ti; const exs=CAM.lessons[ti].exercises||[];
  if(ei<0||ei>=exs.length) return;
  if(document.getElementById('crMain')) _saveVals();      // conserva lo de la tarjeta actual
  window._part=ei;
  exs.forEach((_,k)=>{ const it=document.getElementById('cr-item-'+k); if(it){ const on=k===ei; it.classList.toggle('act',on); it.setAttribute('aria-pressed',on?'true':'false'); } });
  const total=exs.length;
  const nav=`<div class="cr-nav">
      <button class="go sec" ${ei===0?'disabled':''} onclick="showPart(${ei-1})">← Anterior</button>
      <span class="cr-prog">Unidad ${ei+1} de ${total}</span>
      <button class="go" ${ei===total-1?'disabled':''} onclick="showPart(${ei+1})">Siguiente →</button>
    </div>`;
  const main=document.getElementById('crMain');
  main.innerHTML=`<div class="cr-card">${exerciseHtml(ti,ei)}${nav}</div>`;
  _restoreVals(ti,ei);
  const act=document.getElementById('cr-item-'+ei); if(act&&act.scrollIntoView) act.scrollIntoView({block:'nearest'});
  main.scrollIntoView({behavior:'smooth',block:'nearest'});
}

const _sel={};
function pick(ti,ei,qi,oi){
  _sel[`${ti}-${ei}-${qi}`]=oi;
  const items=CAM.lessons[ti].exercises[ei].items[qi];
  items.opts.forEach((_,k)=>{ const el=document.getElementById(`o-${ti}-${ei}-${qi}-${k}`); const on=k===oi; el.classList.toggle('sel',on); el.setAttribute('aria-pressed', on?'true':'false'); });
}
function wc(ti,ei,min){
  const v=document.getElementById(`wr-${ti}-${ei}`).value.trim();
  const n=v?v.split(/\s+/).length:0;
  document.getElementById(`wc-${ti}-${ei}`).textContent=`${n} palabras (mínimo ${min})`;
}

function dispatchAttempt(ex,ti,ei,o){
  document.dispatchEvent(new CustomEvent('cohasset:attempt',{detail:Object.assign({
    app:'cambridge-'+LEVEL, level:CEFR[LEVEL], lesson_n:ti+1,
    block:blockFor(ex.tl), exercise_index:ei, exercise_type:ex.type
  },o)}));
}

function grade(ti,ei){
  const ex=CAM.lessons[ti].exercises[ei];
  let ok=0,total=(ex.items||[]).length;
  (ex.items||[]).forEach((it,qi)=>{
    let correct=false,ua='';
    if(ex.type==='fl'||ex.type==='kt'||ex.type==='wf'){
      const inp=document.getElementById(`i-${ti}-${ei}-${qi}`);
      ua=inp.value.trim();
      /* la respuesta buena esta en `gap` (huecos), en `ans` (transformaciones) o
         en `gap`/`ans` segun el archivo, y puede admitir variantes separadas por / */
      const buenas=String(it.gap!=null?it.gap:(it.ans!=null?it.ans:'')).split('/').map(x=>x.trim().toLowerCase()).filter(Boolean);
      const suya=ua.toLowerCase().replace(/\s+/g,' ');
      correct=buenas.some(b=>b.replace(/\s+/g,' ')===suya);
      if(!correct && !inp.nextElementSibling){
        inp.insertAdjacentHTML('afterend', `<span class="sol"> \u2192 ${esc(buenas[0]||'')}</span>`);
      }
      if(correct){ const s=inp.parentNode.querySelector('.sol'); if(s) s.remove(); }
      inp.style.borderColor=correct?'#15803D':'#DC2626';
      inp.setAttribute('aria-invalid', correct?'false':'true');
    } else {
      const sel=_sel[`${ti}-${ei}-${qi}`];
      ua=sel!=null?String.fromCharCode(65+sel):'';
      correct=sel===it.ans;
      (it.opts||[]).forEach((_,k)=>{
        const el=document.getElementById(`o-${ti}-${ei}-${qi}-${k}`);
        el.classList.remove('sel');
        el.querySelectorAll('.mark').forEach(m=>m.remove());
        if(k===it.ans){ el.classList.add('ok'); el.insertAdjacentHTML('beforeend','<span class="mark">✓ <span class="sr-only">correcta</span></span>'); }
        else if(k===sel){ el.classList.add('bad'); el.insertAdjacentHTML('beforeend','<span class="mark">✗ <span class="sr-only">tu respuesta</span></span>'); }
      });
      /* si la pregunta vive dentro del texto, se pinta el hueco y, si fallo, se
         enseña ahi la palabra buena */
      const gw=document.getElementById(`gw-${ti}-${ei}-${qi}`);
      if(gw){
        gw.classList.remove('ok','bad'); gw.classList.add(correct?'ok':'bad');
        const vieja=gw.querySelector('.sol'); if(vieja) vieja.remove();
        if(!correct) gw.insertAdjacentHTML('beforeend',`<span class="sol"> → ${esc((it.opts||[])[it.ans]||'')}</span>`);
      }
    }
    if(correct) ok++;
    dispatchAttempt(ex,ti,ei,{
      question_text:(it.q||((it.pre||'')+' ___ '+(it.post||''))).slice(0,500),
      options: ex.type==='fl'?null:(it.opts||null),
      user_answer:ua, correct_answer:ex.type==='fl'?(it.gap||''):String.fromCharCode(65+it.ans),
      is_correct:correct
    });
  });
  const r=document.getElementById(`r-${ti}-${ei}`);
  r.setAttribute('role','status'); r.setAttribute('aria-live','polite');
  const pct=total?Math.round(100*ok/total):0;
  r.textContent=`Resultado: ${ok}/${total} (${pct}%)`;
  r.style.color=pct>=60?'#15803D':'#DC2626';
}

function submitWr(ti,ei){
  const ex=CAM.lessons[ti].exercises[ei];
  const v=document.getElementById(`wr-${ti}-${ei}`).value.trim();
  const n=v?v.split(/\s+/).length:0, min=ex.minWords||0;
  const r=document.getElementById(`r-${ti}-${ei}`);
  r.setAttribute('role','status'); r.setAttribute('aria-live','polite');
  if(n<min){ r.style.color='#DC2626'; r.textContent=`Llevas ${n} de ${min} palabras mínimas.`; return; }
  r.style.color='#15803D'; r.textContent='Enviado para revisión del profesor.';
  dispatchAttempt(ex,ti,ei,{
    question_text:(ex.prompt||'Writing').slice(0,500), options:null,
    user_answer:v.slice(0,4000), correct_answer:null, is_correct:null
  });
}

loadData(()=>{ renderExam(); renderPracList(); });
</script>
<script src="nis-nav.js?v=2"></script>
<script src="activity-save.js?v=4"></script>
<script>
/* El motor emite `cohasset:attempt` en cada respuesta. En NIS no hay quien
   lo escuche, asi que se recoge aqui y se lleva a la cuenta del alumno por
   la via de siempre (unit_submissions), igual que las demas actividades. */
var CAM_WORK = {};
document.addEventListener('cohasset:attempt', function(e){
  var d = e.detail || {};
  var k = (d.app||'cambridge') + '#' + (d.lesson_n||0) + '#' + (d.exercise_index||0);
  CAM_WORK[k] = { q:d.question_text, ua:d.user_answer, ok:d.is_correct, ca:d.correct_answer };
  if(window.NIS_WORK) NIS_WORK.touch();
});
if(window.NIS_WORK) NIS_WORK.attach(Object.assign(NIS_WORK.ficha(), {
  title: 'Cambridge ' + (CEFR[LEVEL]||'') + ' — ' + LEVEL.toUpperCase(),
  read:  function(){ return { store: CAM_WORK }; },
  write: function(d){ var p=(d&&d.store)||{}; Object.keys(p).forEach(function(k){ CAM_WORK[k]=p[k]; }); },
  count: function(d){ var p=(d&&d.store)||{}; return Object.keys(p).length; },
  answers: function(d){
    var p=(d&&d.store)||{}, out={};
    Object.keys(p).forEach(function(k){ out[k] = (p[k].ua==null?"":p[k].ua) + (p[k].ok===true?" ✓":p[k].ok===false?" ✗":""); });
    return out;
  }
}));
</script>
