<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cohasset School</title>
<meta name="theme-color" content="#081847">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cohasset School">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="/school-app/icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="/school-app/icons/icon-32.png">
<link rel="manifest" href="/school-app/manifest.webmanifest">
<!-- Lanzador de la app Cohasset School (Android TWA, iOS y PWA). Recuerda el
     colegio elegido y abre el portal: NIS en / y cualquier otro con
     ?school=<slug>; app=1 le dice a school.js que no es una vista previa. -->
<script>
(function () {
  var KEY = 'coh-school-app';
  var p = new URLSearchParams(location.search);
  window.cohSchoolGo = function (slug) {
    location.replace(slug === 'nis' ? '/?app=1' : '/?school=' + encodeURIComponent(slug) + '&app=1');
  };
  if (p.get('change') !== null) { try { localStorage.removeItem(KEY); } catch (e) {} return; }
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
  if (saved && saved.slug && navigator.onLine !== false) { document.documentElement.className = 'going'; window.cohSchoolGo(saved.slug); }
})();
</script>
<style>
:root{--ink:#081847;--muted:#5b6478;--line:#dfe3ec;--accent:#2563EB;--bg:#ffffff;--card:#f6f8fc}
@media (prefers-color-scheme:dark){:root{--ink:#eef2fb;--muted:#a3adc2;--line:#2a3550;--bg:#0b1220;--card:#121b2e}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
html.going main{visibility:hidden}
main{max-width:440px;margin:0 auto;padding:max(32px,env(safe-area-inset-top)) 20px max(32px,env(safe-area-inset-bottom));min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:22px}
.brand{text-align:center}
.brand img{width:96px;height:96px;border-radius:22px}
h1{font-size:24px;margin:10px 0 2px}
.sub{color:var(--muted);margin:0}
.school{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:inherit;font:inherit;text-align:left;cursor:pointer}
.school:hover,.school:focus-visible{border-color:var(--accent);outline:none}
.school img{height:34px;width:auto;max-width:150px;background:#fff;border-radius:6px;padding:4px}
.school b{display:block}
.school small{color:var(--muted)}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
form{display:flex;flex-direction:column;gap:10px}
label{font-weight:600;font-size:15px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;padding:13px 14px;border:1px solid var(--line);border-radius:12px;font:inherit;background:var(--bg);color:inherit}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button.go{padding:13px 18px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:600 16px/1 inherit;cursor:pointer}
button.go:disabled{opacity:.6}
.msg{min-height:1.4em;font-size:14px;color:#c62828;margin:0}
.hint{font-size:13px;color:var(--muted);margin:0}
.offline{display:none;text-align:center}
html.off .offline{display:block}
html.off .pick{display:none}
</style>
</head>
<body>
<main>
  <div class="brand">
    <img src="/school-app/icons/icon-192.png" alt="">
    <h1>Cohasset School</h1>
    <p class="sub">Choose your school to sign in.</p>
  </div>

  <div class="offline">
    <p><b>You're offline.</b><br>Connect to the internet to open your school portal.</p>
    <button class="go" type="button" onclick="location.reload()">Try again</button>
  </div>

  <div class="pick">
    <button class="school" type="button" data-slug="nis" data-name="Nordic International School of Lima">
      <img src="/assets/logo-h.svg" alt="">
      <span><b>Nordic International School</b><small>Lima · nis.cohasset.pe</small></span>
    </button>
  </div>

  <div class="or pick">or</div>

  <form class="pick" id="codeForm" novalidate>
    <label for="code">Another school</label>
    <div class="row">
      <input id="code" name="code" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="School code" required>
      <button class="go" type="submit">Continue</button>
    </div>
    <p class="msg" id="msg" role="alert"></p>
    <p class="hint">Your school gives you its code (for example, the first part of its address: <i>code</i>.cohasset.pe).</p>
  </form>
</main>
<script>
(function () {
  var KEY = 'coh-school-app';
  var SB = 'https://kjrppibltkbflvxmiyib.supabase.co', K = 'sb_publishable_HINNpxCDLvwXIlecuhKGcw_LDGamS-Z';
  function pick(slug, name) {
    try { localStorage.setItem(KEY, JSON.stringify({ slug: slug, name: name })); } catch (e) {}
    window.cohSchoolGo(slug);
  }
  function offline() { document.documentElement.classList.toggle('off', navigator.onLine === false); }
  offline(); addEventListener('online', function () { location.reload(); }); addEventListener('offline', offline);

  document.querySelector('.school').addEventListener('click', function () { pick(this.dataset.slug, this.dataset.name); });

  var form = document.getElementById('codeForm'), msg = document.getElementById('msg');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var code = form.code.value.trim().toLowerCase().replace(/\.cohasset\.pe.*$/, '').replace(/^https?:\/\//, '');
    if (!/^[a-z0-9-]{2,40}$/.test(code)) { msg.textContent = 'Enter the code your school gave you.'; return; }
    if (code === 'nis') { pick('nis', 'Nordic International School of Lima'); return; }
    var btn = form.querySelector('button'); btn.disabled = true; msg.textContent = '';
    fetch(SB + '/rest/v1/rpc/school_public', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: K, Authorization: 'Bearer ' + K },
      body: JSON.stringify({ p_host: code })
    }).then(function (r) { return r.ok ? r.json() : null; }).then(function (s) {
      if (s && s.slug === code) pick(s.slug, s.name);
      else { msg.textContent = 'We couldn’t find a school with that code.'; btn.disabled = false; }
    }).catch(function () { msg.textContent = 'No connection. Try again.'; btn.disabled = false; });
  });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/school-app/sw.js', { scope: '/school-app/' }).catch(function () {});
})();
</script>
</body>
</html>
