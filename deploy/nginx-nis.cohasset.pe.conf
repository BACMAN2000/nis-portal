# ============================================================================
# Portal NIS — bloque nginx para servir el frontend estático en nis.cohasset.pe
# ----------------------------------------------------------------------------
# Va en el SERVIDOR (204.168.174.160), NO en el repo/auto_pull:
#   /etc/nginx/sites-available/nis.cohasset.pe
#   ln -s ../sites-available/nis.cohasset.pe /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Arquitectura (igual que cohasset.pe): navegador -> Cloudflare (HTTPS) -> nginx.
# Cloudflare aporta el TLS del borde. Para TLS de origen usar Cloudflare Origin
# Certificate o certbot y añadir el listen 443 (ver nota al final).
#
# Cache-Control "no-cache" en HTML/JS/CSS = revalidan siempre (304 si no cambió),
# evita servir "página vieja montada sobre la nueva" tras un deploy. Mismo criterio
# que se aplicó en cohasset.pe. OJO Cloudflare: si el "Browser Cache TTL" de CF
# está en un valor fijo, sobrescribe el no-cache de CSS/JS -> ponerlo en
# "Respect Existing Headers" (dashboard CF, cuenta paolobaca2000@gmail.com).
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name nis.cohasset.pe;

    root /opt/nis-portal;
    index index.html;

    # HTML/JS/CSS: siempre revalidar (el ?v=N del index ya rompe caché al cambiar).
    location ~* \.(?:html|js|css)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Fuentes y media pesada: sí se cachean fuerte (no cambian).
    location ~* \.(?:woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|ico|mp3|wav|pdf)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Resto (rutas sin extensión / directorios).
    location / {
        try_files $uri $uri/ /index.html =404;
        add_header Cache-Control "no-cache" always;
    }

    # Higiene: sin listados de directorio, oculta .git si el root fuera el repo.
    autoindex off;
    location ~ /\.git { deny all; return 404; }
}

# --- TLS de origen (opcional, recomendado "Full (strict)" en Cloudflare) ------
# Tras emitir el certificado (certbot --nginx -d nis.cohasset.pe, o CF Origin Cert):
#
# server {
#     listen 443 ssl http2;
#     listen [::]:443 ssl http2;
#     server_name nis.cohasset.pe;
#     ssl_certificate     /etc/ssl/cloudflare/nis.cohasset.pe.pem;
#     ssl_certificate_key /etc/ssl/cloudflare/nis.cohasset.pe.key;
#     root /opt/nis-portal;
#     index index.html;
#     # ...(repetir los mismos location de arriba)...
# }
# y en el server :80 -> return 301 https://$host$request_uri;
