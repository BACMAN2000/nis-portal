<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grammar — Portal NIS</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font:15px/1.55 "Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:#0f172a;background:linear-gradient(180deg,#d1d2ea 0%,#f8fafc 60%,#fff 100%);min-height:100vh}
  header{background:#fff;padding:12px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    box-shadow:0 4px 16px rgba(15,23,42,.06);position:sticky;top:0;z-index:10;border-bottom:1px solid #e2e8f0}
  header img{display:block;height:38px;width:auto}
  header .sub{color:#636465;font-size:13px;margin-left:auto;font-weight:600}
  header a.back{margin-left:14px;text-decoration:none;background:#2d5a8d;color:#fff;font-weight:700;font-size:13px;padding:8px 14px;border-radius:9px;white-space:nowrap}
  main{max-width:880px;margin:0 auto;padding:22px 18px}
  h1{font-size:22px;margin:0 0 6px}
  p.lead{color:#475569;margin:0 0 18px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
  .card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:26px 22px;
    box-shadow:0 8px 24px rgba(15,23,42,.08);text-align:center;color:inherit;display:block;text-decoration:none;transition:.15s}
  a.card:hover{transform:translateY(-3px)}
  .card.soon{opacity:.7}
  .card .ico{font-size:3rem;line-height:1}
  .card h2{font-size:18px;margin:10px 0 4px;color:#2d5a8d}
  .card .desc{color:#475569;font-size:13px;margin:0 0 12px}
  .tag{display:inline-block;background:#d1d2ea;color:#244c77;font-weight:700;font-size:12px;padding:5px 12px;border-radius:14px;margin:2px}
  .tag.go{background:#2d5a8d;color:#fff}
  .footer{color:#475569;font-size:12px;text-align:center;padding:22px 0 32px}
</style>
</head>
<body>
<header>
  <img src="assets/logo-h.svg" alt="Nordic International School" onerror="this.style.display='none'">
  <div class="sub" id="hsub">CLASSES · GRAMMAR</div>
  <a class="back" href="./">🏫 Volver al Portal</a>
</header>
<main>
  <h1 id="title">📝 Grammar</h1>
  <p class="lead" id="lead">Gramática por grado. Iremos publicando más unidades poco a poco.</p>
  <div class="grid" id="grid"></div>
  <div class="footer" id="foot">Grammar — NIS English · 2026</div>
</main>

<script>
const META={g6:['6️⃣','6th grade','A2'],g7:['7️⃣','7th grade','A2'],g8:['8️⃣','8th grade','B1'],
  g9:['9️⃣','9th grade','B2'],g10:['🔟','10th grade','B2'],g11:['🎓','11th grade','C1']};

// Unidades por grado. go:true = juego listo; soon:true = próximamente.
const UNITS={
  g6:[{ico:'🧩',t:'Word Formation',d:'Prefixes, suffixes & roots — 5 CEFR games.',href:'word-formation.html?grade=g6'},{ico:'⏱️',t:'Present Simple vs Continuous',d:'Rutinas vs. lo que pasa ahora.',href:'grammar-quiz.html?set=a2-present'}],
  g7:[{ico:'🧩',t:'Word Formation',d:'Prefixes, suffixes & roots — 5 CEFR games.',href:'word-formation.html?grade=g7'},{ico:'⏱️',t:'Present Simple vs Continuous',d:'Rutinas vs. lo que pasa ahora.',href:'grammar-quiz.html?set=a2-present'}],
  g8:[{ico:'🧩',t:'Word Formation',d:'Prefixes, suffixes & roots — 5 CEFR games.',href:'word-formation.html?grade=g8'},{ico:'✅',t:'Present Perfect vs Past Simple',d:'ever/never/already/since vs. yesterday/last…',href:'grammar-quiz.html?set=b1-perfect'}],
  g9:[
    {ico:'🗣️',t:'Reported Speech — Lab',d:'Aprende los 4 cambios (animado) y practica statements, questions y commands.',href:'reported-speech-lab.html'},
    {ico:'⏪',t:'Backshifting Machine',d:'Cada tiempo un paso atrás: ladder, matching, drill y whack-a-mole (incluye modales).',href:'backshifting.html'},
    {ico:'🎡',t:'Reported Speech — Ruleta',d:'Ruleta de oraciones para transformar en voz alta en clase (proyector).',href:'reported-speech-wheel.html'},
    {ico:'🗣️',t:'Reported Speech — Quiz',d:'Elige la transformación correcta.',href:'reported-speech.html'},
    {ico:'🔤',t:'Reported Speech — Ordena',d:'Ordena las palabras del reported speech.',href:'reported-speech-order.html'},
    {ico:'🎯',t:'Reporting Verbs (Challenge)',d:'Avanzado B2: advise/suggest/apologise/accuse… con su patrón. Con racha y cronómetro.',href:'reported-speech-verbs.html'},
    {ico:'🧩',t:'Word Formation',d:'Prefixes, suffixes & roots — 5 CEFR games.',href:'word-formation.html?grade=g9'},
    {ico:'🔁',t:'Passive Voice',d:'be + participio: el foco en la acción.',href:'grammar-quiz.html?set=b2-passive'}
  ],
  g10:[
    {ico:'🧩',t:'Word Formation',d:'Prefixes, suffixes & roots — 5 CEFR games.',href:'word-formation.html?grade=g10'},
    {ico:'🔁',t:'Passive Voice',d:'be + participio: el foco en la acción.',href:'grammar-quiz.html?set=b2-passive'},
    {ico:'✅',t:'Present Perfect vs Past Simple',d:'Repaso de tiempos clave B2.',href:'grammar-quiz.html?set=b1-perfect'}
  ],
  g11:[{ico:'🧩',t:'Word Formation',d:'Prefixes, suffixes & roots — 5 CEFR games.',href:'word-formation.html?grade=g11'},{ico:'🔗',t:'Conditionals (advanced)',d:'Mixtos, wish e inversión (Had I…, Should it…).',href:'grammar-quiz.html?set=c1-cond'}]
};

const grade=(new URLSearchParams(location.search).get('grade'))||'g9';
const m=META[grade]||META.g9;
const units=UNITS[grade]||UNITS.g9;
document.getElementById('title').textContent=m[0]+' Grammar — '+m[1];
document.getElementById('hsub').textContent='CLASSES · '+m[1].toUpperCase()+' · GRAMMAR';
document.getElementById('lead').textContent='Gramática de '+m[1]+' (nivel '+m[2]+'). Toca una unidad para practicar.';
document.getElementById('foot').textContent=m[1]+' · Grammar — NIS English · 2026';
document.getElementById('grid').innerHTML=units.map(u=>{
  const href=u.soon?null:(u.href.indexOf('grammar-quiz.html')===0?u.href+'&grade='+grade:u.href);
  if(u.soon) return `<div class="card soon"><div class="ico">${u.ico}</div><h2>${u.t}</h2><div class="desc">${u.d}</div><span class="tag">Próximamente</span></div>`;
  return `<a class="card" href="${href}"><div class="ico">${u.ico}</div><h2>${u.t}</h2><div class="desc">${u.d}</div><span class="tag go">▶ Practicar</span></a>`;
}).join('');
</script>
</body>
</html>
