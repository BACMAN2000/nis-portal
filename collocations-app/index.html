<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collocations · Nordic International School</title>
<link rel="icon" href="../favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../lexapp.css?v=1">
<style>
.embed header{display:none}
.embed .wrap{padding-top:16px}
</style>
</head>
<body>
<script>if(new URLSearchParams(location.search).get("embed")==="1")document.documentElement.classList.add("embed");</script>
<header>
  <div class="wrap">
    <div class="crumb"><a href="../index.html">Portal</a> › Collocations</div>
    <h1>Collocations</h1>
    <div class="sub">Las palabras que en inglés van juntas, medidas en nuestros propios cursos y ordenadas por nivel.</div>
  </div>
</header>

<div class="wrap">
  <div class="levels" id="levels"></div>
  <div class="tabs" role="tablist">
    <button class="tab" id="tab-learn" role="tab" aria-selected="true" onclick="setTab('learn')">Aprender</button>
    <button class="tab" id="tab-practice" role="tab" aria-selected="false" onclick="setTab('practice')">Practicar</button>
    <button class="tab" id="tab-games" role="tab" aria-selected="false" onclick="setTab('games')">Juegos</button>
    <button class="tab" id="tab-progress" role="tab" aria-selected="false" onclick="setTab('progress')">Mi progreso</button>
  </div>
  <div id="view"><div class="empty">Cargando…</div></div>
</div>

<script>
/* Lo único propio de esta app: qué claves trae su data.json y cómo se nombra lo
   que enseña. El motor está en ../js/lexapp.js, compartido con las otras dos. */
var APP = {
  store:'coh_colloc', list:'cols', id:'col', audio:'collocations', datav:1,
  uno:'colocación', varios:'colocaciones',
  elMejor:'la mejor', deLos:'de las',
  extra:' y la pareja de palabras',
  badges: function(d){
    return '<span class="badge insep">' + esc(d.tipo || '') + '</span>' +
      (d.freq ? '<span class="badge">' + d.freq + ' veces en el curso</span>' : '');
  }
};
</script>
<script src="../lexapp.js?v=1"></script>
</body>
</html>
