<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kitchen Sort — In the Kitchen · 2nd grade</title>
<style>
  :root{ --bg:#eef7f1; --card:#ffffff; --ink:#27332b; --muted:#6f8377;
    --accent:#2f9e44; --accent-soft:#d3f4dc; --blue:#3b5bdb;
    --good:#2f9e44; --good-soft:#d3f4dc; --bad:#e03131; --bad-soft:#ffe3e3; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Segoe UI',system-ui,Arial,sans-serif; background:var(--bg); color:var(--ink); padding:18px; touch-action:manipulation;}
  .topnav{position:sticky; top:0; z-index:30; background:#fff; display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    padding:10px 18px; box-shadow:0 2px 10px rgba(30,60,40,.10); margin:-18px -18px 16px;}
  .topnav img{height:32px; width:auto; display:block;}
  .topnav .nav-sp{margin-left:auto;}
  .navbtn{text-decoration:none; font-weight:700; font-size:.85rem; padding:8px 14px; border-radius:9px; white-space:nowrap;
    background:var(--accent-soft); color:#1e6b30; border:none; cursor:pointer;}
  .navbtn.primary{background:var(--accent); color:#fff;}
  header{max-width:900px; margin:0 auto 10px; text-align:center;}
  header h1{font-size:1.6rem;}
  header p{color:var(--muted); font-size:.95rem; margin-top:4px;}
  .stage{max-width:820px; margin:0 auto; background:var(--card); border-radius:20px; padding:22px;
         box-shadow:0 3px 14px rgba(30,60,40,.10); text-align:center;}
  .bar{height:14px; background:#e3ede6; border-radius:8px; overflow:hidden; margin-bottom:16px;}
  .bar i{display:block; height:100%; background:var(--accent); border-radius:8px; transition:width .3s;}
  .card-word{display:inline-block; background:#fff8e8; border:4px solid #f5c518; border-radius:22px;
             padding:18px 34px; margin:6px 0 14px; animation:drop .35s;}
  .card-word .ico{font-size:4rem; line-height:1.15;}
  .card-word .w{font-weight:900; font-size:1.5rem; margin-top:4px;}
  @keyframes drop{0%{transform:translateY(-30px); opacity:0;}100%{transform:translateY(0); opacity:1;}}
  .speaker{font-size:2.2rem; background:none; border:none; cursor:pointer; vertical-align:middle;}
  .baskets{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:14px;}
  .basket{border:4px dashed #bcd3c4; border-radius:18px; padding:14px 6px; cursor:pointer;
          -webkit-tap-highlight-color:transparent; transition:.12s; background:#f7fbf8;}
  .basket .ico{font-size:2.6rem;}
  .basket .t{font-weight:900; font-size:1rem; margin-top:4px;}
  .basket .n{font-size:.8rem; color:var(--muted); font-weight:700;}
  .basket:active{transform:scale(.96);}
  .basket.ok{background:var(--good-soft); border-color:var(--good); animation:pop .35s;}
  .basket.ko{background:var(--bad-soft); border-color:var(--bad); animation:shake .4s;}
  @keyframes pop{0%{transform:scale(.9);}60%{transform:scale(1.06);}100%{transform:scale(1);}}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}
  .msg{min-height:1.5em; font-weight:800; font-size:1.1rem; margin-top:10px;}
  .bigbtn{border:none; border-radius:16px; background:var(--blue); color:#fff; font-weight:800;
          font-size:1.25rem; padding:16px 30px; cursor:pointer; box-shadow:0 4px 0 #2b46b3; margin-top:10px;}
  .bigbtn:active{transform:translateY(3px); box-shadow:0 1px 0 #2b46b3;}
  .end .trophy{font-size:4.5rem;}
  .stars{font-size:1.6rem; letter-spacing:3px;}
  footer{max-width:900px; margin:18px auto 0; text-align:center; color:var(--muted); font-size:.75rem;}
  @media (max-width:480px){ body{padding:8px;} .topnav{margin:-8px -8px 12px; padding:8px 12px;}
    .stage{padding:14px;} .basket .t{font-size:.85rem;} }
</style>
<meta name="google" content="notranslate">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="config.js?v=18"></script>
<script src="g2-u4-data.js?v=3"></script>
<script src="nis-nav.js?v=2"></script>
<script src="activity-save.js?v=4"></script>
</head>
<body>
<nav class="topnav">
  <img src="assets/logo-h.svg" alt="Nordic International School" onerror="this.style.display='none'">
  <span class="nav-sp"></span>
  <a class="navbtn" href="activities.html">🎲 Actividades</a>
  <a class="navbtn primary" href="./">🏫 Portal</a>
</nav>
<header>
  <h1>🧺 Kitchen Sort</h1>
  <p>In the Kitchen · Unit 4 — Is it an action, food, or a utensil? Touch the right basket! 2nd grade · NIS English</p>
</header>

<div class="stage" id="stage"></div>

<footer>Unit 4 · In the Kitchen — 2nd grade Primary · Nordic International School</footer>

<script>
const G = window.G2U4;
/* Cartas curadas: fuera los emoji ambiguos entre categorías (peel/banana 🍌,
   slice·chop/knife 🔪, serve/plate): el niño clasifica por la palabra y el
   audio, y el dibujo no debe contradecir la cesta correcta. */
const CARDS = [
  ...['cut','spread','add','pour','squeeze','mix'].map(w=>({w,ico:G.ICO[w],cat:'action'})),
  ...['tomato','bread','cheese','egg','banana','carrot','milk','fish'].map(w=>({w,ico:G.ICO[w],cat:'food'})),
  ...['spoon','fork','bowl','glass','plate','knife'].map(w=>({w,ico:G.ICO[w],cat:'utensil'})),
];
const BASKETS = [
  {cat:'action',  ico:'👩‍🍳', t:'Actions',  hint:'things you DO'},
  {cat:'food',    ico:'🍎', t:'Food',     hint:'things you EAT'},
  {cat:'utensil', ico:'🍴', t:'Utensils', hint:'things you USE'},
];
let deck=[], i=0, results=[], t0=0, tries=0, counts={action:0,food:0,utensil:0};

function start(){
  deck=G.shuffle(CARDS); i=0; results=[]; t0=Date.now(); counts={action:0,food:0,utensil:0};
  next();
}
function next(){
  if(i>=deck.length) return finish();
  tries=0;
  const c=deck[i];
  document.getElementById('stage').innerHTML=`
    <div class="bar"><i style="width:${Math.round(100*i/deck.length)}%"></i></div>
    <div class="card-word"><div class="ico">${c.ico}</div><div class="w">${c.w}
      <button class="speaker" onclick="G.say('${c.w}')">🔊</button></div></div>
    <div style="font-weight:800;color:var(--muted)">Where does it go?</div>
    <div class="baskets">${BASKETS.map(b=>`
      <div class="basket" data-cat="${b.cat}" onclick="drop(this)">
        <div class="ico">${b.ico}</div><div class="t">${b.t}</div>
        <div class="n">${b.hint} · ${counts[b.cat]}</div>
      </div>`).join('')}
    </div>
    <div class="msg" id="msg"></div>`;
  setTimeout(()=>G.say(c.w), 300);
}
window.drop = (el)=>{
  const c=deck[i];
  if(el.dataset.cat===c.cat){
    el.classList.add('ok'); G.ding();
    counts[c.cat]++;
    results.push(tries===0?1:0);
    document.getElementById('msg').textContent = tries===0 ? '⭐ Perfect!' : '👍 That\'s it!';
    setTimeout(()=>{ i++; next(); }, 800);
  }else{
    tries++; el.classList.add('ko'); G.buzz();
    document.getElementById('msg').textContent='🙈 Not there… listen again!';
    G.say(c.w);
    setTimeout(()=>el.classList.remove('ko'), 450);
  }
};
function finish(){
  const stars=results.filter(r=>r===1).length, total=deck.length;
  const pct=Math.round(100*stars/total);
  const dur=Math.round((Date.now()-t0)/1000);
  G.setBest('kitchen-sort', pct);
  G.fanfare(); G.confetti(30);
  document.getElementById('stage').innerHTML=`
    <div class="end">
      <div class="trophy">${pct>=80?'🏆':pct>=50?'🎉':'💪'}</div>
      <h2>${pct>=80?'Super sorter!':pct>=50?'Well done!':'Good try!'}</h2>
      <div class="stars">${'⭐'.repeat(Math.min(stars,10))}${stars>10?' +'+(stars-10):''}</div>
      <p style="margin:10px 0;color:var(--muted);font-weight:700">${stars} of ${total} sorted first try · ${pct}%</p>
      <div style="display:flex;gap:10px;justify-content:center;font-weight:800;margin-bottom:8px">
        <span>👩‍🍳 ${counts.action}</span><span>🍎 ${counts.food}</span><span>🍴 ${counts.utensil}</span>
      </div>
      <button class="bigbtn" onclick="start()">🔁 Play again</button>
    </div>`;
  G.NISACT.submit({activity:'g2u4-kitchen-sort', title:'Kitchen Sort — In the Kitchen',
    level:'A1', score:stars, total:total, duration:dur});
  RES['Kitchen Sort'] = { score:stars, total:total, duration:dur };
  if(window.NIS_WORK) NIS_WORK.touch();
}
document.getElementById('stage').innerHTML=`
  <div style="padding:30px 10px">
    <div style="font-size:4rem">🧺🍅🥄</div>
    <h2 style="margin:12px 0">Sort the kitchen words!</h2>
    <p style="color:var(--muted);font-weight:700;margin-bottom:16px">
      👩‍🍳 Actions are things you <b>do</b> · 🍎 Food is what you <b>eat</b> · 🍴 Utensils are what you <b>use</b>.</p>
    <button class="bigbtn" onclick="start()">▶️ Start</button>
  </div>`;

/* ---- Guardado y entrega (barra Save / Submit) --------------------------
   Juego de primaria: cada ronda es una partida. Se guarda el resultado de
   cada una en la cuenta del alumno (asi no se pierde al cambiar de tablet)
   y se le puede entregar al profesor desde aqui mismo. */
const RES = {};
function resumen(x){
  const t = Math.max(0, Math.round(x.duration || 0));
  return (x.score || 0) + '/' + (x.total || 0) + ' / ' +
         Math.floor(t/60) + 'm ' + String(t%60).padStart(2,'0') + 's';
}
if(window.NIS_WORK) NIS_WORK.attach(Object.assign(NIS_WORK.ficha(), {
  title: document.title,
  vacio: 'Finish a game first — then you can hand it in.',
  read:  function(){ return { store: RES }; },
  write: function(d){
    const p = (d && d.store) || {};
    Object.keys(p).forEach(function(k){ RES[k] = p[k]; });
  },
  after: function(){  },
  count: function(d){ return Object.keys((d && d.store) || {}).length; },
  answers: function(d){
    const p = (d && d.store) || {}, out = {};
    Object.keys(p).forEach(function(k){ out[k] = resumen(p[k] || {}); });
    return out;
  }
}));

</script>
</body>
</html>
